<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fart Candle King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one fixed 400x720 portrait game screen, scaled to fit and centered; HTML overlays share its box. Single night-party-room look (deliberately one theme). */
:root{
  --room:#170d1f;
  --ink:#fff3e0;
  --pink:#ff5a8f;
  --mustard:#ffc23d;
  --mint:#56e0b2;
  --plum:#2d1838;
  --muted:#c9b2d4;
  --f-display:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Rounded Mplus 1c","Nunito","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Hiragino Sans","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--room)}
body{height:100%;margin:0;background:var(--room);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{box-sizing:border-box;height:100%;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
#stage{position:relative;--u:1px;border-radius:calc(var(--u)*16);overflow:hidden;background:#24142d;box-shadow:0 0 0 1px rgba(255,220,240,.08),0 24px 70px rgba(0,0,0,.55);touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
button{font-family:var(--f-display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:calc(var(--u)*3) solid var(--mustard);outline-offset:calc(var(--u)*2)}
.hudbtn{position:absolute;top:calc(var(--u)*9);width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:calc(var(--u)*17);display:grid;place-items:center;padding:0;line-height:1}
#bPause{right:calc(var(--u)*10)}
#bSound{right:calc(var(--u)*54);z-index:6}
#bSkip{position:absolute;left:50%;top:calc(var(--u)*86);transform:translateX(-50%);border:0;border-radius:999px;padding:calc(var(--u)*6) calc(var(--u)*14);background:rgba(255,255,255,.16);font-size:calc(var(--u)*13);font-weight:800;letter-spacing:.06em}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*12);padding:calc(var(--u)*22);box-sizing:border-box;text-align:center;background:rgba(18,9,24,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov h1,.ov h2,.ov p{margin:0}
.logo{font-family:var(--f-display);font-weight:900;line-height:.92;letter-spacing:-.01em;text-wrap:balance}
.logo .l1{display:block;font-size:calc(var(--u)*46);color:var(--mint);text-shadow:0 calc(var(--u)*4) 0 #0f3b2f}
.logo .l2{display:block;font-size:calc(var(--u)*52);color:var(--mustard);text-shadow:0 calc(var(--u)*4) 0 #6b4400}
.logo .l3{display:block;font-size:calc(var(--u)*62);color:var(--pink);text-shadow:0 calc(var(--u)*5) 0 #6a1030;transform:rotate(-4deg)}
.zh-name{font-size:calc(var(--u)*15);color:var(--muted);letter-spacing:.2em}
.tag{font-size:calc(var(--u)*15);line-height:1.5;max-width:calc(var(--u)*320);color:var(--ink);text-wrap:balance}
.big{border:0;border-radius:calc(var(--u)*18);background:var(--pink);font-size:calc(var(--u)*26);font-weight:900;padding:calc(var(--u)*14) calc(var(--u)*44);box-shadow:0 calc(var(--u)*6) 0 #8e1f47;letter-spacing:.06em}
.big:active{transform:translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*2) 0 #8e1f47}
.howto{font-size:calc(var(--u)*13);color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*340)}
.lvbtn{border:calc(var(--u)*2) solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*3);align-items:center;min-width:0}
.lvbtn b{font-size:calc(var(--u)*16);color:var(--mustard)}
.lvbtn span{font-size:calc(var(--u)*11);line-height:1.25;color:var(--ink)}
.lvbtn small{font-size:calc(var(--u)*10.5);color:var(--muted);font-variant-numeric:tabular-nums}
.lvbtn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:calc(var(--u)*8);flex-wrap:wrap;justify-content:center}
.chip{border:calc(var(--u)*1.5) solid rgba(255,255,255,.2);background:transparent;border-radius:999px;padding:calc(var(--u)*6) calc(var(--u)*13);font-size:calc(var(--u)*13);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.res-lv{font-size:calc(var(--u)*13);color:var(--muted);letter-spacing:.12em}
#resHead{font-family:var(--f-display);font-size:calc(var(--u)*38);font-weight:900;line-height:1}
#resHead.win{color:var(--mint)} #resHead.lose{color:var(--mustard)}
#resImg{width:calc(var(--u)*210);height:calc(var(--u)*210);border-radius:calc(var(--u)*12);box-shadow:0 0 0 calc(var(--u)*2) rgba(255,255,255,.15);background:#2d1838}
.cardhint{font-size:calc(var(--u)*11);color:var(--muted)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*320)}
.sc{border-radius:calc(var(--u)*12);padding:calc(var(--u)*8);display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.sc span{font-size:calc(var(--u)*11);letter-spacing:.1em;font-weight:800}
.sc b{font-family:var(--f-display);font-size:calc(var(--u)*24);font-variant-numeric:tabular-nums}
.sc.c{background:rgba(86,224,178,.14)} .sc.c span{color:var(--mint)}
.sc.x{background:rgba(255,90,143,.16)} .sc.x span{color:var(--pink)}
.resline{font-size:calc(var(--u)*13);color:var(--ink);font-variant-numeric:tabular-nums}
.newbest{color:var(--mustard);font-weight:900}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);width:100%;max-width:calc(var(--u)*320)}
.btns .primary{grid-column:1/-1}
.bt{border:0;border-radius:calc(var(--u)*12);padding:calc(var(--u)*11);font-size:calc(var(--u)*16);font-weight:800;background:rgba(255,255,255,.12)}
.bt.primary{background:var(--pink);font-size:calc(var(--u)*20);box-shadow:0 calc(var(--u)*5) 0 #8e1f47}
.bt.next{background:var(--mint);color:#0d2b22}
#toast{position:absolute;left:50%;bottom:calc(var(--u)*170);transform:translateX(-50%);background:var(--ink);color:var(--room);border-radius:999px;padding:calc(var(--u)*8) calc(var(--u)*16);font-size:calc(var(--u)*13);font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.big:active{transform:none}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Game screen"></canvas>
    <button class="hudbtn" id="bSound" aria-label="Sound">🔊</button>
    <button class="hudbtn" id="bPause" aria-label="Pause">⏸</button>
    <button id="bSkip" hidden data-i18n="skip">SKIP ▶▶</button>

    <div class="ov" id="ovTitle">
      <h1 class="logo"><span class="l1">FART</span><span class="l2">CANDLE</span><span class="l3">KING 👑</span></h1>
      <p class="zh-name">放屁吹灭蜡烛 KING</p>
      <p class="tag" data-i18n="tag"></p>
      <button class="big" id="bStart" data-i18n="start"></button>
      <p class="howto" data-i18n="howto"></p>
      <div class="levels" id="lvList"></div>
      <div class="row" id="langRow">
        <button class="chip" data-lang="ja">日本語</button>
        <button class="chip" data-lang="en">English</button>
        <button class="chip" data-lang="zh">中文</button>
      </div>
    </div>

    <div class="ov" id="ovPause" hidden>
      <h2 class="logo"><span class="l2" data-i18n="paused"></span></h2>
      <div class="btns">
        <button class="bt primary" id="bResume" data-i18n="resume"></button>
        <button class="bt" id="bRetryP" data-i18n="retry"></button>
        <button class="bt" id="bTitleP" data-i18n="toTitle"></button>
      </div>
      <div class="row" id="langRow2">
        <button class="chip" data-lang="ja">日本語</button>
        <button class="chip" data-lang="en">English</button>
        <button class="chip" data-lang="zh">中文</button>
      </div>
    </div>

    <div class="ov" id="ovResult" hidden>
      <p class="res-lv" id="resLv"></p>
      <h2 id="resHead"></h2>
      <img id="resImg" alt="">
      <p class="cardhint" data-i18n="cardHint"></p>
      <div class="scores">
        <div class="sc c"><span>CANDLE SCORE</span><b id="resCandle">0</b></div>
        <div class="sc x"><span>CHAOS SCORE</span><b id="resChaos">0</b></div>
      </div>
      <p class="resline" id="resLine"></p>
      <div class="btns">
        <button class="bt primary" id="bRetry" data-i18n="retry"></button>
        <button class="bt next" id="bNext" data-i18n="next"></button>
        <button class="bt" id="bShare" data-i18n="share"></button>
        <button class="bt" id="bTitleR" data-i18n="toTitle"></button>
      </div>
    </div>

    <div id="toast" hidden></div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================= constants & utils ================= */

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const mnX=b.x-b.hw,mxX=b.x+b.hw,mnY=b.y-b.hh,mxY=b.y+b.hh;let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
  const p=[-dx,dx,-dy,dy],q=[x1-mnX,mxX-x1,y1-mnY,mxY-y1];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return false}else{const r=q[i]/p[i];if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}
  return t0<=t1&&t1>0.03&&t0<0.97;
}
function segCircle(x1,y1,x2,y2,cx,cy,r){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;let t=clamp(((cx-x1)*dx+(cy-y1)*dy)/l2,0,1);const px=x1+t*dx-cx,py=y1+t*dy-cy;return px*px+py*py<r*r&&t>0.03&&t<0.97}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function zoneColor(P){return P<0.25?'#8d86a3':P<=0.70?'#56e0b2':P<=0.90?'#ffc23d':'#ff4f6a'}

/* ================= save ================= */
const SAVE_KEY='fck_v3_save';
let save={unlocked:1,best:{},lang:null,sound:true,stats:{shots:0,events:0}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s==='object')save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
if(!save.lang){const n=(navigator.language||'ja').toLowerCase();save.lang=n.startsWith('zh')?'zh':n.startsWith('en')?'en':'ja'}

/* ================= i18n ================= */
const T={
ja:{tag:'ロウソクを消したいだけなのに、世界が大惨事になる。',start:'スタート',howto:'ドラッグで狙う ・ 長押しでためる ・ 離して発射',
lv1:'はじめてのロウソク',lv2:'花瓶のむこう',lv3:'おばあちゃんの誕生日',locked:'未解放',hold:'長押し',angle:'角度',drag:'↕ ドラッグ',wind:'風',

lv1:'First Candles',lv2:'Behind the Vase',lv3:"Grandma's Birthday",locked:'Locked',hold:'HOLD',angle:'Angle',drag:'↕ drag',wind:'Wind',
z1:'Weak',z2:'Sweet spot',z3:'Strong',z4:'Chaos',clear:'ALL OUT!',fail:'TIME UP…',retry:'Retry',next:'Next ▶',share:'Share',toTitle:'Title',
resume:'Resume',paused:'Paused',copied:'Result copied',shareFail:'Could not share',oneShot:'One-shot clear!',allOut:'All out',timeBonus:'Time left',
catastrophe:'CATASTROPHE BONUS!',toSpace:'TO SPACE!',cakeBoom:'CAKE DESTROYED!',maxChain:'Max chain',best:'Best',newBest:'NEW BEST!',chaosKept:'Your chaos was recorded',
ev_poop:'Poop Launch',ev_rocket:'Human Rocket',ev_cake:'Runaway Cake',ev_fire:'Flame Blast',ev_legs:'Fleeing Candles',ev_granny:'Ultimate Grandma',
puff1:'pfft…',puff2:'BRRRT',puff3:'BRAAAAP!!',hintAim:'Aim at the candles',hintHold:'Hold, then release',relit:'Relit!',trick:'Trick candles relight in {s}s!',skip:'SKIP ▶▶',cardHint:'Long-press the image to save it',

total:'合计',chain:'连锁',clearRec:'通关',chaosRec:'大灾难'}};
const t=k=>(T[save.lang]&&T[save.lang][k])||T.en[k]||k;
function applyLang(){
  document.documentElement.lang=save.lang==='zh'?'zh-CN':save.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===save.lang?'true':'false'));

}

/* ================= sound ================= */
const SFX={c:null,m:null,nb:null,on:save.sound,ch:null,
 init(){if(this.c){if(this.c.state==='suspended')this.c.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.c=new AC()}catch(e){return}
  this.m=this.c.createGain();this.m.gain.value=this.on?0.7:0;this.m.connect(this.c.destination);
  const len=this.c.sampleRate*2,b=this.c.createBuffer(1,len,this.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b},
 set(v){this.on=v;if(this.m)this.m.gain.value=v?0.7:0},
 tone(type,f0,f1,dur,vol=.3,delay=0){const c=this.c;if(!c)return;const t0=c.currentTime+delay;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+dur+0.05)},
 nz(type,freq,dur,vol=.3,delay=0,q=1,f1){const c=this.c;if(!c)return;const t0=c.currentTime+delay;const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;
  const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(this.m);s.start(t0,Math.random()*1.5);s.stop(t0+dur+0.05)},
 fart(P){const c=this.c;if(!c)return;const t0=c.currentTime;const dur=P<.25?.12+P*.4:.25+P*.85;
  const base=P<.25?150:100-P*40;
  const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(base*1.25,t0);o.frequency.exponentialRampToValueAtTime(base*.7,t0+dur);
  const lfo=c.createOscillator();lfo.frequency.value=17+P*22;const lg=c.createGain();lg.gain.value=base*.4;lfo.connect(lg);lg.connect(o.frequency);
  const am=c.createOscillator();am.type='square';am.frequency.value=9+P*16;const amg=c.createGain();amg.gain.value=.45;
  const fl=c.createGain();fl.gain.value=.55;am.connect(amg);amg.connect(fl.gain);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=360+P*1000;lp.Q.value=5;
  const g=c.createGain();const v=.45+P*.45;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.02);g.gain.setValueAtTime(v,t0+dur*.7);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(lp);lp.connect(fl);fl.connect(g);g.connect(this.m);
  [o,lfo,am].forEach(x=>{x.start(t0);x.stop(t0+dur+.05)});
  this.nz('lowpass',280+P*700,dur,.2+P*.45,0,2);
  if(P>.9){this.tone('sine',70,28,.9,.8);this.nz('lowpass',600,.9,.5,.05,1,120)}},
 chargeStart(){const c=this.c;if(!c||this.ch)return;const o=c.createOscillator();o.type='triangle';o.frequency.value=180;

/* ================= gust (F = P × A × D × W) ================= */
function gust(px,py,P,aim,self,extra=0){
  const B=buttPos(),dx=px-B.x,dy=py-B.y,d=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  const diff=Math.abs(angDiff(ang,aim)),half=(4+6*P)*DEG+extra;
  let A=diff<=half?1-0.35*(diff/half)**2:Math.max(0,0.65*(1-(diff-half)/(4*DEG)));
  let blocked=false;
  for(const b of world.bodies){if(!b.occ||b===self||!b.alive||b.tipped)continue;if(segBox(B.x,B.y,px,py,b)){blocked=true;break}}
  const bl=world.balloon;if(!blocked&&bl&&bl.alive&&self!==bl&&segCircle(B.x,B.y,px,py,bl.x,bl.y,bl.r))blocked=true;
  if(blocked)A*=0.3;
  const D=clamp(1-d/REACH,0,1),Wf=clamp(1+0.55*world.wind*Math.cos(ang),0.35,1.6);
  return{F:P*A*D*Wf,d,ang,blocked};
}

let charge=null; // {pid,t,power,src}
function canFire(){return mode==='play'&&!paused&&world&&!world.cleared&&!world.over&&P_().state==='idle'}
function effAim(){const w=world;if(charge&&charge.power>.9)return clamp(w.aim+Math.sin(charge.t*23)*12*DEG*((charge.power-.9)/.1),AIM_MIN-.2,AIM_MAX+.2);return w.aim}
function startCharge(pid,src){if(!canFire()||charge||world.cool>0)return;charge={pid,t:0,power:0,src};SFX.chargeStart()}
function cancelCharge(){if(charge){charge=null;SFX.chargeStop()}}
function releaseCharge(){if(!charge)return;const P=charge.power,a=effAim();charge=null;SFX.chargeStop();if(canFire())fire(P,a)}

function fire(P,aimShot){
  finalizeShot();
  const w=world;w.shots++;save.stats.shots++;
  const sh={id:w.shots,P,maxDepth:0,pairs:new Set(),t0:w.time,done:false,slow:false};
  w.shot=sh;w.ff=false;
  for(const b of w.bodies)b.depth=0;
  const aim=aimShot==null?w.aim:aimShot,B=buttPos(),p=P_();w.cool=1.0;
  // candles: decided now, applied when the gust front arrives (deterministic)
  for(const c of w.candles){if(!c.lit)continue;const cp=candlePos(c);const g=gust(cp.fx,cp.fy,P,aim,c.attached?null:c.body);
    later(g.d/WAVE,()=>{if(!c.lit)return;if(g.F>=c.th)extinguish(c,sh.id);else{c.leanV+=Math.cos(g.ang)*clamp(g.F/c.th,0,1)*260;c.flare=.5}})}
  // bodies
  for(const b of w.bodies){if(!b.alive||b===p)continue;const g=gust(b.x,b.y,P,aim,b,Math.atan2(Math.max(b.hw,b.hh),Math.hypot(b.x-B.x,b.y-B.y)));
    if(g.F>0.03)later(g.d/WAVE,()=>applyGust(b,g,P))}
  if(w.balloon&&w.balloon.alive){const bl=w.balloon;const g=gust(bl.x,bl.y,P,aim,bl,Math.atan2(bl.r,Math.hypot(bl.x-B.x,bl.y-B.y)));
    if(g.F>0.3)later(g.d/WAVE,()=>popBalloon(1))}
  // visuals
  const q=quality,n=Math.round((14+60*P)*q),half=(4+6*P)*DEG;
  for(let i=0;i<n;i++){const a=aim+(Math.random()*2-1)*half,s=(160+760*P)*(.4+Math.random()*.7);
    w.parts.push({k:'gas',x:B.x,y:B.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.6*(.5+P),max:1.1,r:3+Math.random()*4,drag:2.2,g:-30,hue:P})}
  w.waves.push({x:B.x,y:B.y,a:aim,half,r:0,max:P>CANDLE_TH?REACH*(1-CANDLE_TH/P):40,P});
  SFX.fart(P);
  const label=P<.25?t('puff1'):P<=.9?t('puff2'):t('puff3');
  addText(B.x+18,B.y-26,label,zoneColor(P),P>.9?24:P<.25?14:19,1);
  if(P<.25){p.expr='blush';p.exprT=1.3}
  else if(P<=.9){p.expr='relief';p.exprT=1;if(P>.7)p.shove=.35}
  else{p.expr='shock';p.exprT=1.5;w.shake=10;w.flash=.25}
  // 91-100%: the kid is blown away by the recoil
  if(P>.9)later(.02,()=>launchPlayer(-Math.cos(aim)*380,-760,0));
  // random event (35%), resolved after the base judgment
  if(w.L.events){const ev=rollEvent();if(ev){save.stats.events++;later(.5,()=>runEvent(ev))}}
  persist();
}
function applyGust(b,g,P){
  if(!b.alive)return;
  if(b.type==='granny'){if(g.F>.28&&b.state==='idle'){b.depth=1;bump(1);grannyCounter(b,null)}else b.wob=.5;return}
  if(b.pinned||b.kinematic)return;
  if(g.F<b.moveTh){b.wob=Math.min(1,g.F/b.moveTh+.2);return}
  let s=(g.F-b.moveTh*.6)*1600/b.mass;if(P>.9)s*=2.2;
  b.vx+=Math.cos(g.ang)*s;b.vy+=Math.sin(g.ang)*s-(P>.9?260:40);b.vr+=Math.cos(g.ang)*s*.012;
  if(b.type==='vase'&&!b.tipped)tipVase(b);
  if(!b.depth){b.depth=1;bump(1)}
}

const EVENTS=[['poop',20,'💩'],['rocket',20,'🚀'],['cake',20,'🎂'],['fire',15,'🔥'],['legs',15,'🕯️'],['granny',10,'👵']];
function rollEvent(){if(Math.random()>=0.35)return null;let r=Math.random()*100;for(const[k,wt]of EVENTS){if(r<wt)return k;r-=wt}return'poop'}

  const w=world,p=P_();if(w.over)return;

  if(k==='rocket'&&p.state!=='idle')k='poop';

  if(k==='legs'&&!w.candles.some(c=>c.lit))k='fire';
  const e2=EVENTS.find(e=>e[0]===k)[2]||em;
  w.banner={emoji:e2,text:t('ev_'+k),t:1.1};w.eventsFired++;

  else if(k==='rocket'){launchPlayer(70,-1480,0);for(let i=0;i<20*quality;i++)w.parts.push({k:'fire',x:B.x,y:B.y+10,vx:(Math.random()-.5)*120,vy:200+Math.random()*200,life:.5,max:.5,r:5,drag:2,g:0});SFX.whoosh();addChaos(500,p.x,p.y-60)}
  else if(k==='cake'){const c=w.cake;const dir=Math.random()<.5?-1:1;c.vx=dir*480;c.vy=-170;c.legsT=1.2;if(!c.depth){c.depth=1;bump(1)}SFX.scream();addChaos(400,c.x,c.y-50)}
  else if(k==='fire'){w.fireJet={t:.8,a};p.expr='scorched';p.exprT=2;SFX.fire();
    for(const b of w.bodies){if(b===p||b.pinned||!b.alive)continue;const dx=b.x-B.x,dy=b.y-B.y,d=Math.hypot(dx,dy);if(d<240&&Math.abs(angDiff(Math.atan2(dy,dx),a))<.35){b.vx+=dx/d*240;b.vy-=120;if(!b.depth){b.depth=1;bump(1)}}}
    addChaos(600,B.x+40,B.y-50)}
  else if(k==='legs'){for(const c of w.candles){if(!c.lit)continue;
      if(c.attached){const[lo,hi]=candleRange(c);const to=clamp(c.ox+(Math.random()<.5?-1:1)*(14+Math.random()*30),lo,hi);c.walk={from:c.ox,to,t:0,d:1.3}}
      else{c.body.vx=(Math.random()<.5?-1:1)*150;c.body.legsT=1.3}}
    addChaos(300,200,300)}
  else if(k==='granny'){grannyDropkick();addChaos(1000,200,260)}
}
function candleRange(c){const b=c.body;
  if(b.tiers&&c.oy>0){const th=b.tiers[1].w/2+5,bh=b.tiers[0].w/2-5;return c.ox<0?[-bh,-th]:[th,bh]}

  if(attacker&&!attacker.pinned){attacker.vx=-Math.abs(attacker.vx)*.6-260;attacker.vy=-280}
  later(.35,()=>{if(!g.alive||g.state!=='angry')return;g.state='throw';g.stT=.5;
    const s=mkBody({type:'slipper',x:g.x-18,y:g.y-28,hw:10,hh:5,mass:.4,moveTh:0,rest:.2,depth:g.depth+1,life:-1});
    const h=hips(),T=.6;s.vx=(h.x-s.x)/T;s.vy=(h.y-10-s.y)/T-.5*G*T;s.vr=-14;world.bodies.push(s);bump(s.depth);SFX.whoosh();

function launchPlayer(vx,vy,depth){

/* ================= physics ================= */
function resolveStatic(b,s){
  const dx=b.x-s.x,dy=b.y-s.y,ox=b.hw+s.hw-Math.abs(dx),oy=b.hh+s.hh-Math.abs(dy);
  if(ox<=0||oy<=0)return;
  if(oy<ox){

    else{b.y+=oy;if(b.vy<0)b.vy=0}
  }else{b.x+=dx<0?-ox:ox;b.vx=-b.vx*.3}
}
function onLand(b,imp,s){

  else if(b.type==='vase'&&s.floor&&imp>240){b.alive=false;SFX.shatter();addChaos(100,b.x,b.y-30);bump(b.depth+1);
    for(let i=0;i<16*quality;i++)world.parts.push({k:'shard',x:b.x,y:b.y,vx:(Math.random()-.5)*400,vy:-Math.random()*380,life:.9,max:.9,r:3,drag:.8,g:1300,col:'#6fa8ff'})}
  else if(b.type==='poop'){b.alive=false;world.decals.push({x:b.x,y:FLOOR,r:13,col:'#7a4a22',life:6,poop:true});SFX.splat()}
  else if(b.type==='slipper'&&b.life<0)b.life=2.5;
}
function impactPair(a,b,sp){
  const sh=world.shot;

  if(src&&sp>140){dst.depth=src.depth+1;bump(dst.depth)}
  if(sp>140&&sh){const key=a.uid<b.uid?a.uid+'-'+b.uid:b.uid+'-'+a.uid;
    if(!sh.pairs.has(key)){sh.pairs.add(key);addChaos(100,(a.x+b.x)/2,Math.min(a.y,b.y)-14);SFX.crash(Math.min(1,sp/700));world.shake=Math.max(world.shake,Math.min(7,sp/90))}}

function onHit(self,other,sp){

  else if(self.type==='player'&&self.state==='idle'&&sp>240){const dir=Math.sign(self.x-other.x)||-1;launchPlayer(dir*240,-1250-(other.type==='slipper'?550:0),self.depth)}

}
function collide(a,b){

  if((a.noHit===b&&a.noHitT>0)||(b.noHit===a&&b.noHitT>0))return;
  const dx=b.x-a.x,dy=b.y-a.y,ox=a.hw+b.hw-Math.abs(dx),oy=a.hh+b.hh-Math.abs(dy);

}
function physStep(dt){

/* ================= simulation step ================= */

  else if(p.state==='return'){p.retT+=dt/.35;const k=Math.min(1,p.retT);p.x=lerp(p.rsx,p.home,k);p.y=lerp(p.rsy,FLOOR-p.hh,k)-Math.sin(k*Math.PI)*36;p.rot=lerp(p.rr,0,k);

/* ================= main loop ================= */
let last=performance.now(),acc=0,quality=1,slowFrames=0;
function frame(now){
  requestAnimationFrame(frame);
  try{step(now)}catch(e){console.error(e)}
}
function step(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(dt>.026)slowFrames++;else slowFrames=Math.max(0,slowFrames-1);
  if(slowFrames>90&&quality>.5){quality=.5;slowFrames=0}
  if(world&&!paused&&(mode==='play'||mode==='title'||mode==='result')){
    const w=world;
    if(mode==='play'){
      if(charge){charge.t+=dt;const x=(charge.t/.95)%2;charge.power=x<1?x:2-x;SFX.chargeUpd(charge.power);const p=P_();p.expr='charge';p.exprT=.2;if(p.state!=='idle')cancelCharge()}
      if(w.cool>0)w.cool-=dt;if(keys.up)w.aim=clamp(w.aim-1.3*dt,AIM_MIN,AIM_MAX);if(keys.down)w.aim=clamp(w.aim+1.3*dt,AIM_MIN,AIM_MAX);
      if(!w.cleared&&!w.over){w.timeLeft-=dt;if(w.timeLeft<=0){w.timeLeft=0;w.over=true;w.endAt=w.time+.7;cancelCharge();SFX.lose();w.banner={emoji:'⏰',text:t('fail'),t:1.2}}}
    }
    let ts=1;if(w.slowT>0){w.slowT-=dt;ts=.28}else if(w.ff)ts=4;
    acc+=dt*ts;let n=0;while(acc>=STEP&&n<48){simStep(STEP);acc-=STEP;n++}if(n>=48)acc=0;
    if(mode==='play'){
      if(w.cleared){const since=w.time-w.clearAt;if((since>1.2&&((w.shot&&w.shot.done)||settled()))||since>2.6)showResult(true)}
      else if(w.over&&w.time>=w.endAt)showResult(false);
      const showSkip=(w.slowT>0)||(w.shot&&!w.shot.done&&w.time-w.shot.t0>.7&&!w.ff);
      if(skipBtn.hidden===showSkip)skipBtn.hidden=!showSkip;
    }else if(!skipBtn.hidden)skipBtn.hidden=true;
  }
  if(world)render(now/1000);
}

  else if(e==='blush'){ctx.fillRect(ex-7,ey-4,2.5,3);ctx.fillRect(ex+5,ey-4,2.5,3);ctx.beginPath();ctx.moveTo(ex-5,ey+7);ctx.quadraticCurveTo(ex-2.5,ey+4,ex,ey+7);ctx.quadraticCurveTo(ex+2.5,ey+10,ex+5,ey+7);ctx.stroke()}
  else{ctx.beginPath();ctx.arc(ex-6,ey-3,2,0,Math.PI*2);ctx.arc(ex+6,ey-3,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex,ey+4,5,.15*Math.PI,.85*Math.PI);ctx.stroke()}
  ctx.restore();
}
function drawAim(rt){
  const w=world,B=buttPos(),P=charge?charge.power:0;
  const ea=effAim(),shown=charge?P:.5,half=(4+6*shown)*DEG,col=zoneColor(charge?P:.5);
  const reach=charge?(P>CANDLE_TH?REACH*(1-CANDLE_TH/P):26):150;
  ctx.save();ctx.translate(B.x,B.y);
  ctx.globalAlpha=charge?.22:.1;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,reach,ea-half,ea+half);ctx.closePath();ctx.fill();
  ctx.globalAlpha=charge?.85:.5;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.lineDashOffset=-rt*30;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ea)*Math.max(reach,170),Math.sin(ea)*Math.max(reach,170));ctx.stroke();
  if(charge){ctx.setLineDash([]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,reach,ea-half,ea+half);ctx.stroke()}
  ctx.restore();ctx.globalAlpha=1;ctx.setLineDash([]);
}
function drawWaves(){for(const v of world.waves){const a=Math.max(0,1-v.r/(v.max+40));ctx.strokeStyle=`rgba(200,255,140,${a*.7})`;ctx.lineWidth=3+v.P*4;ctx.beginPath();ctx.arc(v.x,v.y,Math.max(1,v.r),v.a-v.half,v.a+v.half);ctx.stroke()}}
function drawParts(){
  for(const q of world.parts){const a=clamp(q.life/q.max,0,1);
    if(q.k==='gas'){ctx.fillStyle=q.hue>.9?`rgba(200,220,80,${a*.45})`:`rgba(160,214,90,${a*.38})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}
    else if(q.k==='smoke'){ctx.fillStyle=`rgba(220,210,230,${a*.35})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r+(1-a)*7,0,Math.PI*2);ctx.fill()}
    else if(q.k==='fire'){ctx.fillStyle=`rgba(255,${120+a*110|0},40,${a*.85})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.5+a),0,Math.PI*2);ctx.fill()}
    else if(q.k==='spark'){ctx.fillStyle=`rgba(255,230,140,${a})`;ctx.fillRect(q.x-1,q.y-1,2.5,2.5)}
    else if(q.k==='confetti'){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.life*q.spin);ctx.fillStyle=q.col;ctx.globalAlpha=Math.min(1,a*2);ctx.fillRect(-3,-1.5,6,3);ctx.restore();ctx.globalAlpha=1}
    else{ctx.fillStyle=q.col||'#fff';ctx.globalAlpha=Math.min(1,a*1.5);ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
}
function drawTexts(){ctx.textAlign='center';ctx.textBaseline='middle';for(const x of world.texts){const a=clamp(x.life/x.max*2,0,1);ctx.globalAlpha=a;outlinedText(x.text,x.x,x.y,x.size,x.color)}ctx.globalAlpha=1}
function drawHUD(rt){
  const w=world;
  let g=ctx.createLinearGradient(0,0,0,84);g.addColorStop(0,'rgba(18,9,24,.85)');g.addColorStop(1,'rgba(18,9,24,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,84);
  rr(10,11,58,30,15);ctx.fillStyle='#ffc23d';ctx.fill();ctx.fillStyle='#2a1500';font(15);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('LV '+w.level,39,27);
  const tl=Math.ceil(w.timeLeft),low=tl<=10&&!w.cleared;const pul=low?1+.08*Math.sin(rt*12):1;
  ctx.save();ctx.translate(196,27);ctx.scale(pul,pul);outlinedText('⏱ '+tl,0,0,26,low?'#ff4f6a':'#fff3e0');ctx.restore();
  const lit=w.candles.filter(c=>c.lit).length;
  ctx.textAlign='left';outlinedText('🕯 '+lit+'/'+w.candles.length,12,62,15,'#fff3e0',undefined,3);
  ctx.textAlign='center';font(14,800);
  const s1='🕯'+w.candleScore.toLocaleString(),s2='💥'+w.chaosScore.toLocaleString();
  outlinedText(s1,150,62,14,'#56e0b2',undefined,3);outlinedText(s2,234,62,14,'#ff5a8f',undefined,3);
  if(w.L.wind){const wx=360,wy=62,len=10+Math.abs(w.wind)*30;ctx.strokeStyle='#bfe2ff';ctx.fillStyle='#bfe2ff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(wx+len/2,wy);ctx.lineTo(wx-len/2,wy);ctx.stroke();ctx.beginPath();ctx.moveTo(wx-len/2-6,wy);ctx.lineTo(wx-len/2+2,wy-5);ctx.lineTo(wx-len/2+2,wy+5);ctx.fill();
    ctx.textAlign='right';outlinedText(t('wind'),wx-len/2-10,wy,12,'#bfe2ff',undefined,3)}
  if(w.chainPop){const k=w.chainPop,sc=1+Math.max(0,k.t-.8)*1.5,big=k.n>=5;ctx.save();ctx.translate(200,112);ctx.scale(sc,sc);ctx.textAlign='center';
    outlinedText('CHAIN ×'+k.n,0,0,big?32:24+k.n*2,big?'#ff4f6a':'#ffc23d','#1a0d22',6);ctx.restore()}
}
function drawControls(rt){
  const w=world;
  const g=ctx.createLinearGradient(0,550,0,H);g.addColorStop(0,'rgba(18,9,24,0)');g.addColorStop(.12,'rgba(18,9,24,.8)');g.addColorStop(1,'rgba(18,9,24,.94)');ctx.fillStyle=g;ctx.fillRect(0,550,W,H-550);
  // power gauge with the four zones from the spec
  const gx=20,gy=572,gw=360,gh=14,P=charge?charge.power:0;
  ctx.save();rr(gx,gy,gw,gh,7);ctx.clip();
  [[0,.25,'#5b5470'],[.25,.71,'#2f8f71'],[.71,.91,'#a87e1e'],[.91,1,'#a3324a']].forEach(z=>{ctx.fillStyle=z[2];ctx.fillRect(gx+gw*z[0],gy,gw*(z[1]-z[0]),gh)});
  if(charge){ctx.fillStyle=zoneColor(P);ctx.fillRect(gx,gy,gw*P,gh)}
  ctx.restore();
  ctx.fillStyle='#fff3e0';const mx=gx+gw*P;ctx.beginPath();ctx.moveTo(mx-6,gy-7);ctx.lineTo(mx+6,gy-7);ctx.lineTo(mx,gy+1);ctx.fill();
  font(10,800);ctx.textAlign='center';ctx.textBaseline='middle';
  [['z1',.125],['z2',.48],['z3',.81],['z4',.955]].forEach(([k,c])=>{ctx.fillStyle=zoneColor(c);ctx.fillText(t(k),gx+gw*c,gy+gh+10)});
  // angle pad
  rr(PAD.x,PAD.y,PAD.w,PAD.h,14);ctx.fillStyle=padActive()?'rgba(255,255,255,.12)':'rgba(255,255,255,.06)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.stroke();
  const cx=PAD.x+30,cy=PAD.y+PAD.h-22,r=52;
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,r,AIM_MIN,AIM_MAX);ctx.stroke();
  ctx.strokeStyle='#ffc23d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(w.aim)*(r+4),cy+Math.sin(w.aim)*(r+4));ctx.stroke();
  ctx.fillStyle='#ffc23d';ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  ctx.textAlign='left';ctx.fillStyle='#c9b2d4';font(12,800);ctx.fillText(t('angle'),PAD.x+104,PAD.y+24);
  outlinedText(Math.round(-w.aim/DEG)+'°',PAD.x+104,PAD.y+52,26,'#fff3e0',undefined,3);
  ctx.fillStyle='#c9b2d4';font(11,700);ctx.fillText(t('drag'),PAD.x+104,PAD.y+78);
  // fire button
  const pressed=!!charge,rad=FIRE.r*(pressed?.94:1);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(FIRE.x,FIRE.y+6,rad,0,Math.PI*2);ctx.fill();
  const bg=ctx.createRadialGradient(FIRE.x-14,FIRE.y-18,4,FIRE.x,FIRE.y,rad);bg.addColorStop(0,'#ff8ab0');bg.addColorStop(1,canFire()&&!(w.cool>0)?'#e63a72':'#6b4a5a');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(FIRE.x,FIRE.y+(pressed?4:0),rad,0,Math.PI*2);ctx.fill();
  if(w.cool>0&&!pressed){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(FIRE.x,FIRE.y,rad+6,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-w.cool));ctx.stroke()}
  if(pressed){ctx.strokeStyle=zoneColor(P);ctx.lineWidth=7;ctx.beginPath();ctx.arc(FIRE.x,FIRE.y+4,rad+7,-Math.PI/2,-Math.PI/2+Math.PI*2*P);ctx.stroke()}
  ctx.textAlign='center';font(26);ctx.fillText('💨',FIRE.x,FIRE.y-6+(pressed?4:0));
  outlinedText(t('hold'),FIRE.x,FIRE.y+22+(pressed?4:0),14,'#fff3e0','#8e1f47',3);
}
function drawHints(rt){
  const b=Math.sin(rt*5)*5;ctx.textAlign='center';ctx.textBaseline='middle';
  const c=world.cake;if(c&&c.alive){outlinedText('👇 '+t('hintAim'),c.x,c.y-c.hh-70+b,15,'#ffc23d')}
  outlinedText(t('hintHold')+' 👇',FIRE.x-30,FIRE.y-76+b,14,'#ffc23d');
}
function drawBanner(rt){const bn=world.banner;if(!bn)return;const k=Math.min(1,bn.t*4);
  ctx.save();ctx.globalAlpha=k;ctx.translate(200,250);ctx.textAlign='center';ctx.textBaseline='middle';
  font(28);const tw=ctx.measureText(bn.text).width+80;if(tw>380){const k2=380/tw;ctx.scale(k2,k2)}rr(-tw/2,-34,tw,68,34);ctx.fillStyle='rgba(18,9,24,.82)';ctx.fill();
  font(30);ctx.fillText(bn.emoji,-tw/2+36,1);outlinedText(bn.text,18,1,28,'#fff3e0');ctx.restore();ctx.globalAlpha=1}

/* ================= input ================= */
const pointers=new Map();const keys={up:false,down:false};
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function padActive(){for(const v of pointers.values())if(v.role==='pad')return true;return false}
function aimAt(pt){const h=hips();if(pt.x<h.x+6)return;world.aim=clamp(Math.atan2(pt.y-h.y,pt.x-h.x),AIM_MIN,AIM_MAX)}
cv.addEventListener('pointerdown',e=>{
  SFX.init();if(mode!=='play'||paused)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const pt=toLogical(e);let role;
  if(Math.hypot(pt.x-FIRE.x,pt.y-FIRE.y)<FIRE.r+14){role='charge';startCharge(e.pointerId,'btn')}
  else if(pt.x>=PAD.x-8&&pt.x<=PAD.x+PAD.w+8&&pt.y>=PAD.y-20){role='pad'}
  else if(pt.y<556){role=e.pointerType==='mouse'?'aimcharge':'aim';aimAt(pt);if(role==='aimcharge')startCharge(e.pointerId,'mouse')}
  else role='none';
  pointers.set(e.pointerId,{role,sy:pt.y,sa:world.aim});
});
cv.addEventListener('pointermove',e=>{const s=pointers.get(e.pointerId);if(!s||mode!=='play')return;const pt=toLogical(e);
  if(s.role==='aim'||s.role==='aimcharge')aimAt(pt);else if(s.role==='pad')world.aim=clamp(s.sa+(pt.y-s.sy)*.012,AIM_MIN,AIM_MAX)});
function endPointer(e){const s=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!s)return;if((s.role==='charge'||s.role==='aimcharge')&&charge&&charge.pid===e.pointerId)releaseCharge()}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(charge&&charge.pid===e.pointerId)cancelCharge()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  SFX.init();
  if(e.code==='Escape'){if(mode==='play')setPause(!paused);return}
  if(mode==='result'){if(e.code==='KeyR'||e.code==='Enter'||e.code==='Space'){e.preventDefault();startLevel(currentLevel)}return}
  if(mode==='title'){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();startLevel(defaultLevel())}return}
  if(mode!=='play')return;
  if(e.code==='KeyR'){startLevel(currentLevel);return}
  if(paused)return;
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)startCharge('key','key')}
  if(e.code==='ArrowUp'||e.code==='ArrowLeft'||e.code==='KeyW'){keys.up=true;e.preventDefault()}
  if(e.code==='ArrowDown'||e.code==='ArrowRight'||e.code==='KeyS'){keys.down=true;e.preventDefault()}
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'&&charge&&charge.pid==='key')releaseCharge();
  if(e.code==='ArrowUp'||e.code==='ArrowLeft'||e.code==='KeyW')keys.up=false;
  if(e.code==='ArrowDown'||e.code==='ArrowRight'||e.code==='KeyS')keys.down=false;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')setPause(true)});

/* ================= screens ================= */
const ovTitle=$('#ovTitle'),ovPause=$('#ovPause'),ovResult=$('#ovResult'),skipBtn=$('#bSkip'),toastEl=$('#toast');
function defaultLevel(){return Math.min(3,save.unlocked)}
function buildLevelList(){
  const el=$('#lvList');el.innerHTML='';
  for(let i=1;i<=3;i++){const b=document.createElement('button');b.className='lvbtn';const rec=save.best[i]||{};const locked=i>save.unlocked;b.disabled=locked;
    b.innerHTML=`<b>LV ${i}</b><span>${locked?'🔒 '+t('locked'):t('lv'+i)}</span><small>${rec.clear?('🏆 '+rec.clear.toLocaleString()):'—'} · 💥 ${(rec.chaos||0).toLocaleString()}</small>`;
    b.addEventListener('click',()=>{SFX.init();startLevel(i)});el.appendChild(b)}
}
function startLevel(n){
  cancelCharge();pointers.clear();currentLevel=n;newWorld(n);mode='play';paused=false;
  ovTitle.hidden=true;ovPause.hidden=true;ovResult.hidden=true;
  world.banner={emoji:'🎂',text:'LV '+n+' '+t('lv'+n),t:1.1};
  if(world.L.relight)later(1.15,()=>{world.banner={emoji:'🕯️',text:t('trick').replace('{s}',world.L.relight),t:2}});
}
function toTitle(){cancelCharge();mode='title';paused=false;newWorld(defaultLevel());ovPause.hidden=true;ovResult.hidden=true;ovTitle.hidden=false;buildLevelList()}
function setPause(v){if(mode!=='play')return;paused=v;ovPause.hidden=!v;if(v)cancelCharge();last=performance.now()}
let cardBlob=null,lastShareText='';
function showResult(win){
  const w=world;finalizeShot();mode='result';cancelCharge();
  const total=w.candleScore+w.chaosScore,rec=save.best[w.level]||{};
  let nb=[];
  if(win&&total>(rec.clear||0)){rec.clear=total;nb.push(t('clearRec'))}
  if(w.chaosScore>(rec.chaos||0)){rec.chaos=w.chaosScore;nb.push(t('chaosRec'))}
  rec.chain=Math.max(rec.chain||0,w.maxChain);save.best[w.level]=rec;
  if(win&&w.level<3)save.unlocked=Math.max(save.unlocked,w.level+1);persist();
  $('#resLv').textContent='LV '+w.level+' · '+t('lv'+w.level);
  const hd=$('#resHead');hd.textContent=win?t('clear'):t('fail');hd.className=win?'win':'lose';
  $('#resCandle').textContent=w.candleScore.toLocaleString();$('#resChaos').textContent=w.chaosScore.toLocaleString();
  const line=$('#resLine');line.textContent='';
  line.append(`${t('total')} ${total.toLocaleString()} · ${t('maxChain')} ×${w.maxChain}`);
  if(nb.length){const s=document.createElement('span');s.className='newbest';s.textContent='  '+t('newBest')+' ('+nb.join('/')+')';line.append(s)}
  else if(!win&&w.chaosScore>0){line.append(' · '+t('chaosKept'))}
  const nx=$('#bNext');nx.hidden=!(win&&w.level<3);
  ovResult.hidden=false;skipBtn.hidden=true;
  lastShareText=`FART CANDLE KING 💨🕯️ LV${w.level} ${win?'CLEAR':'FAIL'} | CANDLE ${w.candleScore} · CHAOS ${w.chaosScore} · CHAIN ×${w.maxChain}`;
  makeCard(win,total);
  setTimeout(()=>$('#bRetry').focus({preventScroll:true}),50);
}
function makeCard(win,total){
  const w=world;w.banner=null;w.chainPop=null;w.texts=[];render(performance.now()/1000);
  const S=600,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');
  const sy=cv.height*(150/H),sh=cv.height*(400/H),sw=cv.width*(400/W);
  x.fillStyle='#24122f';x.fillRect(0,0,S,S);x.drawImage(cv,0,sy,sw,sh,0,0,S,S);
  const g=x.createLinearGradient(0,S*.55,0,S);g.addColorStop(0,'rgba(18,9,24,0)');g.addColorStop(1,'rgba(18,9,24,.95)');x.fillStyle=g;x.fillRect(0,0,S,S);
  x.fillStyle='rgba(18,9,24,.85)';x.fillRect(0,0,S,70);
  x.textAlign='left';x.textBaseline='middle';x.font=`900 34px ${FONT}`;x.fillStyle='#ffc23d';x.fillText('FART CANDLE KING 👑',22,37);
  x.font=`900 56px ${FONT}`;x.fillStyle=win?'#56e0b2':'#ffc23d';x.fillText(win?t('clear'):t('fail'),22,S-150);
  x.font=`800 30px ${FONT}`;x.fillStyle='#56e0b2';x.fillText('🕯 '+w.candleScore.toLocaleString(),22,S-90);
  x.fillStyle='#ff5a8f';x.fillText('💥 '+w.chaosScore.toLocaleString(),260,S-90);
  x.font=`800 24px ${FONT}`;x.fillStyle='#fff3e0';x.fillText('LV '+w.level+' · CHAIN ×'+w.maxChain+' · '+t('total')+' '+total.toLocaleString(),22,S-44);
  try{$('#resImg').src=c.toDataURL('image/png')}catch(e){}
  cardBlob=null;try{c.toBlob(b=>{cardBlob=b},'image/png')}catch(e){}
}
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.hidden=true,1800)}
async function share(){
  const text=lastShareText;
  const copy=async()=>{try{await navigator.clipboard.writeText(text);toast(t('copied'))}catch(e){toast(t('shareFail'))}};
  if(!navigator.share){copy();return}
  try{
    if(cardBlob){const f=new File([cardBlob],'fart-candle-king.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return}}
    await navigator.share({text,title:'FART CANDLE KING'});
  }catch(e){if(e&&e.name==='AbortError')return;copy()}
}

/* ================= wiring ================= */
$('#bStart').addEventListener('click',()=>{SFX.init();startLevel(defaultLevel())});
$('#bResume').addEventListener('click',()=>setPause(false));
$('#bRetryP').addEventListener('click',()=>startLevel(currentLevel));
$('#bTitleP').addEventListener('click',toTitle);
$('#bRetry').addEventListener('click',()=>{SFX.init();startLevel(currentLevel)});
$('#bNext').addEventListener('click',()=>{SFX.init();startLevel(Math.min(3,currentLevel+1))});
$('#bShare').addEventListener('click',share);
$('#bTitleR').addEventListener('click',toTitle);
$('#bPause').addEventListener('click',()=>{if(mode==='play')setPause(!paused)});
skipBtn.addEventListener('click',()=>{if(!world)return;world.slowT=0;world.ff=true;skipBtn.hidden=true});
const sndBtn=$('#bSound');
function syncSound(){sndBtn.textContent=save.sound?'🔊':'🔇';sndBtn.setAttribute('aria-pressed',save.sound?'true':'false')}
sndBtn.addEventListener('click',()=>{SFX.init();save.sound=!save.sound;SFX.set(save.sound);syncSound();persist()});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{save.lang=b.dataset.lang;persist();applyLang()}));
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>SFX.init(),{once:true,capture:true}));

// test hook: event-rate check, e.g. __fck.eventRate(100000) → ≈0.35
window.__fck={eventRate(n=100000){let k=0;for(let i=0;i<n;i++)if(rollEvent())k++;return k/n},stats:()=>save.stats};

resize();syncSound();applyLang();newWorld(defaultLevel());
requestAnimationFrame(t0=>{last=t0;requestAnimationFrame(frame)});
})();
</script>
