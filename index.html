<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini Game Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --bg:#14102a;
  --bg-2:#1f1940;
  --card:#271f52;
  --line:#3b3175;
  --ink:#fff7e6;
  --muted:#b8addf;
  --hot:#ff4f7b;
  --gold:#ffd23d;
  --mint:#4fe0b6;
  --danger:#ff5a5a;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, #3a2380 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #5a1f5e 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}

/* Header */
header{padding:40px 0 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,48px);line-height:1.1;margin:0;letter-spacing:.02em}
.brand h1 span{color:var(--gold)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--bg-2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;transition:transform .1s,background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.on{background:var(--gold);border-color:var(--gold);color:#241a00}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}

.search{flex:1 1 220px;max-width:320px;border:2px solid var(--line);background:var(--bg-2);border-radius:999px;padding:8px 16px;font-size:14px;outline:none}
.search:focus{border-color:var(--gold)}

/* Manage banner */
.manage-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:rgba(255,210,61,.08);border:2px dashed var(--gold);border-radius:16px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.manage-bar p{margin:0;color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.thumb{all:unset;cursor:pointer;display:grid;place-items:center;aspect-ratio:16/10;position:relative;overflow:hidden}
.thumb:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.thumb .emoji{font-size:72px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));transition:transform .2s}
.card:hover .thumb .emoji{transform:scale(1.12) rotate(-6deg)}
.thumb .play-badge{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border-radius:999px;padding:4px 12px;font-weight:800;font-size:12px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3;margin:0}
.body p{margin:0;color:var(--muted);font-size:13px;flex:1}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.card .actions{display:flex;gap:8px;margin-top:4px}
.card .actions .btn{flex:1;text-align:center}
.del{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:18px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:2}
.card.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;min-height:260px;gap:8px;color:var(--muted);font-weight:800}
.card.add .plus{font-size:48px;line-height:1;color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

/* Player */
#player{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#player iframe{flex:1;width:100%;border:0;display:block;background:#000}
.player-bar{flex:none;display:flex;align-items:center;gap:6px;padding:4px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left));padding-top:max(4px,env(safe-area-inset-top));background:#0c0a1a;border-bottom:1px solid #2a2350}
.player-bar .title{flex:1;min-width:0;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.player-bar .btn{padding:2px 12px;font-size:12px;line-height:1.6;border-width:1.5px}
#player iframe{min-height:0}

/* Dialog */
dialog{border:2px solid var(--line);border-radius:20px;background:var(--bg-2);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,3,15,.7);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px}
dialog h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
input[type=text],input[type=url],input[type=password],textarea{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:500;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:12px}
.row>label{flex:1}
input[type=color]{width:100%;height:42px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:2px}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg label{flex:1;flex-direction:row;justify-content:center;padding:6px;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--gold);color:#241a00}
.hint{font-size:12px;color:var(--muted);margin:0;font-weight:500}
#pwMsg{color:#ff8a8a;min-height:1.2em;font-weight:800}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.preview{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.preview .mini{width:72px;aspect-ratio:16/10;border-radius:10px;display:grid;place-items:center;font-size:28px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 20px;border-radius:999px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px}

footer{color:var(--muted);font-size:12px;text-align:center;margin-top:48px}

/* Popularity ranking */
.sort{border:2px solid var(--line);background:var(--bg-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;outline:none;cursor:pointer}
.sort:focus{border-color:var(--gold)}
.ranking{background:linear-gradient(135deg,rgba(255,210,61,.10),rgba(255,79,123,.08));border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:24px}
.rank-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.rank-head h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.rank-note{color:var(--muted);font-size:12px;flex:1;min-width:120px}
.rank-head .btn{padding:4px 12px;font-size:12px}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank-item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:36px 40px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(20,16,42,.55);border:1.5px solid transparent;transition:border-color .15s,transform .1s}
.rank-item:hover{border-color:var(--gold)}
.rank-item:active{transform:scale(.99)}
.rank-item:focus-visible{outline:3px solid var(--gold)}
.rank-no{font-family:var(--display);font-size:18px;text-align:center;color:var(--muted)}
.rank-item.top .rank-no{font-size:24px}
.rank-emoji{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.rank-title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-count{font-family:var(--display);font-size:16px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.rank-count small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}
.rank-msg{color:var(--muted);font-size:13px;margin:0;padding:6px 4px}
.plays{font-size:12px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.plays[data-rank]::before{content:attr(data-rank);margin-right:4px}
</style>
</head>
<body>

<div class="wrap" id="home">
  <header>
    <div class="brand">
      <h1>MINI GAME <span>ARCADE</span></h1>
      <p>好きなゲームを選んで遊ぼう！</p>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="ゲームを検索…" aria-label="ゲームを検索">
      <select class="sort" id="sort" aria-label="並び順">
        <option value="default">おすすめ順</option>
        <option value="popular">人気順</option>
      </select>
      <button class="btn" id="manageBtn" aria-pressed="false">⚙ 管理</button>
    </div>
  </header>

  <div class="manage-bar" id="manageBar" hidden>
    <p>管理モード：右上の ✕ で削除、「＋」で追加できます。変更はこのブラウザに保存されます。</p>
    <div class="toolbar">
      <button class="btn" id="restoreBtn">削除したゲームを元に戻す</button>
      <button class="btn primary" id="addBtn">＋ ゲームを追加</button>
    </div>
  </div>

  <section class="ranking" id="ranking" aria-labelledby="rankTitle">
    <div class="rank-head">
      <h2 id="rankTitle">🏆 人気ランキング</h2>
      <span class="rank-note" id="rankNote">みんなが遊んだ回数（クリック数）</span>
      <button class="btn" id="rankToggle" aria-expanded="false">すべて見る</button>
    </div>
    <ol class="rank-list" id="rankList"></ol>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>Mini Game Arcade</footer>
</div>

<!-- Player -->
<div id="player" hidden>
  <div class="player-bar">
    <button class="btn" id="backBtn">← 戻る</button>
    <div class="title" id="playerTitle"></div>
    <button class="btn" id="reloadBtn" title="最初から">↻</button>
    <button class="btn" id="fsBtn" title="全画面">⛶</button>
  </div>
  <iframe id="frame" title="ゲーム" allow="autoplay; fullscreen; clipboard-write; web-share" allowfullscreen></iframe>
</div>

<!-- Add dialog -->
<dialog id="pwDlg">
  <form method="dialog" id="pwForm">
    <h3>🔒 管理者パスワード</h3>
    <label>パスワード
      <input type="password" name="pw" id="pwInput" autocomplete="current-password" required>
    </label>
    <p class="hint" id="pwMsg" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" value="cancel" data-close>キャンセル</button>
      <button class="btn primary" value="ok" id="pwOk">開く</button>
    </div>
  </form>
</dialog>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h3>ゲームを追加</h3>
    <label>タイトル *
      <input type="text" name="title" required maxlength="60" placeholder="例：Super Jump King">
    </label>
    <label>説明
      <textarea name="description" maxlength="200" placeholder="どんなゲーム？"></textarea>
    </label>
    <div class="row">
      <label>絵文字
        <input type="text" name="emoji" maxlength="4" value="🎮">
      </label>
      <label>背景色
        <input type="color" name="color" value="#3b2690">
      </label>
    </div>
    <div class="preview"><div class="mini" id="pv">🎮</div>カードのプレビュー</div>

    <div class="seg" role="radiogroup" aria-label="ゲームの場所">
      <label><input type="radio" name="src" value="file" checked>HTMLファイル</label>
      <label><input type="radio" name="src" value="url">URL / パス</label>
    </div>
    <label id="fileField">HTMLファイル *
      <input type="file" name="file" accept=".html,.htm,text/html">
      <span class="hint">1ファイルで完結するゲーム（.html）をアップロードします。</span>
    </label>
    <label id="urlField" hidden>URL またはパス *
      <input type="text" name="url" placeholder="games/my-game/index.html または https://…">
      <span class="hint">games/ フォルダに置いたゲームや、外部サイトのゲームを登録できます。</span>
    </label>

    <div class="dlg-actions">
      <button class="btn" type="button" value="cancel" data-close>キャンセル</button>
      <button class="btn primary" value="ok" id="addOk">追加する</button>
    </div>
  </form>
</dialog>

<script src="games.js?v=39"></script>
<script>
(() => {
  "use strict";

  /* ---------- storage ---------- */
  const LS_CUSTOM = "arcade.customGames";
  const LS_HIDDEN = "arcade.hiddenGames";
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

  // IndexedDB for uploaded HTML files (can be larger than localStorage allows)
  const idb = (() => {
    let p;
    const open = () => p ??= new Promise((res, rej) => {
      const r = indexedDB.open("arcade", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction("files", mode);
        const req = fn(t.objectStore("files"));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      get: k => tx("readonly", s => s.get(k)),
      put: (k, v) => tx("readwrite", s => s.put(v, k)),
      del: k => tx("readwrite", s => s.delete(k)),
    };
  })();

  /* ---------- state ---------- */
  const builtin = (window.GAMES || []).map(g => ({ ...g, builtin: true }));
  let custom = lsGet(LS_CUSTOM, []);
  let hidden = new Set(lsGet(LS_HIDDEN, []));
  let manage = false;
  let query = "";
  let sortMode = lsGet("arcade.sort", "default");
  let rankOpen = false;

  const allGames = () => [...builtin.filter(g => !hidden.has(g.id)), ...custom];
  const findGame = id => allGames().find(g => g.id === id);

  /* ---------- DOM ---------- */
  const $ = s => document.querySelector(s);
  const grid = $("#grid"), home = $("#home"), player = $("#player"), frame = $("#frame");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || "") ? c : "#3b2690";

  function render() {
    const q = query.trim().toLowerCase();
    let list = allGames().filter(g => !q || (g.title + " " + (g.description || "")).toLowerCase().includes(q));
    if (sortMode === "popular") list = byPopularity(list);
    let html = list.map(g => {
      const c = safeColor(g.color), a = safeColor(g.accent || g.color);
      return `
      <article class="card" data-id="${esc(g.id)}">
        ${manage ? `<button class="del" data-del="${esc(g.id)}" aria-label="${esc(g.title)} を削除">✕</button>` : ""}
        <button class="thumb" data-play="${esc(g.id)}" aria-label="${esc(g.title)} で遊ぶ"
          style="background:radial-gradient(circle at 30% 30%, ${a}55, transparent 60%), linear-gradient(135deg, ${c}, ${c}cc)">
          <span class="emoji">${esc(g.emoji || "🎮")}</span>
          <span class="play-badge">▶ PLAY</span>
        </button>
        <div class="body">
          <h2>${esc(g.title)}${g.builtin ? "" : `<span class="tag">追加</span>`}</h2>
          ${playsBadge(g)}
          <p>${esc(g.description || "")}</p>
          <div class="actions"><button class="btn primary" data-play="${esc(g.id)}">▶ 遊ぶ</button></div>
        </div>
      </article>`;
    }).join("");
    if (manage) html += `<button class="card add" id="addCard"><span class="plus">＋</span>ゲームを追加</button>`;
    if (!list.length && !manage) html = `<div class="empty">${q ? "見つかりませんでした。" : "ゲームがありません。「⚙ 管理」から追加できます。"}</div>`;
    grid.innerHTML = html;
    $("#restoreBtn").hidden = hidden.size === 0;
    renderRanking();
  }

  /* ---------- click counter & popularity ranking ----------
   * 全員分のクリック数（ゲームを開いた回数）を無料のカウンターサービス Abacus に保存する。
   * https://abacus.jasoncameron.dev  … 登録不要。1人あたり10秒に30回までのアクセス制限あり。
   * 追加した（このブラウザだけの）ゲームは集計しない。 */
  const COUNTER_API = "https://abacus.jasoncameron.dev";
  const COUNTER_NS = window.ARCADE_COUNTER_NS || "cuichunxue-mini-game-arcade";
  const LS_COUNTS = "arcade.counts";
  const CACHE_MS = 60 * 1000;
  let counts = {};          // id -> number
  let countsState = "loading"; // loading | ok | error
  {
    const c = lsGet(LS_COUNTS, null);
    if (c && c.counts) { counts = c.counts; countsState = "ok"; }
  }
  const counted = g => g.builtin;
  const saveCounts = () => lsSet(LS_COUNTS, { t: Date.now(), counts });
  const fmtN = n => Number(n || 0).toLocaleString("ja-JP");

  async function counterReq(kind, id) {
    const r = await fetch(`${COUNTER_API}/${kind}/${COUNTER_NS}/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (r.status === 404) return 0; // まだ一度もクリックされていない
    if (!r.ok) throw new Error("counter " + r.status);
    const j = await r.json();
    return Number(j.value) || 0;
  }

  async function loadCounts(force) {
    const c = lsGet(LS_COUNTS, null);
    if (!force && c && Date.now() - c.t < CACHE_MS) return;
    const ids = builtin.map(g => g.id);
    let failed = 0, i = 0;
    // 同時に4件ずつ取得（アクセス制限に引っかからないように）
    await Promise.all(Array.from({ length: 4 }, async () => {
      while (i < ids.length) {
        const id = ids[i++];
        try { counts[id] = Math.max(await counterReq("get", id), counts[id] || 0); } catch { failed++; }
      }
    }));
    if (failed < ids.length) { countsState = "ok"; saveCounts(); }
    else if (countsState !== "ok") countsState = "error";
    if (player.hidden) render();
  }

  function countPlay(g) {
    if (!counted(g)) return;
    // ページ再読み込みなどで同じゲームを数秒以内に二重カウントしない
    let last = null;
    try { last = JSON.parse(sessionStorage.getItem("arcade.lastHit")); } catch {}
    if (last && last.id === g.id && Date.now() - last.t < 5000) return;
    try { sessionStorage.setItem("arcade.lastHit", JSON.stringify({ id: g.id, t: Date.now() })); } catch {}
    counts[g.id] = (counts[g.id] || 0) + 1; // すぐに画面へ反映
    counterReq("hit", g.id)
      .then(v => { counts[g.id] = Math.max(v, counts[g.id] || 0); countsState = "ok"; saveCounts(); })
      .catch(() => {});
  }

  function byPopularity(list) {
    const order = new Map(allGames().map((g, i) => [g.id, i]));
    return [...list].sort((a, b) =>
      (counted(b) - counted(a)) || ((counts[b.id] || 0) - (counts[a.id] || 0)) || (order.get(a.id) - order.get(b.id)));
  }
  const MEDALS = ["🥇", "🥈", "🥉"];
  // 同数は同順位（1, 2, 2, 4 …）。0 回のゲームは順位なし (0)
  function rankOf(id) {
    const n = counts[id] || 0;
    if (!n) return 0;
    return 1 + allGames().filter(g => counted(g) && (counts[g.id] || 0) > n).length;
  }
  function playsBadge(g) {
    if (!counted(g) || countsState !== "ok") return "";
    const r = rankOf(g.id), n = counts[g.id] || 0;
    const medal = r >= 1 && r <= 3 ? ` data-rank="${MEDALS[r - 1]}"` : "";
    return `<span class="plays"${medal}>▶ ${fmtN(n)} 回プレイ</span>`;
  }

  function renderRanking() {
    const list = $("#rankList"), toggle = $("#rankToggle");
    const games = byPopularity(allGames().filter(counted));
    $("#ranking").hidden = games.length === 0;
    if (countsState === "loading") { list.innerHTML = `<li class="rank-msg">集計を読み込み中…</li>`; toggle.hidden = true; return; }
    if (countsState === "error") { list.innerHTML = `<li class="rank-msg">ランキングを読み込めませんでした。通信状況を確認してください。</li>`; toggle.hidden = true; return; }
    const shown = rankOpen ? games : games.slice(0, 5);
    list.innerHTML = shown.map(g => {
      const n = counts[g.id] || 0, rank = rankOf(g.id);
      const no = rank === 0 ? "–" : rank <= 3 ? MEDALS[rank - 1] : rank;
      return `<li><button class="rank-item${rank >= 1 && rank <= 3 ? " top" : ""}" data-play="${esc(g.id)}" aria-label="${rank ? rank + "位 " : ""}${esc(g.title)} ${fmtN(n)}回 — 遊ぶ">
        <span class="rank-no">${no}</span>
        <span class="rank-emoji" style="background:${safeColor(g.color)}">${esc(g.emoji || "🎮")}</span>
        <span class="rank-title">${esc(g.title)}</span>
        <span class="rank-count">${fmtN(n)}<small>回</small></span>
      </button></li>`;
    }).join("");
    toggle.hidden = games.length <= 5;
    toggle.textContent = rankOpen ? "トップ5だけ表示" : `すべて見る（${games.length}）`;
    toggle.setAttribute("aria-expanded", rankOpen);
  }

  $("#rankList").addEventListener("click", e => {
    const b = e.target.closest("[data-play]");
    if (b) location.hash = "#/play/" + encodeURIComponent(b.dataset.play);
  });
  $("#rankToggle").addEventListener("click", () => { rankOpen = !rankOpen; renderRanking(); });
  const sortSel = $("#sort");
  sortSel.value = sortMode === "popular" ? "popular" : "default";
  sortSel.addEventListener("change", () => { sortMode = sortSel.value; lsSet("arcade.sort", sortMode); render(); });

  grid.addEventListener("click", e => {
    const play = e.target.closest("[data-play]");
    const del = e.target.closest("[data-del]");
    if (del) return removeGame(del.dataset.del);
    if (play) return location.hash = "#/play/" + encodeURIComponent(play.dataset.play);
    if (e.target.closest("#addCard")) openAdd();
  });

  $("#search").addEventListener("input", e => { query = e.target.value; render(); });

  /* ---------- admin password ----------
   * 管理モードに入るときに毎回パスワードを確認する。games.js の ADMIN_PASSWORD_HASH と照合
   * （SHA-256、"mini-game-arcade:" + パスワード）。公開サイトなので簡易ロックである点に注意。 */
  const PW_SALT = "mini-game-arcade:";
  const pwDlg = $("#pwDlg"), pwForm = $("#pwForm"), pwInput = $("#pwInput"), pwMsg = $("#pwMsg");
  let pwFails = 0, pwLockUntil = 0, pwResolve = null;
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function askAdminPassword() {
    if (!window.ADMIN_PASSWORD_HASH) return Promise.resolve(true); // not configured
    if (!(window.crypto && crypto.subtle)) { alert("このブラウザではパスワードを確認できません（https で開いてください）。"); return Promise.resolve(false); }
    pwForm.reset(); pwMsg.textContent = "";
    pwDlg.showModal(); pwInput.focus();
    return new Promise(res => { pwResolve = res; });
  }
  pwForm.addEventListener("submit", async e => {
    if (e.submitter?.value !== "ok") return;
    e.preventDefault();
    const wait = Math.ceil((pwLockUntil - Date.now()) / 1000);
    if (wait > 0) { pwMsg.textContent = `${wait} 秒後にもう一度お試しください。`; return; }
    const ok = (await sha256Hex(PW_SALT + pwInput.value)) === String(window.ADMIN_PASSWORD_HASH).toLowerCase();
    if (ok) { pwFails = 0; pwDlg.close("ok"); return; }
    pwFails++; pwInput.select();
    if (pwFails >= 5) { pwFails = 0; pwLockUntil = Date.now() + 30000; pwMsg.textContent = "5回まちがえました。30秒後にもう一度お試しください。"; }
    else pwMsg.textContent = "パスワードがちがいます。";
  });
  // Cancel buttons are type=button so that Enter in a text field submits the OK button, not Cancel
  document.querySelectorAll("dialog [data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close("cancel")));
  pwDlg.addEventListener("close", () => { const r = pwResolve; pwResolve = null; r?.(pwDlg.returnValue === "ok"); });

  $("#manageBtn").addEventListener("click", async () => {
    if (!manage && !(await askAdminPassword())) return;
    manage = !manage;
    $("#manageBtn").classList.toggle("on", manage);
    $("#manageBtn").setAttribute("aria-pressed", manage);
    $("#manageBar").hidden = !manage;
    render();
  });

  /* ---------- delete / restore ---------- */
  async function removeGame(id) {
    const g = findGame(id);
    if (!g || !confirm(`「${g.title}」を削除しますか？`)) return;
    if (g.builtin) {
      hidden.add(id);
      lsSet(LS_HIDDEN, [...hidden]);
    } else {
      custom = custom.filter(x => x.id !== id);
      lsSet(LS_CUSTOM, custom);
      if (g.fileKey) idb.del(g.fileKey).catch(() => {});
    }
    render();
    toast(`「${g.title}」を削除しました`);
  }

  $("#restoreBtn").addEventListener("click", () => {
    const n = hidden.size;
    hidden.clear();
    lsSet(LS_HIDDEN, []);
    render();
    toast(`${n} 個のゲームを元に戻しました`);
  });

  /* ---------- add ---------- */
  const dlg = $("#addDlg"), form = $("#addForm");
  const updatePreview = () => {
    const pv = $("#pv");
    pv.textContent = form.emoji.value || "🎮";
    pv.style.background = form.color.value;
  };
  const updateSrc = () => {
    const isFile = form.src.value === "file";
    $("#fileField").hidden = !isFile;
    $("#urlField").hidden = isFile;
  };
  form.addEventListener("input", updatePreview);
  form.addEventListener("change", updateSrc);
  form.file.addEventListener("change", () => {
    const f = form.file.files[0];
    if (f && !form.title.value) form.title.value = f.name.replace(/\.html?$/i, "").replace(/[-_]+/g, " ");
  });

  function openAdd() {
    form.reset();
    updatePreview(); updateSrc();
    dlg.showModal();
  }
  $("#addBtn").addEventListener("click", openAdd);

  form.addEventListener("submit", async e => {
    if (e.submitter?.value !== "ok") return;
    e.preventDefault();
    const title = form.title.value.trim();
    if (!title) return form.title.reportValidity();
    const id = "custom-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const game = {
      id, title,
      description: form.description.value.trim(),
      emoji: form.emoji.value.trim() || "🎮",
      color: form.color.value,
    };
    if (form.src.value === "file") {
      const f = form.file.files[0];
      if (!f) { alert("HTMLファイルを選んでください。"); return; }
      try {
        await idb.put(id, await f.text());
      } catch {
        alert("ファイルを保存できませんでした（プライベートブラウズでは保存できない場合があります）。");
        return;
      }
      game.fileKey = id;
    } else {
      const url = form.url.value.trim();
      if (!url || /^\s*(javascript|data):/i.test(url)) { alert("URL またはパスを入力してください。"); return; }
      game.path = url;
    }
    custom.push(game);
    if (!lsSet(LS_CUSTOM, custom)) {
      custom.pop();
      if (game.fileKey) idb.del(game.fileKey).catch(() => {});
      alert("保存できませんでした。");
      return;
    }
    dlg.close();
    render();
    toast(`「${title}」を追加しました`);
  });

  /* ---------- player ---------- */
  let blobUrl = null;
  async function openGame(id) {
    const g = findGame(id);
    if (!g) { location.hash = ""; toast("ゲームが見つかりません"); return; }
    let src = g.path;
    // 組み込みゲームはバージョンを付けて、古いキャッシュが使われないようにする
    if (g.builtin && window.GAMES_VERSION) src += (src.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(window.GAMES_VERSION);
    if (g.fileKey) {
      const html = await idb.get(g.fileKey).catch(() => null);
      if (html == null) { location.hash = ""; toast("ゲームファイルが見つかりません"); return; }
      blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      src = blobUrl;
    }
    countPlay(g);
    $("#playerTitle").textContent = g.title;
    document.title = g.title + " | Mini Game Arcade";
    frame.src = src;
    player.hidden = false;
    home.hidden = true;
    frame.focus();
  }
  function closeGame() {
    frame.src = "about:blank";
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    player.hidden = true;
    home.hidden = false;
    render();
    loadCounts();
    document.title = "Mini Game Arcade";
    if (document.fullscreenElement) document.exitFullscreen?.();
  }
  function route() {
    const m = location.hash.match(/^#\/play\/(.+)$/);
    if (m) openGame(decodeURIComponent(m[1]));
    else if (!player.hidden) closeGame();
  }
  window.addEventListener("hashchange", route);

  $("#backBtn").addEventListener("click", () => {
    location.hash = "";
  });
  $("#reloadBtn").addEventListener("click", () => {
    const s = frame.src; frame.src = "about:blank"; setTimeout(() => { frame.src = s; frame.focus(); }, 30);
  });
  $("#fsBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else player.requestFullscreen?.().catch(() => toast("全画面にできませんでした"));
  });
  if (!document.fullscreenEnabled) $("#fsBtn").hidden = true;

  /* ---------- audio helper (injected into same-origin game frames) ----------
   * iPhone/iPad では
   *  - Web Audio はユーザー操作（タップ）の中で resume しないと鳴らない
   *  - マナーモード（消音スイッチ）だと Web Audio が鳴らない
   * そこで、ゲームの AudioContext を記録してタップのたびに resume し、
   * さらに「再生」扱いの音声セッションにしてマナーモードでも鳴るようにする。 */
  let silentUrl = null;
  function getSilentUrl() {
    if (silentUrl) return silentUrl;
    // 0.25 秒・8kHz・8bit の無音 WAV
    const n = 2000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, "data"); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return silentUrl = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  function setPlaybackSession(w) {
    try { if (w.navigator.audioSession) { w.navigator.audioSession.type = "playback"; return true; } } catch {}
    return false;
  }
  setPlaybackSession(window);

  function enhanceFrame() {
    let w, d;
    try { w = frame.contentWindow; d = w.document; } catch { return; } // cross-origin: nothing we can do
    if (!w || !d || w.__arcadeAudio || w.location.href === "about:blank") return;
    const ctxs = new Set(); // AudioContexts the game creates from now on
    w.__arcadeAudio = ctxs;
    setPlaybackSession(w);

    for (const name of ["AudioContext", "webkitAudioContext"]) {
      const Orig = w[name];
      if (typeof Orig !== "function") continue;
      const Wrapped = function (...args) { const c = new Orig(...args); ctxs.add(c); return c; };
      Wrapped.prototype = Orig.prototype;
      try { Object.setPrototypeOf(Wrapped, Orig); w[name] = Wrapped; } catch {}
    }

    let silent = null;
    const unlock = () => {
      for (const c of ctxs) if (c.state !== "running" && c.state !== "closed") c.resume().catch(() => {});
      if (!silent) {
        // A looping silent <audio> switches the page to "playback", so Web Audio is not muted
        // by the ringer switch. navigator.audioSession alone is not honored inside iframes on iOS.
        silent = d.createElement("audio");
        silent.src = getSilentUrl();
        silent.loop = true;
        silent.setAttribute("playsinline", "");
        silent.setAttribute("x-webkit-airplay", "deny");
        silent.dataset.arcadeSilent = "1";
        silent.style.display = "none";
        (d.body || d.documentElement).appendChild(silent);
        silent.play().catch(() => { silent = null; });
      }
    };
    for (const ev of ["pointerdown", "touchend", "click", "keydown"]) {
      w.addEventListener(ev, unlock, { capture: true, passive: true });
    }
    // Games pause audio when hidden; bring it back when the page is visible again
    d.addEventListener("visibilitychange", () => {
      if (d.hidden) { silent?.pause(); }
      else { silent?.play().catch(() => {}); }
    });
    w.addEventListener("pagehide", () => { silent?.pause(); silent = null; });
  }
  frame.addEventListener("load", enhanceFrame);

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg) {
    let t = $(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.hidden = true, 2200);
  }

  render();
  route();
  loadCounts();
})();
</script>
</body>
</html>
