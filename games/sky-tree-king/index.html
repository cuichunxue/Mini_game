<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SKY TREE KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed living sky canvas; HUD hugs the top safe area; thumbs own the bottom corners (stick left, JUMP/GRAB right) */
:root{
  --night:#0c1233;
  --cream:#fff6df;
  --muted:#c4c9ea;
  --leaf:#86e3a5;
  --leaf-deep:#3f9b5c;
  --sun:#ffc94d;
  --sun-deep:#c98f12;
  --rose:#ff8fa3;
  --glass:rgba(10,14,44,.86);
  --hair:rgba(255,246,223,.18);
  --ink:#241c3a;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-body)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HUD */
#hud{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(30px,calc(env(safe-area-inset-right,0px) + 30px));pointer-events:none}
.hud-left{display:flex;flex-direction:column;gap:7px;min-width:0}
.hud-alt{font-family:var(--f-display);font-size:clamp(32px,9vw,46px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(12,18,51,.6),0 0 16px rgba(12,18,51,.4)}
.hud-alt small{font-size:.42em;margin-left:4px}
.hud-zone{align-self:flex-start;white-space:nowrap;font-weight:900;font-size:12px;letter-spacing:.06em;background:rgba(12,18,51,.58);padding:5px 11px;border-radius:999px}
.stam{width:132px;height:9px;border-radius:9px;background:rgba(12,18,51,.6);border:1px solid rgba(255,246,223,.3);overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7be0a0,#c8f59a);border-radius:9px;transition:width .1s linear}
.stam.low i{background:linear-gradient(90deg,#ff6b6b,#ffb36b)}
.stam-l{font-size:10px;font-weight:900;letter-spacing:.14em;opacity:.85;text-shadow:0 1px 3px rgba(12,18,51,.9)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair);background:rgba(12,18,51,.6);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0;pointer-events:auto}
.icon-btn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
.chip{font-size:12px;font-weight:700;background:rgba(12,18,51,.6);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,246,223,.22)}
.dots i.on{background:conic-gradient(#ff6b8b,#ffc94d,#7be0a0,#6fd3ff,#b18cff,#ff6b8b)}
.chip.warn{background:rgba(111,211,255,.35)}

/* banner */
#banner{position:fixed;left:0;right:0;top:27%;z-index:7;text-align:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0;transform:translateY(10px) scale(.96);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#banner.show{opacity:1;transform:none}
.b-main{font-family:var(--f-display);font-size:clamp(26px,7.5vw,44px);line-height:1.15;text-wrap:balance;color:var(--cream);text-shadow:0 3px 0 rgba(12,18,51,.65),0 0 24px rgba(12,18,51,.5)}
.b-sub{margin-top:6px;font-weight:900;font-size:clamp(13px,3.6vw,16px);text-shadow:0 1px 0 rgba(12,18,51,.85),0 0 10px rgba(12,18,51,.75)}
#banner.rare .b-main{color:var(--sun)}
#banner.zone .b-main{font-size:clamp(13px,3.6vw,16px);letter-spacing:.34em;color:var(--sun)}
#banner.zone .b-sub{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,9vw,52px);margin-top:6px}
#banner.big .b-main{font-size:clamp(30px,9vw,54px)}
#banner.danger .b-main{color:#ffe36b}

/* talk */
#talk{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s}
#talk.show{opacity:1;transform:none}
.bubble{max-width:500px;background:var(--cream);color:var(--ink);border-radius:6px 22px 22px 22px;padding:11px 15px 11px 11px;display:flex;gap:11px;align-items:center;box-shadow:0 6px 0 rgba(12,18,51,.35)}
.bubble svg{flex:0 0 42px;width:42px;height:42px}
.bubble .who{font-weight:900;font-size:11px;letter-spacing:.12em;color:#3d7a52}
.bubble p{margin:2px 0 0;font-weight:700;font-size:14.5px;line-height:1.55}

/* touch controls */
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:52%;height:58%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(12,18,51,.3);border:2px solid rgba(255,246,223,.38);pointer-events:none}
#stick::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,246,223,.25)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,246,223,.9);box-shadow:0 3px 0 rgba(12,18,51,.4)}
.cbtn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,246,223,.55);color:var(--ink);font-weight:900;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.1;text-align:center;padding:0}
#btnJump{width:104px;height:104px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);background:var(--sun);font-size:16px;letter-spacing:.06em;box-shadow:0 5px 0 var(--sun-deep)}
.cbtn.on{transform:translateY(3px);box-shadow:none}
.cbtn.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,201,77,.5)}}
.ctip{position:absolute;font-size:11px;font-weight:900;background:rgba(12,18,51,.65);padding:4px 9px;border-radius:999px;white-space:nowrap;transition:opacity .6s}
#tipStick{left:calc(max(16px,env(safe-area-inset-left,0px)) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 176px)}
#tipJump{right:calc(max(16px,env(safe-area-inset-right,0px)) + 2px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;touch-action:pan-y}
#title{background:linear-gradient(to bottom,rgba(12,18,51,.55),rgba(12,18,51,0) 32%,rgba(12,18,51,0) 46%,rgba(12,18,51,.86) 74%);align-items:stretch}
.title-wrap{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:20px;width:100%;max-width:480px;min-height:100%}
.logo{text-align:center;margin-top:1vh}
.eyebrow{margin:0;font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--sun)}
.logo h1{margin:8px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(52px,16vw,90px);line-height:.88;display:flex;flex-direction:column;align-items:center;color:var(--cream);text-shadow:0 5px 0 rgba(12,18,51,.55)}
.logo h1 .king{color:var(--sun);font-size:1.14em}
.logo .tag{margin:12px 0 0;font-weight:900;font-size:14px;letter-spacing:.08em;color:var(--cream);text-shadow:0 1px 6px rgba(12,18,51,.9)}
.menu{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.mode-l{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--muted)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:340px}
.diff button{border:1px solid var(--hair);background:rgba(255,246,223,.08);color:var(--cream);border-radius:14px;padding:9px 4px 8px;cursor:pointer;font-family:var(--f-display);font-size:15px;line-height:1.2}
.diff button small{display:block;font-family:var(--f-body);font-weight:700;font-size:10px;color:var(--muted);margin-top:3px}
.diff button[aria-checked="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.diff button[aria-checked="true"] small{color:#5a5070}
.btn{font-weight:900;font-size:17px;padding:15px 22px;border-radius:18px;border:none;cursor:pointer;width:100%;max-width:340px;transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn-primary{background:var(--sun);color:#2a1f05;box-shadow:0 5px 0 var(--sun-deep)}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-ghost{background:rgba(255,246,223,.1);color:var(--cream);border:1px solid var(--hair)}
.btn small{font-weight:700;opacity:.75;margin-left:6px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.two .btn{font-size:14px;padding:12px 8px}
.howto{margin:2px 0 0;text-align:center;font-size:12.5px;line-height:1.7;color:var(--muted)}
.howto b{color:var(--cream)}
.records{margin:0;font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

.sheet{background:var(--glass);border:1px solid var(--hair);border-radius:26px;padding:22px 20px;width:100%;max-width:560px;box-sizing:border-box;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:auto}
.sheet h2{margin:6px 0 4px;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.2;text-wrap:balance}
.sheet .lead{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;gap:10px;align-items:center;background:rgba(255,246,223,.06);border:1px solid var(--hair);border-radius:16px;padding:10px;min-width:0}
.card canvas{flex:0 0 56px;width:56px;height:56px;border-radius:12px}
.card div{min-width:0}
.card b{display:block;font-size:14px}
.card span{display:block;font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:2px}
.card.rare b::after{content:"レア";font-size:10px;font-weight:900;color:#2a1f05;background:var(--sun);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.card.locked b{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.row .btn{flex:1 1 140px;max-width:none}
.score{font-family:var(--f-display);font-size:clamp(40px,12vw,58px);line-height:1;margin:10px 0 2px;color:var(--sun);font-variant-numeric:tabular-nums}
.score-l{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.stats div{background:rgba(255,246,223,.06);border:1px solid var(--hair);border-radius:14px;padding:10px 12px;min-width:0}
.stats dt{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.newrec{margin:12px 0 0;font-weight:900;color:var(--sun);font-size:14px}
.teaser{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(111,211,255,.18),rgba(177,140,255,.18));border:1px solid rgba(111,211,255,.35);font-size:13px;line-height:1.6}
.teaser b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em}
textarea#shareText{width:100%;box-sizing:border-box;margin-top:12px;height:96px;border-radius:12px;background:rgba(0,0,0,.3);color:var(--cream);border:1px solid var(--hair);font-family:var(--f-body);font-size:13px;padding:8px;user-select:text;-webkit-user-select:text}
.toggles{display:grid;gap:8px;margin-top:6px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,246,223,.06);border:1px solid var(--hair);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;color:var(--cream);cursor:pointer;width:100%;text-align:left}
.tg span:last-child{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:rgba(255,246,223,.15)}
.tg[aria-pressed="true"] span:last-child{background:var(--leaf);color:var(--ink)}
@media (prefers-reduced-motion:reduce){#banner,#talk{transition:none}.cbtn.glow{animation:none}}
</style>

</head>
<body>
<canvas id="c" aria-label="SKY TREE KING のゲーム画面"></canvas>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="hud-alt"><span id="altv">0</span><small>m</small></div>
    <div class="hud-zone" id="zonev">生命の森</div>
    <div><div class="stam-l">STAMINA</div><div class="stam" id="stamBox"><i id="stamv"></i></div></div>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div class="chips">
      <span class="chip" id="timev">0:00</span>
      <span class="chip" title="虹の実">虹の実 <span class="dots" id="rainv"><i></i><i></i><i></i><i></i><i></i></span></span>
      <span class="chip" id="birdv">大鳥 3</span>
      <span class="chip warn" id="windv" hidden>強風 →</span>
    </div>
  </div>
</div>

<div id="controls" hidden>
  <div id="stickZone"></div>
  <div id="stick"><div id="knob"></div></div>
  <button class="cbtn" id="btnJump" aria-label="ジャンプ">JUMP</button>
  <span class="ctip" id="tipStick">◀ ▶ 歩く　▲ 幹を登る・しらべる</span>
  <span class="ctip" id="tipJump">長押しで高く</span>
</div>

<div id="banner" aria-live="polite"><div class="b-main" id="bnM"></div><div class="b-sub" id="bnS"></div></div>

<div id="talk" aria-live="polite">
  <div class="bubble">
    <svg id="faceTree" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="22" fill="#7b5333"/><ellipse cx="23" cy="25" rx="15" ry="13" fill="#9a6d45"/><ellipse cx="17" cy="22" rx="2.6" ry="3.4" fill="#241c3a"/><ellipse cx="29" cy="22" rx="2.6" ry="3.4" fill="#241c3a"/><path d="M18 30q5 4 10 0" stroke="#241c3a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="9" r="7" fill="#79d08b"/><circle cx="23" cy="5" r="7" fill="#3f9b5c"/><circle cx="34" cy="9" r="7" fill="#79d08b"/></svg>
    <svg id="faceMoon" viewBox="0 0 46 46" aria-hidden="true" style="display:none"><circle cx="23" cy="23" r="21" fill="#fff4cf"/><circle cx="14" cy="14" r="3" fill="#e2d5a6"/><circle cx="33" cy="32" r="4" fill="#e2d5a6"/><path d="M11 22q12-9 24 0q-12 9-24 0z" fill="#fff"/><circle cx="23" cy="22" r="4.5" fill="#3cc6a3"/><circle cx="23" cy="22" r="2" fill="#120c1e"/></svg>
    <div><div class="who" id="talkWho">大きな木</div><p id="talkText"></p></div>
  </div>
</div>

<section id="title" class="screen">
  <div class="title-wrap">
    <div class="logo">
      <p class="eyebrow">CLIMB MODE</p>
      <h1><span>SKY</span><span>TREE</span><span class="king">KING</span></h1>
      <p class="tag">登れ、雲を越えろ。月の上まで。</p>
    </div>
    <div class="menu">
      <span class="mode-l">難易度</span>
      <div class="diff" role="radiogroup" aria-label="難易度">
        <button role="radio" data-d="easy" aria-checked="false">EASY<small>広い枝・自動補助</small></button>
        <button role="radio" data-d="normal" aria-checked="true">NORMAL<small>標準・大鳥3回</small></button>
        <button role="radio" data-d="king" aria-checked="false">KING<small>狭い枝・つかみ判定小</small></button>
      </div>
      <button class="btn btn-primary" id="startBtn">登りはじめる</button>
      <div class="two">
        <button class="btn btn-ghost" id="albumBtn">発見アルバム<small id="albumCount">0/20</small></button>
        <button class="btn btn-ghost" id="setBtn">設定</button>
      </div>
      <p class="howto" id="howto"></p>
      <p class="records" id="records"></p>
    </div>
  </div>
</section>

<section id="album" class="screen" hidden>
  <div class="sheet">
    <p class="eyebrow">DISCOVERY ALBUM</p>
    <h2>発見アルバム</h2>
    <p class="lead" id="albumLead"></p>
    <div class="grid" id="albumGrid"></div>
    <div class="row"><button class="btn btn-primary" id="albumClose">とじる</button></div>
  </div>
</section>

<section id="pause" class="screen" hidden>
  <div class="sheet" style="max-width:400px">
    <p class="eyebrow" id="pauseEye">PAUSE</p>
    <h2 id="pauseTitle">ひと休み</h2>
    <div class="toggles">
      <button class="tg" id="tgMute" aria-pressed="false"><span>音</span><span></span></button>
      <button class="tg" id="tgFx" aria-pressed="false"><span>画面のゆれ・フラッシュを弱める</span><span></span></button>
    </div>
    <div class="row" id="pauseRow">
      <button class="btn btn-primary" id="resumeBtn">続ける</button>
      <button class="btn btn-ghost" id="restartBtn">最初から</button>
      <button class="btn btn-ghost" id="quitBtn">タイトルへ</button>
    </div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div class="sheet">
    <p class="eyebrow" id="resEye">SUMMIT</p>
    <h2 id="resTitle">月の頂点に到達</h2>
    <div class="score-l">CLIMB SCORE</div>
    <div class="score" id="resScore">0</div>
    <dl class="stats" id="resStats"></dl>
    <p class="newrec" id="resRec" hidden></p>
    <div class="teaser" id="resTeaser"></div>
    <div class="row">
      <button class="btn btn-primary" id="againBtn">もう一度登る</button>
      <button class="btn btn-ghost" id="copyBtn">記録をコピー</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ghost" id="resAlbum">発見アルバム</button>
      <button class="btn btn-ghost" id="resHome">タイトルへ</button>
    </div>
    <textarea id="shareText" hidden readonly aria-label="共有用テキスト"></textarea>
  </div>
</section>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');

/* ---------- persistence ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const SYS_RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const SET=Object.assign({mute:false,lowfx:SYS_RM,diff:'normal'},load('stk2.set',{}));
const saveSet=()=>save('stk2.set',SET);
const FOUND=new Set(load('stk2.album',[]));
const REC=load('stk2.rec',{});
const recOf=d=>REC[d]||(REC[d]={bestScore:0,bestTime:null,bestAlt:0,clears:0});
const SHORT=new Set(load('stk2.short',[]));

/* ---------- constants ---------- */

function music(dt){
  if(!AU.c||SET.mute||G.mode!=='play'||G.paused)return;
  const z=G.flipNow?2:zoneAt(altOf(P.y)),m=MUS[z],st=60/m.bpm/2;AU.musT+=dt;
  while(AU.musT>=st){AU.musT-=st;const i=AU.step++,n=m.p[i%m.p.length];
    if(n>=0){tone(m.s[n],st*1.8,'triangle',.03);if(m.echo)tone(m.s[n]*2,st*1.4,'sine',.01,null,st*.6)}
    if(i%4===0)tone(m.b[(i>>2)%4],st*3.6,'sine',.055);
    if(m.pulse&&i%2===1)tone(m.b[(i>>2)%4]*2,st*.5,'square',.014)}
  if(z===0){AU.chirpT-=dt;if(AU.chirpT<=0){AU.chirpT=3+Math.random()*5;SFX.chirp()}}

function updateCam(dt,snap){
  cam.z=snap?cam.zT:lerp(cam.z,cam.zT,1-Math.exp(-dt*2.5));
  cam.S=SC*cam.z;cam.VH=H/cam.S;cam.VW=W/cam.S;
  const fy=G.mode==='ending'?G.camFocus:P.y;
  let look=0;
  if(G.mode==='play'){if(P.state==='ground'&&IN.y<-.5&&!nearTrunk())look=cam.VH*.2;else if(P.state==='climb')look=cam.VH*.08;if(P.inv)look=-cam.VH*.06}
  cam.look=snap?look:lerp(cam.look,look,1-Math.exp(-dt*3));
  let want=fy-cam.VH*(P.inv?.42:.64)-cam.look;want=Math.min(want,60-cam.VH);
  cam.top=snap?want:lerp(cam.top,want,1-Math.exp(-dt*(G.mode==='ending'?2:5.5)));

      const t2=z2===1&&r()<.5?'cloud':(z2===3?(r()<.4?'blink':'star'):(z2===2&&r()<.4?'crumble':'normal'));

  const pool=(a0,a1)=>branches.filter(b=>{const a=altOf(b.y);return a>=a0&&a<=a1&&!b.cp&&['normal','sway','star','moonb'].includes(b.type)});
  const pick=arr=>arr.length?arr[Math.floor(r()*arr.length)]:null;
  const g1=pool(580,630)[0];if(g1)items.push({k:'gold',x:(g1.x1+g1.x2)/2,y:g1.y-32,got:false,p:0});
  if(r()<.6){const g2=pick(pool(660,780));if(g2)items.push({k:'gold',x:(g2.x1+g2.x2)/2,y:g2.y-32,got:false,p:0})}

    const c=pool(a0,a1);
    for(let k=0;k<14&&c.length;k++){const b=pick(c);const left=(b.x1+b.x2)/2<200;const sx=clamp(left?b.x1-30:b.x2+30,40,360),sy=b.y-62,L=Math.max(56,64*D.wide);
      if(branches.some(o=>Math.abs(o.y-sy)<36&&o.x1<sx+L/2+8&&o.x2>sx-L/2-8))continue;

  const dd=pick(pool(205,700).filter(x=>x.x2-x.x1>90&&(altOf(x.y)<425||altOf(x.y)>505)&&['normal','star'].includes(x.type)));
  if(dd){dd.door=true;dd.doorX=Math.abs(dd.x1-200)>Math.abs(dd.x2-200)?dd.x1+16:dd.x2-16}
  for(let i=0;i<6;i++){const a=598+i*30+r()*12;jellies.push({x:70+r()*260,y:-a*M,vx:(r()<.5?-1:1)*(16+r()*14),w:60,sq:0,ph:r()*6})}
  whale={state:'patrol',x:200,y:-240*M,base:-240*M,toY:-2700,fromY:0,t:0,dir:1,gold:r()<.07,backY:-240*M-32};
  G.rares=[];const boost=id=>FOUND.has(id)?0:.08;
  if(r()<.32+boost('cat'))G.rares.push({k:'cat',alt:200+r()*120});
  if(r()<.15+boost('dragon'))G.rares.push({k:'dragon',alt:360+r()*60});
  if(r()<.36+boost('manta'))G.rares.push({k:'manta',alt:570+r()*200});
  if(r()<.34+boost('rabbit'))G.rares.push({k:'rabbit',alt:815+r()*120});
  branches.sort((a,b)=>b.y-a.y);
}

/* ---------- landing / grabs ---------- */
function land(b,soft){
  const impact=soft?0:Math.abs(P.vy),inv=P.inv;
  P.state='ground';P.on=b;P.vy=0;P.lastOx=b.ox;P.anim=null;P.coyote=0;
  if(b.k)b.ov+=(inv?-1:1)*impact*(b.type==='sway'?.32:b.type==='cloud'?.22:.06);
  if(bird&&bird.ph===0){bird.ph=2;bird.t=0;G.rescues++;G.falls--}
  if(b.type==='cloud'&&impact>380&&!inv){P.state='air';P.on=null;P.vy=-impact*.42;P.jcut=true;SFX.boing();burst(P.x,P.y,6,['#ffffff','#ffe1ef'],80,'spark');return}
  if(impact>60){P.sq=clamp(impact/1000,.15,.6);SFX.land();burst(P.x,P.y,4,LEAF[b.st],60,'leaf')}
  if(b.type==='crumble'||b.struck){if(!b.crack){b.crack=true;b.crackT=G.diff==='king'?.8:1.05;tip('crumble')}}
  if(stable(b)&&!inv)G.lastSafe=b;
  if(b.cp&&!inv&&(!G.cp||b.y<G.cp.y)){G.cp=b;b.lit=true;banner('チェックポイント',G.rescues>0||G.diff!=='king'?'落ちても、ここから再開できる':'ここから再挑戦できる');SFX.cp()}

}

/* ---------- main update ---------- */
function update(rdt){
  G.t+=rdt;updBanner(rdt);
  if(G.talk){G.talk.t-=rdt;if(G.talk.t<=0)hideTalk()}
  if(G.face){G.face.open=lerp(G.face.open,G.talk?1:0,Math.min(1,rdt*6));if(!G.talk&&G.face.open<.03&&G.mode==='play'&&G.introT>3)G.face=null}
  for(const r of bg.rain){r.y+=r.v*rdt*1.4;if(r.y>1.1){r.y=-.1;r.x=Math.random()}}
  for(const s of bg.streaks){s.x+=(G.wind>0?1:-1)*s.v*rdt*1.4;if(s.x>1.2)s.x=-.2;if(s.x<-.2)s.x=1.2}
  if(G.mode==='title'){updParts(rdt);if(Math.random()<rdt*1.5)burst(200+(Math.random()-.5)*360,cam.top+Math.random()*cam.VH*.7,1,LEAF[0],20,'leaf');for(const b of branches)if(b.amp)b.ox=Math.sin(G.t*b.sw+b.ph)*b.amp;patrolWhale();updateCam(rdt);return}
  if(G.paused)return;
  if(G.tsT>0){G.tsT-=rdt;if(G.tsT<=0)G.ts=1}
  const dt=rdt*G.ts;
  readInput();

    case'manta':drawManta(c,36,32,1,t);break;
    case'rabbit':drawRabbit(c,32,38,.8,t);break;
  }
  c.restore();
}
function openAlbum(){
  const grid=$('albumGrid');grid.innerHTML='';
  $('albumLead').textContent=`見つけたもの ${FOUND.size} / ${ALBUM.length}。毎回必ず出会えるものと、何度も登って出会えるレアなものがあります。`;
  for(const a of ALBUM){const has=FOUND.has(a.id);const d=document.createElement('div');d.className='card'+(a.rare?' rare':'')+(has?'':' locked');
    const cvs=document.createElement('canvas');cvs.width=112;cvs.height=112;d.appendChild(cvs);
    const tx=document.createElement('div');tx.innerHTML=`<b>${has?a.name:'？？？'}</b><span>${has?a.desc:(a.rare?'まだ見ぬ不思議な生き物':'まだ見つけていない')}</span>`;d.appendChild(tx);grid.appendChild(d);
    const ic=cvs.getContext('2d');if(has)drawIcon(ic,a.id,112);else{ic.fillStyle='#141a45';ic.fillRect(0,0,112,112);ic.fillStyle='rgba(255,246,223,.35)';ic.font='bold 44px sans-serif';ic.textAlign='center';ic.textBaseline='middle';ic.fillText('?',56,58)}}
  $('album').hidden=false;
}
function renderTitleInfo(){
  $('albumCount').textContent=FOUND.size+'/'+ALBUM.length;
  document.querySelectorAll('.diff button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.d===G.diff)));
  const R=recOf(G.diff),p=[];if(R.bestAlt)p.push('最高 '+Math.floor(R.bestAlt)+' m');if(R.bestTime!=null)p.push('登頂 '+fmt(R.bestTime));if(R.bestScore)p.push('SCORE '+R.bestScore.toLocaleString());
  $('records').textContent=p.length?DIFF[G.diff].label+'　'+p.join('　・　'):'';
  $('howto').innerHTML=G.touch?'<b>左スティック</b>で歩く・幹を登る　<b>JUMP</b>長押しで高く<br>手が届く枝には<b>自動でつかまる</b>':'<b>← → / A D</b> 歩く　<b>↑ / W</b> 幹を登る・よじ登る<br><b>Space</b> ジャンプ（長押しで高く）　<b>↓</b> 手をはなす・枝から降りる<br>手が届く枝には<b>自動でつかまる</b>　<b>P</b> 一時停止';
}
function setPauseToggles(){$('tgMute').setAttribute('aria-pressed',String(!SET.mute));$('tgMute').lastElementChild.textContent=SET.mute?'オフ':'オン';$('tgFx').setAttribute('aria-pressed',String(SET.lowfx));$('tgFx').lastElementChild.textContent=SET.lowfx?'オン':'オフ'}
function openPause(fromTitle){G.paused=G.mode==='play';setPauseToggles();$('pauseEye').textContent=fromTitle?'SETTINGS':'PAUSE';$('pauseTitle').textContent=fromTitle?'設定':'ひと休み';$('restartBtn').hidden=!!fromTitle;$('quitBtn').hidden=!!fromTitle;$('resumeBtn').textContent=fromTitle?'とじる':'続ける';$('pause').hidden=false;IN.keys.clear();IN.tJ=IN.tG=false;IN.sx=IN.sy=0}

/* ---------- input ---------- */
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(e.repeat&&(e.key===' '||e.key==='Shift'))return;
  if(G.mode==='title'&&e.key==='Enter'&&$('album').hidden&&$('pause').hidden){start();return}
  if((e.key==='p'||e.key==='P'||e.key==='Escape')&&G.mode==='play'){if($('pause').hidden)openPause();else closePause();return}
  if(G.mode!=='play')return;
  auInit();
  const k=KEYMAP[e.key];if(k){IN.keys.add(k);e.preventDefault()}
  if(e.key===' '||e.key==='k'||e.key==='K'||e.key==='z'||e.key==='Z'){e.preventDefault();if(!IN.kJ)onJumpPress();IN.kJ=true}
  if(e.key==='Shift'||e.key==='j'||e.key==='J'||e.key==='x'||e.key==='X'){IN.kG=true;onGrabPress()}
  if(e.key==='e'||e.key==='E')onGrabPress();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)IN.keys.delete(k);if(e.key===' '||e.key==='k'||e.key==='K'||e.key==='z'||e.key==='Z')IN.kJ=false;if(e.key==='Shift'||e.key==='j'||e.key==='J'||e.key==='x'||e.key==='X')IN.kG=false});
addEventListener('blur',()=>{IN.keys.clear();IN.kJ=IN.kG=false});
// touch stick
const stickEl=$('stick'),knob=$('knob'),zone=$('stickZone');let stickId=null,sox=0,soy=0;
function stickHome(){const r=zone.getBoundingClientRect();stickEl.style.left=(Math.max(16,0)+86)+'px';stickEl.style.top=(innerHeight-110)+'px';knob.style.transform=''}
zone.addEventListener('pointerdown',e=>{if(stickId!==null)return;auInit();stickId=e.pointerId;try{zone.setPointerCapture(e.pointerId)}catch(_){}sox=e.clientX;soy=e.clientY;stickEl.style.left=sox+'px';stickEl.style.top=soy+'px';e.preventDefault()});
zone.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;let dx=e.clientX-sox,dy=e.clientY-soy;const d=Math.hypot(dx,dy),R=48;if(d>R){dx*=R/d;dy*=R/d}knob.style.transform=`translate(${dx}px,${dy}px)`;let nx=dx/R,ny=dy/R;IN.sx=Math.abs(nx)<.22?0:nx;IN.sy=Math.abs(ny)<.3?0:ny});
function stickEnd(e){if(e.pointerId!==stickId)return;stickId=null;IN.sx=IN.sy=0;stickHome()}
zone.addEventListener('pointerup',stickEnd);zone.addEventListener('pointercancel',stickEnd);
function holdBtn(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();auInit();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');down()});const u=e=>{el.classList.remove('on');up()};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('contextmenu',e=>e.preventDefault())}
holdBtn($('btnJump'),()=>{if(!IN.tJ)onJumpPress();IN.tJ=true},()=>{IN.tJ=false});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!G.touch){G.touch=true;if(G.mode==='play')$('controls').hidden=false;renderTitleInfo()}},true);
document.addEventListener('touchmove',e=>{if(!e.target.closest('.screen'))e.preventDefault()},{passive:false});

function start(){auInit();newRun()}
function closePause(){$('pause').hidden=true;G.paused=false}
document.querySelectorAll('.diff button').forEach(b=>b.onclick=()=>{G.diff=b.dataset.d;SET.diff=G.diff;saveSet();renderTitleInfo()});
$('startBtn').onclick=start;
$('albumBtn').onclick=openAlbum;$('albumClose').onclick=()=>{$('album').hidden=true;renderTitleInfo()};
$('setBtn').onclick=()=>openPause(true);
$('pauseBtn').onclick=()=>openPause(false);
$('resumeBtn').onclick=closePause;
$('restartBtn').onclick=()=>{closePause();newRun()};
$('quitBtn').onclick=()=>{closePause();toTitle()};
$('tgMute').onclick=()=>{auInit();SET.mute=!SET.mute;saveSet();applyMute();setPauseToggles()};
$('tgFx').onclick=()=>{SET.lowfx=!SET.lowfx;saveSet();setPauseToggles()};
$('againBtn').onclick=()=>newRun();
$('resHome').onclick=toTitle;$('resAlbum').onclick=openAlbum;
$('copyBtn').onclick=()=>{const t=$('shareText').value;const fb=()=>{const ta=$('shareText');ta.hidden=false;ta.focus();ta.select();$('copyBtn').textContent='下の文字を選んでコピー'};try{navigator.clipboard.writeText(t).then(()=>{$('copyBtn').textContent='コピーしました'}).catch(fb)}catch(_){fb()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.mode==='play'&&$('pause').hidden)openPause();if(AU.c)AU.c.suspend()}else if(AU.c)AU.c.resume()});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}requestAnimationFrame(frame)}
G.touch=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
window.__stk={G,P,IN,get branches(){return branches},newRun,startEnding,get whale(){return whale}};
resize();stickHome();toTitle();requestAnimationFrame(frame);
})();
</script>

</body>
