<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DANCE SYNC KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud, playful arcade night — a dance battle cabinet.
   IDEA: a neon dance-studio stage where two RAIJIN robots face off.
   PICTURE: the live 3D stage fills the screen; controls sit below it, never over the dancers.
   COLOUR and TYPE: midnight violet ground, player orange #ff6a1a vs rival cyan #3ee0ff, fever magenta. Chakra Petch + Zen Kaku Gothic New.
   LAYOUT: portrait = stage / lane / two big pads; landscape = pads as side columns. */
:root{--bg:#0a0a1c;--panel:#12122a;--line:#2b2b55;--ink:#f2f3ff;--mute:#9a9cc8;--p1:#ff6a1a;--p2:#3ee0ff;--fev:#ff3fb4;--gold:#ffd447;
 --disp:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:minmax(0,1fr) clamp(104px,19vh,180px);grid-template-areas:"mid mid mid" "L J R";gap:8px;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
#mid{grid-area:mid;display:flex;flex-direction:column;min-height:0}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#lane{flex:none;height:58px;position:relative;margin:0 8px}
#laneCv{position:absolute;inset:0;width:100%;height:100%}
.pad{position:relative;border-radius:18px;border:1.5px solid var(--line);background:linear-gradient(180deg,#1a1a3a,#111128);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--disp);overflow:hidden;transition:transform .06s}
.pad svg{width:42%;max-width:64px;height:auto}
.pad small{font-size:11px;color:var(--mute);letter-spacing:.06em}
.pad::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 3px var(--hc,#fff),inset 0 0 40px var(--hc,#fff);background:radial-gradient(circle at 50% 50%,var(--hc,#fff) 0%,transparent 70%)}
.pad.hit::after{animation:padhit .32s ease-out}
.pad.miss::after{--hc:#ff4d73;animation:padhit .3s ease-out}
.pad.hit svg{animation:padpop .25s ease-out}
@keyframes padhit{0%{opacity:.95}100%{opacity:0}}
@keyframes padpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#stage.shake{animation:shk .14s linear}
#stage.shake2{animation:shk2 .2s linear}
@keyframes shk{25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@keyframes shk2{20%{transform:translate(4px,-3px) scale(1.012)}40%{transform:translate(-4px,2px) scale(1.012)}60%{transform:translate(3px,3px)}80%{transform:translate(-2px,-1px)}}
#combo.bump b{animation:cbump .22s ease-out}
@keyframes cbump{0%{transform:scale(1.45);color:var(--gold)}100%{transform:scale(1)}}
.pad.on{transform:scale(.97);background:linear-gradient(180deg,#3a2a5a,#1b1b3a);border-color:var(--gold)}
#padL{grid-area:L;margin-left:8px}#padR{grid-area:R;margin-right:8px}
#padJ{grid-area:J;width:22vw;max-width:140px;display:none}
body.jumpbtn #padJ{display:flex}
#padL svg path{fill:var(--p1)}#padR svg path{fill:var(--p1)}#padJ svg path{fill:var(--gold)}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
 #app{grid-template-columns:clamp(96px,15vw,190px) minmax(0,1fr) clamp(96px,15vw,190px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"L mid R" "L J R";padding-top:max(8px,env(safe-area-inset-top))}
 #padL{margin-left:max(8px,env(safe-area-inset-left))}#padR{margin-right:max(8px,env(safe-area-inset-right))}
 #padJ{width:auto;max-width:none;height:54px;flex-direction:row;gap:10px}
 #padJ svg{width:28px}
}
/* HUD */
.hud{position:absolute;pointer-events:none}
#top{left:10px;right:10px;top:8px;display:grid;grid-template-columns:1fr minmax(0,1.4fr) 1fr;align-items:start;gap:8px}
.stat b{display:block;font-family:var(--disp);font-size:clamp(17px,5vw,22px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stat small{font-family:var(--disp);font-size:11px;color:var(--mute);letter-spacing:.12em}
#stR{text-align:right;display:flex;justify-content:flex-end;gap:10px;align-items:flex-start}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,10,28,.6);display:grid;place-items:center}
#prog{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;display:flex}
#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--fev),var(--p2));width:0}
#phaseName{display:block;text-align:center;font-family:var(--disp);font-size:13px;letter-spacing:.2em;margin-top:5px;color:var(--gold)}
#combo{left:0;right:0;top:64px;text-align:center;opacity:0;transition:opacity .2s}
#combo b{font-family:var(--disp);font-size:40px;line-height:1;display:block;text-shadow:0 0 18px rgba(255,106,26,.6)}
#combo small{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:var(--mute)}
#combo.show{opacity:1}
#banner{left:0;right:0;top:38%;text-align:center;opacity:0}
#banner b{display:block;font-family:var(--disp);font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.04em;background:linear-gradient(90deg,var(--p1),var(--gold),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
#banner span{display:inline-block;margin-top:8px;font-size:15px;font-weight:700;background:rgba(10,10,28,.75);padding:4px 12px;border-radius:999px}
#banner.go{animation:ban 1.7s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#chaosB{left:50%;top:150px;transform:translateX(-50%) rotate(-3deg);font-family:var(--disp);font-size:22px;letter-spacing:.06em;padding:4px 14px;border-radius:8px;background:var(--fev);color:#1a0010;opacity:0;white-space:nowrap;transition:opacity .15s}
#chaosB.show{opacity:1;animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{to{transform:translateX(-50%) rotate(3deg) scale(1.06)}}
#moveTag{left:12px;bottom:12px;font-family:var(--disp);font-size:14px;letter-spacing:.12em;color:#fff;background:rgba(10,10,28,.65);border-left:3px solid var(--p1);padding:4px 10px;border-radius:4px;opacity:0;transform:translateX(-10px);transition:opacity .25s,transform .25s}
#moveTag.show{opacity:1;transform:none}
#hint{left:12px;right:12px;bottom:10px;text-align:center;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s}
#hint span{background:rgba(10,10,28,.8);border:1px solid var(--line);padding:6px 12px;border-radius:999px;display:inline-block}
#hint.show{opacity:1}
#rpTag{left:12px;top:12px;font-family:var(--disp);font-size:13px;letter-spacing:.14em;display:none;align-items:center;gap:8px;background:rgba(10,10,28,.75);padding:6px 10px;border-radius:8px}
#rpTag i{width:9px;height:9px;border-radius:50%;background:#ff3b5c;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
body.state-result #rpTag{display:flex}
body:not(.state-play) #top,body:not(.state-play) #combo,body:not(.state-play) #moveTag{visibility:hidden}
body.state-title .pad,body.state-title #lane,body.state-result .pad,body.state-result #lane{visibility:hidden}
/* overlays */
.ov{position:fixed;inset:0;display:none;z-index:5;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.ov.on{display:flex}
#titleScr{flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(180deg,rgba(10,10,28,0) 0%,rgba(10,10,28,.2) 35%,rgba(10,10,28,.92) 62%)}
.logo{text-align:center;margin-bottom:auto;margin-top:clamp(8px,4vh,40px)}
.logo h1{font-family:var(--disp);font-weight:700;font-size:clamp(38px,10vw,72px);line-height:.95;letter-spacing:.02em}
.logo h1 .a{color:var(--p1)}.logo h1 .b{color:var(--p2)}
.logo p{margin-top:10px;font-size:14px;font-weight:700;color:#d8d9ff;text-wrap:balance}
.card{width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.35}
.how b{display:block;font-family:var(--disp);font-size:18px;color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--disp);font-size:14px;letter-spacing:.06em;background:rgba(255,255,255,.04)}
.seg button[aria-pressed="true"]{background:var(--p1);border-color:var(--p1);color:#1a0d04}
.big{min-height:58px;border-radius:16px;background:linear-gradient(90deg,var(--p1),#ff9a3c);color:#1a0d04;font-family:var(--disp);font-size:24px;letter-spacing:.14em;box-shadow:0 8px 30px rgba(255,106,26,.35)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:rgba(255,255,255,.04)}
.chip[aria-pressed="true"]{border-color:var(--p2);color:var(--p2)}
.lbl{font-size:12px;color:var(--mute);font-weight:700}
.best{text-align:center;font-family:var(--disp);font-size:13px;color:var(--mute);letter-spacing:.1em}
#pauseScr{background:rgba(6,6,18,.82);align-items:center;justify-content:center}
#pauseScr .card{align-items:stretch}
#pauseScr h2{font-family:var(--disp);font-size:36px;text-align:center;letter-spacing:.1em}
.btn{min-height:50px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:16px;background:rgba(255,255,255,.05)}
#resultScr{flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(180deg,rgba(10,10,28,0) 0%,rgba(10,10,28,0) 30%,rgba(10,10,28,.94) 52%)}
.res{width:min(480px,100%);display:flex;flex-direction:column;gap:10px}
.rk{display:flex;align-items:flex-end;gap:14px;justify-content:center}
.rk b{font-family:var(--disp);font-size:clamp(64px,18vw,104px);line-height:.85;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.rk div{display:flex;flex-direction:column}
.rk em{font-style:normal;font-family:var(--disp);font-size:clamp(30px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.rk span{font-weight:700;color:var(--gold);font-size:15px}
#newRec{align-self:center;font-family:var(--disp);font-size:13px;letter-spacing:.2em;color:#1a0010;background:var(--fev);padding:3px 10px;border-radius:6px;display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--mute);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
#toast.on{opacity:1}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mute);z-index:10;background:var(--bg)}
@media (prefers-reduced-motion:reduce){#stage.shake,#stage.shake2{animation:none}#chaosB.show{animation:none}#banner.go{animation-duration:2.4s}}
</style>
</head>
<body class="state-title">
<div id="app">
  <div id="mid">
    <section id="stage" aria-label="ダンスステージ">
      <canvas id="gl"></canvas><canvas id="fx"></canvas>
      <div class="hud" id="top">
        <div class="stat"><b id="score">0</b><small>SCORE</small></div>
        <div><div id="prog"><i></i></div><span id="phaseName">START</span></div>
        <div id="stR"><div class="stat"><b id="sync">—</b><small>SYNC</small></div><button id="pauseBtn" aria-label="一時停止"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="#f2f3ff"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="#f2f3ff"/></svg></button></div>
      </div>
      <div class="hud" id="combo"><b>0</b><small>COMBO</small></div>
      <div class="hud" id="banner"><b></b><span></span></div>
      <div class="hud" id="chaosB"></div>
      <div class="hud" id="hint"><span></span></div>
      <div class="hud" id="moveTag"></div>
      <div class="hud" id="rpTag"><i></i><span id="rpLbl">REPLAY</span></div>
    </section>
    <div id="lane"><canvas id="laneCv"></canvas></div>
  </div>
  <button class="pad" id="padL" aria-label="左ステップ"><svg viewBox="0 0 40 40"><path d="M28 6 L8 20 L28 34 Z"/></svg><small>A / ←</small></button>
  <button class="pad" id="padJ" aria-label="ジャンプ"><svg viewBox="0 0 40 40"><path d="M20 4 L36 22 H26 V36 H14 V22 H4 Z"/></svg><small>SPACE</small></button>
  <button class="pad" id="padR" aria-label="右ステップ"><svg viewBox="0 0 40 40"><path d="M12 6 L32 20 L12 34 Z"/></svg><small>D / →</small></button>
</div>

<div class="ov on" id="titleScr">
  <div class="logo"><h1><span class="a">DANCE</span><br>SYNC <span class="b">KING</span></h1><p data-t="tag"></p></div>
  <div class="card">
    <div class="how"><div><b>◀ ▶</b><span data-t="how1"></span></div><div><b>◀+▶</b><span data-t="how2"></span></div><div><b>HOLD</b><span data-t="how3"></span></div></div>
    <div class="lbl" data-t="diff"></div>
    <div class="seg" id="diffSeg"><button data-d="0">EASY</button><button data-d="1">NORMAL</button><button data-d="2">HARD</button><button data-d="3">KING</button></div>
    <button class="big" id="startBtn">START</button>
    <div class="row"><button class="chip" id="jumpChip" data-t="jumpBtn"></button><button class="chip" id="sndChip"></button><button class="chip" id="langChip">日本語 / EN</button></div>
    <div class="best" id="bestLbl"></div>
  </div>
</div>

<div class="ov" id="pauseScr">
  <div class="card"><h2>PAUSE</h2>
    <button class="btn" id="resumeBtn" data-t="resume"></button>
    <button class="btn" id="retryBtn" data-t="retry"></button>
    <button class="btn" id="sndBtn2"></button>
    <button class="btn" id="quitBtn" data-t="quit"></button>
  </div>
</div>

<div class="ov" id="resultScr">
  <div class="res">
    <span id="newRec">NEW RECORD</span>
    <div class="rk"><b id="rRank">S</b><div><em id="rScore">0</em><span id="rTitle"></span></div></div>
    <div class="stats"><div><b id="rSync">0%</b><small data-t="sync"></small></div><div><b id="rCombo">0</b><small data-t="maxc"></small></div><div><b id="rFunny">0</b><small data-t="funny"></small></div></div>
    <div class="lbl" data-t="moment"></div>
    <div class="seg" style="grid-template-columns:1fr 1fr" id="rpSeg"><button data-m="best" aria-pressed="true">BEST</button><button data-m="funny" aria-pressed="false">FUNNY</button></div>
    <div class="two"><button class="big" id="againBtn" style="font-size:18px">PLAY AGAIN</button><button class="btn" id="shareBtn">SNS SHARE</button></div>
    <button class="chip" id="toTitle" data-t="quit" style="align-self:center"></button>
  </div>
</div>
<div id="toast"></div>
<div id="err">この端末では3D表示（WebGL2）を利用できません。別のブラウザでお試しください。<br>WebGL2 is not available on this device.</div>
<script>
// RAIJIN X1 — humanoid robot definition (skeleton, parts, pose solver).
// Ported from the "RAIJIN X1 ロボット設計" artifact; internal 'core' parts removed for the game.
(function (g) {
  'use strict';
  const PI = Math.PI;
  const qmul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
  const qconj = q => [-q[0], -q[1], -q[2], q[3]];
  const qax = (ax, an) => { const s = Math.sin(an / 2), c = Math.cos(an / 2); return ax === 0 ? [s, 0, 0, c] : ax === 1 ? [0, s, 0, c] : [0, 0, s, c]; };
  const qrot = (q, v) => {
    const x = q[0], y = q[1], z = q[2], w = q[3];
    const ix = w * v[0] + y * v[2] - z * v[1], iy = w * v[1] + z * v[0] - x * v[2], iz = w * v[2] + x * v[1] - y * v[0], iw = -x * v[0] - y * v[1] - z * v[2];
    return [ix * w - iw * x - iy * z + iz * y, iy * w - iw * y - iz * x + ix * z, iz * w - iw * z - ix * y + iy * x];
  };
  const X = a => qax(0, a), Y = a => qax(1, a), Z = a => qax(2, a);
  const q3 = (a, b, c) => qmul(qmul(a, b), c);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  // ---------------------------------------------------------------- skeleton
  const L1 = 0.42, L2 = 0.42, ANKLE_H = 0.09, BALL = 0.125, HEEL = 0.075, PELVIS_Y = 0.97, HIP_X = 0.095, HIP_Y = -0.04;
  const JOINTS = [];
  const JI = {};
  const J = (name, parent, pos, rest) => { JI[name] = JOINTS.length; JOINTS.push({ name, parent: parent == null ? -1 : JI[parent], pos, rest: rest || [0, 0, 0, 1] }); };
  J('Root', null, [0, 0, 0]);
  J('Pelvis', 'Root', [0, PELVIS_Y, 0]);
  J('Spine', 'Pelvis', [0, 0.10, 0]);
  J('Neck', 'Spine', [0, 0.43, 0]);
  J('Head', 'Neck', [0, 0.07, 0]);
  const SIDES = [['L', 1], ['R', -1]];
  const FING = [['Index', 0.03], ['Middle', 0.01], ['Ring', -0.01], ['Pinky', -0.03]];
  for (const [s, m] of SIDES) {
    J('UpperArm_' + s, 'Spine', [m * 0.215, 0.35, 0]);
    J('LowerArm_' + s, 'UpperArm_' + s, [0, -0.29, 0]);
    J('Hand_' + s, 'LowerArm_' + s, [0, -0.26, 0]);
    for (const [f, z] of FING) {
      J(f + '1_' + s, 'Hand_' + s, [0, -0.1, z]);
      J(f + '2_' + s, f + '1_' + s, [0, -0.042, 0]);
    }
    J('Thumb1_' + s, 'Hand_' + s, [m * -0.006, -0.035, 0.036], qmul(X(-0.95), Z(m * -0.25)));
    J('Thumb2_' + s, 'Thumb1_' + s, [0, -0.04, 0]);
    J('UpperLeg_' + s, 'Pelvis', [m * HIP_X, HIP_Y, 0]);
    J('LowerLeg_' + s, 'UpperLeg_' + s, [0, -L1, 0]);
    J('Foot_' + s, 'LowerLeg_' + s, [0, -L2, 0]);
    J('Toe_' + s, 'Foot_' + s, [0, -0.065, BALL]);
  }

  // ---------------------------------------------------------------- materials
  const MATS = {
    armor: { c: [0.86, 0.87, 0.89], m: 0.05, r: 0.26, e: 0 },
    suit: { c: [0.035, 0.038, 0.046], m: 0.15, r: 0.62, e: 0 },
    dark: { c: [0.075, 0.08, 0.095], m: 0.3, r: 0.55, e: 0 },
