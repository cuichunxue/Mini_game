<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>靴飛ばし王</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: 校庭を横から見た1画面ゲーム。上に空と校庭のステージ、下に親指で押す操作パネル。タイトルと結果は上に重なるカード。 */
:root{
  --sky-top:#2f8fe0; --sky-low:#bfe8ff; --soil:#d99a5b; --soil-dark:#b9773f; --line:#ffffff;
  --ink:#14213d; --ink-2:#2b3b63; --red:#e8363f; --red-dark:#a3202a; --sun:#ffc531; --sun-dark:#c4951a;
  --leaf:#3fae5f; --leaf-dark:#2b7d43; --panel:#fdfeff; --muted:#56638a;
  --font-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--sky-low);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:15px;line-height:1.5;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,a.btn{font:inherit;color:inherit;cursor:pointer}
textarea,input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column;min-height:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0 0;padding-left:var(--gutter-l);padding-right:var(--gutter-r);pointer-events:none}
.hud .chip{background:rgba(255,255,255,.93);border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;min-width:0;line-height:1.2}
.hud .chip small{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:800}
.hud .chip b{font-family:var(--font-display);font-weight:400;font-size:18px;white-space:nowrap}
.hud .who{flex-direction:row;align-items:center;gap:8px}
.hud .who canvas{width:44px;height:44px;flex:none;display:block}
.opt.char{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;text-align:center}
.opt.char canvas{width:56px;height:56px;display:block}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none;border:2px solid var(--ink)}
.hud .right{display:flex;gap:8px;align-items:stretch;pointer-events:auto}
.hud .right button{border:0;border-radius:10px;background:rgba(255,255,255,.93);padding:0 12px;font-weight:800;font-size:13px;min-height:44px}
.wind{position:absolute;left:var(--gutter-l);bottom:10px;background:rgba(20,33,61,.82);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:800;pointer-events:none;white-space:nowrap}
.live{position:absolute;left:0;right:0;top:58px;text-align:center;font-family:var(--font-display);font-size:clamp(40px,12vw,76px);line-height:1.1;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;pointer-events:none;font-variant-numeric:tabular-nums}
.live small{font-size:.4em;margin-left:4px}
.callout{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--font-display);font-size:clamp(30px,9.5vw,68px);line-height:1.15;color:var(--sun);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none;padding:0 16px;text-wrap:balance;white-space:pre-line}
.callout.show{animation:pop 1.5s ease-out forwards}
.callout.red{color:#ff6b6b}.callout.green{color:#7be495}.callout.white{color:#fff}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

/* controls */
.controls{flex:none;background:var(--ink);color:#fff;padding:12px 0 12px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:grid;gap:10px}
.meters{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:14px;align-items:end}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.08em;color:#aab7dc;margin-bottom:4px}
.lab b{font-family:var(--font-display);font-weight:400;color:#fff;font-size:14px;letter-spacing:0}
.bar{position:relative;height:28px;border-radius:7px;background:var(--ink-2);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun) 65%,var(--red))}
.perfect{position:absolute;top:0;bottom:0;left:92%;right:0;border-left:3px solid #fff;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}
.dial{width:96px;height:68px;display:block;overflow:visible}
.kick{height:60px;width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;font-family:var(--font-display);font-size:20px;box-shadow:0 5px 0 var(--red-dark);touch-action:none;transition:transform .05s}
.kick:active,.kick[data-s=charge]{transform:translateY(4px);box-shadow:0 1px 0 var(--red-dark)}
.kick[data-s=charge]{background:var(--sun);color:var(--ink);box-shadow:0 1px 0 var(--sun-dark)}
.kick[data-s=angle]{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-dark)}
.kick[data-s=wait]{background:var(--ink-2);box-shadow:0 5px 0 #1a2547;color:#aab7dc;pointer-events:none}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;overflow-y:auto;display:flex;flex-direction:column;padding:16px 0;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.overlay.dim{background:rgba(20,33,61,.8);justify-content:center}
.logo{text-align:center;padding:6px 0 18px}
.logo .en{font-weight:800;letter-spacing:.32em;font-size:12px;color:var(--ink)}
.logo h1{margin:2px 0 6px;font-family:var(--font-display);font-weight:400;font-size:clamp(46px,15vw,84px);line-height:1.05;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;letter-spacing:.02em}
.logo p{margin:0 auto;max-width:22em;font-weight:800;color:var(--ink);text-wrap:balance}
.card{background:var(--panel);border-radius:16px;padding:16px;box-shadow:0 8px 0 rgba(20,33,61,.22);display:grid;gap:14px;margin-top:auto;max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.dim .card{margin-top:0}
.card h3{margin:0;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:800}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:2px solid var(--ink);border-radius:10px;padding:9px 12px;background:#fff;text-align:left;line-height:1.35;font-weight:800;min-height:48px}
.opt small{display:block;font-weight:500;font-size:12px;opacity:.78}
.opt[aria-pressed=true]{background:var(--ink);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names label{font-size:12px;font-weight:800;color:var(--muted);display:grid;gap:3px}
.names input{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;min-width:0;width:100%;color:var(--ink);background:#fff}
.go{border:0;border-radius:14px;background:var(--red);color:#fff;font-family:var(--font-display);font-size:26px;padding:14px;box-shadow:0 6px 0 var(--red-dark);text-align:center}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
.recs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);font-weight:800}
.recs b{color:var(--ink);font-family:var(--font-display);font-weight:400}
details.sim{border-top:2px dashed #cfd6ea;padding-top:12px}
details.sim summary{cursor:pointer;font-weight:800;min-height:32px}
.sim .row{display:grid;grid-template-columns:7em minmax(0,1fr) 4.5em;gap:8px;align-items:center;font-size:13px;font-weight:800;margin-top:6px}
.sim input[type=range]{width:100%;accent-color:var(--red)}
.sim .out{font-variant-numeric:tabular-nums;text-align:right}
.sim .pred{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.sim .pred b{font-family:var(--font-display);font-weight:400;font-size:38px;color:var(--red);font-variant-numeric:tabular-nums}
.sim .note{font-size:12px;color:var(--muted);margin:6px 0 0;font-weight:500}
.sim canvas{width:100%;height:110px;display:block;background:linear-gradient(#e7f5ff,#bfe8ff);border-radius:8px;margin-top:8px}

/* result */
.res{text-align:center;max-height:100%;overflow-y:auto}
.res .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:800}
.res h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.2;text-wrap:balance}
.bigscore{font-family:var(--font-display);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.bigscore b{font-weight:400;font-size:clamp(52px,16vw,84px)}
.bigscore span{font-size:24px;margin-left:4px}
.badge{justify-self:center;background:var(--sun);color:var(--ink);font-family:var(--font-display);padding:4px 16px;border-radius:8px;border:3px solid var(--ink);transform:rotate(-3deg)}
.unlock{margin:0;font-weight:800;color:var(--leaf-dark)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid #e0e5f2;text-align:center}
.tbl th{font-size:11px;color:var(--muted);letter-spacing:.08em}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:800}
.tbl .top{color:var(--red);font-weight:800}
.res img{width:100%;border-radius:10px;border:2px solid var(--ink);display:block}
.res .hint{font-size:12px;color:var(--muted);margin:-6px 0 0}
.res textarea{width:100%;font:inherit;font-size:13px;border:2px solid #cfd6ea;border-radius:8px;padding:8px;resize:none;color:var(--ink);background:#f6f8fd}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn,.btnrow button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:10px 8px;font-weight:800;text-decoration:none;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.primary,.btnrow button.primary{background:var(--red);border-color:var(--red-dark);color:#fff}
.btn.x{background:var(--ink);color:#fff}
.replaybar{position:absolute;left:0;right:0;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;padding:10px 0;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:linear-gradient(rgba(20,33,61,.8),transparent);color:#fff;font-family:var(--font-display)}
.replaybar button{border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;padding:8px 14px;min-height:44px}
.jik{position:absolute;left:var(--gutter-l);right:var(--gutter-r);top:62px;text-align:center;pointer-events:none;opacity:0;z-index:5}
.jik span{display:inline-block;max-width:100%;background:rgba(20,33,61,.86);color:#fff;font-weight:800;font-size:13px;line-height:1.4;padding:5px 12px;border-radius:999px;text-wrap:balance}
.jik.show{animation:jk 3.6s ease-out forwards}
@keyframes jk{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.callout.show{animation-duration:2s}}
</style>

</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="靴飛ばしゲームの画面"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="chip who"><canvas id="whoAv" width="88" height="88" aria-hidden="true"></canvas><div><small id="whoThrow">1 / 3 投目</small><b id="whoName">パパ</b></div></div>
      <div class="right">
        <div class="chip"><small>今回のベスト</small><b><span id="bestNow">0.0</span> <span id="bestUnit">m</span></b></div>
        <button id="muteBtn" type="button" aria-label="音の切り替え">音 ON</button>
      </div>
    </div>
    <div class="wind" id="windChip" hidden></div>
    <div class="live" id="live" hidden></div>
    <div class="callout" id="callout" aria-live="polite"></div>
    <div class="jik" id="jik" aria-live="polite"></div>
    <div class="replaybar" id="replayBar" hidden><span>REPLAY</span><button id="replayClose" type="button">とじる</button></div>
  </div>
  <div class="controls" id="controls">
    <div class="meters">
      <div>
        <div class="lab"><span>POWER</span><b id="pwTxt">0%</b></div>
        <div class="bar"><div class="fill" id="pwFill"></div><div class="perfect"></div></div>
      </div>
      <svg class="dial" id="dial" viewBox="0 0 96 68" aria-label="角度メーター"></svg>
    </div>
    <button class="kick" id="kickBtn" type="button" data-s="ready">長押しでパワーをためる</button>
  </div>

  <section class="overlay" id="titleOv">
    <div class="logo">
      <div class="en">SHOE KICK KING</div>
      <h1>靴飛ばし王</h1>
      <p>靴を蹴り飛ばせ！誰が一番遠くまで飛ばせる？</p>
    </div>
    <div class="card">
      <div><h3>ゲームモード</h3><div class="opts" id="modeOpts" style="margin-top:8px"></div></div>
      <div><h3>遊び方</h3><div class="opts" id="oppOpts" style="margin-top:8px"></div></div>
      <div id="charWrap"><h3>キャラクター</h3><div class="opts" id="charOpts" style="margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr))"></div></div>
      <div class="names" id="names">
        <label>1人目の名前<input id="n1" maxlength="8" value="パパ" autocomplete="off"></label>
        <label id="n2wrap">2人目の名前<input id="n2" maxlength="8" value="娘" autocomplete="off"></label>
      </div>
      <div><h3>エリア（記録を伸ばすと開放）</h3><div class="opts" id="stageOpts" style="margin-top:8px"></div></div>
      <button class="go" id="goBtn" type="button">5回チャレンジ スタート</button>
      <button type="button" id="sndTest" style="margin-top:10px;width:100%;padding:12px;border-radius:16px;border:3px solid #14213d;background:#fff;color:#14213d;font-weight:800;font-size:15px">🔊 音テスト（音が出ないとき）</button>
      <div id="sndMsg" style="margin-top:6px;font-size:13px;line-height:1.5;color:#2b3b63"></div>
      <div class="recs" id="recs"></div>
      <details class="sim">
        <summary>飛距離シミュレーター</summary>
        <div class="row"><label for="sP">キックパワー</label><input id="sP" type="range" min="10" max="100" value="85"><span class="out" id="oP">85%</span></div>
        <div class="row"><label for="sA">飛び出し角度</label><input id="sA" type="range" min="5" max="85" value="42"><span class="out" id="oA">42°</span></div>
        <div class="row"><label for="sW">風（追い風＋）</label><input id="sW" type="range" min="-60" max="60" value="0"><span class="out" id="oW">0 m/s²</span></div>
        <div class="pred"><span>予測飛距離</span><b id="oD">42.2</b><span>m</span></div>
        <canvas id="simCv" aria-label="予測される飛び方"></canvas>
        <p class="note">簡易物理モデルによる計算。空気抵抗と靴の回転は省略し、風は水平方向の加速度として近似しています。</p>
      </details>
    </div>
  </section>

  <section class="overlay dim" id="resultOv" hidden>
    <div class="card res">
      <div class="eyebrow" id="resMode">DISTANCE KING</div>
      <h2 id="resTitle">パパの勝ち！</h2>
      <div class="bigscore"><b id="resBig">0.0</b><span id="resUnit">m</span></div>
      <div class="badge" id="resBadge" hidden>NEW RECORD</div>
      <p class="unlock" id="resUnlock" hidden></p>
      <table class="tbl" id="resTbl"></table>
      <img id="cardImg" alt="結果カード" hidden>
      <p class="hint" id="cardHint" hidden>画像を長押しすると保存できます</p>
      <textarea id="shareTxt" rows="4" readonly aria-label="X投稿文"></textarea>
      <div class="btnrow">
        <a class="btn x" id="xBtn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet">Xで共有</a>
        <button type="button" id="copyBtn">X投稿文をコピー</button>
        <button type="button" id="imgBtn">結果画像をつくる</button>
        <button type="button" id="replayBtn">最長飛行リプレイ</button>
      </div>
      <div class="btnrow">
        <button type="button" class="primary" id="againBtn">もう一度</button>
        <button type="button" id="homeBtn">タイトルへ</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d');
var W=300,H=300,DPR=1;
var G=9.8,V0=24;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function fmt(x){return (Math.round(x*10)/10).toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var r=$('stage').getBoundingClientRect();
  W=Math.max(200,r.width);H=Math.max(200,r.height);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

/* ---------- storage ---------- */
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var rec={
  best:store.get('sks_best',0),
  bestT:store.get('sks_bestT',0),
  wins:store.get('sks_wins',{p1:0,p2:0,ai:0,aiLose:0}),
  names:store.get('sks_names',{p1:'パパ',p2:'娘'}),
  mute:store.get('sks_mute',false)
};

/* ---------- stages ---------- */
var STAGES=[
  {id:1,name:'校庭',en:'SCHOOLYARD',need:0,windMax:1.4,zones:false,rings:false,birds:0,pads:0,gust:0,boost:1,ringR:0},
  {id:2,name:'丘の風',en:'WINDY HILLS',need:70,windMax:3,zones:true,rings:false,birds:.35,pads:2,gust:1,boost:1,ringR:0},
  {id:3,name:'空のリング',en:'SKY RINGS',need:150,windMax:4,zones:true,rings:true,birds:.3,pads:2,gust:2,boost:1.3,ringR:5},
  {id:4,name:'成層圏',en:'STRATOSPHERE',need:400,windMax:5,zones:true,rings:true,birds:.4,pads:0,gust:2,boost:1.42,ringR:6.5}
];
function unlockedId(best){var id=1;for(var i=0;i<STAGES.length;i++){if(best>=STAGES[i].need)id=STAGES[i].id}return id}

/* ---------- state ---------- */
var cfg={mode:'dist',opp:'solo',stageSel:1,char:store.get('sks_char','dad'),nameAuto:true};
var S={
  state:'title',t:0,cam:{x:0,s:60},shoe:null,world:null,timers:[],parts:[],shocks:[],marks:[],
  players:[],turn:0,pi:0,ri:0,power:0,pdir:1,angle:45,adir:1,angleT:0,slow:0,shake:0,kickT:99,bonk:0,
  frames:[],recT:0,replay:null,oldBest:0,newRec:false,unlockMsg:'',hitStop:0,pressUpT:0,matchRecord:false,landT:0,throwInfo:null,idleT:0
};
function curPlayer(){return S.players[S.pi]}
function after(sec,fn){S.timers.push({t:sec,fn:fn})}

/* ---------- audio ---------- */
var A={ctx:null,master:null,noise:null,wh:null};
function makeSilentWav(){
  var sr=8000,n=sr,b=new Uint8Array(44+n*2),dv=new DataView(b.buffer);
  function w(o,t){for(var q=0;q<t.length;q++)b[o+q]=t.charCodeAt(q)}
  w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
  for(var i=0;i<n;i++)dv.setInt16(44+i*2,(i%50===0)?1:0,true);
  var s='';for(var q=0;q<b.length;q++)s+=String.fromCharCode(b[q]);
  return 'data:audio/wav;base64,'+btoa(s);
}

function makeWorld(){

    useZones:st.zones&&!tgt,useRings:st.rings&&!tgt};

    for(var i=0;i<st.gust;i++)w.gusts.push({t0:.9+rnd(0,1.8)+i*2.6,dur:1.5,dw:(Math.random()<.5?-1:1)*rnd(4,8),fired:false});
    var px=28;

function ensureWorld(x){

    w.nextZone+=rnd(45,100);

function windAt(t){
  var w=S.world,v=w.wind;
  for(var i=0;i<w.gusts.length;i++){var g=w.gusts[i];if(t>=g.t0&&t<g.t0+g.dur)v+=g.dw*Math.sin(Math.PI*(t-g.t0)/g.dur)}

}

function aiPlay(){
  if(S.state!=='ready')return;

  if(cfg.mode==='target'){
    // 的に合わせた力加減（ただし少しズレる）

function lockPower(){

function kick(p,a){
  var pl=curPlayer(),w=S.world,sh=S.shoe,k=pl.k;
  S.state='fly';S.t=0;S.kickT=0;S.frames=[];S.recT=0;S.hitStop=0;
  var v=V0*p,type='normal',perfect=false,rad=a*Math.PI/180;
  var pP=p>=.92,aP=Math.abs(a-45)<=4;
  if(p<.12)type='back';
  else if(a>=76)type='head';
  else if(a<=9)type='low';
  else if(pP&&aP){perfect=true;v*=1.08}
  else if(p<.3&&Math.random()<.22)type='back';
  sh.x=0;sh.y=.41*k;sh.carry=0;sh.rolling=false;sh.bounces=0;sh.bonked=false;sh.topY=0;
  if(type==='normal'){sh.vx=v*Math.cos(rad);sh.vy=v*Math.sin(rad);sh.rv=9+p*12}
  else if(type==='low'){sh.vx=v*.98;sh.vy=v*.12+1.5;sh.rv=6}
  else if(type==='back'){var vb=Math.max(v,10);sh.vx=-vb*.9;sh.vy=vb*.5;sh.rv=-14}
  else{
    var vy=Math.max(V0*Math.max(p,.5)*.9,12),hy=1.62*k,hxx=-.696*k+.1;
    var t=(vy+Math.sqrt(Math.max(0,vy*vy-2*G*(hy-sh.y))))/G;
    sh.vy=vy;sh.vx=(hxx-sh.x)/t;sh.rv=16;
  }
  S.throwInfo={type:type,perfect:perfect,p:p,a:a,rings:0,birds:false,pads:0,gusts:0};
  SFX.kick(p);whooshStart();buzz(25);
  S.shake=perfect?14:6;
  if(perfect){
    SFX.perfect();S.slow=.55;S.shocks.push({x:0,y:.6,age:0,big:true});
    callout('PERFECT KICK!','');
  }else if(type==='head'){callout('ズコー！真上〜！','red');SFX.miss()}
  else if(type==='back'){callout('うしろ〜!?','red');SFX.miss()}
  else if(type==='low'){callout('ゴロゴロ…','white')}
  else callout(p>=.75?'ナイスキック！':'ちょい弱め！','white');
  setKick('wait','飛行中…');
  $('live').hidden=false;
}

/* ---------- physics ---------- */
function trySpawnRing(sh,w){
  if(!w.useRings||sh.vx<6||sh.carry>0||w.combo>=9)return;
  var last=w.rings[w.rings.length-1];
  if(last&&!last.passed)return;
  var dx=Math.max(26,sh.vx*1.5)*rnd(.9,1.15),t=dx/sh.vx,yp=sh.y+sh.vy*t-.5*G*t*t;
  if(yp<4)return;
  var r=w.stage.ringR;
  w.rings.push({x:sh.x+dx,y:Math.max(3.5,yp+rnd(-7,7)),r:r,hit:false,passed:false,spawnT:S.t,hitT:-1});
}
function stepFlight(dt){
  var sh=S.shoe,w=S.world,i,g;
  S.t+=dt;
  if(S.t>120){sh.y=0;sh.vx=0;sh.vy=0;landed();return}
  for(i=0;i<w.gusts.length;i++){g=w.gusts[i];if(!g.fired&&S.t>=g.t0){g.fired=true;S.throwInfo.gusts++;callout(g.dw>0?'追い風の突風！':'向かい風の突風！',g.dw>0?'green':'red');SFX.gust()}}
  if(w.bird&&!w.bird.used&&S.t>=w.bird.t0&&sh.y>6&&sh.vy<9&&sh.vx>0&&!sh.carry){
    w.bird.used=true;sh.carry=1.5;sh.cvx=Math.max(sh.vx,14)*1.12+8;sh.cy=sh.y;S.throwInfo.birds=true;
    w.bird.t1=S.t;callout('鳥がくわえた！','white');SFX.bird();
  }
  if(sh.carry>0){
    sh.carry-=dt;sh.x+=sh.cvx*dt;sh.y+=(sh.cy-sh.y)*Math.min(1,dt*3);sh.rot+=dt*2;
    if(sh.carry<=0){sh.vx=sh.cvx*.9;sh.vy=0;sh.rv=8;callout('ポイッ！','white')}
    return;
  }
  var prevX=sh.x,ax=windAt(S.t),ay=-G;
  if(w.useZones){
    ensureWorld(sh.x);
    for(i=0;i<w.zones.length;i++){var z=w.zones[i];if(Math.abs(sh.x-z.x)<z.w/2&&sh.y<z.top&&sh.y>.5)ay+=z.p}
  }
  sh.vx+=ax*dt;sh.vy+=ay*dt;
  if(sh.vx>140)sh.vx=140;
  sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.rot+=sh.rv*dt;
  if(sh.y>sh.topY)sh.topY=sh.y;
  // rings
  if(w.useRings){
    trySpawnRing(sh,w);
    for(i=0;i<w.rings.length;i++){
      var r=w.rings[i];
      if(!r.passed&&prevX<r.x&&sh.x>=r.x){
        r.passed=true;
        if(Math.abs(sh.y-r.y)<=r.r){
          r.hit=true;r.hitT=S.t;w.combo++;S.throwInfo.rings++;
          var gain=1+(w.stage.boost-1)/(1+.15*(w.combo-1));
          sh.vx=Math.min(140,sh.vx*gain);sh.vy=Math.max(sh.vy,0)+6+w.stage.id;
          S.shocks.push({x:r.x,y:r.y,age:0,big:false});S.hitStop=.12;S.shake=8;
          SFX.ring(w.combo);buzz(15);
          callout('RING × '+w.combo+'！','green');
        }
      }
    }
  }
  // head bonk
  if(S.throwInfo.type==='head'&&!sh.bonked&&sh.vy<0){
    var k=curPlayer().k,hy=1.62*k,hx=-.696*k;
    if(sh.y<=hy&&Math.abs(sh.x-hx)<.9){
      sh.bonked=true;sh.vy=5;sh.vx=1.3;sh.rv=9;S.bonk=1;SFX.bonk();S.shake=10;buzz(60);
      callout('ゴツン！！','red');
    }
  }
  // ground
  if(sh.y<=0&&sh.vy<=0){
    sh.y=0;
    var pad=null;
    for(i=0;i<w.pads.length;i++){if(Math.abs(sh.x-w.pads[i].x)<w.pads[i].w/2)pad=w.pads[i]}
    if(pad&&sh.vy<-1){
      sh.vy=Math.max(-sh.vy+10,17);sh.vx=sh.vx*1.1+2;sh.rv=14;pad.sq=.45;S.throwInfo.pads++;
      SFX.boing();callout('ボヨーン！','green');buzz(30);
    }else if(sh.vy<-2.5){
      SFX.thud(-sh.vy);sh.vy=-sh.vy*.36;sh.vx*=.62;sh.rv*=.6;sh.bounces++;
    }else{sh.vy=0;sh.rolling=true}
  }
  if(sh.rolling){
    sh.y=0;sh.vy=0;
    var f=(6+2.5*Math.abs(sh.vx))*dt;
    if(Math.abs(sh.vx)<=f)sh.vx=0;else sh.vx-=(sh.vx>0?1:-1)*f;
    sh.rot+=sh.vx*2*dt;
    if(sh.vx===0)landed();
  }
}
function landed(){

function groundY(){return H*.8}

function triwave(x){var p=x%2;return p>1?2-p:p}
function update(dt){
  var i;
  for(i=S.timers.length-1;i>=0;i--){var tm=S.timers[i];tm.t-=dt;if(tm.t<=0){S.timers.splice(i,1);tm.fn()}}
  if(cfg.mode==='battle'&&S.bt&&S.state!=='title'&&S.state!=='result')bUpdate(dt);
  var st=S.state,ts=1;
  if(S.slow>0){ts=.3;S.slow-=dt}
  if(S.hitStop>0){ts=Math.min(ts,.2);S.hitStop-=dt}
  var pl=S.players[S.pi];
  if(st==='charge'){
    var ai=pl&&pl.ai;
    S.power+=S.pdir*dt/1.15;
    if(S.power>=1){S.power=1;S.pdir=-1}else if(S.power<=0){S.power=0;S.pdir=1}
    setPowerUI(S.power);
    S.chT=(S.chT||0)+dt;if(!ai&&S.chT>.07){S.chT=0;SFX.charge(S.power)}
    if(ai&&S.power>=S.aiPow&&S.pdir===1){S.power=S.aiPow;setPowerUI(S.power);lockPower()}
  }else if(st==='angle'){
    S.angleT+=dt;S.angle=8+74*triwave(S.angleT/1.15);setNeedle(S.angle);
    if(pl&&pl.ai&&Math.abs(S.angle-S.aiAng)<2.8)lockAngle();
  }else if(st==='fly'){
    var sdt=dt*ts,n=Math.max(1,Math.ceil(sdt/(1/120)));
    for(i=0;i<n&&S.state==='fly';i++)stepFlight(sdt/n);
    var sh=S.shoe;
    S.recT+=dt;
    S.frames.push({t:S.t,x:sh.x,y:sh.y,rot:sh.rot,cx:S.cam.x,cs:S.cam.s,c:sh.carry>0?1:0,b:sh.bonked?1:0});
    whooshSet(Math.hypot(sh.vx,sh.vy));
    var live=cfg.mode==='target'?Math.max(0,sh.x):sh.x;
    $('live').innerHTML=fmt(live)+'<small>m</small>';
    var wv=windAt(S.t);
    S.hudWind=wv;
  }
  S.kickT+=dt;S.idleT+=dt;
  if(S.bonk>0)S.bonk=Math.max(0,S.bonk-dt*1.2);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*30);
  for(i=S.shocks.length-1;i>=0;i--){S.shocks[i].age+=dt;if(S.shocks[i].age>.9)S.shocks.splice(i,1)}
  for(i=S.parts.length-1;i>=0;i--){var p=S.parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.vx*=.995;p.rot+=p.vr*dt;if(p.life<=0||p.y>H+30)S.parts.splice(i,1)}
  if(S.world){for(i=0;i<S.world.pads.length;i++){var pd=S.world.pads[i];if(pd.sq>0)pd.sq=Math.max(0,pd.sq-dt)}}
  updateWindChip();
  updateCam(dt);
}
function updateWindChip(){
  var el=$('windChip');
  if(cfg.mode==='battle'&&S.bt){el.hidden=true;return}
  if(!S.world||S.state==='title'||S.state==='replay'||S.state==='result'){el.hidden=true;return}
  var v=S.state==='fly'&&S.hudWind!=null?S.hudWind:S.world.wind;
  el.hidden=false;
  var txt=(v>=0?'追い風 ＋':'向かい風 －')+Math.abs(v).toFixed(1)+' m/s²  '+(v>=0?'→':'←');
  if(cfg.mode==='target'&&S.state!=='fly')txt='的 '+S.world.target+'m　'+txt;
  else if(cfg.mode==='target')txt='的 '+S.world.target+'m　'+txt;
  if(el.textContent!==txt)el.textContent=txt;
}
function updateCam(dt){
  var cam=S.cam,st=S.state,sh=S.shoe;
  if(cfg.mode==='battle'&&S.bt){var bs=bScale();cam.s=bs;cam.x=(W*.28-W*.12)/bs;return}
  if(st==='replay'&&S.replay){return}
  if(!sh||st==='title'||st==='ready'||st==='charge'||st==='angle'||st==='result'){
    var sr=sReady();cam.s+=(sr-cam.s)*Math.min(1,dt*5);cam.x+=(0-cam.x)*Math.min(1,dt*5);return;
  }
  var gy=groundY(),vx=Math.max(Math.abs(sh.vx),10);
  var sH=H*.72*(gy/H)/(Math.max(sh.y,8)+6)*1.0;
  var sW=W*.6/(vx*1.7);
  var tgt=Math.min(sReady(),sH*1.25,sW);
  if(st==='landed'){tgt=Math.min(Math.max(cam.s,10),22)}
  tgt=Math.max(.05,tgt);
  var rate=tgt<cam.s?4:1.6;
  cam.s*=Math.pow(tgt/cam.s,Math.min(1,dt*rate));
  var wantX=sh.x-W*.17/cam.s-(st==='fly'?Math.min(vx,60)*.1:0);
  var lag=st==='landed'?3:9;
  cam.x+=(wantX-cam.x)*Math.min(1,dt*lag);
}

/* ---------- rendering ---------- */
var CLOUDS=[],STARS=[],TREES=[];
(function(){
  var i;
  for(i=0;i<12;i++)CLOUDS.push({px:Math.random()*900,y:rnd(.06,.5),r:rnd(22,52),par:rnd(.05,.3)});
  for(i=0;i<70;i++)STARS.push({x:Math.random(),y:Math.random()*.8,r:rnd(.6,1.8),ph:Math.random()*6});
  for(i=0;i<600;i++)TREES.push({h:rnd(.7,1.3),g:Math.random()<.3?1:0});
})();
function sxf(x){return W*.28+(x-S.cam.x)*S.cam.s}
function syf(y){return groundY()-y*S.cam.s}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function mix(a,b,t){return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}



function legDeg(t,windup,state){
  if(state==='fly'||state==='landed'||state==='replay'){
    if(t<.16){var u=t/.16;u=u*u*(3-2*u);return lerp(windup,58,u)}
    if(t<.35)return 58;
    if(t<1.1){var v=(t-.35)/.75;return lerp(58,0,v*v*(3-2*v))}
    return 0;
  }
  if(state==='charge')return -(12+S.power*55);
  if(state==='angle')return windup;
  return 0;
}


function drawFlag(c,x,col,label,sub,px){
  var gy=groundY(),sx=sxf(x);
  if(sx<-80||sx>W+80)return;
  c.strokeStyle='#14213d';c.lineWidth=3;c.beginPath();c.moveTo(sx,gy);c.lineTo(sx,gy-px);c.stroke();
  c.fillStyle=col;c.beginPath();c.moveTo(sx,gy-px);c.lineTo(sx+px*.55,gy-px*.82);c.lineTo(sx,gy-px*.64);c.closePath();c.fill();
  c.strokeStyle='#14213d';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#fff';c.strokeStyle='#14213d';c.lineWidth=4;c.font='800 13px "M PLUS Rounded 1c",sans-serif';c.textAlign='center';c.textBaseline='alphabetic';
  c.strokeText(label,sx,gy-px-6);c.fillText(label,sx,gy-px-6);
  if(sub){c.font='800 11px "M PLUS Rounded 1c",sans-serif';c.strokeText(sub,sx,gy-px-20);c.fillText(sub,sx,gy-px-20)}
}



function render(dt){
  var c=ctx,gy=groundY(),cam,i,sh;
  if(S.state==='replay')replayStep(dt);
  cam=S.cam;sh=S.shoe;
  var bS=cfg.mode==='battle'&&S.bt;
  var altT=bS?S.bt.dkT:sh&&(S.state==='fly'||S.state==='landed'||S.state==='replay')?clamp((sh.y-70)/420,0,1):0;
  S.dk=(S.dk||0)+(altT-(S.dk||0))*Math.min(1,dt*2);
  var dk=S.dk;

  c.fillStyle=g;c.fillRect(-20,-20,W+40,H+40);

  }

  for(i=0;i<CLOUDS.length;i++){
    var cl=CLOUDS[i],span=W+400,px=(((cl.px-cam.x*18*cl.par)%span)+span)%span-200,cy=cl.y*gy;
    c.beginPath();c.arc(px,cy,cl.r,0,7);c.arc(px+cl.r*.9,cy+4,cl.r*.75,0,7);c.arc(px-cl.r*.9,cy+6,cl.r*.65,0,7);c.fill();
  }
  // hills
  var layers=[{col:'#8fd0a4',par:.12,amp:46,base:34,lam:240},{col:'#62b982',par:.28,amp:30,base:12,lam:160}];

    c.fillStyle=L.col;c.beginPath();c.moveTo(-10,gy);

    c.lineTo(W+12,gy);c.closePath();c.fill();
  }
  // school building (distant)
  (function(){
    var d=.22,bx=W*.28+(-8-cam.x)*cam.s*d,bw=36*cam.s*d,bh=11*cam.s*d,by=gy;
    if(bx-bw>W||bx<-20||bw<4)return;
    c.fillStyle='#dfe6f2';c.fillRect(bx-bw,by-bh,bw,bh);
    c.fillStyle='#c9504e';c.fillRect(bx-bw-3,by-bh-bh*.12,bw+6,bh*.12);
    c.fillStyle='#7fb7e6';
    var cols=8,rows=3,ww=bw/(cols*1.9),wh=bh/(rows*2.1);
    for(var r=0;r<rows;r++)for(var q=0;q<cols;q++)c.fillRect(bx-bw+bw/cols*(q+.28),by-bh+bh/rows*(r+.25),ww*1.2,wh);
    c.fillStyle='#fff';c.fillRect(bx-bw*.52,by-bh-bh*.5,bw*.07,bh*.5);
    c.beginPath();c.arc(bx-bw*.485,by-bh-bh*.3,bh*.1,0,7);c.fillStyle='#fff';c.fill();c.strokeStyle='#14213d';c.lineWidth=1.5;c.stroke();
    c.fillStyle='#8a97b4';c.fillRect(bx-bw*.58,by-bh*.34,bw*.14,bh*.34);
  })();

  (function(){
    var d=.34,sc=cam.s*d,l=cam.x-W*.28/sc,r=cam.x+W*.72/sc,sp=Math.max(12,(r-l)/36),i0=Math.floor(l/sp),i1=Math.ceil(r/sp);
    for(var q=i0;q<=i1;q++){

      var tr=TREES[((q%600)+600)%600],tx=W*.28+(q*sp-cam.x)*sc,th=tr.h*5*sc;
      if(th<5)continue;
      c.fillStyle='#8b5a36';c.fillRect(tx-th*.05,gy-th*.45,th*.1,th*.45);
      c.fillStyle=tr.g?'#3b9a63':'#4cae6a';c.beginPath();c.arc(tx,gy-th*.62,th*.3,0,7);c.arc(tx-th*.17,gy-th*.48,th*.22,0,7);c.arc(tx+th*.17,gy-th*.48,th*.22,0,7);c.fill();
    }
  })();
  // ground
  var gg=c.createLinearGradient(0,gy,0,H);gg.addColorStop(0,'#e6ad6e');gg.addColorStop(1,'#b9773f');
  c.fillStyle=gg;c.fillRect(-20,gy,W+40,H-gy+20);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-20,gy,W+40,3);
  c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=2;
  c.beginPath();c.moveTo(0,gy+(H-gy)*.58);c.lineTo(W,gy+(H-gy)*.58);c.stroke();
  var steps=[5,10,20,50,100,200,500,1000,2000,5000,10000],step=steps[steps.length-1];
  for(i=0;i<steps.length;i++){if(steps[i]*cam.s>=100){step=steps[i];break}}
  var m0=Math.max(0,Math.floor((cam.x-W*.28/cam.s)/step)),m1=Math.ceil((cam.x+W*.72/cam.s)/step);

    drawFlag(c,S.world.target,'#ffc531','的 '+S.world.target+'m','',clamp(3.4*cam.s,34,80));
  }
  // updraft zones
  if(S.world&&S.world.useZones){
    for(i=0;i<S.world.zones.length;i++){

      var zt=syf(z.top),zg=c.createLinearGradient(0,gy,0,zt);zg.addColorStop(0,'rgba(255,255,255,.45)');zg.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=zg;c.fillRect(zx,zt,zw,gy-zt);
      c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;
      for(var q=0;q<4;q++){
        var qx=zx+zw*(q+.5)/4,off=(S.idleT*60+q*37)%90;
        for(var yy=gy-off;yy>Math.max(zt,-20);yy-=90){c.beginPath();c.moveTo(qx-6,yy+8);c.lineTo(qx,yy);c.lineTo(qx+6,yy+8);c.stroke()}
      }

  }
  // pads
  if(S.world){
    for(i=0;i<S.world.pads.length;i++){
      var pd=S.world.pads[i],pxx=sxf(pd.x),pw=Math.max(34,pd.w*cam.s),sq=pd.sq>0?Math.sin(pd.sq/.45*Math.PI)*.5:0,topY=gy-Math.max(10,.9*cam.s)*(1-sq*.7);

      c.fillStyle='#e8363f';c.beginPath();c.ellipse(pxx,topY,pw/2,Math.max(5,pw*.12),0,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
      c.fillStyle='#14213d';c.beginPath();c.ellipse(pxx,topY,pw*.3,Math.max(2,pw*.06),0,0,7);c.fill();
    }
  }
  // flags
  if(!bS&&cfg.mode!=='target'&&rec.best>0&&S.state!=='title')drawFlag(c,rec.best,'#ffc531','RECORD',fmt(rec.best)+'m',54);
  for(i=0;i<S.marks.length;i++){var mk=S.marks[i];drawFlag(c,mk.x,mk.color,cfg.mode==='target'?mk.score+'点':fmt(mk.x)+'m',mk.name,40)}

  var tNow=S.state==='replay'&&S.replay?S.replay.cur.t:S.t;

  if(kicked&&sh){

  for(i=0;i<S.shocks.length;i++){
    var sk=S.shocks[i],u=sk.age/.9,rad=(sk.big?9:5)*Math.pow(u,.7)*Math.max(cam.s,14);

}

/* ---------- replay ---------- */
function startReplay(th){
  if(!th||!th.frames||!th.frames.length)return;
  S.replay={th:th,t:0,idx:0,cur:th.frames[0],hold:0};
  S.state='replay';S.world=th.world;
  $('resultOv').hidden=true;$('replayBar').hidden=false;$('hud').hidden=true;$('live').hidden=false;
  setKick('wait','リプレイ中…');
  $('controls').style.visibility='hidden';
  SFX.kick(1);
}
function replayStep(dt){
  var R=S.replay;if(!R)return;
  var fr=R.th.frames;
  if(R.idx>=fr.length-1){
    R.hold+=dt;if(R.hold>1)endReplay();
  }else{
    R.t+=dt;
    while(R.idx<fr.length-1&&fr[R.idx+1].t<=R.t)R.idx++;
    R.cur=fr[R.idx];
  }
  var f=R.cur;
  S.shoe={x:f.x,y:f.y,rot:f.rot,carry:f.c?1:0,vx:0,vy:0};
  S.cam.x=f.cx;S.cam.s=f.cs;S.kickT=f.t;
  $('live').innerHTML=fmt(f.x)+'<small>m</small>';
}
function endReplay(){
  if(S.state!=='replay')return;
  S.replay=null;S.state='result';S.shoe=null;S.world=null;
  $('replayBar').hidden=true;$('live').hidden=true;$('resultOv').hidden=false;
}

/* ---------- simulator ---------- */
function simulate(pw,ang,wind){
  var v=V0*pw/100,rad=ang*Math.PI/180,vx=v*Math.cos(rad),vy=v*Math.sin(rad),x=0,y=0,dt=.004,pts=[[0,0]],n=0,top=0;
  while(n<20000){
    vx+=wind*dt;vy-=G*dt;x+=vx*dt;y+=vy*dt;n++;
    if(y>top)top=y;
    if(n%12===0)pts.push([x,Math.max(0,y)]);
    if(y<=0&&vy<0)break;
  }
  pts.push([x,0]);
  return {dist:x,pts:pts,top:top};
}
function drawSim(){
  var pw=+$('sP').value,an=+$('sA').value,wd=+$('sW').value/10;
  $('oP').textContent=pw+'%';$('oA').textContent=an+'°';$('oW').textContent=(wd>0?'+':'')+wd.toFixed(1)+' m/s²';
  var r=simulate(pw,an,wd);
  $('oD').textContent=fmt(r.dist);
  var cs=$('simCv'),w=cs.clientWidth,h=cs.clientHeight;if(!w)return;
  var d=Math.min(2,window.devicePixelRatio||1);cs.width=w*d;cs.height=h*d;
  var c=cs.getContext('2d');c.setTransform(d,0,0,d,0,0);
  var xs=r.pts.map(function(p){return p[0]}),xmin=Math.min(0,Math.min.apply(null,xs)),xmax=Math.max(30,Math.max.apply(null,xs))*1.08,ymax=Math.max(8,r.top)*1.25;
  var padL=14,padB=18,sx=function(x){return padL+(x-xmin)/(xmax-xmin)*(w-padL*2)},sy=function(y){return h-padB-y/ymax*(h-padB-10)};
  c.fillStyle='#d99a5b';c.fillRect(0,h-padB,w,padB);
  c.strokeStyle='#14213d';c.lineWidth=2.5;c.setLineDash([6,5]);c.beginPath();
  r.pts.forEach(function(p,i){if(i)c.lineTo(sx(p[0]),sy(p[1]));else c.moveTo(sx(p[0]),sy(p[1]))});c.stroke();c.setLineDash([]);
  drawShoeOn(c,sx(r.dist),sy(0)-4,18,0,'#e8363f');
  c.fillStyle='#14213d';c.font='800 12px sans-serif';c.textAlign='center';c.fillText(fmt(r.dist)+'m',clamp(sx(r.dist),30,w-30),h-5);
  c.fillStyle='#fff';c.fillRect(sx(0)-1.5,h-padB-14,3,14);
}

function chain(c,pts,w,col){
  var o=Math.max(1.6,w*.17),i;
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=INK;c.lineWidth=w+o*2;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();
}
function seg(c,a,b,w,col){
  var o=Math.max(1.6,w*.17);
  c.lineCap='round';c.strokeStyle=INK;c.lineWidth=w+o*2;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
  c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
}
function lerp2(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}

/* ---- 靴 ---- */
function drawShoeOn(c,x,y,size,rot,col){
  c.save();c.translate(x,y);c.rotate(rot);c.scale(size,size);c.translate(0,.17);
  c.lineJoin='round';c.lineCap='round';
  var lw=Math.max(.035,1.7/size),i;
  // sole
  var sg=c.createLinearGradient(0,-.02,0,.14);sg.addColorStop(0,'#ffffff');sg.addColorStop(1,'#c9d3e6');
  c.fillStyle=sg;c.strokeStyle=INK;c.lineWidth=lw;
  c.beginPath();c.moveTo(-.53,-.02);c.lineTo(.5,-.02);c.quadraticCurveTo(.58,.0,.56,.08);c.quadraticCurveTo(.54,.15,.44,.15);c.lineTo(-.46,.15);c.quadraticCurveTo(-.56,.15,-.55,.05);c.closePath();c.fill();c.stroke();
  // upper
  var ug=c.createLinearGradient(0,-.42,0,0);ug.addColorStop(0,col);ug.addColorStop(1,shade(col,-.28));
  c.fillStyle=ug;c.beginPath();c.moveTo(-.5,-.02);c.lineTo(-.51,-.37);c.quadraticCurveTo(-.42,-.46,-.28,-.4);c.lineTo(-.15,-.25);
  c.quadraticCurveTo(.05,-.24,.2,-.15);c.quadraticCurveTo(.5,-.11,.52,-.02);c.closePath();c.fill();c.stroke();
  // tongue
  c.fillStyle='#fff';c.beginPath();c.moveTo(-.2,-.34);c.quadraticCurveTo(-.12,-.42,-.06,-.3);c.lineTo(-.1,-.22);c.lineTo(-.2,-.26);c.closePath();c.fill();c.stroke();
  // toe cap
  c.fillStyle='#fff';c.beginPath();c.moveTo(.27,-.13);c.quadraticCurveTo(.5,-.11,.52,-.02);c.lineTo(.3,-.02);c.closePath();c.fill();c.stroke();
  // side swoosh
  c.strokeStyle='#fff';c.lineWidth=lw*1.8;c.beginPath();c.moveTo(-.4,-.12);c.quadraticCurveTo(-.2,-.2,-.02,-.08);c.stroke();
  // laces
  c.strokeStyle='#fff';c.lineWidth=lw*1.1;
  for(i=0;i<3;i++){c.beginPath();c.moveTo(-.1+i*.1,-.24+i*.022);c.lineTo(-.06+i*.1,-.15+i*.022);c.stroke()}
  // heel tab + shine
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-.38,-.3,.05,.02,-.5,0,7);c.fill();
  c.restore();
}
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,f=function(v){return clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255)};
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}

/* ---- 顔 ---- */
function drawFace(c,cx,cy,hr,kind,mood,t){
  var g=kind==='girl',E=[[cx+hr*.2,cy+hr*.1],[cx+hr*.66,cy+hr*.1]],er=hr*(g?.19:.15),i;
  if(hr<7){c.fillStyle=INK;for(i=0;i<2;i++){c.beginPath();c.arc(E[i][0],E[i][1],Math.max(1,hr*.12),0,7);c.fill()}return}
  var lw=Math.max(1.4,hr*.07);
  c.lineWidth=lw;c.strokeStyle=INK;c.fillStyle=INK;c.lineCap='round';c.lineJoin='round';
  var blink=mood==='idle'&&(t%3.4)<.12;
  for(i=0;i<2;i++){
    var ex=E[i][0],ey=E[i][1];
    if(blink){c.beginPath();c.moveTo(ex-er,ey+er*.2);c.lineTo(ex+er,ey+er*.2);c.stroke()}
    else if(mood==='kick'){c.beginPath();c.moveTo(ex-er*1.1,ey-er*1.1);c.lineTo(ex+er*.6,ey);c.lineTo(ex-er*1.1,ey+er*1.1);c.stroke()}
    else if(mood==='cheer'){c.beginPath();c.arc(ex,ey+er*.5,er*1.15,Math.PI*1.08,Math.PI*1.92);c.stroke()}
    else if(mood==='dizzy'){
      c.beginPath();for(var a=0;a<=14;a+=.5){var rr2=er*1.25*(a/14),px=ex+Math.cos(a*1.1+t*8)*rr2,py=ey+Math.sin(a*1.1+t*8)*rr2;if(a===0)c.moveTo(px,py);else c.lineTo(px,py)}c.stroke();
    }else{
      var wide=mood==='watch'?1.3:1,rx=er*(g?1.05:.85)*wide,ry=er*(g?1.45:1.25)*wide;
      if(mood==='watch'||g){c.fillStyle='#fff';c.beginPath();c.ellipse(ex,ey,rx*1.12,ry*1.1,0,0,7);c.fill();c.stroke()}
      c.fillStyle=g?(mood==='sad'?'#3b6fd6':'#5a3fb8'):INK;
      var pxo=mood==='watch'?er*.35:er*.15;
      c.beginPath();c.ellipse(ex+pxo,ey+er*.08,rx*(g?.82:1),ry*(g?.88:1),0,0,7);c.fill();
      c.fillStyle='#14213d';if(g){c.beginPath();c.ellipse(ex+pxo,ey+er*.1,rx*.45,ry*.5,0,0,7);c.fill()}
      c.fillStyle='#fff';c.beginPath();c.arc(ex+pxo-rx*.28,ey-ry*.3,Math.max(1,er*.32),0,7);c.fill();
      if(g){c.beginPath();c.arc(ex+pxo+rx*.3,ey+ry*.3,Math.max(.8,er*.17),0,7);c.fill()}
      c.fillStyle=INK;
      if(g){c.lineWidth=lw*1.2;c.beginPath();c.moveTo(ex-rx*1.1,ey-ry*.55);c.quadraticCurveTo(ex-rx*.4,ey-ry*1.25,ex+rx*1.15,ey-ry*.8);c.stroke();c.lineWidth=lw}
    }
    // 眉
    var bw=kind==='dad'?lw*1.7:lw*1.15,by=ey-er*(g?2.6:2.3);
    c.lineWidth=bw;c.beginPath();
    if(mood==='charge'||mood==='focus'||mood==='kick'){c.moveTo(ex-er*1.3,by-er*.5);c.lineTo(ex+er*1.2,by+er*.45)}
    else if(mood==='sad'||mood==='dizzy'){c.moveTo(ex-er*1.2,by+er*.5);c.lineTo(ex+er*1.2,by-er*.4)}
    else if(mood==='cheer'||mood==='watch'){c.moveTo(ex-er*1.2,by-er*.25);c.quadraticCurveTo(ex,by-er*.9,ex+er*1.2,by-er*.25)}
    else{c.moveTo(ex-er*1.2,by);c.quadraticCurveTo(ex,by-er*.5,ex+er*1.2,by)}
    c.stroke();c.lineWidth=lw;
  }
  // 眼鏡（パパ）
  if(kind==='dad'&&hr>9){
    c.strokeStyle='#3a3f55';c.lineWidth=Math.max(1.4,hr*.06);
    for(i=0;i<2;i++){c.beginPath();c.ellipse(E[i][0],E[i][1],er*2.1,er*2.0,0,0,7);c.stroke()}
    c.beginPath();c.moveTo(E[0][0]+er*2.1,E[0][1]-er*.2);c.lineTo(E[1][0]-er*2.1,E[1][1]-er*.2);c.moveTo(E[0][0]-er*2.1,E[0][1]-er*.3);c.lineTo(cx-hr*.85,cy-hr*.05);c.stroke();
    c.fillStyle='rgba(255,255,255,.25)';for(i=0;i<2;i++){c.beginPath();c.ellipse(E[i][0],E[i][1],er*2.0,er*1.9,0,0,7);c.fill()}
  }
  // ほっぺ
  if(g||mood==='cheer'){c.fillStyle='rgba(255,110,140,.45)';c.beginPath();c.ellipse(cx+hr*.5,cy+hr*.5,hr*.2,hr*.12,0,0,7);c.fill()}
  // 鼻
  c.strokeStyle=CHARS[kind].skin2;c.lineWidth=Math.max(1.2,hr*.06);c.beginPath();c.moveTo(cx+hr*.96,cy+hr*.2);c.quadraticCurveTo(cx+hr*1.08,cy+hr*.32,cx+hr*.93,cy+hr*.36);c.stroke();
  // 口
  var mx=cx+hr*.5,my=cy+hr*.6;c.strokeStyle=INK;c.lineWidth=lw;c.fillStyle='#7a1f2b';
  if(mood==='kick'){c.beginPath();c.ellipse(mx,my+hr*.04,hr*.2,hr*.27,0,0,7);c.fill();c.stroke();c.fillStyle='#ff7b8f';c.beginPath();c.ellipse(mx,my+hr*.17,hr*.12,hr*.09,0,0,7);c.fill()}
  else if(mood==='cheer'){c.beginPath();c.moveTo(mx-hr*.32,my-hr*.05);c.quadraticCurveTo(mx,my+hr*.6,mx+hr*.32,my-hr*.05);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(mx-hr*.26,my-hr*.03);c.quadraticCurveTo(mx,my+.1*hr,mx+hr*.26,my-hr*.03);c.closePath();c.fill()}
  else if(mood==='watch'){c.beginPath();c.arc(mx,my+hr*.05,hr*.11,0,7);c.fill();c.stroke()}
  else if(mood==='charge'){c.fillStyle='#fff';c.beginPath();c.rect(mx-hr*.26,my-hr*.08,hr*.52,hr*.2);c.fill();c.stroke();c.beginPath();c.moveTo(mx,my-hr*.08);c.lineTo(mx,my+hr*.12);c.stroke()}
  else if(mood==='sad'){c.beginPath();c.moveTo(mx-hr*.26,my+hr*.14);c.quadraticCurveTo(mx,my-hr*.1,mx+hr*.26,my+hr*.14);c.stroke()}
  else if(mood==='dizzy'){c.beginPath();for(var q=-3;q<=3;q++){var wx=mx+q*hr*.09,wy=my+(q%2?hr*.05:-hr*.03);if(q===-3)c.moveTo(wx,wy);else c.lineTo(wx,wy)}c.stroke()}
  else if(mood==='focus'){c.beginPath();c.moveTo(mx-hr*.2,my+hr*.04);c.lineTo(mx+hr*.2,my+hr*.04);c.stroke()}
  else{c.beginPath();c.moveTo(mx-hr*.25,my-hr*.02);c.quadraticCurveTo(mx,my+hr*.28,mx+hr*.25,my-hr*.02);c.stroke()}
}

/* ---- 頭（髪・耳・顔） ---- */
function drawHeadOn(c,cx,cy,hr,kind,mood,t){
  var ch=CHARS[kind]||CHARS.dad,lw=Math.max(1.4,hr*.07),hair=ch.hair;

/* ---- 全身 ---- */
function kickMood(o){
  if(cfg.mode==='battle'&&S.bt){var bt=S.bt;
    if(o.bonk>0||bt.stun>0)return 'dizzy';
    if(bt.clear)return 'cheer';if(bt.over)return 'sad';
    if(S.kickT<.4)return 'kick';if(bt.sadT>0)return 'sad';if(bt.happyT>0)return 'cheer';
    if(o.state==='charge')return 'charge';if(o.state==='angle')return 'focus';return 'idle';}
  if(o.bonk>0)return 'dizzy';
  var st=o.state;
  if(st==='charge')return 'charge';
  if(st==='angle')return 'focus';
  if(st==='fly'||st==='replay')return S.kickT<.45?'kick':'watch';
  if(st==='landed'){
    var th=S.allThrows&&S.allThrows[S.allThrows.length-1],bad=S.throwInfo&&(S.throwInfo.type==='head'||S.throwInfo.type==='back');
    if(cfg.mode==='target'&&th&&th.score<40)bad=true;
    return bad?'sad':'cheer';
  }
  return 'idle';
}
function drawKicker(c,o){
  var ch=CHARS[o.kind]||CHARS.dad,k=o.k,s=S.cam.s,t=S.idleT,mood=kickMood(o);
  var jump=mood==='cheer'?Math.abs(Math.sin(t*9))*.1*k:0,bob=o.state==='ready'?Math.sin(t*3)*.012*k:0;
  var hx=-.696*k,hy=.9*k+bob,th=o.theta*Math.PI/180;
  function P(x,y){return [sxf(x),syf(y+jump)]}
  var lw=Math.max(2.5,.15*k*s);
  // 影
  c.fillStyle='rgba(20,33,61,.22)';c.beginPath();c.ellipse(sxf(hx+.1*k),groundY()+3,Math.max(8,.55*k*s)/(1+jump*2),Math.max(2,.07*k*s),0,0,7);c.fill();
  var lean=th<0?-.12*k*(-th/1.1):.04*k;
  var hip=P(hx,hy),sho=P(hx+lean,hy+.5*k);
  var a1,a2,f1,f2;
  if(mood==='cheer'){a1=2.7+Math.sin(t*10)*.25;a2=2.5-Math.sin(t*10)*.25;f1=-.3;f2=.3}
  else if(mood==='sad'){a1=.15;a2=-.1;f1=.2;f2=.2}
  else if(mood==='dizzy'){a1=.5+Math.sin(t*8)*.4;a2=-.5+Math.sin(t*8+2)*.4;f1=.3;f2=.3}
  else{a1=-th*.9+.25;a2=th*.9-.25;f1=.55;f2=.55}
  var UL=.24*k,FL=.24*k,aw=.11*k*s;
  function arm(a,f,col){
    var base=hx+lean,by=hy+.5*k-.03*k;
    var el=[base+UL*Math.sin(a),by-UL*Math.cos(a)],ha=[el[0]+FL*Math.sin(a+f),el[1]-FL*Math.cos(a+f)];
    var pE=P(el[0],el[1]),pH=P(ha[0],ha[1]),pS=P(base,by);
    chain(c,[pS,pE,pH],Math.max(2,aw),ch.skin);
    seg(c,pS,lerp2(pS,pE,.85),Math.max(3,aw*1.25),col);
    c.fillStyle=ch.skin;c.strokeStyle=INK;c.lineWidth=Math.max(1.2,.02*k*s);c.beginPath();c.arc(pH[0],pH[1],Math.max(2.5,.065*k*s),0,7);c.fill();c.stroke();
  }
  function shortsAndSock(pHip,pKnee,pAnkle,pFoot){
    seg(c,pHip,lerp2(pHip,pKnee,.5),Math.max(4,.26*k*s),ch.pants);
    seg(c,lerp2(pKnee,pAnkle,.55),pAnkle,Math.max(3,lw*.95),'#ffffff');
  }
  // 奥の腕
  arm(a2,f2,shade(ch.shirt,-.25));
  // 軸足
  var sKnee=P(hx+.08*k,.46*k),sAnk=P(hx+.12*k,.1*k);
  chain(c,[hip,sKnee,sAnk],lw,ch.skin);shortsAndSock(hip,sKnee,sAnk);
  var shoeS=Math.max(10,.55*k*s);
  drawShoeOn(c,sAnk[0]+.12*k*s,sAnk[1]+.1*k*s-.3*shoeS,shoeS,0,o.shoe);
  // 胴体
  var dx=sho[0]-hip[0],dy=sho[1]-hip[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,hw=.2*k*s,sw=.245*k*s;
  var tg=c.createLinearGradient(hip[0],hip[1],sho[0],sho[1]);tg.addColorStop(0,ch.shirt2);tg.addColorStop(1,ch.shirt);
  c.fillStyle=tg;c.strokeStyle=INK;c.lineWidth=Math.max(1.6,.025*k*s*2);c.lineJoin='round';
  c.beginPath();c.moveTo(hip[0]+nx*hw,hip[1]+ny*hw);c.lineTo(sho[0]+nx*sw,sho[1]+ny*sw);
  c.quadraticCurveTo(sho[0]+dx/len*sw*.5,sho[1]+dy/len*sw*.5,sho[0]-nx*sw,sho[1]-ny*sw);
  c.lineTo(hip[0]-nx*hw,hip[1]-ny*hw);c.closePath();c.fill();c.stroke();
  if(k*s>34){ // 胸の番号
    var mxp=(hip[0]+sho[0])/2,myp=(hip[1]+sho[1])/2;
    c.fillStyle='#fff';c.font='400 '+Math.max(9,.22*k*s)+'px "Dela Gothic One",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch.num,mxp,myp);
    c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=Math.max(1.5,.03*k*s);c.beginPath();c.moveTo(hip[0]+nx*hw*.95,hip[1]+ny*hw*.95);c.lineTo(hip[0]-nx*hw*.95,hip[1]-ny*hw*.95);c.stroke();
  }
  // 蹴り足
  var t1=th*.8,t2=th<0?th-.45:th;
  var kn=[hx+.42*k*Math.sin(t1),hy-.42*k*Math.cos(t1)],ft=[kn[0]+.43*k*Math.sin(t2),kn[1]-.43*k*Math.cos(t2)];
  var pK=P(kn[0],kn[1]),pF=P(ft[0],ft[1]);
  chain(c,[hip,pK,pF],lw,ch.skin);shortsAndSock(hip,pK,pF);
  if(o.hasShoe)drawShoeOn(c,pF[0]+Math.cos(t2)*.1*k*s,pF[1]-Math.sin(t2)*.04*k*s,shoeS,t2-.1,o.shoe);
  else{c.fillStyle='#fff';c.strokeStyle=INK;c.lineWidth=Math.max(1,.02*k*s);c.beginPath();c.ellipse(pF[0]+Math.cos(t2)*.06*k*s,pF[1],Math.max(3,.1*k*s),Math.max(2.5,.07*k*s),t2,0,7);c.fill();c.stroke()}
  // 頭
  var hr=Math.max(5,.27*k*s*(o.kind==='girl'?1.04:1)),wob=o.bonk>0?Math.sin(t*40)*hr*.12*o.bonk:0;
  var hc=P(hx+lean,hy+.5*k+.2*k);
  var tilt=mood==='sad'?.12:(mood==='charge'?-.06:0);
  c.save();c.translate(hc[0]+wob,hc[1]);c.rotate(tilt);
  drawHeadOn(c,0,0,hr,o.kind,mood,t);c.restore();
  if(o.bonk>0&&hr>7){
    c.fillStyle='#ffc531';c.strokeStyle=INK;c.lineWidth=1.5;c.font='800 '+Math.max(10,hr*.9)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';
    for(var i=0;i<3;i++){var ang=t*6+i*2.1,sx2=hc[0]+Math.cos(ang)*hr*1.5,sy2=hc[1]-hr*1.35+Math.sin(ang)*hr*.4;c.strokeText('★',sx2,sy2);c.fillText('★',sx2,sy2)}
  }
  // 手前の腕
  arm(a1,f1,ch.shirt);
}

function mkPlayer(kind,name,ai){var c=CHARS[kind];return {name:name,kind:kind,shirt:c.shirt,shoe:c.shoe,k:c.k,ai:ai,throws:[],best:null}}
function startMatch(){
  if(cfg.mode==='battle'){startBattle();return}
  S.bt=null;$('bestNow').parentNode.parentNode.querySelector('small').textContent='今回のベスト';
  audioInit();
  var n1=($('n1').value.trim()||CHARS[cfg.char].name).slice(0,8),n2=($('n2').value.trim()||'娘').slice(0,8);
  rec.names={p1:n1,p2:n2};store.set('sks_names',rec.names);store.set('sks_char',cfg.char);
  S.rounds=cfg.opp==='solo'?5:3;
  var k1=cfg.opp==='duo'?'dad':cfg.char;

function nextTurn(){
  var total=S.rounds*S.players.length;

/* ---- 結果 ---- */
function finishMatch(){
  S.state='result';whooshStop();S.shoe=null;
  var P=S.players,tgt=cfg.mode==='target',bestAll=-Infinity,winner=null,tie=false,i,j,R=S.rounds;
  for(i=0;i<P.length;i++){
    if(P[i].best>bestAll){bestAll=P[i].best;winner=P[i];tie=false}
    else if(P[i].best===bestAll)tie=true;
  }
  var title;
  if(P.length===1){
    var sum=0,n=P[0].throws.length;for(i=0;i<n;i++)sum+=P[0].throws[i].score;
    title=S.matchRecord?'自己ベスト更新！':P[0].name+'の'+R+'回チャレンジ';
    S.avg=n?sum/n:0;
  }
  else if(tie)title='引き分け！';

function finishBattle(){

  else if(bt.clear)ttl='遠足の守護神';
  else if(bt.kochoHits)ttl='ヅラハンター';

  $('resTitle').innerHTML=(bt.clear?'明日は快晴！':'明日は雨…')+'<br><span style="font-size:.62em">称号「'+esc(ttl)+'」</span>';
  $('resBig').textContent=String(bt.score);$('resUnit').textContent='点';
  $('resBadge').hidden=!isRec;
  var msg='';
  if(bt.kochoHits)msg='※校長先生のヅラを飛ばしたので、明日は校長室です';
  else if(bt.used.heel)msg='※ママの靴を勝手に使ったので、あとで怒られます';
  else if(!bt.clear&&rec.bestB>bt.score)msg='自己ベストまで あと '+(rec.bestB-bt.score)+'点';
  $('resUnlock').hidden=!msg;$('resUnlock').textContent=msg;
  var most=null,mc=0;for(var k in bt.used)if(bt.used[k]>mc){mc=bt.used[k];most=k}
  var rows=[['撃退した数',bt.kills+'体'],['最大れんぞく',bt.maxCombo+'連'],['一石二鳥',bt.doubles+'回'],
    ['命中率',bt.shots?Math.round(bt.hits/bt.shots*100)+'%':'-'],['ポチの往復',bt.fetches+'回'],
    ['はだしの時間',fmt(bt.barefootT)+'秒'],['いちばん投げた靴',most?SHOES[most].n+'（'+mc+'回）':'-'],['アフロ',bt.afro?bt.afro+'段':'なし'],
    ['ボウリング（ふっとび命中）',bt.chains+'回'],['大爆発',bt.blasts+'回'],['ギリギリ撃退',bt.giri+'回'],['晴れフィーバー',bt.fevers+'回'],['ひっさつシュート',bt.fires+'回'],['校長先生のヅラ',bt.kochoHits?'飛ばした（'+bt.kochoHits+'回）':'無事'],['UFOからポチ救出',bt.ufoSaved+'回'],['カラスに盗まれた',bt.stolen+'足']];
  var h='<tr><th>記録</th><th></th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>'});
  $('resTbl').innerHTML=h;
  $('replayBtn').hidden=true;
  $('cardImg').hidden=true;$('cardHint').hidden=true;
  var txt='👟 '+bt.score+'点！ '+(bt.clear?'明日は快晴☀️':'明日は雨☔')+'\n靴飛ばし王「あした天気になーれ」\n称号：'+ttl+'\n#靴飛ばし王';
  $('shareTxt').value=txt;$('xBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(txt);
  S.shareData={big:bt.score,winner:null,tie:false};
  $('resultOv').hidden=false;$('resultOv').scrollTop=0;$('live').hidden=true;
  if(isRec){SFX.cheer();confetti(90)}
}

init();
