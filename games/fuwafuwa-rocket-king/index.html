<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ふわふわロケット KING</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
/* Layout: one 9:16 stage centered on a night-sky field; HUD on canvas, title/result as DOM overlays.
   Deliberately single-theme: the game is its own world (sky by day, deep space by night). */
:root {
  --night: #11123a;     /* page field around the stage */
  --ink: #1d1a3a;       /* outlines, text on light */
  --paper: #fffaf2;     /* cards, text on dark */
  --pink: #ff5fa8;      /* dome / brand */
  --gold: #ffcf3f;      /* PERFECT, records */
  --mint: #7cf3c6;      /* goals, positive */
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--paper); font-family: var(--ui);
  box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  background-image: radial-gradient(circle at 20% 15%, rgba(255,95,168,.12), transparent 40%), radial-gradient(circle at 80% 85%, rgba(124,243,198,.08), transparent 45%);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { height: 100%; display: grid; place-items: center; }
#stage {
  position: relative; overflow: hidden; border-radius: 1.1em; touch-action: none;
  box-shadow: 0 0 0 3px var(--ink), 0 1.2em 3em rgba(0,0,0,.5);
  background: #86cdfb; cursor: pointer;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#title {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; padding-top: 3.6em;
  text-align: center;
}
.logo-small { font-family: var(--display); font-size: 1.55em; color: var(--paper); letter-spacing: .04em;
  -webkit-text-stroke: .32em var(--ink); paint-order: stroke fill; transform: rotate(-3deg); }
.logo-king { font-family: var(--display); font-size: 4.4em; line-height: 1; color: var(--gold);
  -webkit-text-stroke: .16em var(--ink); paint-order: stroke fill; transform: rotate(-3deg); margin-top: .02em;
  text-shadow: 0 .09em 0 var(--pink); animation: bob 2.4s ease-in-out infinite; }
.logo-en { font-family: var(--ui); font-weight: 900; font-size: .72em; letter-spacing: .32em; color: var(--ink); margin-top: .7em; }
#title-best { margin-top: .5em; font-weight: 800; font-size: .82em; color: var(--ink); background: rgba(255,250,242,.8);
  padding: .3em .9em; border-radius: 99px; font-variant-numeric: tabular-nums; }
@keyframes bob { 50% { transform: rotate(-3deg) translateY(-.08em); } }

#result {
  position: absolute; inset: 0; background: rgba(17,18,58,.62); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: 1em;
}
.card {
  width: 100%; background: var(--paper); color: var(--ink); border: .19em solid var(--ink);
  border-radius: 1.2em; padding: 1.1em 1.1em 1em; box-shadow: 0 .35em 0 var(--ink);
  display: flex; flex-direction: column; gap: .7em; animation: drop .45s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes drop { from { transform: translateY(-1.5em) scale(.92); opacity: 0; } }
.r-top { display: flex; align-items: center; justify-content: space-between; gap: .5em; }
#r-head { font-family: var(--display); font-size: 1.05em; letter-spacing: .08em; }
#r-new { font-family: var(--display); font-size: .85em; background: var(--gold); border: .14em solid var(--ink);
  border-radius: .5em; padding: .15em .55em; transform: rotate(4deg); animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: rotate(4deg) scale(1.08); } }
.score { text-align: center; }
#r-score { font-family: var(--display); font-size: 2.9em; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--pink);
  -webkit-text-stroke: .05em var(--ink); paint-order: stroke fill; }
.label { font-size: .68em; font-weight: 900; letter-spacing: .14em; opacity: .7; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: .45em; }
.stat { background: #f1ecff; border-radius: .7em; padding: .45em .6em; display: flex; flex-direction: column; gap: .1em; min-width: 0; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 1.15em; font-variant-numeric: tabular-nums; }
#r-grade[data-grade="PERFECT"] { color: #c58a00; }
#r-grade[data-grade="MISS"] { color: #c4466d; }
.incident { background: var(--ink); color: var(--paper); border-radius: .8em; padding: .7em .8em; display: grid; grid-template-columns: auto 1fr; gap: .1em .65em; align-items: center; }
#r-art { grid-row: span 2; font-size: 2.1em; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
.incident .label { color: var(--gold); opacity: 1; }
#r-story { font-weight: 900; font-size: .95em; line-height: 1.45; text-wrap: balance; }
.goal { display: flex; gap: .5em; align-items: baseline; border: .14em dashed var(--ink); border-radius: .7em; padding: .5em .7em; }
.goal .label { flex: none; opacity: 1; color: #129f71; }
#r-goal { font-weight: 900; font-size: .9em; line-height: 1.4; }
#r-break { font-size: .62em; font-weight: 800; opacity: .6; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.5; }
.retry { text-align: center; font-family: var(--display); font-size: .95em; color: var(--pink); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

#mute {
  position: absolute; left: .7em; bottom: .7em; z-index: 3;
  font: 800 .7em var(--ui); color: var(--paper); background: rgba(29,26,58,.6);
  border: 0; border-radius: 99px; padding: .45em .85em; display: inline-flex; align-items: center; gap: .35em; cursor: pointer;
}
#mute:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#mute svg { width: 1.2em; height: 1.2em; }
#mute[aria-pressed="true"] .wave { display: none; }
#pause {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 4;
  background: rgba(17,18,58,.55); font-family: var(--display); font-size: 1.8em; color: var(--paper);
}
@media (prefers-reduced-motion: reduce) {
  .logo-king, #r-new, .retry, .card { animation: none; }
}
</style>

</head>
<body>
<div id="app">
  <div id="stage" aria-label="ふわふわロケット KING ゲーム画面。長押しで力をため、離すと発射">
    <canvas id="cv"></canvas>
    <div id="title">
      <div class="logo-small">ふわふわロケット</div>
      <div class="logo-king">KING</div>
      <div class="logo-en">FLUFFY ROCKET KING</div>
      <div id="title-best"></div>
    </div>
    <div id="result" hidden>
      <div class="card" role="dialog" aria-label="結果">
        <div class="r-top"><span id="r-head">GAME OVER</span><span id="r-new" hidden>NEW RECORD!</span></div>
        <div class="score"><div id="r-score">0</div><div class="label">TOTAL SCORE</div></div>
        <div class="stats">
          <div class="stat"><span class="label">最高高度</span><b id="r-alt">0m</b></div>
          <div class="stat"><span class="label">最大コンボ</span><b id="r-combo">×0</b></div>
          <div class="stat"><span class="label">発射評価</span><b id="r-grade">-</b></div>
          <div class="stat"><span class="label">珍事件図鑑</span><b id="r-dex">0/10</b></div>
        </div>
        <div class="incident"><span id="r-art"></span><span class="label">今日の珍事件</span><span id="r-story"></span></div>
        <div class="goal"><span class="label">次の目標</span><span id="r-goal"></span></div>
        <div id="r-break"></div>
        <div class="retry">画面をタップして再挑戦</div>
      </div>
    </div>
    <div id="pause" hidden>一時停止中</div>
    <button id="mute" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>音 ON</span></button>
  </div>
</div>
<script>/* ふわふわロケット KING — game core (pure logic, no DOM). Spec: v3.0 + v3.1 修正案 */
(function (root) {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- v3.1 §4 altitude scale (world px -> display m) ----
  const BANDS = [
    { id: 0, name: '青空', y0: 0, y1: 3000, m0: 0, m1: 2000 },
    { id: 1, name: '天空', y0: 3000, y1: 7000, m0: 2000, m1: 20000 },
    { id: 2, name: '宇宙', y0: 7000, y1: 12000, m0: 20000, m1: 100000 },
    { id: 3, name: '銀河', y0: 12000, y1: Infinity, m0: 100000, m1: Infinity },
  ];
  function bandOf(y) { return y >= 12000 ? 3 : y >= 7000 ? 2 : y >= 3000 ? 1 : 0; }
  function toMeters(y) {
    if (y <= 0) return 0;
    const b = BANDS[bandOf(y)];
    if (b.id === 3) return 100000 + (y - 12000) * 50;
    return b.m0 + (y - b.y0) / (b.y1 - b.y0) * (b.m1 - b.m0);
  }

  const P = {
    GRAV: 280,          // px/s^2
    LAUNCH_V: 1400,     // px/s at PERFECT
    VMAX: 1700,
    GIRL_R: 16,
    COMBO_WINDOW: 6,    // v3.1 §3
    GAG_RATE: 0.35,     // v3.0 §5 (never modified)
    GAG_DUR: 1.2,       // ≤1.5s (v3.1 §6)
    MAX_TIME: 90,
    LC_TIME_LIMIT: 85,
    LC_COMBO_RECENT: 8.5, // 3+ combo reached within the last N s (v3.0 「直前までに3コンボ」)
    ASSIST_AFTER: 3,
    NEAR_MARGIN: 45,
    NEAR_PTS: 50, NEAR_CAP: 1000,
    EVENT_CAP: 8000,
  };

  const MULT = (n) => n >= 10 ? 10 : n >= 7 ? 7 : n >= 5 ? 5 : n >= 3 ? 3 : n >= 2 ? 2 : 1;
  const COMBO_TIERS = [2, 3, 5, 7, 10];

  // v3.1 §2 launch precision
  const GRADES = {
    PERFECT: { coef: 1.0, dens: 1.5, bonus: 3000, spread: 4, label: 'PERFECT!' },
    GREAT: { coef: 0.9, dens: 1.25, bonus: 1500, spread: 12, label: 'GREAT!' },
    GOOD: { coef: 0.8, dens: 1.0, bonus: 500, spread: 18, label: 'GOOD' },
    MISS: { coef: 0.7, dens: 0.8, bonus: 0, spread: 25, label: 'ドンマイ！' },
  };
  function gradeOf(v) {
    v = Math.round(v);
    if (v >= 87 && v <= 93) return 'PERFECT';
    if ((v >= 80 && v <= 86) || (v >= 94 && v <= 97)) return 'GREAT';
    if ((v >= 65 && v <= 79) || v >= 98) return 'GOOD';
    return 'MISS';
  }

  const up = (g, k, add) => { g.vy = Math.max(g.vy, 0) * k + add; };
  // collision targets with their normal events (v3.1 §6 共通ルール)
  const OBJ = {
    cloud: { r: 30, normal: 'ぽよん反発', pts: 100, fn: (g) => up(g, 0.55, 700) },
    bigcloud: { r: 42, normal: 'もふもふ反発', pts: 150, fn: (g) => up(g, 0.55, 800) },
    bird: { r: 18, emoji: '🐦', normal: 'バサッと押し上げ', pts: 100, fn: (g, r) => { up(g, 0.6, 820); g.vx += (r() - 0.5) * 300; } },
    plane: { r: 26, emoji: '✈️', normal: '翼で滑走', pts: 200, fn: (g) => { g.vx += (g.vx >= 0 ? 1 : -1) * 380; up(g, 0.6, 620); } },
    balloon: { r: 22, emoji: '🎈', normal: '風船ジャンプ', pts: 150, fn: (g) => up(g, 0.55, 780) },
    satellite: { r: 24, emoji: '🛰️', normal: 'パネル反射', pts: 200, fn: (g, r) => { up(g, 0.6, 760); g.vx += (r() - 0.5) * 400; } },
    ufo: { r: 26, emoji: '🛸', normal: 'UFOトランポリン', pts: 250, fn: (g) => up(g, 0.6, 820) },
    comet: { r: 22, emoji: '☄️', normal: '彗星キック', pts: 200, fn: (g, r) => { up(g, 0.6, 760); g.vx += (r() - 0.5) * 500; } },
    moon: { r: 40, emoji: '🌕', normal: '月面バウンド', pts: 300, fn: (g) => up(g, 0.55, 950) },
    star: { r: 20, emoji: '⭐', normal: '流れ星キャッチ', pts: 250, fn: (g) => up(g, 0.6, 820) },
    blackhole: { r: 32, normal: '重力スイング', pts: 300, fn: (g) => { g.vx = -g.vx * 1.2; up(g, 0.6, 820); } },
    earth: { r: 70, emoji: '🌍', normal: '大気圏バウンド', pts: 200, fn: (g) => { g.vy = Math.abs(g.vy) * 0.3 + 540; } },
    rescue: { r: 60, normal: '', pts: 0, fn: () => {} },
  };
  const SPAWN = [
    [['cloud', 60], ['bird', 25], ['plane', 15]],
    [['bigcloud', 45], ['plane', 25], ['balloon', 20], ['bird', 10]],
    [['satellite', 35], ['ufo', 35], ['comet', 30]],
    [['star', 35], ['ufo', 30], ['moon', 20], ['blackhole', 15]],
  ];

  // 10 無厘頭 gags (v3.1 §1 points, §4 band pools, §6 behavior)
  const GAGS = {
    sneeze: { name: '雲のくしゃみ砲', pts: 300, art: '☁️', say: 'ハックショーン！', sfx: 'sneeze',
      a: '雲のくしゃみで吹き飛ばされ', b: '雲のくしゃみで空へ撃ち出された',
      fx(G) { const g = G.girl; g.vy = Math.max(g.vy, 300) * 1.6; } },
    tuna: { name: '飛行機マグロ', pts: 300, art: '🐟', say: 'マグロ便、出発！', sfx: 'whoosh',
      a: '飛行機マグロにはね飛ばされ', b: '飛行機マグロと並んで泳いだ',
      fx(G) { const g = G.girl; g.vx = (G.rng() < 0.5 ? -1 : 1) * 900; g.vy = Math.max(g.vy, 650); } },
    interview: { name: '宇宙人の面接', pts: 500, art: '👽', say: '志望動機は？', sfx: 'boom',
      a: '宇宙人に志望動機を聞かれ', b: '面接の椅子でロケット発射した',
      fx(G) { const g = G.girl; g.vx = (G.rng() < 0.5 ? -1 : 1) * 500; g.vy = 900; } },
    nap: { name: '巨漢の昼寝', pts: 500, art: null, say: 'グーグー…ボヨン！', sfx: 'boing',
      a: '昼寝中の巨漢のお腹で跳ね', b: '巨漢のお腹をトランポリンにした',
      fx(G) { const g = G.girl; g.vy = Math.max(g.vy, 400) * 1.4; } },
    meeting: { name: '宇宙人の会議', pts: 500, art: '👽', say: '議題：この子の進路', sfx: 'boing',
      a: '宇宙人の会議に乱入し', b: '会議机で弾き飛ばされた',
      fx(G) { const g = G.girl; const a = (15 + G.rng() * 150) * Math.PI / 180; g.vx = Math.cos(a) * 900; g.vy = Math.sin(a) * 900; } },
    toilet: { name: '宇宙トイレロケット', pts: 600, art: '🚽', say: 'ゴゴゴゴー！', sfx: 'rumble',
      a: '宇宙トイレに乗り込み', b: 'トイレのジェット噴射で飛んだ',
      fx(G) { const g = G.girl; g.vy = Math.max(g.vy, 300) * 2.0; } },
    sento: { name: 'ブラックホール銭湯', pts: 800, art: '♨️', say: 'いい湯だな〜', sfx: 'warp',
      a: 'ブラックホール銭湯でひとっ風呂浴び', b: 'ブラックホール銭湯からワープした',
      fx(G) { warpAhead(G); } },
    ramen: { name: '月面ラーメン', pts: 1000, art: '🍜', say: 'ズルズルズル！', sfx: 'slurp',
      a: '月にラーメンとしてすすられ', b: '月のラーメンに絡まった',
      fx(G) { const g = G.girl; g.vy = -900; g.vx *= 0.3; addObj(G, 'earth', g.x + g.vx * 1.4, g.y - 1500); } },
    pudding: { name: '地球プリン', pts: 1200, art: '🍮', say: 'ぷるるるん！', sfx: 'pudding',
      a: '地球プリンでぷるんと跳ね', b: '地球プリンに救われた',
      fx(G) { const g = G.girl; g.vy = 1400; } },
    reversal: { name: '立場逆転', pts: 2000, art: null, say: '今度は私の番！', sfx: 'boom',
      a: '巨漢を宇宙へ打ち上げ', b: '巨漢を打ち上げ返した',
      fx(G) { const g = G.girl; g.vy = Math.max(g.vy, 400) * 1.8; } },
  };
  const GAG_IDS = Object.keys(GAGS);
  const BAND_GAGS = [
    ['sneeze', 'nap', 'tuna'],
    ['sneeze', 'tuna', 'interview'],
    ['toilet', 'meeting', 'interview'],
    ['ramen', 'sento', 'reversal'],
  ];

  function pickW(rng, list) {
    let s = 0; for (const [, w] of list) s += w;
    let x = rng() * s;
    for (const [k, w] of list) { x -= w; if (x <= 0) return k; }
    return list[list.length - 1][0];
  }

  let OBJ_ID = 1;
  function addObj(G, kind, x, y, extra) {
    const o = Object.assign({ id: OBJ_ID++, kind, x, y, r: OBJ[kind].r, hit: false, close: false, nm: false, born: G.t, spin: G.rng() * 6.28 }, extra || {});
    G.objects.push(o);
    return o;
  }

  function warpAhead(G) {
    const g = G.girl;
    let best = null, bd = Infinity;
    for (const o of G.objects) {
      if (o.hit || o.kind === 'rescue') continue;
      const dy = o.y - g.y;
      if (dy > 500 && dy < bd) { bd = dy; best = o; }
    }
    if (!best) best = addObj(G, pickW(G.rng, SPAWN[bandOf(g.y + 800)]), g.x, g.y + 800);
    g.x = best.x; g.y = best.y - best.r - 110; g.vx = 0; g.vy = 650;
  }

  function capSpeed(g) {
    const s = Math.hypot(g.vx, g.vy);
    if (s > P.VMAX) { g.vx *= P.VMAX / s; g.vy *= P.VMAX / s; }
  }

  function create(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed >>> 0 : (Math.random() * 2 ** 32) >>> 0;
    const G = {
      seed, rng: mulberry32(seed), plays: opts.plays || 0,
      state: 'READY', stateT: 0, t: 0,
      gauge: 0, chargeT: 0, period: (opts.plays || 0) < 3 ? 1.6 : 1.2,
      grade: null, dens: 1, launchV: 0,
      girl: { x: 36, y: 50, vx: 0, vy: 0, rot: 0 },
      bigman: { x: -130, y: 250, vx: 0, vy: 0 },
      dome: { squash: 0 },
      objects: [], nextSpawnY: 0,
      combo: { n: 0, timer: 0, max: 0 },
      eventPts: 0, nearPts: 0, nearMisses: 0, collisions: 0,
      maxY: 0, distX: 0,
      gagStreak: 0, recent: [], log: [],
      stats: { lottery: 0, gagHits: 0, forced: 0 },
      lastChange: 0, lastC3: -1, guarantees: 0, wasUp: true, assistStreak: 0, lcUsed: false, descentT: 0, maxBand: 0,
      ev: null, fxq: [], result: null, endReason: null,
    };
    G.fx = (type, data) => G.fxq.push(Object.assign({ type }, data || {}));
    G.press = () => { if (G.state === 'READY') { G.state = 'CHARGE'; G.chargeT = 0; G.gauge = 0; G.fx('charge'); } };
    G.release = () => { if (G.state === 'CHARGE') launchWith(G, gradeOf(G.gauge)); };
    G.startWithGrade = (grade) => launchWith(G, grade);
    G.update = (dt) => update(G, dt);
    return G;
  }

  function launchWith(G, grade) {
    G.grade = grade;
    const gr = GRADES[grade];
    G.dens = gr.dens;
    G.launchV = P.LAUNCH_V * gr.coef;
    G.state = 'BIGFALL'; G.stateT = 0;
    G.fx('grade', { grade, label: gr.label });
    G.fx('sfx', { name: 'whoosh' });
  }

  function placeOnPath(G, kind, vx, vy, x0, y0, ys) {
    // put objects exactly on the ballistic path at given heights (guaranteed chances)
    for (const yy of ys) {
      const a = -0.5 * P.GRAV, b = vy, c = y0 - yy;
      const disc = b * b - 4 * a * c;
      if (disc < 0) continue;
      const tt = (-b + Math.sqrt(disc)) / (2 * a);
      const tHit = Math.min(tt, (-b - Math.sqrt(disc)) / (2 * a));
      const t1 = tHit > 0 ? tHit : tt;
      addObj(G, kind, x0 + vx * t1 + (G.rng() - 0.5) * 16, yy);
    }
  }

  function startFlight(G) {
    const g = G.girl, gr = GRADES[G.grade];
    const ang = (G.grade === 'PERFECT' ? 6 : (G.rng() * 2 - 1) * gr.spread) * Math.PI / 180;
    g.x = 36; g.y = 96;
    g.vx = Math.sin(ang) * G.launchV; g.vy = Math.cos(ang) * G.launchV;
    G.state = 'FLIGHT'; G.stateT = 0; G.t = 0; G.lastChange = 0;
    // v3.1 §2 最低保証: 2 guaranteed collision chances on the opening path
    const apex = g.y + g.vy * g.vy / (2 * P.GRAV);
    placeOnPath(G, 'cloud', g.vx, g.vy, g.x, g.y, [apex * 0.45, apex * 0.9]);
    G.nextSpawnY = apex * 0.9 + 300;
    G.fx('launch');
    G.fx('sfx', { name: 'boom' });
    G.fx('shake', { a: 14 });
  }

  function spawnAhead(G) {
    const g = G.girl;
    const limit = g.y + 950;
    while (G.nextSpawnY < limit) {
      const y = G.nextSpawnY, b = bandOf(y);
      const kind = pickW(G.rng, SPAWN[b]);
      const tReach = Math.max(0, (y - g.y) / Math.max(250, Math.abs(g.vy)));
      const x = g.x + g.vx * Math.min(1.5, tReach) + (G.rng() * 2 - 1) * 170;
      addObj(G, kind, x, y);
      const base = b === 3 ? 300 : b === 2 ? 270 : 230;
      G.nextSpawnY += base * (0.7 + G.rng() * 0.6) / G.dens;
    }
    if (G.objects.length > 160) G.objects = G.objects.filter((o) => Math.abs(o.y - g.y) < 4500);
  }

  function spawnAssist(G) {
    const g = G.girl;
    G.lastChange = G.t;
    const T = 1.1;
    const px = g.x + g.vx * T, py = g.y + g.vy * T - 0.5 * P.GRAV * T * T;
    if (G.assistStreak >= 2 || py < 120) { G.assistStreak = 0; G.fx('scenery'); return; }
    const kind = pickW(G.rng, SPAWN[bandOf(py)]);
    const r = OBJ[kind].r;
    const sp = Math.hypot(g.vx, g.vy) || 1;
    const nx = -g.vy / sp, ny = g.vx / sp;
    const off = (r + P.GIRL_R + 30) * (G.rng() < 0.5 ? -1 : 1);
    addObj(G, kind, px + nx * off, py + ny * off, { assist: true });
    G.assistStreak++;
  }

  function collide(G, o) {
    o.hit = true;
    const g = G.girl;
    G.collisions++;
    G.lastChange = G.t; G.assistStreak = 0;
    G.combo.n = G.combo.timer > 0 ? G.combo.n + 1 : 1;
    G.combo.timer = P.COMBO_WINDOW;
    G.combo.max = Math.max(G.combo.max, G.combo.n);
    if (G.combo.n >= 3) G.lastC3 = G.t;
    const mult = MULT(G.combo.n);

    let gag = null;
    if (G.gagStreak >= 2) { G.stats.forced++; G.gagStreak = 0; }
    else {
      G.stats.lottery++;
      if (G.rng() < P.GAG_RATE) {
        G.stats.gagHits++;
        gag = pickGag(G, o);
      }
      if (!gag) G.gagStreak = 0;
    }
    if (gag) {
      G.gagStreak++;
      const def = GAGS[gag];
      const pts = Math.min(def.pts * mult, P.EVENT_CAP);
      G.eventPts += pts;
      G.recent.push(gag); if (G.recent.length > 3) G.recent.shift();
      G.log.push({ id: gag, t: G.t, y: g.y, pts });
      G.ev = { gag, obj: o, dur: P.GAG_DUR, mult, pts, x: o.x, y: o.y };
      G.state = 'EVENT'; G.stateT = 0;
      G.fx('gag', { id: gag, name: def.name, say: def.say, pts, mult, combo: G.combo.n });
      G.fx('sfx', { name: def.sfx });
      G.fx('shake', { a: 10 });
    } else {
      const def = OBJ[o.kind];
      const pts = Math.min(def.pts * mult, P.EVENT_CAP);
      G.eventPts += pts;
      G.recent.push('n:' + o.kind); if (G.recent.length > 3) G.recent.shift();
      def.fn(g, G.rng);
      capSpeed(g);
      G.fx('hit', { name: def.normal, pts, mult, combo: G.combo.n, x: o.x, y: o.y, kind: o.kind });
      G.fx('sfx', { name: o.kind.includes('cloud') ? 'boing' : 'pop' });
    }
    if (G.combo.n >= 2) G.fx('sfx', { name: 'combo', n: G.combo.n });
  }

  function pickGag(G, o) {
    let pool = o.kind === 'earth' ? ['pudding'] : BAND_GAGS[bandOf(G.girl.y)];
    pool = pool.filter((id) => !G.recent.includes(id));
    if (!pool.length) return null;
    return pool[Math.floor(G.rng() * pool.length)];
  }

  function nearMiss(G, o) {
    G.nearMisses++;
    const add = Math.min(P.NEAR_PTS, P.NEAR_CAP - G.nearPts);
    G.nearPts += Math.max(0, add);
    G.lastChange = G.t;
    G.fx('near', { x: o.x, y: o.y, pts: add });
    G.fx('sfx', { name: 'near' });
  }

  function enterLC(G) {
    const g = G.girl;
    G.lcUsed = true;
    G.state = 'LC'; G.stateT = 0;
    G.lcCloud = addObj(G, 'rescue', g.x, Math.max(30, g.y - 110));
    G.fx('lastchance');
    G.fx('sfx', { name: 'silence' });
  }

  function relaunchLC(G) {
    const g = G.girl;
    const a = (G.rng() * 30 - 15) * Math.PI / 180;
    const V = G.launchV * 0.6;
    g.vx = Math.sin(a) * V; g.vy = Math.cos(a) * V;
    G.combo.timer = P.COMBO_WINDOW;
    G.state = 'FLIGHT'; G.lastChange = G.t; G.descentT = 0;
    // a few chances on the relaunch path
    placeOnPath(G, pickW(G.rng, SPAWN[bandOf(g.y)]), g.vx, g.vy, g.x, g.y, [g.y + 260, g.y + 560]);
    G.fx('sfx', { name: 'boom' });
    G.fx('shake', { a: 16 });
    G.fx('relaunch');
  }

  function finish(G, reason) {
    G.state = 'RESULT'; G.stateT = 0; G.endReason = reason;
    const H = toMeters(G.maxY), D = G.distX;
    const L = GRADES[G.grade].bonus;
    const B = G.nearPts;
    const score = Math.floor(H / 4) + Math.floor(D / 20) + G.eventPts + L + B;
    G.result = {
      score, H: Math.round(H), D: Math.round(D), L, B, eventPts: G.eventPts,
      maxCombo: G.combo.max, grade: G.grade, band: G.maxBand, lcUsed: G.lcUsed,
      gags: G.log.slice(), nearMisses: G.nearMisses, time: G.t, reason,
      heightShare: (Math.floor(H / 4) + L) / Math.max(1, score),
    };
    G.fx('result');
  }

  function update(G, dt) {
    const g = G.girl;
    G.stateT += dt;
    switch (G.state) {
      case 'READY': break;
      case 'CHARGE': {
        G.chargeT += dt;
        const ph = (G.chargeT % G.period) / G.period;
        G.gauge = (ph < 0.5 ? ph * 2 : 2 - ph * 2) * 100;
        break;
      }
      case 'BIGFALL': {
        const k = Math.min(1, G.stateT / 0.9);
        const bm = G.bigman;
        bm.x = -130 + (0 - -130) * k;
        bm.y = 250 + 120 * Math.sin(Math.PI * k) * (1 - k) * 2 - 200 * k * k;
        bm.y = Math.max(bm.y, 70);
        if (k >= 1) { G.state = 'SQUASH'; G.stateT = 0; G.fx('sfx', { name: 'boing' }); G.fx('shake', { a: 8 }); }
        break;
      }
      case 'SQUASH': {
        G.dome.squash = Math.sin(Math.min(1, G.stateT / 0.35) * Math.PI);
        if (G.stateT >= 0.35) { G.dome.squash = 0; startFlight(G); }
        break;
      }
      case 'FLIGHT': flight(G, dt); break;
      case 'EVENT': {
        G.t += dt;
        if (G.stateT >= G.ev.dur) {
          GAGS[G.ev.gag].fx(G);
          capSpeed(g);
          G.state = 'FLIGHT'; G.lastChange = G.t; G.descentT = 0;
          G.fx('gagEnd', { id: G.ev.gag });
          G.ev = null;
        }
        if (G.t >= P.MAX_TIME) finish(G, 'timeup');
        break;
      }
      case 'LC': {
        G.t += dt;
        g.x += g.vx * dt * 0.12; g.y += g.vy * dt * 0.12;
        if (G.stateT >= 0.6) relaunchLC(G);
        break;
      }
      case 'LANDING': if (G.stateT >= 1) finish(G, 'landed'); break;
      case 'RESULT': break;
    }
  }

  function flight(G, dt) {
    const g = G.girl;
    G.t += dt;
    G.descentT = g.vy < 0 ? G.descentT + dt : 0;
    const grav = P.GRAV * (G.descentT > 3 ? 2.6 : 1);
    g.vy -= grav * dt;
    g.vx *= 1 - 0.12 * dt;
    const px = g.x;
    g.x += g.vx * dt; g.y += g.vy * dt;
    G.distX += Math.abs(g.x - px);
    if (g.y > G.maxY) G.maxY = g.y;
    const b = bandOf(g.y);
    if (b > G.maxBand) { G.maxBand = b; G.lastChange = G.t; G.fx('band', { band: b }); G.fx('sfx', { name: 'band' }); }

    if (G.combo.timer > 0) { G.combo.timer -= dt; if (G.combo.timer <= 0) { G.combo.timer = 0; G.combo.n = 0; } }

    spawnAhead(G);

    for (const o of G.objects) {
      if (o.hit || o.kind === 'rescue') continue;
      const d = Math.hypot(o.x - g.x, o.y - g.y);
      if (d < o.r + P.GIRL_R) { collide(G, o); if (G.state !== 'FLIGHT') return; continue; }
      if (!o.nm) {
        if (d < o.r + P.GIRL_R + P.NEAR_MARGIN) o.close = true;
        else if (o.close) { o.nm = true; nearMiss(G, o); }
      }
    }

    // v3.1 §2 最低保証: if the first ascent peaks under 1,500m, put one cloud on the path
    const turning = G.wasUp && g.vy < 0;
    G.wasUp = g.vy >= 0;
    if (turning && G.guarantees < 2 && toMeters(G.maxY) < 1600) {
      G.guarantees++;
      {
        const T = 0.7;
        addObj(G, 'bigcloud', g.x + g.vx * T, g.y + g.vy * T - 0.5 * P.GRAV * T * T);
      }
    }

    if (G.t - G.lastChange > P.ASSIST_AFTER) spawnAssist(G);

    if (g.vy < 0 && toMeters(g.y) < 1500 && G.lastC3 >= 0 && G.t - G.lastC3 <= P.LC_COMBO_RECENT && !G.lcUsed && G.t < P.LC_TIME_LIMIT) { enterLC(G); return; }

    if (g.y <= 0) {
      g.y = 0; g.vy = 0; g.vx = 0;
      G.state = 'LANDING'; G.stateT = 0;
      G.fx('land'); G.fx('sfx', { name: 'land' }); G.fx('shake', { a: 12 });
      return;
    }
    if (G.t >= P.MAX_TIME) finish(G, 'timeup');
  }

  // ---- v3.0 §9 result story & next goal ----
  function story(r) {
    const fmt = (n) => n.toLocaleString('ja-JP');
    const uniq = [];
    for (const e of r.gags) if (!uniq.find((u) => u.id === e.id)) uniq.push(e);
    const top = uniq.slice().sort((a, b) => GAGS[b.id].pts - GAGS[a.id].pts).slice(0, 2).sort((a, b) => a.t - b.t);
    if (top.length === 2) return `${GAGS[top[0].id].a}、${GAGS[top[1].id].b}少女`;
    if (top.length === 1) {
      if (r.lcUsed) return `${GAGS[top[0].id].a}、ラストチャンスで生還した少女`;
      return `${GAGS[top[0].id].b}少女`;
    }
    if (r.nearMisses >= 3) return `ニアミス${r.nearMisses}回をすり抜け、高度${fmt(r.H)}mまで飛んだ少女`;
    if (r.maxCombo >= 3) return `${r.maxCombo}回連続でぶつかりまくり、高度${fmt(r.H)}mに届いた少女`;
    return `高度${fmt(r.H)}mまで飛んだ、伸びしろしかない少女`;
  }

  function nextGoal(r, prevBest, seenCount) {
    const fmt = (n) => n.toLocaleString('ja-JP');
    if (prevBest && prevBest.score > 0 && r.score < prevBest.score && prevBest.score - r.score <= prevBest.score * 0.15)
      return `あと${fmt(prevBest.score - r.score + 1)}点で自己ベスト！`;
    if (prevBest && prevBest.combo === r.maxCombo + 1) return 'あと1コンボで最大コンボ記録！';
    if (r.grade !== 'PERFECT') return 'ゲージ90%付近で離して PERFECT 発射を狙おう';
    if (r.band < 3) { const nb = BANDS[r.band + 1]; return `${nb.name}（${fmt(nb.m0)}m）まで、あと${fmt(Math.max(1, nb.m0 - r.H))}m`; }
    const tier = COMBO_TIERS.find((t) => t > r.maxCombo);
    if (tier) return `次はコンボ×${tier}を狙おう`;
    return `珍事件図鑑、まだ見ぬ事件があと${10 - seenCount}種`;
  }

  root.FRK = { create, P, BANDS, GAGS, GAG_IDS, OBJ, GRADES, MULT, bandOf, toMeters, gradeOf, story, nextGoal, mulberry32 };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* ふわふわロケット KING — renderer, input, audio, UI */
(function () {
  'use strict';
  const FRK = window.FRK;
  const W = 360, H = 640, STEP = 1 / 60;
  const app = document.getElementById('app');
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const titleEl = document.getElementById('title');
  const resultEl = document.getElementById('result');
  const pauseEl = document.getElementById('pause');
  const muteBtn = document.getElementById('mute');
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const DISPLAY = '"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
  const UI = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  const fmt = (n) => Math.round(n).toLocaleString('ja-JP');

  // ---------- storage ----------
  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  let best = load('frk.best', { score: 0, alt: 0, combo: 0 });
  let plays = load('frk.plays', 0);
  const seen = new Set(load('frk.seen', []));
  const debug = /debug/.test(location.hash);
  const seedMatch = /seed(\d+)/.exec(location.hash);

  // ---------- sizing ----------
  let dpr = 1, scale = 1;
  function resize() {
    const aw = app.clientWidth, ah = app.clientHeight;
    const w = Math.max(200, Math.min(aw, ah * 9 / 16)), h = w * 16 / 9;
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.fontSize = (w / 360 * 16) + 'px';
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    scale = w / W;
  }
  window.addEventListener('resize', resize);

  // ---------- audio (Web Audio synth) ----------
  const AU = { ctx: null, master: null, muted: load('frk.muted', false), noise: null, el: null, voice: null };
  const VOL = 0.9;
  // tiny silent WAV: playing it through an <audio> element moves iOS into the "playback"
  // audio category, so Web Audio is heard even when the ringer switch is on silent
  const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  function unlockAudio() {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    } catch (e) { /* Safari 17+ only */ }
    try {
      if (!AU.el) {
        AU.el = new Audio(SILENT_WAV);
        AU.el.loop = true; AU.el.setAttribute('playsinline', '');
        AU.el.volume = 0.01;
      }
      if (AU.el.paused) { const p = AU.el.play(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) { /* optional */ }
    try {
      if (!AU.ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        AU.ctx = new C();
        const comp = AU.ctx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.ratio.value = 6;
        AU.master = AU.ctx.createGain();
        AU.master.gain.value = VOL;
        AU.master.connect(comp); comp.connect(AU.ctx.destination);
      }
      if (AU.ctx.state !== 'running') { const p = AU.ctx.resume(); if (p && p.catch) p.catch(() => {}); }
      // play a short silent buffer inside the gesture (older iOS unlock)
      const b = AU.ctx.createBuffer(1, 1, 22050), s = AU.ctx.createBufferSource();
      s.buffer = b; s.connect(AU.ctx.destination); s.start(0);
    } catch (e) { /* audio optional */ }
    primeVoice();
  }
  // every gesture event that can grant audio permission (touch only counts on pointerup/touchend)
  ['pointerdown', 'pointerup', 'touchend', 'mousedown', 'click', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));

  window.__frkAudioState = () => (AU.ctx ? AU.ctx.state : 'none') + (AU.el ? (AU.el.paused ? '/el-paused' : '/el-playing') : '');
  // ---------- voice (speech synthesis reads the 擬音 aloud) ----------
  let voicePrimed = false;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang));
      AU.voice = vs.find((v) => /Kyoko|Nanami|Haruka|Google/i.test(v.name)) || vs[0] || null;
    } catch (e) { AU.voice = null; }
  }
  if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { /* */ } }
  function primeVoice() {
    if (voicePrimed || !('speechSynthesis' in window)) return;
    voicePrimed = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* */ }
  }
  function say(text, pitch, rate) {
    if (AU.muted || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; if (AU.voice) u.voice = AU.voice;
      u.pitch = pitch || 1.4; u.rate = rate || 1.15; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { /* */ }
  }
  function osc(type, f0, f1, dur, vol, delay) {
    const c = AU.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function vibrato(o, rate, depth, dur) {
    const c = AU.ctx, l = c.createOscillator(), lg = c.createGain();
    l.frequency.value = rate; lg.gain.value = depth; l.connect(lg); lg.connect(o.frequency);
    l.start(); l.stop(c.currentTime + dur);
  }
  function noise(dur, vol, ftype, f0, f1, delay, q) {
    const c = AU.ctx;
    if (!AU.noise) {
      AU.noise = c.createBuffer(1, c.sampleRate * 1.5, c.sampleRate);
      const d = AU.noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = AU.noise;
    const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t + dur + 0.05);
  }
  const SFX = {
    whoosh() { noise(0.9, 0.45, 'bandpass', 2600, 300, 0, 2); osc('sine', 1300, 280, 0.9, 0.1); },
    boing() { vibrato(osc('sine', 230, 90, 0.65, 0.5), 13, 35, 0.7); },
    boom() { noise(0.6, 0.8, 'lowpass', 1400, 80); osc('sine', 120, 35, 0.6, 0.7); },
    pop() { osc('triangle', 700, 1150, 0.12, 0.35); },
    near() { osc('sine', 1600, 2400, 0.09, 0.13); },
    combo(n) { osc('square', 440 * Math.pow(2, Math.min(n, 16) / 12), 0, 0.14, 0.16); },
    sneeze() { noise(0.16, 0.35, 'highpass', 2500, 0, 0, 1); noise(0.55, 0.7, 'bandpass', 5200, 1300, 0.24, 1.4); },
    slurp() { for (let i = 0; i < 4; i++) noise(0.16, 0.38, 'bandpass', 500, 2000, i * 0.17, 7); },
    rumble() { osc('sawtooth', 55, 42, 1.0, 0.3); noise(1.0, 0.45, 'lowpass', 500, 180); },
    warp() { osc('sine', 200, 1700, 0.7, 0.28); osc('sine', 300, 2500, 0.7, 0.12, 0.06); },
    pudding() { vibrato(osc('sine', 320, 150, 0.85, 0.5), 9, 45, 0.9); },
    band() { [523, 659, 784].forEach((f, i) => osc('triangle', f, 0, 0.2, 0.16, i * 0.09)); },
    land() { osc('sine', 90, 40, 0.35, 0.6); noise(0.3, 0.4, 'lowpass', 700, 100); },
    silence() { if (!AU.master) return; const t = AU.ctx.currentTime; AU.master.gain.cancelScheduledValues(t); AU.master.gain.setValueAtTime(0.0001, t); AU.master.gain.setValueAtTime(VOL, t + 0.55); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => osc('square', f, 0, i === 3 ? 0.5 : 0.14, 0.12, i * 0.12)); },
    tap() { osc('triangle', 520, 640, 0.07, 0.15); },
  };
  function sfx(name, arg) {
    if (!AU.ctx || AU.muted || !SFX[name]) return;
    try { SFX[name](arg); } catch (e) { /* ignore */ }
  }
  function setMuteLabel() {
    muteBtn.setAttribute('aria-pressed', AU.muted ? 'true' : 'false');
    muteBtn.querySelector('span').textContent = AU.muted ? '音 OFF' : '音 ON';
  }

  // ---------- game & visual state ----------
  let G, cam, pops, parts, banners, shake, flash, decor, gagT, resultAt, lastFxGag, prevBest;
  function newGame() {
    G = FRK.create({ plays, seed: seedMatch ? +seedMatch[1] : undefined });
    cam = { x: -40, y: 210, z: 1 };
    pops = []; parts = []; banners = []; decor = [];
    shake = 0; flash = 0; gagT = 0; resultAt = 0; lastFxGag = null;
    resultEl.hidden = true;
    titleEl.hidden = false;
    document.getElementById('title-best').textContent = best.score > 0 ? `自己ベスト ${fmt(best.score)}点・${fmt(best.alt)}m` : '巨漢が落ちると、少女が飛ぶ';
  }

  function banner(text, sub, color, dur, size) { banners.push({ text, sub, color, t: 0, dur: dur || 1.4, size: size || 30 }); }
  function pop(x, y, text, color, size) { pops.push({ x, y, text, color: color || '#fff', size: size || 15, t: 0 }); }
  function burst(x, y, n, colors, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * (speed || 220);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.5, t: 0, c: colors[i % colors.length], r: 2 + Math.random() * 3 });
    }
  }

  const GRADE_COLOR = { PERFECT: '#ffcf3f', GREAT: '#7cf3c6', GOOD: '#9fd6ff', MISS: '#ffb1c8' };

  function handleFx() {
    for (const f of G.fxq) {
      switch (f.type) {
        case 'sfx': sfx(f.name, f.n); break;
        case 'shake': shake = Math.max(shake, f.a); break;
        case 'grade': say('ヒューーー！', 1.2, 1.1); banner(f.label, f.grade === 'PERFECT' ? '最高の踏み切り！' : f.grade === 'MISS' ? 'それでも飛ぶ！' : 'いい感じ！', GRADE_COLOR[f.grade], 1.2, 36); titleEl.hidden = true; break;
        case 'launch': say('ドカーン！', 1.1, 1.3); flash = 0.35; burst(30, 60, 26, ['#ffcf3f', '#ff5fa8', '#fff'], 340); break;
        case 'hit': {
          pop(f.x, f.y, `${f.name} +${fmt(f.pts)}`, '#fff', 14);
          burst(f.x, f.y, 10, f.kind.includes('cloud') ? ['#fff', '#dff3ff'] : ['#ffe27a', '#fff'], 180);
          break;
        }
        case 'near': pop(f.x, f.y, f.pts > 0 ? `ヒヤッ！ +${f.pts}` : 'ヒヤッ！', '#9ff7ff', 13); break;
        case 'gag': {
          gagT = 0; lastFxGag = f; say(f.say, 1.5, 1.2);
          if (!seen.has(f.id)) { seen.add(f.id); save('frk.seen', [...seen]); f.isNew = true; }
          break;
        }
        case 'gagEnd': { const e = G.girl; burst(e.x, e.y, 20, ['#ffcf3f', '#ff5fa8', '#7cf3c6', '#fff'], 300); break; }
        case 'band': {
          const b = FRK.BANDS[f.band];
          banner(`${b.name} 突入！`, `${fmt(b.m0)}m`, '#fff', 1.6, 32);
          break;
        }
        case 'scenery': decor.push({ t: 0, kind: G.girl.y > 7000 ? 'meteor' : 'flock', side: Math.random() < 0.5 ? -1 : 1 }); break;
        case 'lastchance': flash = 0.25; setTimeout(() => say('ラストチャンス！', 1.3, 1.25), 150); break;
        case 'relaunch': flash = 0.4; burst(G.girl.x, G.girl.y, 30, ['#ffcf3f', '#fff', '#ff5fa8'], 380); break;
        case 'land': say('ずしーん', 0.8, 1.1); burst(G.girl.x, 10, 24, ['#c7a77a', '#9ccf6a', '#fff'], 200); banner('着地！', '', '#fff', 1, 30); break;
        case 'result': showResult(); break;
      }
    }
    G.fxq.length = 0;
  }

  // ---------- camera & visuals tick ----------
  function tickVisual(dt) {
    const g = G.girl;
    let tx, ty, tz = 1;
    const pre = G.state === 'READY' || G.state === 'CHARGE' || G.state === 'BIGFALL' || G.state === 'SQUASH';
    if (pre) { tx = -40; ty = 210; }
    else {
      tx = g.x; ty = g.y + Math.max(-150, Math.min(200, g.vy * 0.22));
      const sp = Math.hypot(g.vx, g.vy);
      tz = sp > 1200 ? 0.8 : 1;
      if (G.state === 'EVENT') { tz = 1.22; tx = (g.x + G.ev.x) / 2; ty = (g.y + G.ev.y) / 2; }
      if (G.state === 'LC') tz = 1.2;
    }
    const k = 1 - Math.exp(-dt * (pre ? 4 : 7));
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * (1 - Math.exp(-dt * 4));
    const minY = (H / 2 - 92) / cam.z;
    if (cam.y < minY) cam.y = minY;

    if (G.state === 'FLIGHT' && Math.random() < 0.6) parts.push({ x: g.x + (Math.random() - 0.5) * 8, y: g.y - 10, vx: -g.vx * 0.05, vy: -g.vy * 0.05, life: 0.5, t: 0, c: Math.random() < 0.5 ? '#ffcf3f' : '#ffffff', r: 2.5, star: true });
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of pops) { p.t += dt; p.y += 50 * dt; }
    pops = pops.filter((p) => p.t < 1.1);
    for (const b of banners) b.t += dt;
    banners = banners.filter((b) => b.t < b.dur);
    for (const d of decor) d.t += dt;
    decor = decor.filter((d) => d.t < 2.2);
    shake *= Math.exp(-dt * 9); if (shake < 0.2) shake = 0;
    flash = Math.max(0, flash - dt);
    gagT += dt;
    for (const o of G.objects) if (o.hit) o.fade = Math.max(0, (o.fade == null ? 1 : o.fade) - dt * 2.5);
  }

  // ---------- drawing helpers ----------
  const sx = (x) => W / 2 + (x - cam.x) * cam.z;
  const sy = (y) => H / 2 - (y - cam.y) * cam.z;
  function hash(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(c1, c2, t) { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; }
  const SKY = [[0, '#86cdfb', '#e4f6ff'], [2000, '#4fa6f2', '#bde4ff'], [20000, '#2a3c9c', '#7088d6'], [60000, '#141859', '#2c2a7a'], [100000, '#0d0832', '#2b1059'], [400000, '#06021a', '#45114f']];
  function skyAt(m) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const a = SKY[i], b = SKY[i + 1];
      if (m <= b[0]) { const t = (m - a[0]) / (b[0] - a[0]); return [mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
    }
    const l = SKY[SKY.length - 1]; return [l[1], l[2]];
  }

  function txt(s, x, y, size, color, opts) {
    opts = opts || {};
    ctx.font = `${opts.weight || ''} ${size}px ${opts.font || DISPLAY}`;
    ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
    if (opts.stroke !== false) { ctx.lineJoin = 'round'; ctx.lineWidth = opts.lw || Math.max(3, size * 0.18); ctx.strokeStyle = opts.stroke || 'rgba(29,26,58,.92)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function drawCloud(x, y, r, color, shade) {
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.35, r * 1.25, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - r * 0.6, y + r * 0.1, r * 0.55, 0, Math.PI * 2);
    ctx.arc(x, y - r * 0.15, r * 0.72, 0, Math.PI * 2);
    ctx.arc(x + r * 0.62, y + r * 0.08, r * 0.52, 0, Math.PI * 2);
    ctx.ellipse(x, y + r * 0.25, r * 1.15, r * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGirl(x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    // pigtails
    ctx.fillStyle = '#5a2e1d';
    ctx.beginPath(); ctx.ellipse(-12, -10, 5, 8, -0.6, 0, Math.PI * 2); ctx.ellipse(12, -10, 5, 8, 0.6, 0, Math.PI * 2); ctx.fill();
    // dress
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath(); ctx.moveTo(-9, 2); ctx.lineTo(9, 2); ctx.lineTo(13, 20); ctx.lineTo(-13, 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-13, 17, 26, 3);
    // arms up
    ctx.strokeStyle = '#ffd6b5'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(-15, -6); ctx.moveTo(8, 5); ctx.lineTo(15, -6); ctx.stroke();
    // legs
    ctx.beginPath(); ctx.moveTo(-5, 20); ctx.lineTo(-6, 27); ctx.moveTo(5, 20); ctx.lineTo(6, 27); ctx.stroke();
    // head
    ctx.fillStyle = '#ffd6b5'; ctx.beginPath(); ctx.arc(0, -8, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a2e1d'; ctx.beginPath(); ctx.arc(0, -11, 9.8, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.fillStyle = '#1d1a3a'; ctx.beginPath(); ctx.arc(-3.5, -7, 1.4, 0, Math.PI * 2); ctx.arc(3.5, -7, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8fa8'; ctx.beginPath(); ctx.arc(-6, -4, 1.8, 0, Math.PI * 2); ctx.arc(6, -4, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1d1a3a'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(0, -4, 2.6, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.restore();
  }

  function drawBigman(x, y, s, pose, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s);
    const asleep = pose === 'sleep';
    ctx.strokeStyle = '#f2b98f'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    if (pose === 'fall' || pose === 'fly') { ctx.moveTo(-24, -6); ctx.lineTo(-34, -30); ctx.moveTo(24, -6); ctx.lineTo(34, -30); }
    else { ctx.moveTo(-26, -2); ctx.lineTo(-34, 12); ctx.moveTo(26, -2); ctx.lineTo(34, 12); }
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, 26); ctx.lineTo(-14, 38); ctx.moveTo(12, 26); ctx.lineTo(14, 38); ctx.stroke();
    ctx.fillStyle = '#f2b98f'; ctx.beginPath(); ctx.ellipse(0, 4, 30, 28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 6, 25, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d5bd9'; ctx.beginPath(); ctx.ellipse(0, 22, 26, 9, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#f2b98f'; ctx.beginPath(); ctx.arc(0, -30, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1d1a3a'; ctx.fillRect(-10, -44, 20, 5);
    ctx.strokeStyle = '#1d1a3a'; ctx.lineWidth = 2;
    if (asleep) { ctx.beginPath(); ctx.moveTo(-8, -31); ctx.lineTo(-3, -31); ctx.moveTo(3, -31); ctx.lineTo(8, -31); ctx.stroke(); }
    else { ctx.fillStyle = '#1d1a3a'; ctx.beginPath(); ctx.arc(-5, -31, 2, 0, Math.PI * 2); ctx.arc(5, -31, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath();
    if (pose === 'fall') { ctx.ellipse(0, -23, 3.5, 4, 0, 0, Math.PI * 2); ctx.stroke(); }
    else { ctx.arc(0, -25, 4, 0.2, Math.PI - 0.2); ctx.stroke(); }
    ctx.fillStyle = '#ff9a8a'; ctx.beginPath(); ctx.arc(-9, -26, 2.5, 0, Math.PI * 2); ctx.arc(9, -26, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawDome(squash) {
    const x = sx(0), y = sy(0), z = cam.z;
    const w = 92 * (1 + squash * 0.25) * z, h = 82 * (1 - squash * 0.45) * z;
    ctx.fillStyle = 'rgba(29,26,58,.18)'; ctx.beginPath(); ctx.ellipse(x, y + 4 * z, w * 1.05, 10 * z, 0, 0, Math.PI * 2); ctx.fill();
    const gr = ctx.createLinearGradient(0, y - h, 0, y);
    gr.addColorStop(0, '#ffb5da'); gr.addColorStop(1, '#ff5fa8');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - w * 0.35, y - h * 0.62, w * 0.22, h * 0.14, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2 * z;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x, y, w * i / 4, h, 0, Math.PI, 0); ctx.stroke(); }
  }

  function drawTower() {
    const x = sx(-130), top = sy(222), bot = sy(0), z = cam.z;
    ctx.fillStyle = '#8a6a52'; ctx.fillRect(x - 26 * z, top, 52 * z, bot - top);
    ctx.fillStyle = '#6e523f';
    for (let yy = top + 18 * z; yy < bot; yy += 26 * z) ctx.fillRect(x - 26 * z, yy, 52 * z, 3 * z);
    ctx.fillStyle = '#ffcf3f'; ctx.fillRect(x - 34 * z, top - 6 * z, 68 * z, 8 * z);
    ctx.fillStyle = '#1d1a3a'; ctx.beginPath(); ctx.moveTo(x - 30 * z, top - 6 * z); ctx.lineTo(x - 30 * z, top - 46 * z); ctx.lineTo(x - 6 * z, top - 38 * z); ctx.lineTo(x - 30 * z, top - 30 * z); ctx.fill();
  }

  function drawObj(o) {
    const x = sx(o.x), y = sy(o.y), z = cam.z, r = o.r * z;
    if (y < -120 || y > H + 120 || x < -120 || x > W + 120) return;
    const a = o.hit ? (o.fade == null ? 1 : o.fade) : 1;
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    if (o.hit) { ctx.translate(x, y); ctx.scale(1 + (1 - a) * 0.6, 1 + (1 - a) * 0.6); ctx.translate(-x, -y); }
    const k = o.kind;
    if (k === 'cloud' || k === 'bigcloud') drawCloud(x, y, r, '#ffffff', 'rgba(120,170,220,.35)');
    else if (k === 'rescue') {
      const gl = ctx.createRadialGradient(x, y, 0, x, y, r * 1.8); gl.addColorStop(0, 'rgba(255,207,63,.55)'); gl.addColorStop(1, 'rgba(255,207,63,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      drawCloud(x, y, r, '#fff3c4', 'rgba(255,170,40,.4)');
      txt('救済雲', x, y + 4, 13, '#8a5a00', { font: UI, weight: '800', stroke: false });
    } else if (k === 'blackhole') {
      const t = performance.now() / 1000;
      const gr = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.6);
      gr.addColorStop(0, '#000'); gr.addColorStop(0.45, '#12021f'); gr.addColorStop(0.7, 'rgba(170,80,255,.6)'); gr.addColorStop(1, 'rgba(170,80,255,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,120,.8)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(x, y, r * (1 + i * 0.18), r * 0.35, t * (0.8 + i * 0.3) + i, 0.2, 2.6); ctx.stroke(); }
    } else {
      const em = FRK.OBJ[k].emoji;
      const bob = Math.sin(performance.now() / 400 + o.spin) * 3 * z;
      ctx.font = `${Math.round(r * 2.05)}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (k === 'plane' && o.x < G.girl.x) { ctx.save(); ctx.translate(x, y + bob); ctx.scale(-1, 1); ctx.fillText(em, 0, 0); ctx.restore(); }
      else ctx.fillText(em, x, y + bob);
    }
    ctx.restore();
  }

  function drawBackground() {
    const m = FRK.toMeters(Math.max(0, cam.y));
    const [top, bot] = skyAt(m);
    const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    ctx.fillStyle = gr; ctx.fillRect(-20, -20, W + 40, H + 40);
    // stars
    const sa = Math.min(1, Math.max(0, (m - 12000) / 30000));
    if (sa > 0) {
      const p = 0.25, ox = cam.x * p, oy = cam.y * p, cell = 46;
      const cx0 = Math.floor((ox - W / 2) / cell), cy0 = Math.floor((oy - H / 2) / cell);
      for (let i = cx0 - 1; i < cx0 + W / cell + 2; i++) for (let j = cy0 - 1; j < cy0 + H / cell + 2; j++) {
        const h1 = hash(i, j); if (h1 > 0.55) continue;
        const px = W / 2 + (i * cell + hash(j, i) * cell - ox), py = H / 2 - (j * cell + hash(i + 7, j) * cell - oy);
        const tw = 0.6 + 0.4 * Math.sin(performance.now() / 500 + h1 * 40);
        ctx.fillStyle = `rgba(255,255,255,${sa * tw * (0.4 + h1)})`;
        ctx.fillRect(px, py, 1.6 + h1 * 1.6, 1.6 + h1 * 1.6);
      }
    }
    // far planets in galaxy
    if (m > 100000) {
      const a = Math.min(1, (m - 100000) / 40000);
      ctx.globalAlpha = a * 0.8;
      const px = W * 0.78 - (cam.x * 0.05) % 40, py = 150 + ((cam.y * 0.04) % 700) - 200;
      ctx.fillStyle = '#ff9f6b'; ctx.beginPath(); ctx.arc(px, py, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffd9a8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(px, py, 44, 9, -0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // parallax clouds
    const ca = Math.max(0, 1 - m / 16000);
    if (ca > 0) {
      const p = 0.45, ox = cam.x * p, oy = cam.y * p, cw = 190, ch = 170;
      const cx0 = Math.floor((ox - W / 2) / cw), cy0 = Math.floor((oy - H / 2) / ch);
      ctx.globalAlpha = 0.45 * ca;
      for (let i = cx0 - 1; i < cx0 + W / cw + 2; i++) for (let j = Math.max(1, cy0 - 1); j < cy0 + H / ch + 2; j++) {
        if (hash(i, j) > 0.5) continue;
        const px = W / 2 + (i * cw + hash(j, i) * cw - ox), py = H / 2 - (j * ch + hash(i + 3, j) * ch - oy);
        drawCloud(px, py, 18 + hash(i, j + 9) * 22, '#ffffff', 'rgba(255,255,255,0)');
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawGround() {
    const y = sy(0);
    if (y > H + 10) return;
    ctx.fillStyle = '#9fd56a'; ctx.fillRect(-20, y, W + 40, H - y + 40);
    ctx.fillStyle = '#7cbf4c'; ctx.fillRect(-20, y, W + 40, 6 * cam.z);
    ctx.fillStyle = '#c3e889';
    for (let i = -4; i < 8; i++) { const gx = sx(i * 90 + 20) % (W + 90); ctx.beginPath(); ctx.ellipse(sx(i * 90), y + 26 * cam.z, 28 * cam.z, 6 * cam.z, 0, 0, Math.PI * 2); ctx.fill(); void gx; }
  }

  function drawDecor() {
    for (const d of decor) {
      const k = d.t / 2.2;
      if (d.kind === 'flock') {
        ctx.font = `20px ${EMOJI}`; ctx.textAlign = 'center';
        for (let i = 0; i < 5; i++) ctx.fillText('🐦', d.side < 0 ? lerp(-40, W + 40, k) - i * 26 : lerp(W + 40, -40, k) + i * 26, 170 + i * 14 + Math.sin(k * 10 + i) * 6);
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) { const x0 = lerp(W + 30, -60, k) + i * 70, y0 = lerp(80, 360, k) + i * 40; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + 50, y0 - 30); ctx.stroke(); }
      }
    }
  }

  function bubble(x, y, text) {
    ctx.font = `800 15px ${UI}`;
    const w = ctx.measureText(text).width + 22, h = 32;
    x = Math.max(w / 2 + 8, Math.min(W - w / 2 - 8, x));
    ctx.fillStyle = '#fffaf2'; ctx.strokeStyle = '#1d1a3a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, y + h / 2 - 1); ctx.lineTo(x, y + h / 2 + 9); ctx.lineTo(x + 6, y + h / 2 - 1); ctx.fill();
    ctx.fillStyle = '#1d1a3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
  }

  function easeBack(t) { const c = 1.7; t = Math.min(1, t); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  function drawGagScene() {
    if (G.state !== 'EVENT' || !G.ev) return;
    const ev = G.ev, def = FRK.GAGS[ev.gag];
    const t = G.stateT, k = easeBack(t / 0.28);
    const ox = sx(ev.x), oy = sy(ev.y), gx = sx(G.girl.x), gy = sy(G.girl.y);
    ctx.fillStyle = 'rgba(20,10,50,.18)'; ctx.fillRect(0, 0, W, H);
    // radial burst lines
    ctx.save(); ctx.translate(ox, oy); ctx.rotate(t * 0.6);
    ctx.fillStyle = 'rgba(255,230,120,.22)';
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, 260); ctx.lineTo(18, 260); ctx.fill(); }
    ctx.restore();
    const wob = Math.sin(t * 18) * 0.06;
    if (ev.gag === 'nap') {
      drawCloud(ox, oy + 18, 46 * cam.z, '#fff', 'rgba(120,170,220,.35)');
      drawBigman(ox, oy - 16 + Math.sin(t * 6) * 3, 0.9 * k, 'sleep', Math.PI / 2 * 0.95);
      txt('Zzz', ox + 46, oy - 50 - t * 20, 18, '#fff', { font: UI, weight: '900' });
    } else if (ev.gag === 'reversal') {
      drawBigman(gx + 10, gy - 30 - t * t * 160, 0.85, 'fly', t * 3);
    } else if (ev.gag === 'ramen') {
      ctx.font = `${Math.round(64 * k)}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🌕', ox, oy - 10);
      ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); for (let s = 0; s <= 1.001; s += 0.05) { const xx = lerp(ox - 8 + i * 5, gx, s) + Math.sin(s * 14 + t * 10 + i) * 7, yy = lerp(oy + 14, gy, s); s === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); } ctx.stroke(); }
      ctx.font = `${Math.round(40 * k)}px ${EMOJI}`; ctx.fillText('🍜', ox + 34, oy + 26);
    } else {
      ctx.save(); ctx.translate(ox, oy); ctx.rotate(wob); ctx.scale(k, k);
      ctx.font = `64px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.art, 0, 0);
      if (ev.gag === 'sneeze') { ctx.fillStyle = '#1d1a3a'; ctx.beginPath(); ctx.arc(-9, 2, 3, 0, 7); ctx.arc(9, 2, 3, 0, 7); ctx.fill(); }
      if (ev.gag === 'meeting' || ev.gag === 'interview') { ctx.font = `34px ${EMOJI}`; ctx.fillText(ev.gag === 'meeting' ? '👽👽' : '🪑', 0, 46); }
      if (ev.gag === 'toilet') { for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#ffcf3f' : '#ff7a3f'; ctx.beginPath(); ctx.arc((Math.random() - 0.5) * 22, 40 + Math.random() * 30, 6 + Math.random() * 6, 0, 7); ctx.fill(); } }
      ctx.restore();
    }
    drawGirl(gx, gy, 1.15 * cam.z, Math.sin(t * 20) * 0.25);
    if (t > 0.15) bubble(gx, Math.max(60, gy - 62), def.say);
    // headline
    const hk = easeBack(t / 0.25);
    ctx.save(); ctx.translate(W / 2, 128); ctx.scale(hk, hk); ctx.rotate(-0.04);
    ctx.fillStyle = '#ffcf3f'; ctx.strokeStyle = '#1d1a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-58, -48, 116, 24, 12); ctx.fill(); ctx.stroke();
    txt('無厘頭イベント', 0, -35, 13, '#1d1a3a', { font: UI, weight: '900', stroke: false });
    txt(def.name, 0, -2, 28, '#fff');
    txt(`+${fmt(ev.pts)}${ev.mult > 1 ? `（×${ev.mult}）` : ''}`, 0, 30, 18, '#ffcf3f');
    if (lastFxGag && lastFxGag.isNew) txt('図鑑に新登録！', 0, 54, 12, '#7cf3c6', { font: UI, weight: '900' });
    ctx.restore();
  }

  function drawHUD() {
    const g = G.girl;
    const flying = !['READY', 'CHARGE', 'BIGFALL', 'SQUASH', 'RESULT'].includes(G.state);
    if (flying || G.state === 'RESULT') {
      const m = FRK.toMeters(g.y);
      txt(fmt(m), 16, 34, 28, '#fff', { align: 'left' });
      ctx.font = `28px ${DISPLAY}`; const w = ctx.measureText(fmt(m)).width;
      txt('m', 20 + w, 40, 15, '#fff', { align: 'left' });
      const b = FRK.BANDS[FRK.bandOf(g.y)];
      ctx.fillStyle = 'rgba(29,26,58,.55)'; ctx.beginPath(); ctx.roundRect(14, 54, 58, 20, 10); ctx.fill();
      txt(b.name, 43, 64.5, 12, '#fff', { font: UI, weight: '800', stroke: false });
      if (G.t > 80 && G.state !== 'RESULT') txt(`残り${Math.max(0, Math.ceil(90 - G.t))}秒`, 16, 92, 14, '#ffb1c8', { align: 'left', font: UI, weight: '900' });
    }
    // combo
    if (flying && G.combo.n >= 1) {
      const mult = FRK.MULT(G.combo.n);
      txt(`×${mult}`, W - 16, 34, mult >= 5 ? 32 : 26, mult >= 7 ? '#ffcf3f' : '#fff', { align: 'right' });
      txt(`${G.combo.n} COMBO`, W - 16, 62, 12, '#fff', { align: 'right', font: UI, weight: '900' });
      const bw = 84, frac = G.combo.timer / FRK.P.COMBO_WINDOW;
      ctx.fillStyle = 'rgba(29,26,58,.55)'; ctx.beginPath(); ctx.roundRect(W - 16 - bw, 74, bw, 6, 3); ctx.fill();
      ctx.fillStyle = frac < 0.3 ? '#ff7a8a' : '#7cf3c6'; ctx.beginPath(); ctx.roundRect(W - 16 - bw * frac, 74, bw * frac, 6, 3); ctx.fill();
    }
    // gauge
    if (G.state === 'CHARGE' || G.state === 'READY') {
      const gx = W - 44, top = 168, hh = 300, bw = 26;
      const yOf = (v) => top + hh * (1 - v / 100);
      ctx.fillStyle = 'rgba(29,26,58,.7)'; ctx.beginPath(); ctx.roundRect(gx - bw / 2 - 4, top - 4, bw + 8, hh + 8, 10); ctx.fill();
      const zone = (a, b, c) => { ctx.fillStyle = c; ctx.fillRect(gx - bw / 2, yOf(b), bw, yOf(a) - yOf(b)); };
      zone(0, 100, 'rgba(255,255,255,.12)');
      zone(65, 79, 'rgba(159,214,255,.45)'); zone(98, 100, 'rgba(159,214,255,.45)');
      zone(80, 86, 'rgba(124,243,198,.55)'); zone(94, 97, 'rgba(124,243,198,.55)');
      zone(87, 93, '#ffcf3f');
      const v = G.gauge;
      ctx.fillStyle = 'rgba(255,95,168,.75)'; ctx.fillRect(gx - bw / 2 + 5, yOf(v), bw - 10, top + hh - yOf(v));
      ctx.fillStyle = '#fff'; ctx.fillRect(gx - bw / 2 - 8, yOf(v) - 2, bw + 16, 4);
      txt('90%', gx - bw / 2 - 8, yOf(90), 12, '#ffcf3f', { align: 'right', font: UI, weight: '900' });
      txt('PERFECT', gx, top - 18, 10, '#ffcf3f', { font: UI, weight: '900' });
      if (G.state === 'CHARGE') txt(`${Math.round(v)}%`, gx, top + hh + 22, 16, '#fff');
    }
    if (G.state === 'READY') {
      const a = 0.65 + 0.35 * Math.sin(performance.now() / 260);
      ctx.globalAlpha = a;
      txt('長押しでパワーをためる', W / 2, H - 76, 18, '#fff', { font: UI, weight: '900' });
      ctx.globalAlpha = 1;
      txt('黄色の帯（90%）で離すと PERFECT', W / 2, H - 52, 12, '#fff', { font: UI, weight: '800' });
    }
    if (G.state === 'CHARGE') txt('離すと巨漢がダイブ！', W / 2, H - 64, 18, '#fff', { font: UI, weight: '900' });

    // banners
    let by = 210;
    for (const b of banners) {
      const k = easeBack(b.t / 0.25), fade = b.t > b.dur - 0.3 ? (b.dur - b.t) / 0.3 : 1;
      ctx.save(); ctx.globalAlpha = Math.max(0, fade); ctx.translate(W / 2, by); ctx.scale(k, k);
      txt(b.text, 0, 0, b.size, b.color);
      if (b.sub) txt(b.sub, 0, b.size * 0.9, 14, '#fff', { font: UI, weight: '900' });
      ctx.restore(); by += 70;
    }
    // last chance
    if (G.state === 'LC' || (G.lcUsed && G.state === 'FLIGHT' && G.stateT < 0.8 && G.t - G.lastChange < 0.8)) {
      const blink = Math.floor(performance.now() / 90) % 2;
      ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.rotate(-0.06); ctx.scale(1 + Math.min(1, G.stateT * 4) * 0.1, 1 + Math.min(1, G.stateT * 4) * 0.1);
      txt('LAST CHANCE!', 0, 0, 36, blink ? '#ffcf3f' : '#fff', { lw: 7 });
      txt('奇跡の再発射', 0, 34, 15, '#fff', { font: UI, weight: '900' });
      ctx.restore();
    }
    if (G.state === 'RESULT' && G.endReason === 'timeup' && G.stateT < 1.2) txt('タイムアップ！', W / 2, H * 0.4, 34, '#ffb1c8');
  }

  function drawDebug() {
    if (!debug) return;
    const s = G.stats;
    const lines = [
      `seed ${G.seed}  state ${G.state}`,
      `抽選 ${s.lottery}  無厘頭 ${s.gagHits} (${s.lottery ? (s.gagHits / s.lottery * 100).toFixed(1) : '0'}%)`,
      `強制通常 ${s.forced}  連続 ${G.gagStreak}`,
      `帯 ${FRK.BANDS[FRK.bandOf(G.girl.y)].name}  t ${G.t.toFixed(1)}s  obj ${G.objects.length}`,
    ];
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(8, H - 92, 250, 70);
    ctx.font = `11px ui-monospace,monospace`; ctx.fillStyle = '#9ff7a0'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, 14, H - 86 + i * 15));
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    const shx = shake ? (Math.random() - 0.5) * shake : 0, shy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.save(); ctx.translate(shx, shy);
    drawBackground();
    drawDecor();
    drawGround();
    drawTower();
    drawDome(G.dome.squash);
    // big man
    const st = G.state;
    const bm = G.bigman;
    if (st === 'READY' || st === 'CHARGE') {
      const wob = st === 'CHARGE' ? Math.sin(performance.now() / 40) * (G.gauge / 100) * 3 : Math.sin(performance.now() / 300) * 1.5;
      drawBigman(sx(-130) + wob, sy(262), cam.z, 'idle', wob * 0.02);
    } else if (st === 'BIGFALL') drawBigman(sx(bm.x), sy(bm.y), cam.z, 'fall', G.stateT * 2);
    else if (st === 'SQUASH') drawBigman(sx(0), sy(66 - G.dome.squash * 30), cam.z, 'fall', 0);
    else if (G.ev && G.ev.gag === 'reversal') { /* drawn in gag scene */ } else if (!G.log.some((e) => e.id === 'reversal')) drawBigman(sx(-4), sy(110), cam.z * 0.95, 'idle', 0);
    for (const o of G.objects) drawObj(o);
    // particles
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c;
      const px = sx(p.x), py = sy(p.y), r = p.r * cam.z;
      if (p.star) { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = i * 1.2566 - 1.57; ctx.lineTo(px + Math.cos(a) * r * 1.6, py + Math.sin(a) * r * 1.6); ctx.lineTo(px + Math.cos(a + 0.628) * r * 0.7, py + Math.sin(a + 0.628) * r * 0.7); } ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    // girl
    const g = G.girl;
    if (st === 'READY' || st === 'CHARGE' || st === 'BIGFALL') drawGirl(sx(36), sy(96), cam.z, 0.1);
    else if (st === 'SQUASH') drawGirl(sx(36), sy(96 - G.dome.squash * 40), cam.z, 0.1);
    else if (st !== 'EVENT') {
      const rot = st === 'LANDING' || st === 'RESULT' ? 0 : Math.max(-0.9, Math.min(0.9, Math.atan2(g.vx, Math.abs(g.vy) + 200)));
      drawGirl(sx(g.x), sy(g.y + (st === 'LANDING' || st === 'RESULT' ? 22 : 0)), cam.z * 1.05, g.vy < -200 ? rot + Math.sin(performance.now() / 70) * 0.3 : rot);
    }
    // popups
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, (1.1 - p.t) * 3);
      txt(p.text, Math.max(70, Math.min(W - 70, sx(p.x))), sy(p.y) - 30, p.size, p.color, { font: UI, weight: '900' });
    }
    ctx.globalAlpha = 1;
    drawGagScene();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, flash * 2)})`; ctx.fillRect(0, 0, W, H); }
    drawHUD();
    drawDebug();
  }

  // ---------- result ----------
  function showResult() {
    const r = G.result;
    prevBest = Object.assign({}, best);
    plays++; save('frk.plays', plays);
    const isNew = r.score > best.score;
    if (isNew) best.score = r.score;
    if (r.H > best.alt) best.alt = r.H;
    if (r.maxCombo > best.combo) best.combo = r.maxCombo;
    save('frk.best', best);
    const q = (id) => document.getElementById(id);
    q('r-head').textContent = r.reason === 'timeup' ? 'TIME UP' : 'GAME OVER';
    q('r-new').hidden = !isNew;
    q('r-score').textContent = fmt(r.score);
    q('r-alt').textContent = fmt(r.H) + 'm';
    q('r-combo').textContent = '×' + r.maxCombo;
    q('r-grade').textContent = r.grade;
    q('r-grade').dataset.grade = r.grade;
    q('r-dex').textContent = `${seen.size}/10`;
    q('r-story').textContent = `「${FRK.story(r)}」`;
    const topGag = r.gags.slice().sort((a, b) => FRK.GAGS[b.id].pts - FRK.GAGS[a.id].pts)[0];
    q('r-art').textContent = topGag ? (FRK.GAGS[topGag.id].art || '🏋️') : '🚀';
    q('r-goal').textContent = FRK.nextGoal(r, prevBest, seen.size);
    q('r-break').textContent = `高度 ${fmt(Math.floor(r.H / 4))}・距離 ${fmt(Math.floor(r.D / 20))}・イベント ${fmt(r.eventPts)}・発射 ${fmt(r.L)}・ニアミス ${fmt(r.B)}`;
    resultEl.hidden = false;
    resultAt = performance.now();
    if (isNew) { setTimeout(() => sfx('fanfare'), 250); setTimeout(() => say('新記録！', 1.5, 1.2), 800); }
  }

  // ---------- input ----------
  function onDown(e) {
    if (e.target.closest && e.target.closest('#mute')) return;
    unlockAudio();
    if (G.state === 'RESULT') {
      if (!resultEl.hidden && performance.now() - resultAt > 700) { sfx('tap'); newGame(); }
      return;
    }
    if (paused) return;
    if (G.state === 'READY') { try { stage.setPointerCapture(e.pointerId); } catch (_) { /* */ } G.press(); sfx('tap'); }
    e.preventDefault();
  }
  function onUp() { if (G.state === 'CHARGE') G.release(); }
  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  let keyHeld = false;
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    e.preventDefault(); if (keyHeld) return; keyHeld = true;
    onDown({ target: stage, pointerId: 0, preventDefault() {} });
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'Enter') { keyHeld = false; onUp(); } });
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation(); unlockAudio();
    AU.muted = !AU.muted; save('frk.muted', AU.muted); setMuteLabel();
    if (AU.muted) { try { speechSynthesis.cancel(); } catch (_) { /* */ } } else { sfx('tap'); say('おと、オン！'); }
  });

  // ---------- pause (v3.1 §8) ----------
  let paused = false, resumeT = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      paused = true; pauseEl.hidden = false; pauseEl.textContent = '一時停止中';
      if (G.state === 'CHARGE') { G.state = 'READY'; G.gauge = 0; }
    } else if (paused) {
      paused = false; resumeT = 0.5; pauseEl.textContent = '再開！';
    }
  });

  // ---------- loop ----------
  let acc = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) {
      if (resumeT > 0) { resumeT -= dt; if (resumeT <= 0) pauseEl.hidden = true; }
      else {
        acc += dt;
        while (acc >= STEP) { G.update(STEP); handleFx(); tickVisual(STEP); acc -= STEP; }
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  resize();
  setMuteLabel();
  newGame();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
</script>

</body>
