<style>

</head>
<body>
<div id="wrap">

        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const gameEl = document.getElementById('game'), wrapEl = document.getElementById('wrap');
const INK = '#1b1420', PAPER = '#fff8ec', SKIN = '#ffd2a6', SKIN2 = '#efb37f';
const DISPLAY = '"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
const BODYF = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
const TAU = Math.PI * 2, PI = Math.PI;
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));

const rnd = (a, b) => a + Math.random() * (b - a);

const lerpA = (a, b, t) => a + wrapA(b - a) * t;

/* ---------------- Stage data (judgement logic, independent of drawing) ---------------- */
const STAGES = [
  { name: 'RIGHT HAND', jp: '右手ガード', arms: ['F'], period: { F: 0.9 }, dir: { F: 1 }, ease: { F: 1.7 },
    win: 25, perfect: 8, dur: 13, dodge: false, bg: '#ffd23f', bg2: '#ffb627' },
  { name: 'LEFT HAND', jp: '左手ガード・逆回転', arms: ['B'], period: { B: 0.7 }, dir: { B: -1 }, ease: { B: 1.4 },
    win: 20, perfect: 8, dur: 14, dodge: true, bg: '#6fd3e8', bg2: '#3fb6d6' },
  { name: 'DOUBLE SPIN', jp: '両腕が同時に開いた瞬間を狙え', arms: ['F', 'B'], period: { F: 0.95, B: 0.75 }, dir: { F: 1, B: -1 }, ease: { F: 1.6, B: 1.25 },
    win: 18, perfect: 8, clear: 60, dur: 16, dodge: true, bg: '#ff79a8', bg2: '#f2558e' }
];
const PTS = { PERFECT: 100, GOOD: 60, OK: 30, NEAR: 15, MISS: 0, DODGE: 0 };
const CLEARJ = { PERFECT: 1, GOOD: 1, OK: 1 };
const CHAOS = [['heli', 25], ['self', 25], ['stretch', 20], ['harisen', 20], ['octo', 10]];
const CHAOS_NAME = { heli: 'ヘリコプター化!', self: '自分にビンタ!', stretch: '腕が伸びる!?', harisen: 'ハリセン反撃!', octo: '超レア・タコ化!!' };
const TITLES = [[0, '回転にはじかれ係'], [800, 'すき間ハンター'], [1600, 'ガードくずし'], [2600, 'ビンタ職人'], [3800, '鉄壁ブレイカー'], [5200, 'SLAP SPIN QUEEN']];
// Shoulder pivots in scene coordinates (scene box = 720 x 720). Target angle = 0 (toward her cheek).
const SH = { F: { x: 285, y: 330, len: 185, glove: '#e8322b', tag: 'R' }, B: { x: 240, y: 318, len: 232, glove: '#1f8fd6', tag: 'L' } };
const SELF_A = { F: -2.08, B: -2.05 }, SELF_L = { F: 100, B: 82 };
// His spinning arm guards when pointing toward her (BLK). The gap opens on the far side (OPEN).
const BLK = { F: -0.55, B: -0.45 }, OPEN = { F: -0.55 + PI, B: -0.45 + PI };
const CHEEK = { x: 292, y: 238 };

/* ---------------- State ---------------- */
let state = 'TITLE', prevState = 'PLAY';
let stageIdx = 0, stageTime = 0, totalTime = 0, transition = 0;
let score = 0, streak = 0, bestStreak = 0, perfects = 0, hits = 0, tapCount = 0, missRun = 0, assistLeft = 0;
let lock = 0, hitstop = 0, R = null, chaosNext = null, resultT = 0, newBest = false, clock = 0;
let best = parseInt(sget('ssk_best') || '0', 10) || 0;
let muted = sget('ssk_mute') === '1';
let popups = [], parts = [], words = [], shake = 0, flash = 0, zoomT = 9;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FLAVOR = { launch: '空のかなたへ!', flat: 'ペラペラ化!', spinhead: '首が3回転!', tarai: '金ダライ追撃!', star: '星になった…' };
const POWER_WORD = ['ほぼ隕石', '新幹線級', '台風3個分', '測定不能', '宇宙規模', 'ちょっと痛そう(痛くない)'];
const arms = { F: mkArm(), B: mkArm() };
const girl = { line: null, lineT: 0 };
const dz = { state: 'idle', timer: 2, duck: 0 };
let manLine = null, manLineT = 0;
function mkArm() { return { t: 0, th0: PI, dir: 1, w0: TAU, a: 0.3, P: 1.7, theta: PI, active: false, prev: PI }; }
function armTheta(a) { return a.th0 + a.dir * a.w0 * (a.t + a.a * a.P / TAU * (1 - Math.cos(TAU * a.t / a.P))); }

/* ---------------- Layout ---------------- */
let LW = 720, LH = 1280, L = null, scale = 1;
function layout(land) {
  if (land) { LW = 1280; LH = 720; L = { land: true, sx: 395, sy: 96, ss: 0.68, meterY: 618, meterW: 480, tapY: 676, tapH: 40 }; }
  else { LW = 720; LH = 1280; L = { land: false, sx: 0, sy: 236, ss: 1, meterY: 1000, meterW: 600, tapY: 1100, tapH: 140 }; }
}
function resize() {
  const r = wrapEl.getBoundingClientRect();
  const cs = getComputedStyle(wrapEl);
  const w = r.width, h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  layout(w / h > 1.05);
  const s = Math.min(w / LW, h / LH);
  const cw = Math.floor(LW * s), ch = Math.floor(LH * s);
  gameEl.style.width = cw + 'px'; gameEl.style.height = ch + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = cv.width / LW;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------------- Audio ---------------- */
let AC = null, master = null, noiseBuf = null, silentEl = null, blipDone = false;
// Tiny silent WAV played through an <audio> element: it puts iOS into "playback" mode
// so Web Audio is heard even when the ringer/silent switch is on.
function silentWavURI() {
  const n = 4000, buf = new Uint8Array(44 + n), dv = new DataView(buf.buffer);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) buf[o + i] = str.charCodeAt(i); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) buf[44 + i] = 128;
  let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}
function audioInit() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    if (!silentEl) { silentEl = new Audio(silentWavURI()); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); }
    if (silentEl.paused) { const pr = silentEl.play(); if (pr && pr.catch) pr.catch(() => {}); }
  } catch (e) {}
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state !== 'running') { const pr = AC.resume(); if (pr && pr.catch) pr.catch(() => {}); }
    if (!blipDone) { // unlock with a one-sample buffer inside the gesture
      const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0); blipDone = true;
    }
  } catch (e) { AC = null; }
}
// Unlock on every kind of first gesture; iOS only counts some of them.
['pointerdown', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, audioInit, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state !== 'running') AC.resume().catch(() => {}); });
function tone(f, dur, type, vol, slide, delay) {
  if (!AC || muted) return; if (AC.state !== 'running') AC.resume().catch(() => {}); const t = AC.currentTime + 0.01 + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, f1, f2, ft, delay) {
  if (!AC || muted) return; const t = AC.currentTime + 0.01 + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = ft; fl.Q.value = 1.2;
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.03);
}
const SFX = {
  tick() { noise(0.07, 0.12, 900, 2600, 'bandpass'); },
  swing() { noise(0.16, 0.35, 700, 3200, 'bandpass'); },
  slap() { noise(0.13, 0.75, 2600, 1800, 'highpass'); tone(240, 0.12, 'triangle', 0.4, 90); },
  boom() { tone(110, 0.5, 'sine', 0.8, 28); noise(0.45, 0.7, 1400, 80, 'lowpass'); tone(55, 0.6, 'square', 0.12, 30); },
  launch() { tone(300, 0.6, 'square', 0.08, 1800); noise(0.5, 0.25, 500, 4000, 'bandpass'); },
  bell() { tone(520, 0.9, 'triangle', 0.35); tone(1310, 0.7, 'sine', 0.15); tone(780, 0.9, 'sine', 0.12); },
  twinkle() { [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, 0.18, 'sine', 0.12, null, i * 0.06)); },
  perfect() { [880, 1175, 1568].forEach((f, i) => tone(f, 0.13, 'square', 0.1, null, i * 0.05)); },
  dbl() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, 0.14, 'square', 0.1, null, i * 0.045)); },
  near() { tone(600, 0.16, 'triangle', 0.18, 420); },
  boing() { tone(170, 0.38, 'sine', 0.4, 640); },
  whiff() { noise(0.32, 0.35, 300, 2200, 'bandpass'); tone(420, 0.3, 'sine', 0.12, 200, 0.1); },
  warn() { tone(1500, 0.05, 'square', 0.07); tone(1500, 0.05, 'square', 0.07, null, 0.08); },
  stage() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.11, 'square', 0.1, null, i * 0.07)); },
  heli() { for (let i = 0; i < 9; i++) noise(0.05, 0.3, 300, 500, 'lowpass', i * 0.08); },
  self() { noise(0.12, 0.6, 2600, 1800, 'highpass', 0.18); tone(700, 0.3, 'sine', 0.2, 260, 0.2); },
  stretch() { tone(140, 0.55, 'sawtooth', 0.12, 900); },
  harisen() { noise(0.1, 0.9, 3500, 2500, 'highpass', 0.12); tone(150, 0.25, 'sawtooth', 0.2, 60, 0.12); },
  octo() { tone(320, 0.55, 'sine', 0.25, 110); tone(460, 0.55, 'triangle', 0.1, 980); },
  result() { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.1, null, i * 0.1)); }
};
function setMute(m) {
  muted = m; sset('ssk_mute', m ? '1' : '0');
  if (master) master.gain.value = m ? 0 : 0.7;
  document.getElementById('icoOn').hidden = m; document.getElementById('icoOff').hidden = !m;
}

/* ---------------- Game flow ---------------- */
function rollChaos() {
  if (Math.random() >= 0.35) return null;
  let r = Math.random() * 100;
  for (const [k, w] of CHAOS) { if ((r -= w) < 0) return k; }
  return 'heli';
}
function setupStage(i) {
  const st = STAGES[i]; stageIdx = i; stageTime = 0;
  for (const k of ['F', 'B']) {
    const a = arms[k]; a.active = st.arms.includes(k);
    if (a.active) { a.t = 0; a.dir = st.dir[k]; a.w0 = TAU / st.period[k]; a.P = st.ease[k]; a.th0 = BLK[k] + (k === 'B' && i === 2 ? 1.3 : 0); a.theta = armTheta(a); a.prev = a.theta; }
  }
  dz.state = 'idle'; dz.timer = rnd(1.2, 2.0); dz.duck = 0;
  transition = i === 0 ? 1.0 : 0.75;
}
function startGame() {
  state = 'PLAY'; score = 0; streak = 0; bestStreak = 0; perfects = 0; hits = 0; tapCount = 0; missRun = 0; assistLeft = 0;
  totalTime = 0; R = null; lock = 0; hitstop = 0; popups = []; parts = []; words = []; newBest = false;
  chaosNext = rollChaos(); manLine = null; girl.line = null;
  setupStage(0); SFX.stage();
}
function nextStage() {
  if (stageIdx < 2) { setupStage(stageIdx + 1); SFX.stage(); }
  else endGame();
}
function endGame() {
  state = 'RESULT'; resultT = 0; R = null; lock = 0;
  if (score > best) { best = score; newBest = true; sset('ssk_best', String(best)); }
  SFX.result();
}
function windowNow() {
  const st = STAGES[stageIdx]; const n = tapCount + 1;
  let m = 1, pm = 1;
  if (n <= 3) { m = 1.35; pm = 1.25; } else if (assistLeft > 0) { m = 1.2; pm = 1.1; }
  const clear = st.clear ? st.clear * Math.min(m, 1.2) : 0;
  return { win: st.win * m, perf: st.perfect * pm, clear, near: (clear || st.win * m) + 15 };
}
function slap() {
  const st = STAGES[stageIdx];
  const w = windowNow();
  if (tapCount + 1 > 3 && assistLeft > 0) assistLeft--;
  tapCount++;
  const dodging = st.dodge && dz.duck > 0.5;
  const ang = {};
  const results = st.arms.map(k => {
    ang[k] = arms[k].theta;
    const d = Math.abs(wrapA(arms[k].theta - OPEN[k])) * 180 / PI;
    let j = 'MISS';
    if (dodging) j = 'DODGE';
    else if (d <= w.perf) j = 'PERFECT'; else if (d <= w.win) j = 'GOOD'; else if (w.clear && d <= w.clear) j = 'OK'; else if (d <= w.near) j = 'NEAR';
    return { k, d, j };
  });
  // Every spinning arm must be out of the way; one arm still guarding blocks the slap.
  const success = results.every(r => CLEARJ[r.j]);
  const dbl = results.length === 2 && results.every(r => r.j === 'PERFECT');
  const blocked = !success && results.some(r => r.j === 'MISS' || r.j === 'DODGE');
  const base = dbl ? 250 : success ? results.reduce((s, r) => s + PTS[r.j], 0) : (blocked ? 0 : PTS.NEAR);
  if (success) { streak++; hits++; missRun = 0; bestStreak = Math.max(bestStreak, streak); }
  else { streak = 0; missRun++; if (missRun >= 3) { assistLeft = 2; missRun = 0; addPop('ASSIST!', 'すき間ゾーン拡大', '#ffffff', 0.55); } }
  perfects += results.filter(r => r.j === 'PERFECT').length;
  const mult = success ? Math.min(2, 1 + 0.25 * (streak - 1)) : 1;
  const gain = success ? Math.round(base * mult) : base;
  score += gain;

  let type, dur;
  if (dbl) { type = 'double'; dur = 0.9; }
  else if (success) { type = 'hit'; dur = 0.86; }
  else if (dodging) { type = 'dodge'; dur = 0.66; }
  else if (!blocked) { type = 'near'; dur = 0.6; }
  else { type = pick(['deflect', 'spun', 'whiff']); dur = 0.74; }
  const chaos = chaosNext; chaosNext = rollChaos();
  if (chaos) dur = 0.88;
  R = { type, t: 0, dur, results, ang, chaos, success, flavor: dbl ? 'star' : (success ? pick(['launch', 'launch', 'flat', 'spinhead', 'tarai']) : null) };
  lock = dur;

  const order = ['PERFECT', 'GOOD', 'OK', 'NEAR', 'DODGE', 'MISS'];
  const bestJ = results.map(r => r.j).sort((a, b) => order.indexOf(a) - order.indexOf(b))[0];
  const COL = { PERFECT: '#ffd23f', GOOD: '#7fe08a', OK: '#9be7ff', NEAR: '#ffffff', MISS: '#c8c3d6', DODGE: '#9fd8ff' };
  const worstJ = results.map(r => r.j).sort((a, b) => order.indexOf(b) - order.indexOf(a))[0];
  const label = dbl ? 'DOUBLE PERFECT!!' : success ? (results.length === 2 ? 'BREAK THROUGH!' : bestJ + '!') : dodging ? 'DODGED!' : blocked ? 'GUARD!' : 'NEAR MISS';
  const lcol = success ? (results.length === 2 ? '#ffd23f' : COL[bestJ]) : COL[worstJ];
  let sub = gain > 0 ? '+' + gain + (success && mult > 1 ? '  ×' + mult.toFixed(2).replace(/0$/, '') : '') : '';
  if (results.length === 2 && !dbl) sub = 'R:' + short(results[0].j) + '  L:' + short(results[1].j) + (gain > 0 ? '   +' + gain : '');
  addPop(label, sub, lcol, dbl ? 1.25 : 1);

  SFX.swing();
  if (success) {
    setTimeout(() => { SFX.slap(); if (bestJ === 'PERFECT') { dbl ? SFX.dbl() : SFX.perfect(); } }, 60);
    hitstop = bestJ === 'PERFECT' ? 0.12 : 0.08; shake = REDUCED ? 4 : (dbl ? 34 : bestJ === 'PERFECT' ? 26 : 18);
    flash = REDUCED ? 0.3 : 1; zoomT = 0;
    setTimeout(SFX.boom, 50);
    if (R.flavor === 'launch' || R.flavor === 'star') setTimeout(SFX.launch, 140);
    if (R.flavor === 'tarai') setTimeout(SFX.bell, 330);
    if (R.flavor === 'star') setTimeout(SFX.twinkle, 450);
    const pw = (bestJ === 'PERFECT' ? 9000 : 3000) + Math.round(Math.random() * 999) + (dbl ? 90000 : 0);

  st.arms.forEach((k, i) => {
    const y = y0 + i * gap, s = SH[k];
    const toX = deg => cx + clamp(deg / 180, -1, 1) * mw / 2;
    shape('rgba(27,20,32,0.35)', () => rrect(cx - mw / 2, y - h / 2, mw, h, h / 2), 4);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(toX(-w.near), y - h / 2 + 3, toX(w.near) - toX(-w.near), h - 6);
    if (w.clear) { ctx.fillStyle = '#9be7ff'; ctx.fillRect(toX(-w.clear), y - h / 2 + 3, toX(w.clear) - toX(-w.clear), h - 6); }
    ctx.fillStyle = '#7fe08a'; ctx.fillRect(toX(-w.win), y - h / 2 + 3, toX(w.win) - toX(-w.win), h - 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(toX(-w.perf), y - h / 2 + 3, toX(w.perf) - toX(-w.perf), h - 6);
    const th = R && R.ang[k] != null ? R.ang[k] : arms[k].theta;
    const mx = toX(wrapA(th - OPEN[k]) * 180 / PI);
    shape(s.glove, () => { ctx.moveTo(mx, y + h / 2 - 2); ctx.lineTo(mx - 11, y - h / 2 - 14); ctx.lineTo(mx + 11, y - h / 2 - 14); ctx.closePath(); }, 4);
    txt(s.tag, cx - mw / 2 - 12, y + 8, 22, s.glove, { align: 'right', stroke: 6 });
  });
  if (!L.land) txt('PERFECT ZONE', cx, y0 - 22, 18, '#ffd23f', { align: 'center', stroke: 6 });
  if (bothOpen()) txt('OPEN!!', cx + mw / 2, y0 - (L.land ? 18 : 22), L.land ? 24 : 30, '#7fe08a', { align: 'right', stroke: 8 });
}
function drawTapZone(label) {
  const p = 0.5 + 0.5 * Math.sin(clock * 6);
  if (!L.land) {
    const y = L.tapY;
    shape(INK, () => rrect(40, y + 10, LW - 80, L.tapH, 36), 0);
    shape('#ffffff', () => rrect(40, y - p * 4, LW - 80, L.tapH, 36), 6);
    txt(label, LW / 2, y + L.tapH / 2 - p * 4 + 2, 56, '#e8322b', { align: 'center', base: 'middle', stroke: 10 });
  } else {
    txt(label, LW / 2, L.tapY + 8 - p * 3, 34, '#ffffff', { align: 'center', base: 'middle', stroke: 9 });
  }
}
function drawPopups() {
  const cx = LW / 2, baseY = L.land ? 130 : L.sy + 14;
  for (const p of popups) {
    if (p.t < 0) continue;
    const s = (p.t < 0.12 ? 0.4 + 0.8 * easeOut(p.t / 0.12) : 1 + 0.03 * Math.sin(p.t * 20)) * p.big * (L.land ? 0.8 : 1);
    const a = clamp((p.dur - p.t) / 0.2, 0, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, (p.ay != null ? L.sy + p.ay * L.ss : baseY + p.y * (L.land ? 92 : 124)) - p.t * 20); ctx.scale(s, s); ctx.rotate(-0.05);
    txt(p.text, 0, 0, 62, p.color, { align: 'center', base: 'middle', stroke: 14 });
    if (p.sub) txt(p.sub, 0, 50, 28, '#ffffff', { align: 'center', base: 'middle', stroke: 8 });
    ctx.restore();
  }
}
function drawBanner() {
  if (state !== 'PLAY' || transition <= 0) return;
  const st = STAGES[stageIdx], total = stageIdx === 0 ? 1.0 : 0.75, t = total - transition;
  const slide = t < 0.18 ? (1 - easeOut(t / 0.18)) * LW : (transition < 0.15 ? -(1 - transition / 0.15) * LW : 0);
  const cy = LH * (L.land ? 0.42 : 0.4);
  ctx.save(); ctx.translate(slide, 0);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(0, cy - 90); ctx.lineTo(LW, cy - 120); ctx.lineTo(LW, cy + 70); ctx.lineTo(0, cy + 100); ctx.closePath(); ctx.fill();
  txt('STAGE ' + (stageIdx + 1), LW / 2, cy - 40, 34, '#ffd23f', { align: 'center', stroke: 0 });
  txt(st.name, LW / 2, cy + 22, L.land ? 70 : 76, '#ffffff', { align: 'center', stroke: 0 });
  txt(stageIdx === 0 ? '右手ガード ― すき間でTAP!' : st.jp, LW / 2, cy + 66, 26, '#ff9fc4', { align: 'center', stroke: 0, body: true });
  ctx.restore();
}
function drawTitle() {
  const p = Math.sin(clock * 3);
  ctx.save();
  if (!L.land) {
    ctx.translate(LW / 2 - 50, 178); ctx.rotate(-0.06 + p * 0.01); ctx.scale(0.84, 0.84); // smaller/lower: keep clear of the pause & sound buttons
    txt('SLAP SPIN', 0, 0, 82, '#ffffff', { align: 'center', stroke: 16 });
    txt('KING', 0, 104, 116, '#e8322b', { align: 'center', stroke: 20 });
    ctx.restore();
    txt('彼の腕は回転ガード。すき間を狙ってビンタ!', LW / 2, 980, 26, INK, { align: 'center', body: true, stroke: 0 });
    txt('BEST ' + best, LW / 2, 1036, 30, '#ffffff', { align: 'center', stroke: 8 });
    drawTapZone('TAP TO START');
    txt('タップ / クリック / SPACE ・ 音が出ないときはマナーモードと音量を確認', LW / 2, 1268, 18, INK, { align: 'center', body: true, stroke: 0 });
  } else {
    ctx.translate(200, 250); ctx.rotate(-0.08 + p * 0.01);
    txt('SLAP', 0, 0, 84, '#ffffff', { align: 'center', stroke: 16 });
    txt('SPIN', 0, 90, 84, '#ffffff', { align: 'center', stroke: 16 });
    txt('KING', 0, 190, 100, '#e8322b', { align: 'center', stroke: 18 });
    ctx.restore();
    txt('彼の腕は回転ガード。', 1080, 300, 26, INK, { align: 'center', body: true, stroke: 0 });
    txt('すき間を狙って', 1080, 340, 26, INK, { align: 'center', body: true, stroke: 0 });
    txt('ビンタ!', 1080, 380, 26, INK, { align: 'center', body: true, stroke: 0 });
    txt('BEST ' + best, 1080, 450, 30, '#ffffff', { align: 'center', stroke: 8 });
    drawTapZone('TAP / CLICK / SPACE TO START');
  }
}
function titleFor(s) { let t = TITLES[0][1]; for (const [v, n] of TITLES) if (s >= v) t = n; return t; }
function drawResult() {
  const a = clamp(resultT / 0.25, 0, 1);
  ctx.fillStyle = 'rgba(27,20,32,' + (0.55 * a) + ')'; ctx.fillRect(0, 0, LW, LH);
  const pw = L.land ? 640 : 620, ph = L.land ? 600 : 760, px = (LW - pw) / 2, py = (LH - ph) / 2 - (L.land ? 0 : 40);
  const s = 0.7 + 0.3 * easeOut(resultT / 0.3);
  ctx.save(); ctx.translate(LW / 2, LH / 2); ctx.scale(s, s); ctx.translate(-LW / 2, -LH / 2); ctx.globalAlpha = a;
  shape(INK, () => rrect(px + 10, py + 14, pw, ph, 30), 0);
  shape(PAPER, () => rrect(px, py, pw, ph, 30), 6);
  const cx = LW / 2; let y = py + 74;
  txt('RESULT', cx, y, 44, '#e8322b', { align: 'center', stroke: 0 });
  const ttl = titleFor(score);
  y += L.land ? 74 : 92; txt(ttl, cx, y, ttl.length > 10 ? 50 : 58, '#ffd23f', { align: 'center', stroke: 12 });
  y += L.land ? 90 : 110; txt(String(score), cx, y, L.land ? 92 : 110, INK, { align: 'center', stroke: 0 });
  if (newBest) { y += 46; txt('NEW BEST!', cx, y, 34, '#e8322b', { align: 'center', stroke: 0 }); }
  else { y += 46; txt('BEST ' + best, cx, y, 28, '#6d6478', { align: 'center', stroke: 0 }); }
  y += L.land ? 54 : 74;
  const rows = [['PERFECT', perfects], ['最大コンボ', bestStreak], ['命中', hits + ' / ' + tapCount]];
  rows.forEach(([k, v], i) => {
    const ry = y + i * (L.land ? 40 : 48);
    txt(k, px + 70, ry, 26, '#6d6478', { stroke: 0, body: true });
    txt(String(v), px + pw - 70, ry, 30, INK, { stroke: 0, align: 'right' });
  });
  ctx.restore();
  if (resultT > 0.45) {
    const p = 0.5 + 0.5 * Math.sin(clock * 6);
    if (!L.land) drawTapZone('TAP TO RETRY');
    else { ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * p; txt('TAP TO RETRY', LW / 2, py + ph - 34, 32, '#e8322b', { align: 'center', base: 'middle', stroke: 0 }); ctx.restore(); }
  }
}
function drawPause() {
  ctx.fillStyle = 'rgba(27,20,32,0.6)'; ctx.fillRect(0, 0, LW, LH);
  txt('PAUSE', LW / 2, LH / 2 - 10, 90, '#ffffff', { align: 'center', base: 'middle', stroke: 16 });
  txt('タップで再開', LW / 2, LH / 2 + 70, 30, '#ffd23f', { align: 'center', base: 'middle', stroke: 8, body: true });
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawBg();
  ctx.save();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.translate(L.sx + sx, L.sy + sy); ctx.scale(L.ss, L.ss);
  const z = REDUCED ? 0 : 0.16 * bump(zoomT, 0.4);
  if (z) { ctx.translate(CHEEK.x, CHEEK.y); ctx.scale(1 + z, 1 + z); ctx.rotate(-z * 0.3); ctx.translate(-CHEEK.x, -CHEEK.y); }
  drawScene();
  if (zoomT < 0.32) drawImpact(zoomT);
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.75) + ')'; ctx.fillRect(0, 0, LW, LH); }
  if (state === 'TITLE') { drawTitle(); return; }
  drawHUD(); drawMeters();
  if (state === 'PLAY' || state === 'PAUSE') drawTapZone('TAP TO SLAP!');
  drawPopups(); drawBanner();
  if (state === 'RESULT') drawResult();
  if (state === 'PAUSE') drawPause();
}

function drawImpact(t) {
  const k = t / 0.32, r0 = 40 + 120 * easeOut(k), r1 = r0 + 260 * (1 - k * 0.6);
  ctx.save(); ctx.globalAlpha = 1 - k;
  for (let i = 0; i < 18; i++) {
    const a = i * TAU / 18 + (i % 2) * 0.08, wv = i % 2 ? 0.05 : 0.09, rr = i % 3 ? r1 : r1 * 1.3;
    ctx.fillStyle = i % 2 ? INK : '#ffffff'; ctx.beginPath();
    ctx.moveTo(CHEEK.x + Math.cos(a - wv) * r0, CHEEK.y + Math.sin(a - wv) * r0); ctx.lineTo(CHEEK.x + Math.cos(a) * rr, CHEEK.y + Math.sin(a) * rr); ctx.lineTo(CHEEK.x + Math.cos(a + wv) * r0, CHEEK.y + Math.sin(a + wv) * r0); ctx.closePath(); ctx.fill();
  }
  ctx.lineWidth = 10 * (1 - k); ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(CHEEK.x, CHEEK.y, r0 * 1.4, 0, TAU); ctx.stroke();
  ctx.restore();
}
function frame(now) { step(now); draw(); requestAnimationFrame(frame); }
resize(); makeHalftone(); setMute(muted);
if (document.fonts && document.fonts.load) { document.fonts.load('40px "Dela Gothic One"').catch(() => {}); document.fonts.load('800 20px "M PLUS Rounded 1c"').catch(() => {}); }
requestAnimationFrame(frame);
window.__ssk = { audio: () => (AC ? AC.state : 'none') + '|' + muted, info: () => ({ state, stageIdx, score, total: +totalTime.toFixed(1), tapCount, hits }), gap: () => state === 'PLAY' && lock <= 0 && transition <= 0 ? Math.max(...STAGES[stageIdx].arms.map(k => Math.abs(wrapA(arms[k].theta - OPEN[k])))) : 9, duck: () => dz.state };
})();
</script>
