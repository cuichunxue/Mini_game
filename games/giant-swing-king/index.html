<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GIANT SWING KING</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: loud, absurd Japanese variety-show energy
   IDEA: an ordinary playground poster that falls apart mid-swing
   PICTURE: the game canvas itself, full screen, park -> sky -> space
   COLOUR/TYPE: sky blue, grass green, signal red, yolk yellow on deep ink; Dela Gothic One + M PLUS Rounded 1c
   LAYOUT: full-bleed canvas, HUD chips on top, two big thumb buttons at the bottom corners */
:root{--ink:#1d1b2f;--red:#ff3b2f;--yel:#ffd23f;--blue:#2f7bff;--paper:#fff8e6;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:500 16px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#g{position:fixed;inset:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.chip{background:rgba(29,27,47,.8);color:#fff;border-radius:14px;padding:6px 11px;font-weight:800;font-size:13px;white-space:nowrap;line-height:1.3}
.chip b{font:400 17px "Dela Gothic One",sans-serif;color:var(--yel);font-variant-numeric:tabular-nums}
#mid{display:flex;align-items:center;gap:8px}
#gripbar{width:clamp(70px,18vw,150px);height:10px;border-radius:6px;background:#ffffff30;overflow:hidden}
#grip{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yel));transition:width .1s}
#hud.hide,.ctrl.hide{display:none}
.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
.btn{pointer-events:auto;width:clamp(92px,21vw,140px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);font:400 clamp(15px,3.2vw,21px) "Dela Gothic One",sans-serif;color:#fff;box-shadow:0 7px 0 var(--ink);touch-action:none;display:grid;place-content:center;gap:2px;cursor:pointer}
.btn small{font:800 11px "M PLUS Rounded 1c",sans-serif;opacity:.8}
.btn.on{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.pill:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#bA{background:var(--red);position:relative}#bB{background:var(--blue)}
#bA.ready{box-shadow:0 7px 0 var(--ink),0 0 0 8px var(--yel),0 0 34px 14px rgba(255,210,63,.75);animation:rdy .25s ease-out}

@keyframes rdy{from{transform:scale(1.12)}to{transform:scale(1)}}
#spdbar{width:clamp(60px,14vw,120px);height:10px;border-radius:6px;background:#ffffff30;overflow:hidden}
#spd{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be07b,#2fd1ff,#ff3b6b);transition:width .08s}
#combo{position:absolute;left:50%;top:41%;transform:translateX(-50%);font:400 clamp(15px,3vw,22px) "Dela Gothic One",sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;pointer-events:none;opacity:0;transition:opacity .2s}
#hint{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;text-align:center;background:rgba(29,27,47,.7);padding:6px 12px;border-radius:12px;pointer-events:none;max-width:42vw}
#pop{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font:400 clamp(22px,5vw,40px) "Dela Gothic One",sans-serif;color:var(--yel);-webkit-text-stroke:2px var(--ink);paint-order:stroke;pointer-events:none;opacity:0;white-space:nowrap}
#pop.go{animation:pop .7s ease-out}#pop.g-p{color:var(--yel);font-size:clamp(30px,7vw,54px)}#pop.g-g{color:#7be07b}#pop.g-b{color:#fff;font-size:clamp(18px,4vw,30px)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#banner{position:absolute;left:0;right:0;top:16%;text-align:center;pointer-events:none;opacity:0;padding:0 12px}
#banner.go{animation:ban 1.8s ease-out forwards}
#banner h2{margin:0;font:400 clamp(30px,7.5vw,68px)/1.05 "Dela Gothic One",sans-serif;color:var(--yel);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-wrap:balance}
#banner p{margin:8px auto 0;display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:clamp(14px,2.6vw,19px);padding:5px 14px;border-radius:10px}
@keyframes ban{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}12%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1;transform:scale(1.04) rotate(-3deg)}100%{opacity:0;transform:scale(1.1) rotate(-3deg)}}
#rec{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font:400 15px "Dela Gothic One";padding:4px 14px;border-radius:10px;display:none}
.ov{position:absolute;inset:0;display:none;place-items:center;padding:16px;background:rgba(20,18,40,.5);overflow:auto}
.ov.show{display:grid}
#title{place-items:start center;padding-top:max(36px,7vh);background:linear-gradient(180deg,rgba(29,27,47,.0),rgba(29,27,47,.55))}
.logo{text-align:center;color:#fff}
.logo h1{margin:0;font:400 clamp(40px,10vw,96px)/.95 "Dela Gothic One",sans-serif;color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke;transform:rotate(-4deg);text-shadow:0 8px 0 var(--red)}

.how{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px;padding:0;list-style:none}
.how li{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{min-height:48px;border-radius:999px;border:3px solid var(--ink);font:400 16px "Dela Gothic One",sans-serif;padding:0 22px;background:var(--yel);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.pill.red{background:var(--red);color:#fff}.pill.w{background:#fff}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 10px 0 var(--ink);width:100%;max-width:540px;padding:20px 20px 22px;text-align:center;max-height:calc(100dvh - 32px);overflow:auto}
.route{font-weight:800;font-size:13px;color:#5b5670;margin:0 0 6px}
.big{font-size:56px;line-height:1.1}
.job{margin:2px 0 0;font-weight:800;font-size:13px}
.card h2{margin:2px 0 4px;font:400 clamp(24px,5.5vw,34px)/1.1 "Dela Gothic One",sans-serif;text-wrap:balance}
.desc{margin:0 auto 10px;max-width:40ch}
.badge{display:inline-block;font:400 12px "Dela Gothic One";padding:2px 8px;border-radius:8px;margin:0 3px;vertical-align:middle}
.lg{background:var(--ink);color:var(--yel)}.nw{background:var(--red);color:#fff}
.score{font:400 clamp(36px,8vw,52px)/1 "Dela Gothic One",sans-serif;color:var(--red);font-variant-numeric:tabular-nums}

.brk{font-weight:800;font-size:12px;color:#5b5670;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.ttl{font-weight:800;margin:6px 0 14px}
.tot{background:var(--yel);border:3px solid var(--ink);border-radius:14px;padding:8px;margin:0 0 14px;font-weight:800}
.tot b{font:400 26px "Dela Gothic One"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:8px;margin:12px 0 16px;text-align:left}
.cell{border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff}
.cell.no{background:#e8e3d6;color:#8a8496}
.cell .e{font-size:28px}.cell b{display:block;font-size:14px;line-height:1.25}.cell span{font-size:12px;display:block;line-height:1.35;margin-top:3px}
.cell.leg{background:var(--ink);color:#fff}.cell.leg b{color:var(--yel)}
@media(max-width:600px){.hud{flex-wrap:wrap}#mid{order:3;flex-basis:100%;justify-content:center}}
/* portal: short phones — compact title, result buttons stay reachable */
.card>.row:last-child{position:sticky;bottom:-22px;background:var(--paper);padding:8px 0 10px;margin-bottom:-22px;box-shadow:0 -8px 10px var(--paper);z-index:2}
@media (max-height:560px){
  #title{padding-top:8px;padding-bottom:8px}.logo h1{font-size:34px;-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--red)}.logo .cp{margin:10px 0 6px;font-size:12px;padding:4px 10px}
  .how{gap:4px;margin:0 0 8px}.how li{font-size:11px;padding:3px 8px;border-width:2px}.pill{min-height:38px;font-size:14px;padding:0 16px}
  .card{padding:10px 14px 12px}.big{font-size:36px}.score{font-size:34px}.card .row .pill{min-height:36px;font-size:13px;padding:0 12px}
}
@media (prefers-reduced-motion:reduce){#banner.go{animation-duration:2.2s}}
</style>
</head>

function tone(f1,f2,d,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}

function checkEvents(){
 const s=S;if(s.events.length>=3||s.ft-s.evT<.35)return;

function step(dt){

  s.omega+=-(G/R)*Math.sin(s.theta)*dt;s.omega*=1-.12*dt;s.theta+=s.omega*dt;s.rotA+=s.omega*dt;placeOnBar();

  const spins=Math.floor(Math.abs(s.rotA)/TAU);
  if(spins>=9&&!s.warned){s.warned=true;pop(T('spinWarn'))}
  if(spins>=12)return endNow('overspin');
  if(s.idle>4&&aw<1.2&&!s.pressed)hint(T('swingNow'));
  if(s.idle>6.5&&aw<1.2)return endNow('married');
  if(s.grip<=0){s.grip=0;pop(T('gripOut'));release()}
 }
 else if(s.phase==='fly'){
  s.ft+=dt;const sp=Math.hypot(s.vx,s.vy);const air=clamp((keys.R||hold.B?1:0)-(keys.L||hold.A?1:0)+(swipeT>0?swipe:0),-1,1);swipeT-=dt;
  let ax=-.00011*s.vx*sp+air*160,ay=G*s.gs-.00011*s.vy*sp;
  s.angv+=air*7*dt;s.vx+=ax*dt;s.vy+=ay*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.angv*=1-.25*dt;s.ang+=s.angv*dt;s.flail+=dt*(4+sp/150);

   s.y=-18;
   if(s.bounces===0&&!s.landed&&!s.events.length&&Math.abs(s.vx)>650)s.roll=true;
   if(s.vy>220){s.vy=-s.vy*.32;s.vx*=s.roll?.92:.6;s.angv=s.vx/40;s.bounces++;sfx.land()}
   else{s.vy=0;s.landed=true;s.vx*=Math.pow(s.roll?.42:.03,dt);
    if(s.roll){s.ang+=s.vx/24*dt}else{const tgt=Math.round((s.ang-Math.PI/2)/Math.PI)*Math.PI+Math.PI/2;s.ang+=(tgt-s.ang)*Math.min(1,dt*8);s.angv=0}

  s.freeze-=dt;const id=s.anim.id,k=dt;
  if(s.goto){s.x+=(s.goto[0]-s.x)*Math.min(1,k*6);s.y+=(s.goto[1]-s.y)*Math.min(1,k*6)}

  if(id==='fishing')s.y-=dt*420;

function cam(dt){

 if(e.repeat&&(e.code==='Space'||e.code==='Enter'))return e.preventDefault();
 if(e.code==='Space'){e.preventDefault();if(S&&S.phase==='swing')down('A')}
 else if(e.code==='Enter'){e.preventDefault();if(S&&S.phase==='swing')down('B');else if(S&&S.phase==='end'&&endShown&&!replay)next();else if(S&&S.phase==='title')start()}
 else if(e.code==='ArrowLeft'){keys.L=1}else if(e.code==='ArrowRight'){keys.R=1}
 else if(e.code==='KeyR'){au();if(S&&S.phase==='title')start();else restartThrow()}
});
window.addEventListener('keyup',e=>{if(e.code==='Space')up('A');if(e.code==='Enter')up('B');if(e.code==='ArrowLeft')keys.L=0;if(e.code==='ArrowRight')keys.R=0});
$('go').onclick=start;$('zk1').onclick=showZukan;$('lg').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLang()};

function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const s=w/h>=1.15?h/560:w/640;PS=s*dpr;VH=h/s;VW=w/s}
window.addEventListener('resize',resize);resize();applyLang();demo();hint('');

function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(replay){replay.i+=dt*60;const f=replay.f[Math.floor(replay.i)];if(!f)endReplay();else{render(f);if(f.banner&&f.banner!==lastBan)showBanner(f.banner);lastBan=f.banner}}
 else if(S){acc+=dt;let n=0;while(acc>=1/120&&n<12){step(1/120);acc-=1/120;n++}if(n>=12)acc=0;
  const v=snap();if(S.phase!=='title'&&(S.phase!=='end'||S.endT<1.2))S.rec.push(v);
  render(v);if(v.banner&&S.bannerT!==lastBan){lastBan=S.bannerT;showBanner(v.banner)}hud()}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
