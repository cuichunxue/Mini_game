<style>
:root{--y:#ffd23f;--r:#ff4d6d;--ink:#1a1030;--cream:#fff6dc;--g:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1030;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
 padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lbl{font-size:clamp(10px,2.8vmin,13px);font-weight:800;letter-spacing:.06em;opacity:.95;text-shadow:0 1px 2px #000a}
#dist{font-size:clamp(30px,9vmin,56px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;
 text-shadow:0 3px 0 #1a1030,0 0 10px #0007;-webkit-text-stroke:1px #1a1030}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
#bestV{font-size:clamp(15px,4.4vmin,22px);font-weight:900;text-shadow:0 2px 0 #1a1030,0 0 6px #0008;font-variant-numeric:tabular-nums}
#rival{white-space:nowrap;font-size:clamp(10px,2.8vmin,13px);font-weight:700;text-shadow:0 1px 2px #000c;max-width:46vw}
#bPause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid #1a1030;background:#fff;font-size:18px;
 box-shadow:0 3px 0 #1a1030;color:#1a1030;font-weight:900}
#bPause:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1030}
.mid{position:relative;flex:1}
#toast{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:#fff;color:#1a1030;border:3px solid #1a1030;
 border-radius:16px;padding:8px 14px;font-weight:900;font-size:clamp(14px,4vmin,20px);white-space:nowrap;box-shadow:0 4px 0 #1a1030;opacity:0;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#toast.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#toast.gold{background:var(--y)}
#toast.green{background:var(--g)}
@keyframes pop{0%{transform:translateX(-50%) scale(.3)}100%{transform:translateX(-50%) scale(1)}}
#warn{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--r);color:#fff;border:3px solid #fff;border-radius:12px;
 padding:8px 14px;font-weight:900;font-size:clamp(15px,4.4vmin,22px);white-space:nowrap;opacity:0;box-shadow:0 0 0 3px #1a1030,0 6px 18px #f008}
#warn.show{opacity:1;animation:blink .3s steps(2) infinite}
@keyframes blink{50%{background:#ffb000;color:#1a1030}}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px}
#guide{font-weight:900;font-size:clamp(15px,4.4vmin,22px);text-align:center;text-shadow:0 2px 0 #1a1030,0 0 8px #000a;min-height:1.3em;transition:transform .15s}
#guide.warn{color:var(--y)}
#guide.danger{color:#fff;background:var(--r);padding:4px 12px;border-radius:10px;border:3px solid #fff;animation:shake .12s infinite}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#bGo{pointer-events:auto;border:4px solid #1a1030;background:var(--y);color:#1a1030;font-weight:900;font-size:clamp(20px,6vmin,30px);
 padding:10px 28px;border-radius:999px;box-shadow:0 5px 0 #1a1030;animation:bob 1s ease-in-out infinite}
#bGo small{display:block;font-size:.45em;opacity:.8}
#bGo:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1030}
@keyframes bob{50%{transform:translateY(-4px)}}
.bars{width:min(94vw,520px);background:#1a1030cc;border:3px solid #1a1030;border-radius:14px;padding:7px 10px;display:grid;gap:5px}
.bar{display:grid;grid-template-columns:5.6em 1fr 2.6em;align-items:center;gap:8px;font-size:clamp(11px,3vmin,14px);font-weight:800}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.track{position:relative;height:13px;background:#ffffff26;border-radius:8px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px}
#stickF{background:linear-gradient(90deg,#c58b3c,#ffe9a8)}
#tenF{background:var(--g)}
.track.crit{animation:crit .18s steps(2) infinite}
@keyframes crit{50%{background:#ff4d6d88}}

 overflow-y:auto;touch-action:pan-y;z-index:5}
.dim{background:#1a103099;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.card{background:#fff;color:#1a1030;border:4px solid #1a1030;border-radius:22px;box-shadow:0 8px 0 #1a1030;padding:18px 18px 16px;width:min(92vw,430px);
 text-align:center;margin:auto}
.card h2{margin:0 0 12px;font-size:26px}
.btn{display:block;width:100%;border:3px solid #1a1030;background:#fff;color:#1a1030;font-weight:900;font-size:17px;padding:11px;border-radius:14px;
 box-shadow:0 4px 0 #1a1030;margin:9px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1030}
.btn.big{background:var(--y);font-size:23px;padding:14px}
.btn.small{font-size:14px;padding:9px 6px;margin:4px 0}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.pulse{animation:bob 1.1s ease-in-out infinite}
.tcard{width:min(92vw,430px);text-align:center;margin:auto}
.logo{font-weight:900;font-size:clamp(40px,13vmin,70px);line-height:.95;letter-spacing:.02em;color:var(--y);
 -webkit-text-stroke:3px #1a1030;paint-order:stroke fill;text-shadow:0 6px 0 #1a1030;transform:rotate(-4deg);margin-bottom:12px}
.logo .bean{font-size:.8em;-webkit-text-stroke:0;text-shadow:none;display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.copy{font-weight:900;font-size:clamp(14px,4vmin,18px);line-height:1.55;text-shadow:0 2px 0 #1a1030,0 0 8px #000a;margin:6px 0 14px}
.tinfo{font-size:13px;font-weight:800;background:#1a1030cc;border-radius:12px;padding:8px;margin:6px 0;line-height:1.6}
.rend{font-size:42px;line-height:1}
.rend div{font-size:20px;font-weight:900;margin-top:4px}
.rend p{font-size:13px;margin:4px 0 0;font-weight:700;opacity:.75}
.newrec{display:inline-block;background:var(--r);color:#fff;font-weight:900;padding:3px 12px;border-radius:8px;margin-top:8px;animation:bob .6s infinite}
.rdist{font-size:46px;font-weight:900;margin:6px 0 0;font-variant-numeric:tabular-nums}
.rtitle{font-weight:900;background:var(--y);display:inline-block;padding:2px 12px;border-radius:999px;border:2px solid #1a1030;font-size:15px}
.rinfo{font-size:13px;font-weight:700;text-align:left;background:#f4f0ff;border-radius:12px;padding:8px 10px;margin:10px 0 4px;line-height:1.6}
.rinfo .ems{font-size:20px;letter-spacing:2px;word-break:break-all}
.nf{color:#d11;font-weight:900}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0 12px}
.zi{background:#f4f0ff;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:800}
.zi span{display:block;font-size:24px}
.zi.lock{opacity:.4}
.zh{text-align:left;font-weight:900;margin:8px 0 2px}
.ach{text-align:left;font-size:13px;font-weight:700;line-height:1.7}
#shareImg{width:100%;border-radius:12px;border:2px solid #1a1030;margin-bottom:6px}
a.btn{text-decoration:none;box-sizing:border-box}

@media (max-height:520px){
 .screen{padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}

 .logo .bean{display:none}
 .copy{font-size:12px;margin:2px 0 6px;line-height:1.35}

 .btn.big{font-size:18px;padding:8px}
 .btn.small{font-size:12px;padding:6px 4px;margin:3px 0}
 .card{padding:10px 12px;border-radius:16px;box-shadow:0 5px 0 #1a1030}
 .card h2{font-size:20px;margin-bottom:6px}
 .resc{width:min(94vw,720px);display:grid;grid-template-columns:1fr 1.1fr;gap:4px 16px;align-items:center}
 .rend{font-size:30px}.rend div{font-size:16px;margin-top:2px}.rend p{font-size:11px}
 .rdist{font-size:32px;margin:2px 0 0}.rtitle{font-size:12px}.newrec{font-size:12px;margin-top:4px}
 .rinfo{font-size:11px;padding:5px 8px;margin:6px 0 0;line-height:1.45}.rinfo .ems{font-size:15px}
 #shareImg{max-height:40vh;object-fit:contain}
}
</style>
</head>

const AU={c:null,m:null,nb:null,lo:null,lg:null,
 init(){
  if(this.c){if(this.c.state==='suspended')this.c.resume();return;}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=this.c=new AC();
   this.m=c.createGain();this.m.gain.value=0.5;this.m.connect(c.destination);
   const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
   this.lo=c.createOscillator();this.lo.type='triangle';this.lo.frequency.value=200;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1500;
   this.lg=c.createGain();this.lg.gain.value=0;this.lo.connect(f);f.connect(this.lg);this.lg.connect(this.m);this.lo.start();
  }catch(e){this.c=null;}
 },
 ok(){return this.c&&SAVE.sound;},
 tone(f,d,type='sine',v=0.2,f2=null,delay=0){if(!this.ok())return;const c=this.c,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+0.05);},
 noise(d,v,f1,f2,q=1,type='bandpass',delay=0){if(!this.ok())return;const c=this.c,t=c.currentTime+delay,s=c.createBufferSource();s.buffer=this.nb;
  const fl=c.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(this.m);s.start(t,Math.random()*0.4);s.stop(t+d+0.05);},
 loop(vol,freq){if(!this.lg)return;const t=this.c.currentTime;this.lg.gain.setTargetAtTime(SAVE.sound?vol:0,t,0.06);this.lo.frequency.setTargetAtTime(freq,t,0.06);},
 squelch(st){this.noise(0.15,0.4,220+Math.random()*300,800+st*14,5);this.tone(150+Math.random()*90,0.1,'sine',0.13,65);},
 warn(){this.tone(880,0.12,'square',0.11);this.tone(660,0.12,'square',0.11,null,0.15);this.tone(880,0.12,'square',0.11,null,0.3);},
 beat(){this.tone(75,0.13,'sine',0.4,45);},
 snap(){this.noise(0.7,0.9,4500,120,0.7,'lowpass');this.tone(120,0.5,'sine',0.7,28);this.tone(1500,0.2,'sawtooth',0.18,150);},
 catchS(d){const s=d.snd||[600,400,'triangle'];this.tone(s[0],s[3]||0.2,s[2],0.17,s[1]);this.noise(0.12,0.25,900,300,3);},
 pop(){this.tone(520,0.08,'triangle',0.14,950);},
 jingle(good){const n=good?[523,659,784,1047,1319]:[440,415,392,370,262];n.forEach((f,i)=>this.tone(f,good?0.2:0.3,'square',0.09,null,i*(good?0.1:0.18)));},
 comeback(){[440,554,659,880,1109].forEach((f,i)=>this.tone(f,0.13,'triangle',0.16,null,i*0.06));},
 level(){[330,494,659,988].forEach((f,i)=>this.tone(f,0.16,'square',0.08,null,i*0.08));},
 click(){this.tone(900,0.05,'square',0.06);}
};

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot,0,Math.PI*2);ctx.fill();}
const EFONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const EMO={};
function emoC(e,px){const s=Math.min(256,Math.max(8,Math.round(px/8)*8));const k=e+'|'+s;let c=EMO[k];
 if(!c){c=document.createElement('canvas');c.width=c.height=Math.ceil(s*1.35);const x=c.getContext('2d');x.font=s+'px '+EFONT;x.textAlign='center';x.textBaseline='middle';
  x.fillText(e,c.width/2,c.height/2+s*0.07);EMO[k]=c;}return c;}
function emo(e,x,y,size,rot=0,alpha=1,flip=false){if(size<2)return;const c=emoC(e,size*DPR),d=size*1.35;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
 ctx.globalAlpha*=alpha;ctx.drawImage(c,-d/2,-d/2,d,d);ctx.restore();}
function otext(t,x,y,size,fill='#fff',stroke='#1a1030',align='center'){ctx.save();ctx.font='900 '+size+'px "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
 const mw=ctx.measureText(t).width;if(mw>W*0.94){size*=W*0.94/mw;ctx.font='900 '+size+'px "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';}
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*0.18);ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y);ctx.restore();}
function bubble(t,x,y,size){ctx.save();ctx.font='900 '+size+'px system-ui,sans-serif';const w=ctx.measureText(t).width+size*1.2,h=size*1.9;
 ctx.fillStyle='#fff';ctx.strokeStyle='#1a1030';ctx.lineWidth=3;rr(x-w/2,y-h/2,w,h,h/2.4);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(x-6,y+h/2-1);ctx.lineTo(x-14,y+h/2+12);ctx.lineTo(x+8,y+h/2-1);ctx.fill();ctx.stroke();
 ctx.fillStyle='#1a1030';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+1);ctx.restore();}
function mixCol(a,b,t){const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const A=p(a),B=p(b);
 return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';}

function drawWig(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#5a3216';for(const c of WIGC)circ(c[0],c[1],c[2]+1.5);
 ctx.fillStyle='#7b4a22';for(const c of WIGC)circ(c[0]-1,c[1]-1,c[2]);ctx.strokeStyle='#a0693a';ctx.lineWidth=1.6;

function drawBowl(x,y,r,stick=50,ang=0,detail=false){
 const ry=r*0.32;ctx.save();ctx.lineWidth=Math.max(1.5,r*0.05);ctx.strokeStyle='#1a1030';
 ctx.fillStyle='#1b2b5e';ell(x,y+r*0.72,r*0.4,r*0.1);
 ctx.fillStyle='#2a4590';ctx.beginPath();ctx.moveTo(x-r,y);ctx.bezierCurveTo(x-r,y+r*0.95,x+r,y+r*0.95,x+r,y);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.85)';for(let i=-2;i<=2;i++)circ(x+i*r*0.3,y+r*0.34-Math.abs(i)*r*0.05,r*0.055);
 ctx.fillStyle='#eef2fb';ell(x,y,r,ry);ctx.stroke();ctx.fillStyle='#6b3d14';ell(x,y+ry*0.08,r*0.9,ry*0.78);
 const n=detail?40:12,bs=r*(detail?0.07:0.1);
 const pts=[];
 for(let i=0;i<n;i++){const b=BEAN[i],a=b.a+ang*(0.6+b.r*0.6);pts.push([x+Math.cos(a)*b.r*r*0.8,y+ry*0.08+Math.sin(a)*b.r*ry*0.65-b.h*ry*0.25,b.rot+a]);}
 for(const p of pts){ctx.fillStyle='#a8651f';ell(p[0],p[1],bs,bs*0.68,p[2]);ctx.fillStyle='#d9954a';ell(p[0]-bs*0.25,p[1]-bs*0.2,bs*0.35,bs*0.2,p[2]);}
 if(stick>2){const a=Math.min(0.8,stick/120);ctx.strokeStyle='rgba(255,250,235,'+a+')';ctx.lineWidth=Math.max(0.8,r*0.012);
  const m=Math.floor(n*Math.min(1,stick/70));for(let i=0;i<m;i++){const p=pts[i],q=pts[(i+7)%n];ctx.beginPath();ctx.moveTo(p[0],p[1]);
   ctx.quadraticCurveTo((p[0]+q[0])/2,(p[1]+q[1])/2-ry*0.35*Math.sin(G?G.t*3+i:i),q[0],q[1]);ctx.stroke();}
  ctx.fillStyle='rgba(255,250,235,'+(stick/420)+')';ell(x,y+ry*0.08,r*0.85,ry*0.7);}
 ctx.restore();}

function mixBowl(){const land=W>H*1.1;const r=Math.min(W*0.34,H*(land?0.17:0.2),230);return{x:W/2,y:H*(land?0.47:0.58),r};}
function mixMove(x,y,dtm){
 const b=mixBowl(),dx=x-b.x,dy=y-b.y,r=Math.hypot(dx,dy);G.px=x;G.py=y;
 if(r<b.r*0.1||r>b.r*2.6){G.ang=null;return;}
 const a=Math.atan2(dy,dx);
 if(G.ang!==null){let da=a-G.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  if(Math.abs(da)<1.3){
   G.dirAcc=G.dirAcc*0.85+da;const eff=(Math.sign(da)===Math.sign(G.dirAcc))?Math.abs(da):0;
   G.angVel=lerp(G.angVel,Math.abs(da)/(dtm/1000),0.2);
   G.radii.push(r);if(G.radii.length>28)G.radii.shift();
   let sm=1;if(G.radii.length>8){const m=G.radii.reduce((s,v)=>s+v,0)/G.radii.length;const sd=Math.sqrt(G.radii.reduce((s,v)=>s+(v-m)*(v-m),0)/G.radii.length);sm=clamp(1.15-(sd/m)*2.2,0.3,1);}
   const w=G.angVel;const sp=w<1.5?0.55:w<3?lerp(0.55,1,(w-1.5)/1.5):w<=12?1:Math.max(0.3,1-(w-12)/16);
   G.mixAng+=da;G.rotAcc+=eff;const rots=G.rotAcc/(Math.PI*2);const ov=rots>24?0.1:1;
   G.q={s:sp,m:sm,o:ov};
   G.stick=Math.min(100,G.stick+eff/(Math.PI*2)*12*sp*sm*ov*(1-G.stick/108));G.stickMax=Math.max(G.stickMax,G.stick);
   G.sq+=eff;if(G.sq>1.1){G.sq=0;AU.squelch(G.stick);if(Math.random()<0.5)G.parts.push({x:x,y:y,vx:rand(-60,60),vy:rand(-160,-60),life:0.6,ty:'drop',s:rand(2,4)});}
  }}
 G.ang=a;}
function pullMove(x,y,px,py){const upd=py-y,dx=x-px;G.tipTarget=clamp(x,W*0.25,W*0.75);
 if(upd>0.4&&upd>Math.abs(dx)*0.7)G.acc+=upd/H;}

 for(const o of G.objs)if(o.st==='stuck'){const k=t-o.tt;d+=o.dx*0.5*Math.exp(-k*k/0.006);}return d;}

 o.vx=-o.side*260;o.dx=0;o.bias=0;o.tt=0.88;{const p=thrPt(o.tt,pullGeom());o.pos={x:p.x,y:p.y+12+objSize(o.d)*0.45};}discover(o.d);AU.catchS(o.d);G.shake=Math.max(G.shake,Math.min(1,0.25+Math.abs(o.d.w)*0.04));

/* ---------- journey-map pacing ----------
 pull-time(s) -> target log10(distance). Pull starts ~10s into a run, so:
 car/cow (surprise) 25-40s, UFO (laughs) 40-60s, Earth/Level4 (tension) 60-80s, snap 80-90s */
const PACE=[[0,0],[15,1],[28,2],[37,2.6],[45,3],[55,4],[75,4.8],[120,5.6]];
function paceZ(tp){for(let i=1;i<PACE.length;i++)if(tp<=PACE[i][0]){const a=PACE[i-1],b=PACE[i];return lerp(a[1],b[1],(tp-a[0])/(b[0]-a[0]));}return PACE[PACE.length-1][1];}
/* ---------- update ---------- */
function update(dt){
 G.t+=dt;G.shake=Math.max(0,G.shake-dt*2.2);G.warnFlash=Math.max(0,G.warnFlash-dt);
 if(phase==='mix')updMix(dt);
 else if(phase==='trans'){G.transT+=dt;updPull(dt,true);if(G.transT>=0.7){phase='pull';lvlBanner(0);}}
 else if(phase==='pull')updPull(dt,false);
 else if(phase==='snap'){G.snapT+=dt;updObjs(dt);if(G.snapT>1.0)startEnding();}
 else if(phase==='ending'||phase==='result'){G.endT+=dt;if(phase==='ending'&&G.endT>=2.2&&!G.shot)grabShot();if(phase==='ending'&&G.endT>4.6)showResult();}

 let cx,cy;if(ptr.down&&G.px!=null){cx=clamp(G.px,b.x-b.r*0.8,b.x+b.r*0.8);cy=clamp(G.py,b.y-b.r*0.22,b.y+b.r*0.22);}else{cx=b.x+Math.cos(G.t*2)*b.r*0.3;cy=b.y+Math.sin(G.t*2)*b.r*0.08;}
 if(G.stick>5){ctx.strokeStyle='rgba(255,250,235,'+Math.min(0.8,G.stick/110)+')';ctx.lineWidth=1.2;for(let i=0;i<Math.floor(G.stick/12);i++){ctx.beginPath();ctx.moveTo(cx,cy);
   ctx.quadraticCurveTo(cx+Math.sin(G.t*4+i)*30,cy-20-i*6,b.x+Math.cos(i*1.7)*b.r*0.6,b.y+Math.sin(i*1.7)*b.r*0.18);ctx.stroke();}}
 drawChop(cx-4,cy,cx+b.r*0.9,cy-b.r*1.7,5*U);drawChop(cx+4,cy+2,cx+b.r*1.15,cy-b.r*1.6,5*U);
 const rots=Math.floor(G.rotAcc/(Math.PI*2));otext('🌀 '+rots+T('rot'),W>H*1.1?b.x+b.r*1.9:b.x,W>H*1.1?b.y:b.y+b.r*1.05,22*U,'#fff');

}

/* ---------- endings ---------- */
function endFace(t){const u=Math.min(W,H);
 if(t<0.55){drawBG(0.1,G.t,{});const s=u/300;drawHero(W/2,H*0.8,s,{face:'panic'});const k=t/0.55;nattoBlob(W/2,lerp(-60,H*0.8-80*s,k),lerp(10,46,k)*U);return;}
 const k=t-0.55;ctx.save();ctx.translate(W/2,H*0.55);ctx.rotate(G.t*0.3);
 for(let i=0;i<16;i++){ctx.fillStyle=i%2?'#ffd23f':'#ff9f1c';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Math.max(W,H),i/16*Math.PI*2,(i+1)/16*Math.PI*2);ctx.fill();}ctx.restore();
 const R=u*0.3*(1+0.06*Math.sin(k*14)*Math.max(0,1-k*1.5)),cx=W/2,cy=H*0.56;
 ctx.fillStyle='#ffd7b0';ctx.strokeStyle='#1a1030';ctx.lineWidth=4;circ(cx-R*0.95,cy,R*0.18);circ(cx+R*0.95,cy,R*0.18);circ(cx,cy,R);ctx.stroke();
 drawWig(cx,cy-R*0.82,R/24);
 const blink=(k*2.5)%1>0.88;ctx.fillStyle='#fff';ell(cx-R*0.35,cy-R*0.1,R*0.16,blink?R*0.02:R*0.18);ell(cx+R*0.35,cy-R*0.1,R*0.16,blink?R*0.02:R*0.18);
 if(!blink){ctx.fillStyle='#1a1030';circ(cx-R*0.33,cy-R*0.08,R*0.07);circ(cx+R*0.37,cy-R*0.08,R*0.07);}
 ctx.fillStyle='rgba(255,250,235,.55)';ell(cx,cy+R*0.35,R*0.75,R*0.45);
 const n=Math.min(FACEB.length,Math.floor(k*90));
 for(let i=0;i<n;i++){const b=FACEB[i];if(Math.abs(b.y+0.1)<0.12&&Math.abs(Math.abs(b.x)-0.35)<0.14)continue;const x=cx+b.x*R,y=cy+b.y*R;
  if(b.str){ctx.strokeStyle='rgba(255,250,235,.75)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+Math.sin(G.t*2+i)*12,y+R*0.3,x+Math.sin(i)*8,y+R*0.45+Math.sin(G.t*3+i)*8);ctx.stroke();}
  ctx.fillStyle='#a8651f';ell(x,y,R*0.075,R*0.05,b.rot);ctx.fillStyle='#d9954a';ell(x-R*0.02,y-R*0.015,R*0.03,R*0.016,b.rot);}
 if(k>0.6)otext(SAVE.lang==='ja'?'ネバ〜…':'Sticky…',cx+R*0.9,cy-R*0.9+Math.sin(G.t*3)*5,22*U,'#fff');}
function endCar(t){drawBG(0.05,G.t,{noPeople:true});const s=Math.min(W,H)/300,hx=W/2,hy=H*0.8,bald=t>1.15;
 drawHero(hx,hy,s,{face:t<1.15?'panic':t<2.3?'shock':'blank',bald,arms:'none'});
 const hdx=hx,hdy=hy-92*s;let cx,cy,rot;
 if(t<1.15){const k=ease(t/1.15);cx=lerp(W+90,hdx,k);cy=lerp(-80,hdy,k)-Math.sin(k*Math.PI)*H*0.15;rot=k*Math.PI*4;}
 else{const k=ease((t-1.15)/1.2);cx=lerp(hdx,-160,k);cy=lerp(hdy,H*0.22,k)-Math.sin(k*Math.PI)*H*0.12;rot=k*Math.PI*3;}
 const cs=Math.min(W,H)*0.24;emo('🚗',cx,cy,cs,rot);if(bald){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);drawWig(0,-cs*0.35,s*1.1);ctx.restore();}
 if(t>1.1&&t<1.5)otext(SAVE.lang==='ja'?'スポーン！':'SHWOOP!',hdx,hdy-60*s,30*U,'#ffd23f');
 if(bald&&Math.floor(G.t*4)%2)emo('✨',hx-10*s,hy-104*s,24*U);
 if(t>2.4)bubble(SAVE.lang==='ja'?'…あれ？涼しい':'…why so breezy?',hx+70*s,hy-140*s,15*U);}
function endSumo(t){drawBG(0.05,G.t,{noPeople:true});const s=Math.min(W,H)/300,gy=H*0.8;
 ctx.fillStyle='#e6c88f';ell(W/2,gy+10*s,W*0.48,40*s);ctx.strokeStyle='#f4f1e6';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(W/2,gy+10*s,W*0.4,30*s,0,0,Math.PI*2);ctx.stroke();
 const sx=t<0.8?lerp(W*0.12,W*0.38,ease(t/0.8)):W*0.38;drawSumo(sx,gy-38*s*1.5,s*1.5,t>1.1?1:0);
 if(t<1.0){drawHero(W*0.64+(t>0.8?Math.sin(G.t*40)*3:0),gy,s,{face:'panic'});}
 else{const k=clamp((t-1)/1.3,0,1);const x=lerp(W*0.62,W*0.88,k),y=lerp(gy,H*0.12,ease(k))-Math.sin(k*Math.PI)*H*0.2;ctx.save();ctx.translate(x,y);ctx.rotate(k*12);drawHero(0,40*s*(1-k),s*(1-k*0.9),{face:'panic'});ctx.restore();}
 if(t>1.0&&t<2.4)bubble(SAVE.lang==='ja'?'どすこーい！':'DOSUKOI!',sx,gy-130*s,16*U);
 if(t>2.3){const p=1+0.3*Math.sin(G.t*10);emo('✨',W*0.88,H*0.12,40*U*p);otext(SAVE.lang==='ja'?'キラーン☆':'Twinkle☆',W*0.72,H*0.2,22*U,'#ffd23f');}}
function endAlien(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090926');g.addColorStop(1,'#33206b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff';for(const s of STARS){ctx.globalAlpha=0.5+0.5*Math.sin(G.t*2+s.p);circ(s.x*W,s.y*H*0.8,s.r);}ctx.globalAlpha=1;
 const s=Math.min(W,H)/300,gy=H*0.8;ctx.fillStyle='#1d3b2a';ctx.fillRect(0,gy,W,H);
 const ux=W/2+Math.sin(G.t*2)*12,uy=H*0.24;
 if(t>0.4&&t<2.3){ctx.fillStyle='rgba(255,240,120,'+(0.22+0.08*Math.sin(G.t*12))+')';ctx.beginPath();ctx.moveTo(ux-20*s,uy+20*s);ctx.lineTo(ux+20*s,uy+20*s);ctx.lineTo(W/2+60*s,gy);ctx.lineTo(W/2-60*s,gy);ctx.fill();}
 drawHero(W/2,gy,s,{face:t<2?'panic':'cry',bowl:t<0.6,stick:60});
 if(t>=0.6&&t<2.1){const k=ease((t-0.6)/1.4);drawBowl(W/2,lerp(gy-50*s,uy+20*s,k),24*s*(1-k*0.5),60,G.t*3);}
 emo('🛸',ux,uy,Math.min(W,H)*0.3);
 if(t>2.0){const k=ease((t-2)/0.35);const ax=ux,ay=uy-Math.min(W,H)*0.14*k;emo('👽',ax,ay,Math.min(W,H)*0.17*k);
  const wv=Math.sin(G.t*10)*0.4;ctx.save();ctx.translate(ax+40*s,ay-10*s);ctx.rotate(wv);drawChop(0,0,8*s,-60*s,4*U);drawChop(8*s,0,18*s,-58*s,4*U);ctx.restore();
  if(t>2.4)bubble('NATTO GET!! 🏆',ax,ay-70*s,16*U);}}
function endEarth(t){ctx.fillStyle='#8fd3ff';ctx.fillRect(0,0,W,H);const a=Math.PI*ease((t-0.3)/1.3);const s=Math.min(W,H)/300;
 ctx.save();if(t>0.3&&t<1.6){ctx.translate(rand(-4,4),rand(-4,4));}ctx.translate(W/2,H/2);ctx.rotate(a);ctx.translate(-W/2,-H/2);
 drawBG(0.12,G.t,{noPeople:true});const gy=H*0.8;drawHero(W/2,gy,s,{face:t<1.6?'panic':'shock'});
 const ppl=['😱','🙀','🐄','👵','🐕'];ppl.forEach((e,i)=>emo(e,W*(0.12+i*0.19)+(i===2?0:0),gy-18*s,30*s));ctx.restore();
 if(t>1.5){const items=['🍙','🧦','🚗','📱','🫘','👟'];items.forEach((e,i)=>{const yy=((t-1.5)*H*0.5+i*H*0.17)%(H*0.9);emo(e,W*(0.1+i*0.16),H*0.25+yy*0.8,26*U,G.t*3+i);});}
 if(t>2.2)otext(SAVE.lang==='ja'?'天井に張りついた…！':'Stuck to the ceiling…!',W/2,H*0.62,20*U,'#fff');}
function infScene(d){ctx.fillStyle='#07071c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<60;i++){const s=STARS[i];circ(s.x*W,s.y*H,s.r*1.3);}
 const s=Math.min(W,H)/280;const gx=W/2,gy=H*0.88;drawHero(gx,gy,s,{face:'happy',bowl:true,stick:80});
 const fx=W*0.29,fy=H*0.1,k=0.42;
 ctx.strokeStyle='rgba(255,246,220,.95)';ctx.lineWidth=2.5/1;ctx.beginPath();ctx.moveTo(gx,gy-50*s);ctx.quadraticCurveTo(gx+Math.sin(G.t*2)*20,(gy+fy+H*k)/2,W/2,fy+H*k);ctx.stroke();
 if(d>0){ctx.save();ctx.translate(fx,fy);ctx.scale(k,k);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();infScene(d-1);ctx.restore();}
 ctx.strokeStyle='#ffd23f';ctx.lineWidth=5;ctx.strokeRect(fx,fy,W*k,H*k);}
function endInf(t){const k=0.42,fx=W*0.29,fy=H*0.1;const px=fx/(1-k),py=fy/(1-k);const f=(t*0.45)%1;const sc=Math.pow(1/k,f);

const ENDF={face:endFace,car:endCar,sumo:endSumo,alien:endAlien,earth:endEarth,inf:endInf};

 if(phase==='ending'){const k=ease((t-0.3)/0.4),s=0.6+0.4*k+0.15*Math.sin(Math.min(1,(t-0.3)/0.4)*Math.PI);ctx.save();ctx.globalAlpha=k;
  otext(G.ending.em+' '+NM(G.ending),W/2,H*0.13,30*U*s,'#ffd23f');otext(SAVE.lang==='ja'?G.ending.sja:G.ending.sen,W/2,H*0.13+38*U,Math.min(16*U,W/26),'#fff');
  ctx.globalAlpha=0.6+0.4*Math.sin(G.t*4);otext(T('skip'),W/2,H-40-(parseInt(getComputedStyle(document.body).paddingBottom)||0),14*U,'#fff');ctx.restore();}}

 const its=['🐄','🛸','🚗','🌍','🧦','🏠','🌙','🐋'];its.forEach((e,i)=>{const y=H-((t*40+i*H/its.length*1.3)%(H*1.3));emo(e,W*(0.1+((i*0.37)%0.8)),y,(30+i*4)*U,Math.sin(t+i)*0.5);});
 ctx.strokeStyle='rgba(255,246,220,.8)';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(W/2,H*0.86);ctx.quadraticCurveTo(W/2+Math.sin(t*1.5+i)*60,H*0.4,W/2+(i-1.5)*30,-10);ctx.stroke();}
 drawBowl(W/2,H*0.86,50*s,70,t,false);}

 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const F='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
 const g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#2b1b5a');g.addColorStop(1,'#ff4d6d');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 if(G.shot){const sw=G.shot.width,sh=G.shot.height,tr=1000/640;let w=sw,h=sw/tr;if(h>sh){h=sh;w=sh*tr;}x.save();x.beginPath();x.roundRect?x.roundRect(40,170,1000,640,30):x.rect(40,170,1000,640);x.clip();
  x.drawImage(G.shot,(sw-w)/2,(sh-h)/2,w,h,40,170,1000,640);x.restore();x.strokeStyle='#fff';x.lineWidth=8;x.strokeRect(40,170,1000,640);}

 tx('🫘 NATTO CHAOS KING',110,64,'#ffd23f');tx(fmt(G.L),950,130);tx(G.ending.em+' '+NM(G.ending),1050,58,'#ffd23f');tx('👑 '+titleOf(G.L),1135,46);
 const ems=G.caught.slice(0,14).map(id=>ICON(ALL.find(d=>d.id===id))).join('');x.font='54px '+EFONT;x.textAlign='center';x.fillText(ems,540,1225);
 tx(SAVE.lang==='ja'?'混ぜろ！伸ばせ！世界を巻き込め！':'Mix it! Stretch it! Drag the world in!',1310,36);
 c.toBlob(async b=>{if(!b)return;const text=T('shareText',{d:fmt(G.L),e:NM(G.ending)});
  try{const file=new File([b],'natto-chaos-king.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const url=URL.createObjectURL(b);$('shareImg').src=url;$('shareDl').href=url;show('shareS',true);},'image/png');}

/* ---------- HUD ---------- */
let hudCache={};
function setT(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function updHUD(){if(!G)return;setT('dist',fmt(G.L));setT('bestV',fmt(Math.max(SAVE.best,G.L>G.startBest?G.L:0)));
 const st=Math.round(G.stick),tn=Math.round(Math.min(G.tension,100));$('stickF').style.width=st+'%';setT('stickN',''+st);
 $('tenF').style.width=tn+'%';setT('tenN',''+tn);$('tenF').style.background=G.tension<60?'#3ddc84':G.tension<85?'#ffd23f':'#ff4d6d';
 $('tenT').classList.toggle('crit',G.tension>=100);
 const nx=RIVALS.find(r=>r.d>G.L);setT('rival',nx?'🎯 '+T('next')+': '+NM(nx)+' '+fmt(nx.d):'👑');}

/* ---------- loop ---------- */
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 try{
  if(G&&!paused)update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(phase==='title'||!G){drawTitleBG(now/1000);}
  else{ctx.save();if(G.shake>0){const m=G.shake*9;ctx.translate(rand(-m,m),rand(-m,m));}
   if(phase==='mix')drawMix();else if(phase==='trans'||phase==='pull'||phase==='snap')drawPull();else drawEnding(G.endT);ctx.restore();
   if(phase==='mix'||phase==='trans'||phase==='pull'||phase==='snap')updHUD();}
 }catch(err){console.error(err);}
 requestAnimationFrame(frame);}

/* ---------- buttons ---------- */
const on=(id,f)=>$(id).addEventListener('click',e=>{e.stopPropagation();AU.init();f();});
on('tStart',()=>{AU.click();startGame();});on('tSound',toggleSound);on('tLang',toggleLang);on('tZukan',zukan);
on('bPause',()=>setPause(true));on('bGo',startPull);
on('pResume',()=>setPause(false));on('pRetry',()=>{setPause(false);startGame();});on('pTitle',()=>{setPause(false);toTitle();});on('pSound',toggleSound);on('pLang',toggleLang);
on('rRetry',startGame);on('rShare',shareImage);on('rZukan',zukan);on('rTitleB',toTitle);
on('zClose',()=>show('zukS',false));on('shareClose',()=>show('shareS',false));
['bPause','bGo'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));
applyLang();requestAnimationFrame(frame);
window.__NCK={get G(){return G},get phase(){return phase},startGame,startPull};
})();
