<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF1D2">
<meta name="description" content="One spaghetti. One tap. Snap it perfectly in half... or enjoy the chaos.">
<title>PASTA SNAP KING</title>
<style>
:root{
  --bg:#FFF1D2; --ink:#2B1B12; --tomato:#E5452B; --gold:#F2B33D; --pasta:#F3C766;
  --basil:#3E9B57; --card:#FFFDF7; --muted:#8A6F5A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 35%,#FFF8E6 0%,var(--bg) 60%,#F8E2B4 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

.top{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 12px) 16px 0;display:flex;
  justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.brand .title{font-weight:900;font-size:clamp(17px,4.6vw,24px);letter-spacing:.04em;line-height:1}
.brand .title i{font-style:normal;color:var(--tomato)}
.brand .best{margin-top:6px;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.brand .best b{color:var(--ink);font-size:16px;margin-left:4px}
.tools{display:flex;gap:8px;pointer-events:auto}
.icon{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 2px 0 rgba(43,27,18,.15),0 6px 16px rgba(43,27,18,.08);
  display:grid;place-items:center}
.icon svg{width:22px;height:22px}
.icon:active{transform:translateY(1px)}

.msg{position:absolute;left:0;right:0;top:calc(var(--st) + 74px);text-align:center;pointer-events:none;z-index:1;transition:opacity .15s}
#headline{font-weight:900;font-size:clamp(32px,9vw,56px);letter-spacing:.02em;color:var(--tomato);line-height:1.05;
  text-shadow:0 3px 0 rgba(43,27,18,.12)}
#combo{height:24px;margin-top:6px;font-weight:900;font-size:18px;letter-spacing:.12em;color:var(--basil)}
#combo.bump{animation:bump .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{from{transform:scale(1.8)}}
#subline{margin-top:8px;font-weight:800;font-size:clamp(13px,3.6vw,17px);letter-spacing:.16em}

.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(var(--sb) + 18px);display:flex;flex-direction:column;
  align-items:center;gap:12px;pointer-events:none;z-index:2}
#prompt{font-weight:900;font-size:clamp(16px,4.6vw,22px);letter-spacing:.12em;animation:pulse 1.1s ease-in-out infinite;text-align:center}
@keyframes pulse{50%{transform:scale(1.06);opacity:.75}}
#twistBtn{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;background:#fff;
  box-shadow:0 2px 0 rgba(43,27,18,.15),0 6px 16px rgba(43,27,18,.08);min-height:48px}
#twistBtn .sw{width:40px;height:24px;border-radius:12px;background:#E3D3BC;position:relative;transition:background .15s;flex:none}
#twistBtn .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
#twistBtn[aria-pressed="true"] .sw{background:var(--basil)}
#twistBtn[aria-pressed="true"] .sw::after{transform:translateX(16px)}
#twistBtn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
#twistBtn .lbl span{font-weight:900;letter-spacing:.1em;font-size:14px}
#twistBtn .lbl small{font-weight:800;letter-spacing:.1em;font-size:11px;color:var(--muted)}

.overlay{position:absolute;inset:0;z-index:3;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(var(--st) + 64px) 16px 16px}
.overlay[hidden]{display:none}
.card{width:min(420px,100%);background:var(--card);border-radius:24px;padding:18px 18px 16px;text-align:center;
  box-shadow:0 4px 0 rgba(43,27,18,.14),0 18px 40px rgba(43,27,18,.16);animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.rtitle{font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1;letter-spacing:.02em;color:var(--tomato)}
.rtitle.gold{color:#C98A00;text-shadow:0 0 18px rgba(242,179,61,.7)}
.rquip{margin-top:6px;font-weight:700;color:var(--muted);font-size:15px}
.rrow{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:#FFF3DA;border-radius:14px;padding:8px 4px}
.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
.stat b{display:block;font-size:24px;font-weight:900;margin-top:2px}
.g-PERFECT{color:#C98A00}.g-GREAT{color:var(--basil)}.g-GOOD{color:#2F7FBF}.g-MISS{color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;min-height:0}
.badge{font-size:11px;font-weight:900;letter-spacing:.12em;padding:5px 10px;border-radius:999px;background:var(--ink);color:#fff}
.badge.hot{background:var(--tomato)}.badge.gold{background:var(--gold);color:var(--ink)}
.note{margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
.again{margin-top:12px;font-weight:900;letter-spacing:.14em;font-size:15px;animation:pulse 1.1s ease-in-out infinite}

#stats{background:rgba(43,27,18,.35);align-items:center}
#stats .card{text-align:left}
#stats h2{margin:0 0 10px;font-size:22px;font-weight:900;letter-spacing:.06em}
.srow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #E8D7BD;font-weight:800;font-size:14px;letter-spacing:.06em}
.srow b{font-size:16px}
.chaos{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.chip{aspect-ratio:1;border-radius:12px;background:#F1E4CF;display:grid;place-items:center;font-weight:900;color:#C7B293;font-size:16px}
.chip.on{background:var(--pasta);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.chip.on.two{background:var(--gold)}
.chaos-cap{margin-top:6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.close{margin-top:14px;width:100%;padding:12px;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;letter-spacing:.14em}

@media (max-height:520px){
  .msg{top:calc(var(--st) + 52px)}
  #headline{font-size:24px}
  #subline{margin-top:4px;font-size:12px}
  #combo{height:16px;font-size:13px;margin-top:2px}
  .brand .best{margin-top:4px}
  .overlay{padding-top:calc(var(--st) + 6px);align-items:center;padding-bottom:calc(var(--sb) + 56px)}
  .card{padding:10px 14px;width:min(350px,100%)}
  .rquip{display:none}.badges{margin-top:6px}.note{margin-top:6px}.again{margin-top:6px}
  .rtitle{font-size:28px}
  .rrow{margin-top:8px}.stat b{font-size:20px}
  .bottom{flex-direction:row;justify-content:center;gap:18px;padding-bottom:calc(var(--sb) + 10px)}
}
@media (prefers-reduced-motion:reduce){#prompt,.again{animation:none}.card{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand">

<script id="core">
/* ---------- Pure game logic (testable, no DOM) ---------- */
const PSK = (function () {
  'use strict';
  // Conditional distribution when the snap is NOT a clean 2-piece break (sums to 100%)
  const DIST = [[3, .45], [4, .25], [5, .15], [6, .08], [7, .05], [8, .02]];
  const BASE_P2 = 0.25;

  // E = |p - 50|, S = round(max(0, 100 - 4E))
  function score(p) {
    const E = Math.abs(p - 50);
    const S = Math.round(Math.max(0, 100 - 4 * E));
    const grade = E <= 1 ? 'PERFECT' : E <= 3 ? 'GREAT' : E <= 7 ? 'GOOD' : 'MISS';
    return { E, S, grade };
  }
  // P2(t) = 0.15 + 0.75 * exp(-((t-65)/24)^2)   (game model, not real physics)
  function p2Twist(t) { return 0.15 + 0.75 * Math.exp(-Math.pow((t - 65) / 24, 2)); }

  function pieceCount(P2, rand) {
    if (rand() < P2) return 2;
    const r = rand(); let acc = 0;
    for (const [n, w] of DIST) { acc += w; if (r < acc) return n; }
    return 8;
  }
  // n-1 break points (percent). The primary break is where the player snapped.
  function makeBreaks(n, primary, rand) {
    primary = Math.min(97, Math.max(3, primary));
    const pts = [primary];
    let gap = 4;
    while (pts.length < n - 1) {
      let ok = false;
      for (let i = 0; i < 300 && !ok; i++) {
        const c = gap + rand() * (100 - 2 * gap);
        if (pts.every(b => Math.abs(b - c) >= gap)) { pts.push(c); ok = true; }
      }
      if (!ok) gap *= 0.7;
    }
    return pts.sort((a, b) => a - b);
  }
  // Segments [a,b] in percent; lengths telescope so the sum is exactly 100%.
  function segments(breaks) {
    const e = [0, ...breaks, 100], s = [];
    for (let i = 0; i < e.length - 1; i++) s.push([e[i], e[i + 1]]);
    return s;
  }
  function outcome(n, E) {
    if (n === 2) return E <= 1 ? 'PERFECT SNAP' : (E > 7 ? 'OFF-CENTER SNAP' : 'CLEAN SNAP');
    if (n === 3) return 'TRIPLE TROUBLE';
    if (n <= 5) return 'PASTA RAIN';
    return 'PASTA DISASTER';
  }
  // Full resolution of one snap. Precision is fixed by input and never reduced by chaos.
  function resolve(p, twist, rand) {
    const sc = score(p);
    const P2 = twist == null ? BASE_P2 : p2Twist(twist);
    const n = pieceCount(P2, rand);
    const breaks = makeBreaks(n, p, rand);
    return { p, twist, P2, n, breaks, segs: segments(breaks), ...sc, outcome: outcome(n, sc.E),
             perfectSnap: n === 2 && sc.E <= 1 };
  }
  return { DIST, BASE_P2, score, p2Twist, pieceCount, makeBreaks, segments, outcome, resolve };
})();
</script>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const app = $('app');

/* ---------- Tuning ---------- */
const SWEEP = 1000;        // ms for marker to travel one way
const TWIST_SWEEP = 1300;  // ms for twist gauge 0 -> 100
const M_MIN = 4, M_MAX = 96;
const RESULT_DELAY = 750;  // break animation length (<= 1s)
const INPUT_LOCK = 160;

/* ---------- Records ---------- */
const STORE = 'pastaSnapKing_v7';
const rec = (function load() {
  const d = { best: 0, perfects: 0, streak: 0, bestStreak: 0, total: 0, chaos: {}, muted: false, twist: false };
  try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && typeof s === 'object') Object.assign(d, s); } catch (e) {}
  if (!d.chaos || typeof d.chaos !== 'object') d.chaos = {};
  return d;
})();
function save() { try { localStorage.setItem(STORE, JSON.stringify(rec)); } catch (e) {} }

/* ---------- Layout ---------- */
let W = 0, H = 0, DPR = 1, L = 0, x0 = 0, py = 0, th = 8, floorY = 0, G = 2400;
function layout() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const msgB = $('msg').getBoundingClientRect().bottom;
  const botT = $('bottom').getBoundingClientRect().top;
  const landscapeShort = H < 520;
  floorY = Math.max(msgB + 70, botT - (landscapeShort ? 8 : 20));
  if (floorY > H - 10) floorY = H - 10;
  L = Math.min(W * (landscapeShort ? 0.62 : 0.8), 620);
  x0 = (W - L) / 2;
  th = Math.max(6, Math.min(11, L * 0.02));
  py = msgB + (floorY - msgB) * 0.42;
  G = Math.max(1800, H * 3);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------- Audio (Web Audio, generated) ---------- */
let AC = null, master = null, noiseBuf = null;
function audioInit() {
  try {
    if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C();
    master = AC.createGain(); master.gain.value = rec.muted ? 0 : 0.9;
    try { const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.001; comp.release.value = 0.12; master.connect(comp); comp.connect(AC.destination); } catch (e) { master.connect(AC.destination); }
    const len = Math.floor(AC.sampleRate * 0.3);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
const canPlay = () => !!(AC && master && !rec.muted && AC.state === 'running');
function nz(t, type, freq, q, dur, vol) {      // filtered noise burst
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random() * 0.2, dur + 0.02);
}
function os(t, type, f0, f1, dur, vol) {          // pitched sweep
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
// Dry-pasta snap: click transient + crack body + splinter fizz + brittle ring (+ weight on the first hit)
function snapSfx(delay, pitch, vol) {
  if (!canPlay()) return;
  try {
    const t = AC.currentTime + (delay || 0);
    pitch = pitch || 1; vol = vol || 1;
    nz(t, 'highpass', 5200, 0.7, 0.012, 1.0 * vol);
    nz(t, 'bandpass', 1900 * pitch, 1.4, 0.055, 0.9 * vol);
    nz(t + 0.004, 'bandpass', 4200 * pitch, 3, 0.03, 0.5 * vol);
    os(t, 'triangle', 3900 * pitch, 1200 * pitch, 0.03, 0.25 * vol);
    os(t, 'sine', 2500 * pitch, 1800 * pitch, 0.08, 0.2 * vol);
    if (!delay) os(t, 'sine', 190, 60, 0.07, 0.5 * vol);
  } catch (e) {}
}
function tone(freq, delay, dur, vol, type, endFreq) {
  if (!canPlay()) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  tick: () => tone(1500 * Math.pow(1.04, Math.min(combo, 12)), 0, 0.035, 0.06, 'sine'),
  zone: () => tone(990, 0, 0.06, 0.06, 'triangle'),
  chime: k => { const m = Math.pow(2, Math.min(k || 0, 12) / 12); tone(1046 * m, 0.05, 0.16, 0.18); tone(1318 * m, 0.12, 0.16, 0.18); tone(1568 * m, 0.19, 0.32, 0.2); tone(2093 * m, 0.27, 0.4, 0.12); },
  creak: t => tone(200 + t * 9, 0, 0.03, 0.04, 'sawtooth'),
  clack: (v, rel) => { if (!canPlay()) return; try { const f = 1400 + (1 - rel) * 2600; nz(AC.currentTime, 'bandpass', f, 4, 0.03, 0.3 * v); os(AC.currentTime, 'triangle', f, f * 0.8, 0.025, 0.07 * v); } catch (e) {} },
  thud: d => tone(150, d || 0, 0.28, 0.5, 'sine', 45),
};
function buzz(p) { try { if (!rec.muted && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

function playBreak(n) {
  const r = () => 0.85 + Math.random() * 0.35;
  if (n === 2) { snapSfx(0, 1.05 * r(), 1); buzz(25); }
  else if (n === 3) { snapSfx(0, r(), 1); snapSfx(0.17 + Math.random() * 0.05, 1.25 * r(), 0.8); buzz([20, 140, 20]); }
  else if (n <= 5) { for (let i = 0; i < n - 1; i++) snapSfx(i * (0.05 + Math.random() * 0.03), r() * (1 + i * 0.06), 1 - i * 0.12); buzz([15, 40, 15, 40, 15]); }
  else { for (let i = 0; i < 6; i++) snapSfx(i * (0.035 + Math.random() * 0.025), r() * (0.9 + i * 0.08), 1 - i * 0.1); sfx.thud(0.05); buzz([40, 30, 40, 30, 80]); }
}

/* ---------- State ---------- */
let state = 'ready';        // ready | twist | snap | result
let t0 = performance.now();  // marker phase origin
let pFixed = 50, twistStart = 0, twistNow = 0, wasInZone = false;
let snapAt = 0, resultAt = 0, lockUntil = 0;
let last = null;
let frags = [], crumbs = [];
let shake = 0, flash = 0, wasNear = false;
let held = null;                 // 'pointer' | 'key' | null
let activePointer = null;

const tri = x => { const f = ((x % 2) + 2) % 2; return f < 1 ? f : 2 - f; };
let combo = 0, roundSweep = SWEEP, freezeUntil = 0, slowUntil = 0, punch = 0, punchX = 0;
let rings = [], floats = [], lastClack = 0, creakStep = 0, cuTok = 0;
const markerPos = t => M_MIN + (M_MAX - M_MIN) * tri((t - t0) / roundSweep);
const twistAt = t => 100 * tri((t - twistStart) / TWIST_SWEEP);
const rand = Math.random;
const rr = (a, b) => a + Math.random() * (b - a);

function newRound(now) {
  state = 'ready';
  roundSweep = SWEEP / Math.min(1.6, 1 + 0.05 * combo) * rr(0.93, 1.07);   // combo heats the marker up
  t0 = now - Math.random() * roundSweep * 2;
  frags = []; crumbs = []; rings = []; floats = []; last = null; flash = 0; punch = 0;
  $('result').hidden = true;
  $('msg').style.opacity = 1;
  refreshTexts();
}

function doSnap(p, twist, now) {
  const r = PSK.resolve(p, twist, rand);
  last = r;
  state = 'snap'; snapAt = now; resultAt = now + RESULT_DELAY; lockUntil = now + INPUT_LOCK;

  // records (saved immediately so skipping never loses them)
  r.newBest = r.S > rec.best;
  r.newPattern = !rec.chaos[r.n];
  rec.total++;
  if (r.newBest) rec.best = r.S;
  rec.chaos[r.n] = (rec.chaos[r.n] || 0) + 1;
  if (r.perfectSnap) { rec.perfects++; rec.streak++; if (rec.streak > rec.bestStreak) rec.bestStreak = rec.streak; }
  else rec.streak = 0;
  r.streak = rec.streak;
  combo = r.S >= 72 ? combo + 1 : 0; r.combo = combo;
  if (combo > (rec.bestCombo || 0)) rec.bestCombo = combo;
  save();
  $('bestVal').textContent = rec.best;

  // fragments: lengths are exact slices of the original pasta
  const breakX = x0 + Math.min(97, Math.max(3, p)) / 100 * L;
  const k = r.n === 2 ? 1 : r.n <= 3 ? 1.35 : r.n <= 5 ? 1.7 : 2.3;
  frags = r.segs.map(([a, b]) => {
    const len = (b - a) / 100 * L;
    const cx = x0 + (a + b) / 200 * L;
    const dir = Math.sign(cx - breakX) || (Math.random() < .5 ? -1 : 1);
    return {
      a, b, len, cx, cy: py, ang: 0,
      vx: (cx - breakX) / L * 380 * k + rr(-70, 70) * k,
      vy: -rr(140, 340) * k,
      w: dir * rr(2.5, 6.5) * k * (Math.random() < .2 ? -1 : 1),
      tint: rr(-8, 8),
    };
  });
  for (const b of r.breaks) {
    const bx = x0 + b / 100 * L, cnt = 4 + r.n * 2;
    for (let i = 0; i < cnt; i++) crumbs.push({ x: bx, y: py, vx: rr(-260, 260) * k, vy: -rr(80, 420) * k, life: rr(0.5, 0.9), age: 0, s: rr(1.2, 2.6) });
  }
  shake = r.n >= 6 ? 16 : r.n >= 4 ? 7 : r.n === 3 ? 3.5 : 2;
  punch = 1; punchX = breakX;
  freezeUntil = now + (r.perfectSnap ? 90 : 55);          // hit-stop
  if (r.perfectSnap) {
    flash = 1; slowUntil = now + 420; sfx.chime(r.streak - 1);
    const cc = ['#F2B33D', '#E5452B', '#3E9B57', '#FFF6D8'];
    for (let i = 0; i < 44; i++) crumbs.push({ x: breakX, y: py, vx: rr(-460, 460), vy: -rr(250, 820), life: rr(0.8, 1.3), age: 0, s: rr(3, 6.5), c: cc[i % 4] });
  }
  rings.push({ x: breakX, y: py, age: 0, gold: r.perfectSnap });
  const gc = { PERFECT: '#C98A00', GREAT: '#3E9B57', GOOD: '#2F7FBF', MISS: '#8A6F5A' }[r.grade];
  floats.push({ text: r.grade + (r.grade === 'MISS' ? '' : '!'), sub: '+' + r.S, x: Math.min(W - 80, Math.max(80, breakX)), y: py - th * 4.5, age: 0, color: gc });
  playBreak(r.n);
  updateCombo(true);
}

function updateCombo(bump) {
  const el = $('combo');
  el.textContent = combo >= 2 ? 'COMBO ×' + combo : '';
  if (bump && combo >= 2) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function countUp(el, to) {
  const tok = ++cuTok, s = performance.now();
  (function f() {
    if (tok !== cuTok) return;
    const u = Math.min(1, (performance.now() - s) / 300);
    el.textContent = Math.round(to * (1 - Math.pow(1 - u, 3)));
    if (u < 1) requestAnimationFrame(f);
  })();
}
function showResult(now) {
  if (!last) return;
  state = 'result'; lockUntil = now + INPUT_LOCK;
  const r = last;
  const QUIPS = {
    'PERFECT SNAP': ['Royal precision!', 'Long live the Pasta King!', 'Textbook snap.'],
    'CLEAN SNAP': ['Two pieces. Nice and clean!', 'Snapped like a pro.', 'Clean break!'],
    'OFF-CENTER SNAP': ['Two pieces — just not halves.', 'Clean break, wandering aim.'],
    'TRIPLE TROUBLE': ['One snap wasn\'t enough for it!', 'Bonus piece!', 'Pasta had other plans.'],
    'PASTA RAIN': ['Spaghetti confetti!', 'It\'s raining pasta!', 'Look at them fly!'],
    'PASTA DISASTER': ['Pasta went everywhere!', 'Physics said: chaos.', 'A legendary crunch.'],
  };
  const qs = QUIPS[r.outcome];
  $('rTitle').textContent = r.outcome;
  $('rTitle').className = 'rtitle' + (r.perfectSnap ? ' gold' : '');
  $('rQuip').textContent = qs[Math.floor(Math.random() * qs.length)];
  $('rScore').textContent = r.S; countUp($('rScore'), r.S);
  $('rGrade').textContent = r.grade;
  $('rGrade').className = 'g-' + r.grade;
  $('rPieces').textContent = r.n;
  const bd = [];
  if (r.newBest) bd.push('<span class="badge hot">NEW BEST</span>');
  if (r.newPattern) bd.push('<span class="badge">NEW CHAOS · ' + r.n + ' PIECES</span>');
  if (r.perfectSnap && r.streak > 1) bd.push('<span class="badge gold">STREAK ×' + r.streak + '</span>');
  if (r.combo >= 2) bd.push('<span class="badge">COMBO ×' + r.combo + '</span>');
  $('rBadges').innerHTML = bd.join('');
  const off = r.E.toFixed(1) + '% ' + (r.p < 50 ? 'left' : 'right');
  $('rNote').textContent = r.E <= 1 ? (r.n > 2 ? 'Perfect aim! The pasta chose chaos.' : 'Dead center.')
    : r.E <= 3 ? 'SO CLOSE! Just ' + off + ' of center.'
    : r.n > 2 && r.S >= 72 ? 'Precision kept! Extra pieces are pure luck. (' + off + ')'
    : r.twist != null ? 'Twist ' + Math.round(r.twist) + '% · green zone 55–75% helps a clean snap'
    : 'Off by ' + off + '.';
  $('result').hidden = false;
  $('msg').style.opacity = 0;
  refreshTexts();
}

/* ---------- Input ---------- */
function evTime(e) {
  const now = performance.now(), t = e && e.timeStamp;
  return (t > 0 && Math.abs(now - t) < 1000) ? t : now;
}
function press(t) {
  audioInit();
  if (state === 'ready') {
    const p = markerPos(t);
    if (!rec.twist) doSnap(p, null, t);
    else { state = 'twist'; pFixed = p; twistStart = t; wasInZone = false; refreshTexts(); }
    return true;
  }
  if (state === 'snap' && t >= lockUntil) { showResult(t); return false; }
  if (state === 'result' && t >= lockUntil) { newRound(t); return false; }
  return false;
}
function release(t) {
  if (state === 'twist') doSnap(pFixed, twistAt(t), t);
}
function cancelHold() {   // focus lost / finger left: never get stuck
  if (held) { held = null; activePointer = null; release(performance.now()); }
}

app.addEventListener('pointerdown', e => {
  if (e.target.closest('button,.panel,#stats')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (held) return;                         // ignore multi-touch / double input
  const keepHold = press(evTime(e));
  if (keepHold && state === 'twist') { held = 'pointer'; activePointer = e.pointerId; }
}, { passive: false });
const onUp = e => {
  if (held === 'pointer' && e.pointerId === activePointer) { held = null; activePointer = null; release(evTime(e)); }
};
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('blur', cancelHold);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelHold(); });
['touchstart', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'].forEach(ev =>
  document.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest('button')) e.preventDefault(); }, { passive: false }));

let keyDown = false;
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat || keyDown) return;
    keyDown = true;
    if (!$('stats').hidden) { closeStats(); return; }
    if (held) return;
    if (press(evTime(e)) && state === 'twist') held = 'key';
  } else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyT') toggleTwist();
  else if (e.code === 'Escape') closeStats();
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.key === ' ' || e.code === 'Enter') {
    e.preventDefault(); keyDown = false;
    if (held === 'key') { held = null; release(evTime(e)); }
  }
});
window.addEventListener('blur', () => { keyDown = false; });

/* ---------- UI controls ---------- */
function refreshTexts() {
  const tw = rec.twist;
  $('twistBtn').setAttribute('aria-pressed', tw ? 'true' : 'false');
  $('twistState').textContent = tw ? 'ON · HOLD & RELEASE' : 'OFF · OPTIONAL';
  const pr = $('prompt');
  if (state === 'result') pr.style.visibility = 'hidden';
  else {
    pr.style.visibility = 'visible';
    pr.textContent = state === 'twist' ? 'RELEASE TO SNAP!' : (tw ? 'HOLD TO TWIST!' : 'TAP TO SNAP!');
  }
  $('subline').textContent = state === 'twist' ? 'RELEASE IN THE GREEN ZONE' : 'TAP AT THE CENTER!';
  const muted = rec.muted;
  $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  $('muteBtn').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  $('waves').style.display = muted ? 'none' : '';
  $('xmark').style.display = muted ? '' : 'none';
  $('bestVal').textContent = rec.best;
}
function toggleTwist() {
  if (state === 'twist') return;
  rec.twist = !rec.twist; save(); refreshTexts();
}
function toggleMute() {
  rec.muted = !rec.muted; save();
  audioInit();
  try { if (master) master.gain.value = rec.muted ? 0 : 0.9; } catch (e) {}
  refreshTexts();
}
function openStats() {
  $('sBest').textContent = rec.best;
  $('sPerf').textContent = rec.perfects;
  $('sStreak').textContent = rec.bestStreak;
  $('sTotal').textContent = rec.total;
  $('sCombo').textContent = rec.bestCombo || 0;
  let found = 0, html = '';
  for (let n = 2; n <= 8; n++) {
    const on = !!rec.chaos[n]; if (on) found++;
    html += '<div class="chip' + (on ? ' on' : '') + (n === 2 ? ' two' : '') + '" title="' + n + ' pieces">' + (on ? n : '?') + '</div>';
  }
  $('sChips').innerHTML = html;
  $('sChaos').textContent = found + '/7';
  $('stats').hidden = false;
}
function closeStats() { $('stats').hidden = true; }
$('twistBtn').addEventListener('click', e => { e.stopPropagation(); toggleTwist(); e.currentTarget.blur(); });
$('muteBtn').addEventListener('click', e => { e.stopPropagation(); toggleMute(); e.currentTarget.blur(); });
$('statsBtn').addEventListener('click', e => { e.stopPropagation(); openStats(); });
$('closeStats').addEventListener('click', e => { e.stopPropagation(); closeStats(); });
$('stats').addEventListener('pointerdown', e => { if (e.target === $('stats')) closeStats(); });

/* ---------- Drawing ---------- */
function pastaStroke(xa, ya, xb, yb, tint, twist) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(120,70,10,.35)'; ctx.lineWidth = th + 3;
  ctx.beginPath(); ctx.moveTo(xa, ya + 1.5); ctx.lineTo(xb, yb + 1.5); ctx.stroke();
  ctx.strokeStyle = `hsl(${43 + (tint || 0) * 0.3},${86}%,${66 + (tint || 0) * 0.5}%)`; ctx.lineWidth = th;
  ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,250,225,.75)'; ctx.lineWidth = Math.max(1.5, th * 0.25);
  const off = -th * 0.22;
  ctx.beginPath(); ctx.moveTo(xa, ya + off); ctx.lineTo(xb, yb + off); ctx.stroke();
  if (twist > 0) {   // diagonal twist stripes
    const spacing = Math.max(5, 26 - twist * 0.2);
    ctx.save(); ctx.beginPath(); ctx.rect(Math.min(xa, xb), ya - th / 2, Math.abs(xb - xa), th); ctx.clip();
    ctx.strokeStyle = 'rgba(160,95,15,.45)'; ctx.lineWidth = 1.6;
    const slant = th * (0.4 + twist / 100);
    for (let x = Math.min(xa, xb) - slant; x < Math.max(xa, xb) + slant; x += spacing) {
      ctx.beginPath(); ctx.moveTo(x, ya - th / 2); ctx.lineTo(x + slant, ya + th / 2); ctx.stroke();
    }
    ctx.restore();
  }
}
function pastaCurve(b, twist) {       // bent pasta under tension (peak rises by b)
  const xa = x0, xb = x0 + L, cx = x0 + L / 2;
  const path = dy => { ctx.beginPath(); ctx.moveTo(xa, py + dy); ctx.quadraticCurveTo(cx, py - 2 * b + dy, xb, py + dy); ctx.stroke(); };
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(120,70,10,.35)'; ctx.lineWidth = th + 3; path(1.5);
  ctx.strokeStyle = 'hsl(43,86%,66%)'; ctx.lineWidth = th; path(0);
  ctx.strokeStyle = 'rgba(255,250,225,.75)'; ctx.lineWidth = Math.max(1.5, th * 0.25); path(-th * 0.22);
  if (twist > 0) {
    const spacing = Math.max(5, 26 - twist * 0.2), slant = th * (0.4 + twist / 100);
    ctx.strokeStyle = 'rgba(160,95,15,.5)'; ctx.lineWidth = 1.6; ctx.lineCap = 'butt';
    for (let x = xa + 4; x < xb - 4; x += spacing) {
      const u = (x - xa) / L, y = py - 4 * b * u * (1 - u);
      ctx.beginPath(); ctx.moveTo(x - slant / 2, y - th * 0.42); ctx.lineTo(x + slant / 2, y + th * 0.42); ctx.stroke();
    }
  }
}
function drawHand(x, y, flip, squeeze) {
  ctx.save(); ctx.translate(x, y); ctx.scale(flip, 1);
  const s = th * 1.25 * (1 + squeeze * 0.06);
  ctx.fillStyle = '#F2C29B'; ctx.strokeStyle = '#2B1B12'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-s * 2.6, -s * 1.5, s * 2.4, s * 3, s * 0.9) : ctx.rect(-s * 2.6, -s * 1.5, s * 2.4, s * 3);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#F7D2B2';
  ctx.beginPath(); ctx.ellipse(-s * 0.55, -s * 0.95, s * 0.75, s * 0.55, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawTarget(near) {
  const cx = x0 + L / 2;
  ctx.fillStyle = `rgba(242,179,61,${0.16 + 0.3 * (near || 0)})`;
  ctx.fillRect(x0 + L * 0.47, py - th * 3.2, L * 0.06, th * 6.4);
  ctx.fillStyle = 'rgba(242,179,61,.45)';
  ctx.fillRect(x0 + L * 0.49, py - th * 3.2, L * 0.02, th * 6.4);
  ctx.strokeStyle = 'rgba(43,27,18,.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
  ctx.beginPath(); ctx.moveTo(cx, py - th * 4.5); ctx.lineTo(cx, py + th * 4.5); ctx.stroke(); ctx.setLineDash([]);
}
function drawMarker(p, frozen) {
  const mx = x0 + p / 100 * L, top = py - th * 2.4;
  ctx.strokeStyle = frozen ? 'rgba(229,69,43,.9)' : 'rgba(229,69,43,.65)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(mx, top); ctx.lineTo(mx, py + th * 2.4); ctx.stroke();
  ctx.fillStyle = '#E5452B';
  ctx.beginPath(); ctx.moveTo(mx, top + 2); ctx.lineTo(mx - 10, top - 14); ctx.lineTo(mx + 10, top - 14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(mx, py + th * 2.4 - 2); ctx.lineTo(mx - 7, py + th * 2.4 + 9); ctx.lineTo(mx + 7, py + th * 2.4 + 9); ctx.closePath(); ctx.fill();
}
function drawGauge(t) {
  const gw = Math.min(L * 0.8, 360), gh = 14, gx = (W - gw) / 2;
  const gy = Math.min(py + th * 5 + 16, floorY - 34);
  ctx.fillStyle = 'rgba(43,27,18,.12)'; rrect(gx, gy, gw, gh, 7); ctx.fill();
  ctx.fillStyle = 'rgba(62,155,87,.35)'; ctx.fillRect(gx + gw * 0.55, gy, gw * 0.2, gh);
  const inZone = t >= 55 && t <= 75;
  ctx.fillStyle = inZone ? '#3E9B57' : '#E5452B';
  rrect(gx, gy, Math.max(gh, gw * t / 100), gh, 7); ctx.fill();
  ctx.strokeStyle = '#2B1B12'; ctx.lineWidth = 2; rrect(gx, gy, gw, gh, 7); ctx.stroke();
  ctx.fillStyle = '#2B1B12'; ctx.font = '900 12px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('TWIST ' + Math.round(t) + '%', W / 2, gy + gh + 16);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}
function drawFloor() {
  ctx.fillStyle = 'rgba(214,170,110,.28)'; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.strokeStyle = 'rgba(43,27,18,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
}

/* ---------- Physics ---------- */
function stepFrags(dt, now) {
  for (const f of frags) {
    f.vy += G * dt; f.cx += f.vx * dt; f.cy += f.vy * dt; f.ang += f.w * dt;
    const ext = Math.abs(Math.sin(f.ang)) * f.len / 2 + th / 2;
    if (f.cy + ext >= floorY) {
      f.cy = floorY - ext;
      if (f.vy > 160 && now - lastClack > 35) { lastClack = now; sfx.clack(Math.min(1, f.vy / 1100), f.len / L); }
      if (f.vy > 0) { f.vy = Math.abs(f.vy) > 120 ? -f.vy * 0.32 : 0; f.vx *= 0.72; f.w *= 0.55; }
      const target = Math.round(f.ang / Math.PI) * Math.PI;
      f.ang += (target - f.ang) * Math.min(1, dt * 12);
      f.w *= Math.max(0, 1 - dt * 8);
      f.vx *= Math.max(0, 1 - dt * 5);
    }
    const hx = Math.abs(Math.cos(f.ang)) * f.len / 2;
    if (f.cx - hx < 0) { f.cx = hx; f.vx = Math.abs(f.vx) * 0.5; }
    if (f.cx + hx > W) { f.cx = W - hx; f.vx = -Math.abs(f.vx) * 0.5; }
  }
  for (const c of crumbs) {
    c.age += dt; c.vy += G * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.y > floorY) { c.y = floorY; c.vy *= -0.3; c.vx *= 0.6; }
  }
  crumbs = crumbs.filter(c => c.age < c.life);
}

/* ---------- Loop ---------- */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;

  if (state === 'ready') {
    const near = Math.abs(markerPos(now) - 50) < 3;
    if (near && !wasNear) sfx.tick();
    wasNear = near;
  } else if (state === 'twist') {
    twistNow = twistAt(now);
    const cs = Math.floor(twistNow / 6); if (cs !== creakStep) { creakStep = cs; sfx.creak(twistNow); }
    const inZone = twistNow >= 55 && twistNow <= 75;
    if (inZone && !wasInZone) sfx.zone();
    wasInZone = inZone;
  } else {
    stepFrags(now < freezeUntil ? 0 : now < slowUntil ? dt * 0.35 : dt, now);
    if (state === 'snap' && now >= resultAt) showResult(now);
  }
  punch = Math.max(0, punch - dt * 7);
  for (const r of rings) r.age += dt; rings = rings.filter(r => r.age < 0.45);
  for (const f of floats) f.age += dt; floats = floats.filter(f => f.age < 0.9);
  shake *= Math.pow(0.0015, dt); if (shake < 0.2) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake) ctx.translate(rr(-shake, shake), rr(-shake, shake));
  if (punch) { const z = 1 + 0.05 * punch; ctx.translate(punchX, py); ctx.scale(z, z); ctx.translate(-punchX, -py); }
  drawFloor();

  if (state === 'ready' || state === 'twist') {
    drawTarget(state === 'ready' ? Math.max(0, 1 - Math.abs(markerPos(now) - 50) / 8) : 0);
    const tw = state === 'twist' ? twistNow : 0;
    pastaCurve(th * (0.9 + 0.25 * Math.sin(now / 260)) + tw / 100 * th * 2.2, tw);
    if (state === 'ready') for (let k = 3; k >= 1; k--) {      // marker motion trail
      const gx = x0 + markerPos(now - k * 14) / 100 * L;
      ctx.strokeStyle = `rgba(229,69,43,${0.09 * (4 - k)})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(gx, py - th * 2.4); ctx.lineTo(gx, py + th * 2.4); ctx.stroke();
    }
    drawHand(x0 + th * 0.6, py, 1, tw / 100);
    drawHand(x0 + L - th * 0.6, py, -1, tw / 100);
    drawMarker(state === 'twist' ? pFixed : markerPos(now), state === 'twist');
    if (state === 'twist') drawGauge(twistNow);
  } else {
    if (last && last.perfectSnap === false) { /* keep target faint */ }
    drawHand(x0 + th * 0.6, py, 1, 0);
    drawHand(x0 + L - th * 0.6, py, -1, 0);
    for (const f of frags) {
      ctx.save(); ctx.translate(f.cx, f.cy); ctx.rotate(f.ang);
      pastaStroke(-f.len / 2, 0, f.len / 2, 0, f.tint, 0);
      ctx.restore();
    }
    for (const c of crumbs) { ctx.globalAlpha = 1 - c.age / c.life; ctx.fillStyle = c.c || '#E8B649'; ctx.fillRect(c.x, c.y, c.s, c.s); }
    ctx.globalAlpha = 1;
    for (const r of rings) {
      const u = r.age / 0.45;
      ctx.strokeStyle = (r.gold ? 'rgba(242,179,61,' : 'rgba(229,69,43,') + (1 - u) * 0.8 + ')';
      ctx.lineWidth = 6 * (1 - u) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, 10 + u * (r.gold ? 170 : 90), 0, Math.PI * 2); ctx.stroke();
    }
    for (const f of floats) {
      const u = f.age / 0.9, sc = u < 0.15 ? u / 0.15 * 1.3 : 1.3 - Math.min(1, (u - 0.15) / 0.1) * 0.3;
      ctx.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
      ctx.font = `900 ${Math.round(30 * sc)}px ui-rounded,system-ui,sans-serif`;
      ctx.strokeStyle = '#FFFDF7'; ctx.lineWidth = 6; ctx.strokeText(f.text, f.x, f.y - u * 36);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - u * 36);
      ctx.font = `900 ${Math.round(18 * sc)}px ui-rounded,system-ui,sans-serif`;
      ctx.strokeText(f.sub, f.x, f.y - u * 36 + 24); ctx.fillStyle = '#2B1B12'; ctx.fillText(f.sub, f.x, f.y - u * 36 + 24);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (flash > 0) {
    const g = ctx.createRadialGradient(W / 2, py, 0, W / 2, py, Math.max(W, H) * 0.7);
    g.addColorStop(0, `rgba(255,214,90,${0.75 * flash})`);
    g.addColorStop(1, `rgba(255,190,40,${0.15 * flash})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

layout();
refreshTexts();
newRound(performance.now());
requestAnimationFrame(frame);
