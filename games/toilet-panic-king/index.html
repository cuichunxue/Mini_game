 try{

 }catch(e){}
}

function tone(f,d,type,v,f2,delay){
 if(!AC)return;try{
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
 }catch(e){}
}
function noise(d,v,f1,f2,delay){
 if(!AC)return;try{
  const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';
  const t=AC.currentTime+(delay||0);
  f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
 }catch(e){}
}

  const k=clamp((power-.25)/.75),n=Math.floor((18+k*50)*(lowFx?.4:1)),cx=180,cy=toiletY()-110*SC;
  ctx.save();ctx.strokeStyle=danger>.6?'rgba(255,90,90,'+(.25+k*.4)+')':'rgba(255,255,255,'+(.2+k*.4)+')';
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r0=lerp(260,170,k)+Math.random()*60,r1=r0+120+Math.random()*200;
   ctx.lineWidth=1+Math.random()*3*k;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke();}
  if(!lowFx){const vg=ctx.createRadialGradient(180,320,140,180,320,420);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(.15+k*.35)+')');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}ctx.restore();
 }
 if(mode==='PLAY'||mode==='DEAD'){
  const Hb=hb(),k=clamp(Math.abs(vel)/(Hb*.9));
  if(k>.25){const up=vel>0,n=Math.floor(8+k*28);
   ctx.save();ctx.strokeStyle=up?'rgba(255,255,255,'+(.2+k*.4)+')':'rgba(255,170,170,'+(.2+k*.35)+')';
   for(let i=0;i<n;i++){const x=Math.random()*W,y=Math.random()*H,l=40+Math.random()*160*k;ctx.lineWidth=1+Math.random()*2.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+(up?l:-l));ctx.stroke();}
   ctx.restore();}
 }
}

/* ---------- 吹き出し（Journey Map：😏→😬→😖→😳→🤣→🔥） ---------- */
function bubbleText(){
 if(mode==='READY')return runsPlayed>1?['🔥 次こそ月へ！','🔥 アフロは勲章だ','🔥 今日のおしりは違う'][runsPlayed%3]:['😏 余裕っしょ','😏 今日は快便の予感'][Math.floor(clock/3)%2];
 if(mode!=='PLAY')return null;
 if(charging){
  if(danger<.15)return '😬 ぐぬぬ…';
  if(danger<.45)return '😏 まだいける…';
  if(danger<.75)return '😖 やばいかも…';
  return '😖 げ、限界…！！';
 }
 if(boostT<.35)return '😳 ！！';
 if(vel<-.15*hb())return alt<150?'😱 地面が〜！！':'😱 落ちる〜！';
 return null;
}
function drawBubble(){
 const s=bubbleText();if(!s)return;
 const z=Math.max(1,zoom),ty=toiletY(),cyc=ty-100*SC,hy=cyc+(ty-150*SC-cyc)*z;
 ctx.save();ctx.font='900 15px '+FONT;const w=ctx.measureText(s).width+24;ctx.restore();
 let bx=tb.x+44*SC*z+w/2,by=Math.max(170,hy-46*z);
 if(bx+w/2>W-30)bx=tb.x-44*SC*z-w/2;
 bx=clamp(bx,w/2+6,W-w/2-30);
 const left=bx<tb.x,bob=Math.sin(clock*4)*2,hot=charging&&danger>.7;
 ctx.fillStyle=hot?'#ffe0e4':'#fff';ctx.strokeStyle='#22314a';ctx.lineWidth=2.5;
 rr(bx-w/2,by-16+bob,w,32,16);ctx.fill();ctx.stroke();
 const tx=left?bx+w/2-18:bx-w/2+18;
 ctx.beginPath();ctx.moveTo(tx-6,by+14+bob);ctx.lineTo(left?tx+12:tx-12,by+28+bob);ctx.lineTo(tx+6,by+14+bob);ctx.closePath();ctx.fill();
 txt(s,bx,by+1+bob,15,'#22314a',{sc:hot?1+.06*Math.sin(clock*30):1});
}

/* ---------- HUD ---------- */
function drawLogo(x,y,s,a){
 ctx.save();ctx.globalAlpha=clamp(a);ctx.translate(x,y);ctx.scale(s,s);
 txt('TOILET',0,-38,38,'#3ab8ff',{st:'#0f2a4f',sw:9,rot:-.04});
 txt('PANIC',0,0,40,'#ff4f8f',{st:'#0f2a4f',sw:9,rot:-.04});
 txt('KING',0,40,44,'#ffcc1a',{st:'#0f2a4f',sw:9,rot:-.04});
 emoji('👑',30,18,20);emoji('🧻',-92,-36,26,{rot:-.3});
 ctx.restore();
}

function drawGauge(){
 const x=20+(charging?(Math.random()-.5)*danger*6:0),y=52,w=290,h=26;
 const p=charging?power:(revealT>0?revealP:0);
 ctx.save();rr(x,y,w,h,8);ctx.fillStyle='#14203a';ctx.fill();ctx.clip();
 const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#3ab8ff');g.addColorStop(.55,'#3ee07a');g.addColorStop(.85,'#ffd23a');g.addColorStop(1,'#ff7a1a');
 ctx.fillStyle=g;ctx.fillRect(x,y,w*p,h);
 ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x,y+2,w*p,h*.32);
 ctx.fillStyle='rgba(10,20,40,.5)';for(let k=1;k<20;k++)ctx.fillRect(x+w*k/20-1,y,2,h);
 ctx.restore();
 rr(x,y,w,h,8);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
 txt(Math.round(p*100)+'%',x+44,y+h/2+1,charging?18+power*10:18,'#fff',{st:'#0f1a30',sw:5});
 if(!(revealT>0)&&!charging)txt('限界は毎回ちがう…',x+w-8,y+h/2+1,11,'rgba(255,255,255,.75)',{a:'right',w:900});
 if(revealT>0){
  const a=clamp(revealT/.3),lx=x+w*revealLim,mx=x+w*revealP;
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='#ff3d5a';ctx.fillRect(lx-2,y-6,4,h+12);
  txt('💥限界 '+Math.round(revealLim*100)+'%',clamp(lx,x+30,x+w-30),y+h+12,11,'#ffb0bc',{st:'#0f1a30',sw:3,w:900});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(mx,y-2);ctx.lineTo(mx-7,y-12);ctx.lineTo(mx+7,y-12);ctx.closePath();ctx.fill();
  if(revealP<revealLim)txt('あと'+Math.round((revealLim-revealP)*100)+'%',clamp((mx+lx)/2,x+20,x+w-20),y-16,12,'#ffe14a',{st:'#0f1a30',sw:3});
  ctx.restore();
 }
}
function drawProgress(){
 const x=338,y0=470,y1=160,top=fA(MOON);
 const yy=a=>y0-(y0-y1)*clamp(fA(a)/top);
 rr(x-6,y1-8,12,y0-y1+16,6);ctx.fillStyle='rgba(15,26,48,.6)';ctx.fill();
 const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#3ab8ff');g.addColorStop(.35,'#ff8a3a');g.addColorStop(.6,'#5a3aa0');g.addColorStop(1,'#0a0a20');
 ctx.fillStyle=g;rr(x-4,y1,8,y0-y1,4);ctx.fill();
 for(const [a,l] of [[ZONES[1].from,'Lv2'],[ZONES[2].from,'Lv3']]){const y=yy(a);ctx.fillStyle='#fff';ctx.fillRect(x-8,y-1,16,2);txt(l,x-10,y,9,'#fff',{a:'right',st:'#0f1a30',sw:3,w:900});}
 emoji('🌕',x,y1-14,18);
 if(saved.best>0){const y=yy(saved.best);ctx.fillStyle='#ff8ad8';ctx.fillRect(x-9,y-1.5,18,3);}
 const py=yy(alt);ctx.fillStyle='#ffe14a';circ(x,py,7);ctx.fill();ctx.strokeStyle='#0f1a30';ctx.lineWidth=2;ctx.stroke();
}
function drawHUD(){
 const z=zoneOf(alt);
 rr(14,12,64,28,14);ctx.fillStyle=['#3ab0ff','#ff8a3a','#7a4ad8'][z];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();
 txt('Lv'+(z+1)+'/3',46,27,15,'#fff',{st:'#0f1a30',sw:3});
 txt(ZONES[z].name,86,27,14,'#fff',{a:'left',st:'#0f1a30',sw:4,w:800});
 for(let i=0;i<3;i++)emoji('🧻',268+i*26,26,20,{alpha:i<lives?1:.2});
 drawGauge();
 if(mode!=='OVER'&&mode!=='CLEAR'){
  const sc=boostT<.3?1+.25*(1-boostT/.3):1;
  txt(fmt(alt)+'m',180,118,40,'#fff',{st:'#0f1a30',sw:9,sc});
  if(saved.best>0)txt('自己ベスト '+fmt(saved.best)+'m',180,146,12,'#ff8ad8',{st:'#0f1a30',sw:4,w:900});
  if(combo>0)txt('🔥 COMBO ×'+Math.min(2.5,1+.3*combo).toFixed(1),300,100,14,'#ffe14a',{st:'#0f1a30',sw:4,sc:1+.05*Math.sin(clock*10)});
  drawProgress();
 }
 if(bannerT<1.8){const a=clamp(1.8-bannerT)*clamp(bannerT*6),sc=bannerT<.15?lerp(2.2,1,easeOut(bannerT/.15)):1;
  ctx.save();ctx.globalAlpha=a;rr(0,200,W,74,0);ctx.fillStyle='rgba(15,26,48,.6)';ctx.fill();ctx.restore();
  txt('Lv'+(zoneMax+1)+' '+ZONES[zoneMax].name+' 突入！',180,237,28,'#ffe14a',{st:'#0f1a30',sw:7,alpha:a,sc,maxW:330});}
 // guide
 const by=600;
 if(mode==='READY'||mode==='PLAY'){
  let msg,fg,bg;const falling=mode==='PLAY'&&vel<-.15*hb();
  if(charging){
   if(danger<.15){msg='ためろ…！';fg='#22314a';bg='#ffe14a';}
   else if(danger<.45){msg='もっと攻める？';fg='#fff';bg='#2fbf5a';}
   else if(danger<.75){msg='ミシミシ言ってる…！';fg='#fff';bg='#ff9a2a';}
   else{msg='ヤバい！離せ!?';fg='#fff';bg='#ff3d5a';}
  }else if(mode==='READY'){msg='長押しでため → 離して発射！';fg='#22314a';bg='#fff';}
  else if(falling){msg=alt<150?'墜落するぞ！ためろ！':'落ちてる！ためろ！';fg='#fff';bg='#ff3d5a';}
  else{msg='次の発射をためろ！';fg='#22314a';bg='#fff';}
  const s=(charging&&danger>.45)||falling?1+.05*Math.sin(clock*30):1;
  ctx.save();ctx.translate(180,by);ctx.scale(s,s);
  rr(-140,-24,280,48,24);ctx.fillStyle=bg;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#22314a';ctx.stroke();
  txt(msg,0,1,18,fg,{maxW:250});ctx.restore();
  if(mode==='READY'){
   txt(firstIntro?'落ちながら連続発射で🌕を目指せ！ 限界を超えると爆発🧻-1':'限界ギリギリで離すと COMBO で倍率アップ！',180,by-40,12,'#fff',{st:'#0f1a30',sw:4,w:800,maxW:340});
  }
 }
 if(mode==='READY'&&firstIntro){drawLogo(180,215,.95,1);txt('踏ん張れ！限界までためろ！',180,290,15,'#fff',{st:'#0f1a30',sw:5});}
}
function drawComm(){
 if(comm.t>2.6||!comm.s)return;
 const n=Math.min(comm.s.length,Math.floor(comm.t*28)),s=comm.s.slice(0,n),a=comm.t>2.2?1-(comm.t-2.2)/.4:1;
 ctx.save();ctx.globalAlpha=clamp(a);rr(14,158,300,28,14);ctx.fillStyle='rgba(15,26,48,.82)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffe14a';ctx.stroke();ctx.restore();
 txt('🎙️実況',24,172,11,'#ffe14a',{a:'left',w:900,alpha:a});
 txt(s,72,172,13,'#fff',{a:'left',w:800,alpha:a,maxW:236});
}
function drawOver(){
 const t=modeT,sc=t<.2?lerp(2,1,easeOut(t/.2)):1;
 ctx.fillStyle='rgba(8,12,30,.55)';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(180,250);ctx.scale(sc,sc);
 rr(-160,-120,320,250,22);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#22314a';ctx.stroke();
 txt(deadKind==='bust'?'🤣 星になった…':'💥 墜落…',0,-96,24,'#ff4f8f',{st:'#22314a',sw:5});
 txt(deathTitle,0,-68,13,'#7a4ad8',{w:900});
 txt('記録',0,-46,12,'#6a7590',{w:800});
 txt(fmt(maxAlt)+'m',0,-18,46,'#22314a');
 const nb=maxAlt>=prevBest&&maxAlt>0;
 txt(nb?'🎉 自己ベスト更新！':'自己ベストまで あと '+fmt(prevBest-maxAlt)+'m',0,22,16,nb?'#ff4f8f':'#22314a',{w:900});
 const z=zoneOf(maxAlt);
 txt(z<2?'次の Lv'+(z+2)+' '+ZONES[z+1].name+' まで あと '+fmt(ZONES[z+1].from-maxAlt)+'m':'月まで あと '+fmt(MOON-maxAlt)+'m',0,50,13,'#3a4a6a',{w:800,maxW:290});
 txt('👑神ギリギリ ×'+kamiN+'　🚀発射 '+boostN+'回',0,78,12,'#6a7590',{w:800});
 txt('Lv'+(z+1)+' '+ZONES[z].name+' 到達',0,104,12,'#6a7590',{w:800});
 ctx.restore();
 if(t>.45)txt('押してすぐリトライ 🔥',180,430,22,'#ffe14a',{st:'#0f1a30',sw:6,sc:1+.05*Math.sin(clock*8)});
}
function drawClear(){
 ctx.fillStyle='rgba(10,20,50,.45)';ctx.fillRect(0,0,W,H);
 drawLogo(180,110,1+Math.sin(clock*4)*.03,1);
 txt('月に到達！',180,200,30,'#fff',{st:'#0f1a30',sw:7});
 txt('キミこそトイレの王だ 👑',180,234,16,'#ffe14a',{st:'#0f1a30',sw:4});
 rr(30,262,300,96,16);ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();
 txt('タイム '+runTime.toFixed(1)+'秒',180,288,18,'#22314a');
 txt('👑神ギリギリ ×'+kamiN+'　🧻残り '+lives,180,316,14,'#22314a',{w:800});
 txt('🚀発射 '+boostN+'回',180,340,13,'#6a7590',{w:800});
 txt('つづく… Lv4 ⚫ ブラックホール？',180,560,15,'#ffcc1a',{st:'#0f1a30',sw:4});
 if(modeT>1.2)txt('タップでもう一回',180,600,16,'#9dffbf',{st:'#0f1a30',sw:4,alpha:.6+.4*Math.sin(clock*6)});
}

/* ---------- 描画 ---------- */
function render(){
 const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);
 if(charging)humSet(power);
 const m=heroMood(),p=charging?Math.max(power,danger):boostPow;
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
 {const z=Math.max(1,zoom),cx=tb.x,cy=Math.min(GY-60,toiletY()-100*SC);ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-cx,-cy);}
 drawWorld();
 if(alt<2){ctx.fillStyle='rgba(0,0,0,.25)';ell(tb.x,GY+3,58,8);ctx.fill();}
 if(charging)drawAura();
 if(!(mode==='DEAD'&&deadKind==='bust'&&modeT>1))drawToilet(m,p);
 for(const r of rings){if(r.delay>0)continue;ctx.save();ctx.globalAlpha=clamp(r.life);ctx.strokeStyle=r.col;ctx.lineWidth=r.w*clamp(r.life)+1;ell(r.x,r.y,r.r,r.r*.55);ctx.stroke();ctx.restore();}
 for(const q of parts){
  ctx.save();ctx.globalAlpha=clamp(q.life/Math.min(q.max,.4));ctx.translate(q.x,q.y);ctx.rotate(q.rot);
  if(q.type==='c'){ctx.fillStyle=q.col;circ(0,0,q.size);ctx.fill();}
  else if(q.type==='fire'){const g=ctx.createRadialGradient(0,0,0,0,0,Math.max(.1,q.size));g.addColorStop(0,'rgba(255,255,220,.95)');g.addColorStop(.35,'rgba(255,190,60,.9)');g.addColorStop(.7,'rgba(255,80,30,.6)');g.addColorStop(1,'rgba(120,20,10,0)');ctx.fillStyle=g;circ(0,0,q.size);ctx.fill();}
  else if(q.type==='r'||q.type==='p'){ctx.fillStyle=q.col;ctx.fillRect(-q.size/2,-q.size*q.ar/2,q.size,q.size*q.ar);}
  else{const c=emojiSprite(q.txt,q.size),h=c._s*q.size/Math.max(6,Math.round(q.size/2)*2);ctx.drawImage(c,-h/2,-h/2,h,h);}
  ctx.restore();
 }
 ctx.restore();
 drawSpeedLines();
 if(mode==='PLAY'&&alt<150&&vel<-.15*hb()){ctx.fillStyle='rgba(255,30,50,'+(.12+.1*Math.sin(clock*20))+')';ctx.fillRect(0,0,W,H);}
 if(charging&&danger>.35){ctx.fillStyle='rgba(255,40,60,'+((danger-.35)*.25*(.6+.4*Math.sin(clock*(10+danger*20))))+')';ctx.fillRect(0,0,W,H);}
 if(mode==='READY'||mode==='PLAY')drawBubble();
 for(const q of pops){const sc=Math.max(.01,q.t<.12?lerp(2.2,1,easeOut(q.t/.12)):1+.04*Math.sin(q.t*30)),a=q.t>.65?1-(q.t-.65)/.25:1;txt(q.s,q.x,q.y-q.t*20,q.size,q.col,{st:'#1a1a2e',sw:q.size*.24,rot:q.rot,sc,alpha:a,maxW:340});}
 if(flash>0){ctx.globalAlpha=clamp(flash)*.55;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
 drawHUD();
 txt('v11 · '+tapN+'/'+upN+' · '+(AC?AC.state.slice(0,3):'-'),352,634,8,'rgba(255,255,255,.55)',{a:'right',w:700});
 if(window.__err)txt('ERR: '+String(window.__err).slice(0,60),180,630,9,'#ff5a6a',{st:'#000',sw:3,maxW:340});
 if(mode==='PLAY'||mode==='DEAD')drawComm();
 if(mode==='OVER')drawOver();
 if(mode==='CLEAR')drawClear();
}

let last=0,acc=0,perfSum=0,perfN=0,perfT=0;
function frame(ts){
 requestAnimationFrame(frame);
 const raw=Math.max(0,(ts-last)/1000)||0,dt=Math.min(.1,raw);last=ts;acc=Math.min(acc+dt,STEP*3);
 frameN++;
 while(acc>=STEP){try{update(STEP);}catch(e){if(!window.__err)window.__err='U:'+String(e&&e.message||e);}acc-=STEP;}
 if(raw>0&&raw<.5){perfSum+=raw;perfN++;perfT+=raw;
  if(perfT>1.2){const avg=perfSum/perfN;
   if(avg>.024){if(Q>1){Q=Math.max(1,Q-.5);resize();}else lowFx=true;}
   perfSum=0;perfN=0;perfT=0;}}
 try{render();}catch(e){if(!window.__err){window.__err=String(e&&e.message||e);console.error('RENDER',window.__err);}try{for(let i=0;i<40;i++)ctx.restore();}catch(_){}ctx.setTransform(1,0,0,1,0,0);}
}
window.addEventListener('error',e=>{if(!window.__err)window.__err=(e.message||'error')+' @'+(e.lineno||'');});
newRun();
requestAnimationFrame(frame);
window.__tpk={audio:()=>AC?AC.state:'none',get:()=>({mode,alt:Math.round(alt),vel:Math.round(vel),lives,combo,limit,power,charging,maxAlt:Math.round(maxAlt),boostN,kamiN})};
})();
</script>
