<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>月斬り王 MOON SLICE KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 豪快でバカバカしい。説明より一発の絵
   IDEA: 落書きの線が、そのまま月の切り口になる
   PICTURE: 全画面の宇宙。巨大な月と、光る落書きの刀
   COLOUR and TYPE: 宇宙の藍 #070a1c、月光 #f3ead2、金 #ffcf6b、溶岩の朱 / しっぽり明朝 + Zen角ゴシック
   LAYOUT: キャンバス全面、UIは最小。縦持ち優先、最大幅520pxの列 */
:root{color-scheme:dark;--ink:#f3ead2;--gold:#ffcf6b;--red:#ff5a4a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#070a1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:center}
.col{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);position:relative}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
button{font:inherit;color:inherit;pointer-events:auto;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{border:0;border-radius:14px;padding:16px 20px;font-size:18px;font-weight:700;min-height:52px;background:linear-gradient(180deg,#ffe29a,#f2b443);color:#2a1700;box-shadow:0 6px 0 #9c6512,0 10px 30px rgba(255,190,80,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c6512}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(243,234,210,.35)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.spacer{flex:1}
.title{align-items:center;text-align:center}
.tag{font-size:15px;opacity:.9;margin-top:1vh}
.title h1{font-size:clamp(56px,17vw,92px);line-height:1;margin:6px 0 0;color:#fff;text-shadow:0 0 30px rgba(255,220,140,.6),0 4px 0 #3a2a10;animation:aura 1.6s ease-in-out infinite alternate}
@keyframes aura{to{text-shadow:0 0 50px rgba(255,190,80,1),0 0 90px rgba(255,140,40,.6),0 4px 0 #3a2a10}}
.en{font-weight:700;color:var(--gold);letter-spacing:.3em;font-size:13px;margin-top:6px}
.pitch{margin-top:auto;font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.8);line-height:1.5}
.pitch b{color:var(--gold)}
.title .btn{width:100%;font-size:20px;margin-top:14px}
.hud{display:flex;align-items:center;gap:12px}
.hud .ph{font-size:clamp(22px,6.6vw,28px);line-height:1.2;font-weight:800;color:#fff}
.hud .sub{font-size:13px;opacity:.85;line-height:1.4}
.timer{margin-left:auto;font-size:46px;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,200,90,.5)}
.timer.hot{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.odai{display:inline-block;background:#c8241a;color:#fff3e0;font-weight:800;font-size:12px;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.drawhint{text-align:center;font-size:13px;opacity:.8;margin-bottom:10px}
.verdict{font-size:15px;font-weight:800;margin-bottom:2px}.verdict.ok{color:#7be0a6}.verdict.ng{color:#ff8a7a}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ideas span{font-size:12px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px}
.bottom{display:flex;gap:10px}.bottom .btn{flex:1}
.prompt{margin-top:auto;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 0 20px rgba(160,210,255,.9),0 3px 0 #000;animation:pulse .45s infinite alternate}
.speedhint{text-align:center;font-size:13px;opacity:.9;margin:6px 0 0;text-shadow:0 1px 3px #000}
.speedhint b{color:var(--gold)}
.result{position:relative;margin-top:auto;background:rgba(7,10,28,.88);border:1px solid rgba(255,207,107,.45);border-radius:18px;padding:16px 16px 14px;animation:up .45s cubic-bezier(.2,.9,.3,1.2) both;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.hanko{position:absolute;right:14px;top:-26px;background:#c8241a;color:#fff3e0;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:18px;padding:8px 12px;border-radius:6px;box-shadow:inset 0 0 0 2px #fff3e0,0 6px 20px rgba(200,36,26,.5);transform:rotate(8deg);animation:stamp .35s .45s cubic-bezier(.3,1.6,.5,1) both;max-width:62%;text-align:center;line-height:1.2}
@keyframes stamp{from{transform:rotate(8deg) scale(3.5);opacity:0}}
.result h2{font-size:clamp(28px,8.5vw,40px);line-height:1.15;margin:2px 0 6px;color:#fff;text-wrap:balance}
.result p{margin:0 0 10px;font-size:15px;line-height:1.5;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
.stats div{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 4px;text-align:center}
.stats span{display:block;font-size:11px;opacity:.75}
.stats b{font-size:15px;white-space:nowrap}
.tip{font-size:13px;opacity:.85;border-top:1px dashed rgba(255,255,255,.2);padding-top:8px;margin-bottom:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 80px);transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid rgba(255,207,107,.5);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;z-index:9;white-space:nowrap;animation:up .3s both}
/* portal: phone landscape — compact result card, right side, scrollable with the buttons always visible */
@media (orientation:landscape) and (max-height:560px){
  .result{margin:auto 0 auto auto;width:min(420px,58%);max-height:calc(100dvh - 16px);overflow:auto;padding:10px 12px 0}
  .result h2{font-size:22px;margin:0 0 4px}.result p{font-size:12.5px;margin:0 0 6px}.result .stats{margin:4px 0}.result .tip{font-size:12px}
  .result .bottom{position:sticky;bottom:0;background:rgba(7,10,28,.96);padding:8px 0 10px;margin-top:6px}.result .bottom .btn{min-height:40px;padding:8px}
}
@media (prefers-reduced-motion:reduce){.timer.hot,.prompt,.title h1{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ui=document.getElementById('ui');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);moonCache={};}
addEventListener('resize',resize);
const T_DRAW=8,T_SLASH=6,SLOW_V=1.1,FAST_V=7;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-(1-t)**3,easeInOut=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
const nowS=()=>performance.now()/1000;
let state='title',stT=0,lastSec=-1,parts=[],texts=[],shake=0,flash=0,flashCol='255,255,255';

// ===== 音 =====
let AC=null,noiseBuf=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,d,type='sine',v=.2,f2=null,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);}
function noise(d,v=.3,ft='lowpass',f=1000,f2=null,delay=0){const a=ac();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const t=a.currentTime+delay;const s=a.createBufferSource();s.buffer=noiseBuf;const fl=a.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.03);}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const SFX={
  hammer(c=1){const k=1+Math.min(c,30)*.025;tone(1500*k,.12,'square',.07,500*k);tone(2400*k,.2,'triangle',.06);noise(.06,.3,'highpass',3000);tone(90,.15,'sine',.25,50);vib(12)},
  taiko(){tone(120,.6,'sine',.7,40);noise(.2,.6,'lowpass',300);vib(40)},
  charge(){tone(90,.6,'sawtooth',.09,1000);noise(.6,.22,'bandpass',200,4000)},
  impact(){noise(2.2,.75,'lowpass',1200,40);tone(70,1.6,'sine',.6,20);tone(40,2.2,'sine',.5,18);noise(.25,.6,'highpass',2000);tone(3000,.6,'triangle',.05,700);noise(2.5,.4,'lowpass',500,40,.15);vib([80,30,300])},
  thunder(){noise(.45,.35,'bandpass',3500,300)},
  rumble(){tone(42,1.6,'sawtooth',.07,60);noise(1.6,.2,'lowpass',150)},
  milestone(){[784,988,1318].forEach((f,i)=>tone(f,.18,'square',.06,null,i*.06))},
  bigMilestone(){[523,784,1046,1568].forEach((f,i)=>tone(f,.3,'square',.07,null,i*.08));noise(.6,.3,'bandpass',800,4000)},
  fold(){noise(.35,.3,'lowpass',400,1500);tone(150,.3,'sawtooth',.06,90);vib(25)},
  sharpen(){noise(.22,.22,'bandpass',2500,7000);tone(3200,.25,'sine',.03,4400)},
  tick(){tone(1000,.05,'square',.05)},
  go(){tone(600,.1,'square',.07);tone(900,.25,'square',.07,null,.1)},
  whoosh(){noise(.45,.5,'bandpass',500,5000)},
  boom(){noise(1.8,.7,'lowpass',900,50);tone(80,1.3,'sine',.5,25);vib([60,30,220])},
  crack(){tone(2600,.4,'triangle',.12,1700);tone(3900,.2,'square',.05);noise(.1,.3,'highpass',4000);vib([20,20,40])},
  clink(){tone(1900,.35,'triangle',.12);tone(2850,.3,'triangle',.06);noise(.05,.2,'highpass',5000);vib(30)},
  swish(){noise(.3,.25,'bandpass',300,900)},
  extend(){tone(160,1.1,'sawtooth',.05,1800);noise(1.1,.12,'bandpass',300,3000)},
  fanfare(){[523,659,784,1046].forEach((f,i)=>tone(f,.4,'triangle',.08,null,i*.12))},
  sad(){[392,370,349,311].forEach((f,i)=>tone(f,.4,'triangle',.07,null,i*.2))}
};


// ===== 星 =====
const stars=Array.from({length:260},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.5+Math.random()*2}));
function drawSpace(t,dim=1){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04050f');g.addColorStop(.6,'#0a0f2c');g.addColorStop(1,'#141a3e');
  ctx.fillStyle=g;ctx.fillRect(-50,-50,W+100,H+100);
  const n=ctx.createRadialGradient(W*.75,H*.25,0,W*.75,H*.25,Math.max(W,H)*.6);n.addColorStop(0,'rgba(90,60,160,.18)');n.addColorStop(1,'rgba(90,60,160,0)');
  ctx.fillStyle=n;ctx.fillRect(0,0,W,H);
  for(const s of stars){const a=(.45+.55*Math.sin(t*s.s+s.p))*dim;ctx.fillStyle=`rgba(255,250,235,${a})`;ctx.fillRect(s.x*W,s.y*H,s.r,s.r);}
}

// ===== 月テクスチャ =====
let moonCache={};
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function moonTex(R){const k=Math.round(R);if(moonCache[k])return moonCache[k];
  const c=document.createElement('canvas');const s=Math.ceil(R*2*DPR)+2;c.width=c.height=s;const g=c.getContext('2d');g.scale(DPR,DPR);const r=rng(7);
  g.save();g.beginPath();g.arc(R,R,R,0,7);g.clip();
  let gr=g.createRadialGradient(R*.7,R*.6,R*.1,R,R,R);gr.addColorStop(0,'#fffbea');gr.addColorStop(.6,'#e8dec2');gr.addColorStop(1,'#a89e86');g.fillStyle=gr;g.fillRect(0,0,2*R,2*R);
  for(let i=0;i<8;i++){g.fillStyle='rgba(115,108,96,.22)';g.beginPath();g.ellipse(R+(r()-.5)*1.3*R,R+(r()-.5)*1.3*R,R*(.15+r()*.25),R*(.1+r()*.2),r()*3,0,7);g.fill();}
  for(let i=0;i<46;i++){const x=r()*2*R,y=r()*2*R,cr=R*(.02+r()*r()*.12);g.fillStyle='rgba(90,84,74,.33)';g.beginPath();g.arc(x,y,cr,0,7);g.fill();
    g.strokeStyle='rgba(255,255,240,.35)';g.lineWidth=Math.max(.6,cr*.16);g.beginPath();g.arc(x-cr*.1,y-cr*.1,cr,Math.PI*.9,Math.PI*1.7);g.stroke();}
  gr=g.createRadialGradient(R*.6,R*.5,R*.5,R*.8,R*.7,R*1.5);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(10,10,30,.55)');g.fillStyle=gr;g.fillRect(0,0,2*R,2*R);
  g.restore();moonCache[k]=c;return c;}
function moonImg(x,y,R){ctx.drawImage(moonTex(R),x-R,y-R,R*2,R*2);}
function moonHalo(x,y,R,a=1){const g=ctx.createRadialGradient(x,y,R*.9,x,y,R*1.9);g.addColorStop(0,`rgba(255,240,200,${.28*a})`);g.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*1.9,0,7);ctx.fill();}
function saturnImg(r){ctx.save();ctx.rotate(-.4);
  ctx.strokeStyle='rgba(215,195,150,.85)';ctx.lineWidth=r*.38;ctx.beginPath();ctx.ellipse(0,0,r*2.1,r*.6,0,Math.PI,2*Math.PI);ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();const g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#f3dca4');g.addColorStop(.5,'#c9a46a');g.addColorStop(1,'#7d6038');ctx.fillStyle=g;ctx.fillRect(-r,-r,2*r,2*r);
  ctx.fillStyle='rgba(120,85,45,.3)';for(const yy of[-.45,.05,.5])ctx.fillRect(-r,yy*r,2*r,r*.13);ctx.restore();
  ctx.strokeStyle='rgba(235,215,165,.95)';ctx.lineWidth=r*.38;ctx.beginPath();ctx.ellipse(0,0,r*2.1,r*.6,0,0,Math.PI);ctx.stroke();ctx.restore();}
function sunImg(r){const g=ctx.createRadialGradient(0,0,0,0,0,r*1.7);g.addColorStop(0,'#fffbe0');g.addColorStop(.45,'#ffd35a');g.addColorStop(.6,'#ff9a2a');g.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.7,0,7);ctx.fill();}


function drawHilt(P,a,len,sc=1){const dx=Math.sin(a),dy=-Math.cos(a);ctx.save();ctx.translate(P.x,P.y);ctx.rotate(a);
  const hw=7*sc;ctx.fillStyle='#1a1410';ctx.fillRect(-hw/2,0,hw,len);ctx.fillStyle='#d9a441';
  for(let y=4*sc;y<len-2;y+=8*sc){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(hw/2,y+4*sc);ctx.lineTo(0,y+8*sc);ctx.lineTo(-hw/2,y+4*sc);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#e8b64c';ctx.beginPath();ctx.ellipse(0,0,13*sc,4*sc,0,0,7);ctx.fill();ctx.fillStyle='#6b4a14';ctx.fillRect(-4*sc,-1.5*sc,8*sc,3*sc);ctx.restore();}


// ===== 立体の月（球体レンダリング・自転） =====
const SPH={N:256,tw:512,th:256};
function initSphere(){const tc=document.createElement('canvas');tc.width=SPH.tw;tc.height=SPH.th;const g=tc.getContext('2d'),r=rng(7);
  g.fillStyle='#e6dcc4';g.fillRect(0,0,SPH.tw,SPH.th);
  const wrap=(f)=>{for(const o of[-SPH.tw,0,SPH.tw])f(o);};
  for(let i=0;i<14;i++){const x=r()*SPH.tw,y=SPH.th*(.2+r()*.6),rx=20+r()*60,ry=12+r()*30,a=r()*3;wrap(o=>{g.fillStyle='rgba(110,104,94,.28)';g.beginPath();g.ellipse(x+o,y,rx,ry,a,0,7);g.fill();});}
  for(let i=0;i<160;i++){const x=r()*SPH.tw,y=r()*SPH.th,cr=1.5+r()*r()*16;wrap(o=>{g.fillStyle='rgba(95,88,78,.38)';g.beginPath();g.arc(x+o,y,cr,0,7);g.fill();g.strokeStyle='rgba(255,252,240,.4)';g.lineWidth=Math.max(.6,cr*.18);g.beginPath();g.arc(x+o-cr*.1,y-cr*.1,cr,Math.PI*.9,Math.PI*1.7);g.stroke();});}
  for(let i=0;i<1800;i++){g.fillStyle=`rgba(${r()<.5?60:255},${r()<.5?60:250},${r()<.5?50:235},.06)`;g.fillRect(r()*SPH.tw,r()*SPH.th,2,2);}
  SPH.tex=g.getImageData(0,0,SPH.tw,SPH.th).data;
  const N=SPH.N;SPH.cv=document.createElement('canvas');SPH.cv.width=SPH.cv.height=N;SPH.g=SPH.cv.getContext('2d');SPH.img=SPH.g.createImageData(N,N);
  const n=N*N;SPH.lon=new Float32Array(n);SPH.row=new Int32Array(n);SPH.sh=new Float32Array(n);SPH.al=new Float32Array(n);
  const L=[-.45,-.5,.74],ll=Math.hypot(...L);L[0]/=ll;L[1]/=ll;L[2]/=ll;const tilt=.35,ct=Math.cos(tilt),st=Math.sin(tilt),c=N/2,rad=N/2-1;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,nx=(x+.5-c)/rad,ny=(y+.5-c)/rad,rr=nx*nx+ny*ny;if(rr>1.02){SPH.al[i]=0;continue;}
    const nz=Math.sqrt(Math.max(0,1-rr));const y2=ny*ct-nz*st,z2=ny*st+nz*ct;SPH.lon[i]=Math.atan2(nx,z2);SPH.row[i]=Math.min(SPH.th-1,Math.max(0,((Math.asin(Math.max(-1,Math.min(1,y2)))/Math.PI+.5)*SPH.th)|0));
    const dif=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);SPH.sh[i]=.16+1.0*dif**.9*(.75+.25*nz);SPH.al[i]=Math.max(0,Math.min(1,(1-Math.sqrt(rr))*rad+.5));}
  updateSphere(0);}
function updateSphere(rot){const N=SPH.N,d=SPH.img.data,T=SPH.tex,tw=SPH.tw,k=tw/(Math.PI*2);for(let i=0,n=N*N;i<n;i++){const a=SPH.al[i],o=i*4;if(a<=0){d[o+3]=0;continue;}
    let u=((SPH.lon[i]+rot)*k)%tw;if(u<0)u+=tw;const ti=(SPH.row[i]*tw+(u|0))*4,s=SPH.sh[i];d[o]=Math.min(255,T[ti]*s);d[o+1]=Math.min(255,T[ti+1]*s);d[o+2]=Math.min(255,T[ti+2]*s*.97);d[o+3]=a*255;}
  SPH.g.putImageData(SPH.img,0,0);}
moonTex=function(){return SPH.cv;};
moonImg=function(x,y,R){ctx.drawImage(SPH.cv,x-R,y-R,R*2,R*2);};

// ===== パーティクル =====
function addRock(x,y,vx,vy,sz,col='#8d867a',hot=false){const pts=[];const k=5+(Math.random()*3|0);for(let i=0;i<k;i++)pts.push([Math.cos(i/k*6.28)*sz*rand(.6,1.1),Math.sin(i/k*6.28)*sz*rand(.6,1.1)]);
  parts.push({t:'rock',x,y,vx,vy,life:rand(2.5,5),max:5,rot:rand(0,6),vr:rand(-4,4),pts,col,hot});}
function addSpark(x,y,vx,vy,col='255,170,60',life=rand(.3,.8)){parts.push({t:'spark',x,y,vx,vy,life,max:life,col});}
function addText(text,x,y,size,col='#fff'){if(state==='forge'&&texts.length>4)texts.shift();texts.push({text,x,y,size,col,t0:gt});}

let raw=[],drawing=false,doodle=null;
function resample(pts,N){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));const tot=cum[cum.length-1]||1,out=[];let j=0;
  for(let k=0;k<N;k++){const s=tot*k/(N-1);while(j<cum.length-2&&cum[j+1]<s)j++;const f=(s-cum[j])/Math.max(1e-6,cum[j+1]-cum[j]);out.push({x:pts[j].x+(pts[j+1].x-pts[j].x)*f,y:pts[j].y+(pts[j+1].y-pts[j].y)*f});}return{out,len:tot};}
function segX(a,b,c,d){const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;}
function makeDoodle(){
  let pts=raw.slice(),stick=false;let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  if(pts.length<4||L<40){stick=true;pts=[{x:W*.2,y:H*.5},{x:W*.8,y:H*.5}];}
  const {out:rs,len}=resample(pts,72);
  const bb=p=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};};
  let b=bb(rs);const md=Math.max(b.w,b.h,1);const se=Math.hypot(rs[rs.length-1].x-rs[0].x,rs[rs.length-1].y-rs[0].y);
  const closed=!stick&&se<md*.22&&len>md*2.2;
  let phi=0;if(!closed&&se>md*.35)phi=Math.atan2(rs[rs.length-1].y-rs[0].y,rs[rs.length-1].x-rs[0].x);
  const c=Math.cos(-phi),s=Math.sin(-phi);let loc=rs.map(p=>({x:(p.x-b.cx)*c-(p.y-b.cy)*s,y:(p.x-b.cx)*s+(p.y-b.cy)*c}));
  b=bb(loc);const m2=Math.max(b.w,b.h,1);loc=loc.map(p=>({x:(p.x-b.cx)/m2,y:(p.y-b.cy)/m2}));b=bb(loc);
  let inter=0;for(let i=0;i<loc.length-1;i++)for(let j=i+4;j<loc.length-1;j++){if(i===0&&j===loc.length-2&&closed)continue;if(segX(loc[i],loc[i+1],loc[j],loc[j+1]))inter++;}
  let corners=0,ext=0,lastDir=0;for(let i=2;i<loc.length;i+=2){const a=loc[i-2],m=loc[i-1],q=loc[i];const v1x=m.x-a.x,v1y=m.y-a.y,v2x=q.x-m.x,v2y=q.y-m.y;const ang=Math.acos(clamp((v1x*v2x+v1y*v2y)/((Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1),-1,1));if(ang>1.0)corners++;}
  for(let i=1;i<loc.length;i++){const dy=loc[i].y-loc[i-1].y;if(Math.abs(dy)>.004){const d=Math.sign(dy);if(lastDir&&d!==lastDir)ext++;lastDir=d;}}
  const devi=Math.max(...loc.map(p=>Math.abs(p.y)));
  let type;if(closed)type=corners>=4?'spiky':'cutout';else if(inter>=3)type='shatter';else if(b.h<.09||devi<.06)type='straight';else if(ext>=3&&corners>=2)type='zigzag';else type='crescent';
  doodle={loc,closed,stick,type,inter,w:b.w,h:b.h,screen:rs};
}
function place(Q,th,s){const c=Math.cos(th),sn=Math.sin(th);return doodle.loc.map(p=>({x:Q.x+(p.x*c-p.y*sn)*s,y:Q.y+(p.x*sn+p.y*c)*s}));}
function cutScale(R){return doodle.closed?R*1.5:Math.min(2.5*R/Math.max(doodle.w,.08),2.4*R/Math.max(doodle.h,.08));}

function regionA(g,c){g.beginPath();const p=c.pts;if(c.closed){p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.closePath();return;}
  const d=c.d,n=c.n,E=3000,a=p[0],b=p[p.length-1];g.moveTo(a.x-d.x*E,a.y-d.y*E);p.forEach(q=>g.lineTo(q.x,q.y));g.lineTo(b.x+d.x*E,b.y+d.y*E);g.lineTo(b.x+d.x*E-n.x*E,b.y+d.y*E-n.y*E);g.lineTo(a.x-d.x*E-n.x*E,a.y-d.y*E-n.y*E);g.closePath();}
function regionB(g,c){if(c.closed){regionA(g,c);g.rect(-1e4,-1e4,2e4,2e4);return 'evenodd';}
  g.beginPath();const p=c.pts,d=c.d,n=c.n,E=3000,a=p[0],b=p[p.length-1];g.moveTo(a.x-d.x*E,a.y-d.y*E);p.forEach(q=>g.lineTo(q.x,q.y));g.lineTo(b.x+d.x*E,b.y+d.y*E);g.lineTo(b.x+d.x*E+n.x*E,b.y+d.y*E+n.y*E);g.lineTo(a.x-d.x*E+n.x*E,a.y-d.y*E+n.y*E);g.closePath();return 'nonzero';}
function centroid(p){let x=0,y=0;for(const q of p){x+=q.x;y+=q.y;}return{x:x/p.length,y:y/p.length};}
function pieceXf(c,which,e,mul=1){const pr=1-Math.exp(-e*1.3);
  if(c.closed){if(which==='A'){const C=centroid(c.pts),k=1+.45*pr*mul;ctx.translate(C.x+pr*c.R*.55*mul+e*c.R*.12,C.y-pr*c.R*.9*mul-e*c.R*.05);ctx.rotate(pr*.7+e*.5);ctx.scale(k,k);ctx.translate(-C.x,-C.y);ctx.globalAlpha=clamp(1-(e-2.2)/1.5,0,1);}else{ctx.translate(Math.sin(e*40)*Math.max(0,.3-e)*12,Math.sin(e*1.6)*4);}return;}
  const sep=(c.R*.42*pr+e*c.R*.05)*mul,sg=which==='A'?-1:1,dr=Math.sin(e*1.3)*c.R*.02;ctx.translate(c.Q.x+c.n.x*sep*sg+c.d.x*dr*sg,c.Q.y+c.n.y*sep*sg+c.d.y*dr*sg);ctx.rotate(sg*(.12*pr+e*.035));ctx.translate(-c.Q.x,-c.Q.y);}
function cutGlow(c,M,a){if(a<=0)return;ctx.save();ctx.beginPath();ctx.arc(M.x,M.y,M.r,0,7);ctx.clip();ctx.lineJoin='round';ctx.lineCap='round';
  for(const[lw,col]of[[16,`rgba(255,90,20,${.35*a})`],[6,`rgba(255,160,60,${.9*a})`],[2,`rgba(255,240,200,${a})`]]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();c.pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(c.closed)ctx.closePath();ctx.stroke();}ctx.restore();}
// かけらは斬った瞬間に1枚の絵として作り、以後は絵を動かすだけ（クリップを毎フレーム使わない）
function polyFill(g,c,which,ox,oy){g.beginPath();const p=c.pts.map(q=>({x:q.x-ox,y:q.y-oy}));
  if(c.closed){p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.closePath();g.fill();return;}
  const d=c.d,n=c.n,E=Math.max(W,H)*3,a=p[0],b=p[p.length-1],sg=which==='A'?-1:1;
  g.moveTo(a.x-d.x*E,a.y-d.y*E);p.forEach(q=>g.lineTo(q.x,q.y));g.lineTo(b.x+d.x*E,b.y+d.y*E);g.lineTo(b.x+d.x*E+sg*n.x*E,b.y+d.y*E+sg*n.y*E);g.lineTo(a.x-d.x*E+sg*n.x*E,a.y-d.y*E+sg*n.y*E);g.closePath();g.fill();}
function makePieces(M,c){const m=Math.ceil(M.r*.15),sz=Math.ceil(M.r*2+m*2),ox=M.x-M.r-m,oy=M.y-M.r-m,out={};

// 断面：球を平面で切った面を、層（地殻・マントル・核）ごとに重ねて描く。傾きφで楕円に見える
const LAYERS=[[1,'#b3aa98'],[.93,'#8c8273'],[.8,'#6a4430'],[.6,'#a8461c'],[.42,'#ec7426'],[.24,'#ffc066'],[.1,'#fff1c8']];
function drawFace(c,M,phi,e){const s=Math.sin(phi),glow=Math.max(.6,1-e/5);
  for(const[f,col]of LAYERS){const Rk=M.r*f,runs=[];let cur=[];
    for(const p of c.pts){const r=Math.hypot(p.x-M.x,p.y-M.y);if(r<Rk)cur.push({p,dep:Math.sqrt(Rk*Rk-r*r)});else if(cur.length){runs.push(cur);cur=[];}}if(cur.length)runs.push(cur);

      for(let i=run.length-1;i>=0;i--){const o=run[i];ctx.lineTo(o.p.x-c.n.x*o.dep*s,o.p.y-c.n.y*o.dep*s);}ctx.closePath();ctx.fill();
      if(f===1){ctx.strokeStyle='rgba(255,250,235,.55)';ctx.lineWidth=1.2;ctx.stroke();}}}

    straight:['月、真っ二つ。','一本線の刀で、月が見事に割れた。','月斬り王'],
    zigzag:['月が、ギザギザに割れた。','ギザギザの刀で、月の割れ目もギザギザ。','ギザギザ侍'],
    crescent:['月が、三日月になった。','曲がった刀で斬ったら、三日月ができた。','三日月職人'],
    stuck:['めり込んだ。','振りが遅すぎて、刀が月に刺さったまま抜けない。','月に刺した人'],
    miss:['空振り。','月にかすりもしなかった。','素振り侍'],
    timeout:['振れなかった。','月の大きさに、怖気づいた。','見てるだけの人']}[o];
  let tip={stuck:'もっと速く振り抜こう。',miss:'月の上をなぞるように振ろう。',timeout:'月の上をスワイプ！'}[o]||'別の形を描くと、月の割れ方が変わる。ハート、星、ぐるぐる…';
  if(S.pace==='fast'&&!['miss','stuck'].includes(o)){D[0]='やりすぎた。画面ごと斬れた。';D[1]='速すぎた一振りが、月も宇宙もスマホの画面も、刀の形に斬った。';D[2]='第四の壁斬り';tip='ちょうどいい速さだと、月だけが斬れる。';}
  const ok=matchOdai(o);plays++;streak=ok?streak+1:0;
  const reveal=['miss','timeout','stuck'].includes(o)?`月のうさぎ「${RAB[o][1]}」`:`月の中から、餅つき中のうさぎが出てきた。「${RAB[S.pace==='fast'?'fast':o][1]}」`;
  if(ok)tip='次のお題に挑戦しよう。';else if(!['miss','stuck','timeout'].includes(o))tip=`お題は「${odai.t}」。ヒント：${odai.hint}`;
  RES={title:D[0],rank:D[2],ok};(ok?SFX.fanfare:SFX.sad)();state='result';
  setUI(`<div class="col"><div class="result"><div class="hanko">${D[2]}</div><div class="verdict ${ok?'ok':'ng'}">お題「${odai.t}」${ok?'クリア！':'失敗…'}</div><h2 class="mincho">${D[0]}</h2><p>${reveal}</p>
    <div class="stats"><div><span>月のかけら</span><b>${pieces}個</b></div><div><span>斬撃速度</span><b>${S.v?km+' km/s':'-'}</b></div><div><span>連続クリア</span><b>${streak}</b></div></div>
    <div class="tip">💡 ${tip}</div>
    <div class="bottom"><button class="btn ghost" id="again">${ok?'次のお題':'もう一回'}</button><button class="btn" id="share">結果をコピー</button></div></div></div>`);
  if(ok)setTimeout(()=>addStamp('お題クリア',{size:Math.min(W*.16,64),y:H*.1,dur:1.6,col:'#9ff0c0',glow:'80,220,140'}),200);
  setTimeout(()=>{shake=12;SFX.taiko();},450);
  document.getElementById('again').addEventListener('click',()=>{const wasOk=!!(RES&&RES.ok);SFX.go();newGame();if(wasOk)pickOdai();go('draw');});
  document.getElementById('share').addEventListener('click',shareResult);}
async function shareResult(){const t=`落書きした刀で、月を斬ってみた。\nお題「${odai.t}」→ ${RES.title}${RES.ok?'（クリア！）':''}\n称号：${RES.rank}\n#月斬り王 #MOONSLICEKING`;
  try{await navigator.clipboard.writeText(t);toast('結果テキストをコピーしました');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'結果テキストをコピーしました':'コピーできませんでした');}}

// ===== 画面斬り =====
function applyScreenCut(){try{applyScreenCut2();}catch(err){noteErr(err);screenCut=null;for(let i=0;i<10;i++)ctx.restore();ctx.setTransform(DPR,0,0,DPR,0,0);}}
function applyScreenCut2(){const e=nowS()-screenCut.t0,k=1-Math.exp(-e*3),c=S.cut;if(!offC)offC=document.createElement('canvas');if(offC.width!==cv.width||offC.height!==cv.height){offC.width=cv.width;offC.height=cv.height;}
  const o=offC.getContext('2d');o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,offC.width,offC.height);o.drawImage(cv,0,0);
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const big={pts:c.closed?c.pts.map(q=>({x:c.Q.x+(q.x-c.Q.x)*1.6,y:c.Q.y+(q.y-c.Q.y)*1.6})):c.pts,closed:c.closed,d:c.d,n:c.n};
  for(const which of['B','A']){ctx.save();if(c.closed){if(which==='A'){const C=centroid(big.pts),s=1+.12*k;ctx.translate(C.x,C.y);ctx.rotate(.05*k);ctx.scale(s,s);ctx.translate(-C.x,-C.y);}}
    else{const sg=which==='A'?-1:1,sp=22*k;ctx.translate(c.n.x*sp*sg,c.n.y*sp*sg);}
    if(which==='B'){const r=regionB(ctx,big);r==='evenodd'?ctx.clip('evenodd'):ctx.clip();}else{regionA(ctx,big);ctx.clip();}ctx.drawImage(offC,0,0,W,H);ctx.restore();}
  ctx.strokeStyle=`rgba(255,255,255,${Math.max(.2,1-k)})`;ctx.lineWidth=2;ctx.beginPath();big.pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));if(big.closed)ctx.closePath();ctx.stroke();ctx.restore();}

// ===== UI =====
function setUI(h){ui.innerHTML=h;}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function go(s){state=s;stT=nowS();lastSec=-1;if(s==='title')uiTitle();else if(s==='draw')uiDraw();else if(s==='slash')setUI('');}
function newGame(){raw=[];doodle=null;S=null;rab=null;RES=null;screenCut=null;parts=[];texts=[];rings=[];bolts=[];pillars=[];flash=0;shake=0;hitStop=0;slow=0;}
function uiTitle(){setUI(`<div class="col title"><div class="tag">落書きした刀で、月を斬ってみた。</div><h1 class="mincho">月斬り王</h1><div class="en">MOON SLICE KING</div>
  <div class="pitch">描いた<b>形のとおり</b>に、月が斬れる。<br><span style="font-size:15px;opacity:.85">月の中には、何かいるらしい。</span></div><button class="btn" id="start">刀を描く</button></div>`);
  document.getElementById('start').addEventListener('click',()=>{ac();SFX.go();newGame();pickOdai();go('draw');});}
function uiDraw(){setUI(`<div class="col"><div class="hud"><div><div class="odai">お題</div><div class="ph mincho">月を「${odai.t}」にしろ！</div><div class="sub">ヒント：${odai.hint}</div></div><div class="timer" id="tm">${T_DRAW}</div></div>
  <div class="spacer"></div><div class="drawhint">描いた線が、そのまま刀になる（描き始めが柄）</div><div class="bottom"><button class="btn" id="done">この刀で斬る →</button></div></div>`);
  document.getElementById('done').addEventListener('click',finishDraw);}
function uiReady(){setUI(`<div class="col" style="padding-top:2vh"><div class="prompt mincho" style="margin-top:0">月をなぞって斬れ！ <span id="tm">${T_SLASH}</span></div>
  <div class="speedhint">振る速さで結果が変わる：<b>遅い</b>とめり込む／<b>速すぎ</b>ると…</div></div>`);}
function finishDraw(){if(state!=='draw')return;drawing=false;makeDoodle();SFX.taiko();flash=.6;flashCol='255,220,150';shake=10;
  addStamp('巨大化!!',{size:Math.min(W*.2,90),y:H*.42,dur:1.1,sub:doodle.stick?'（何も描かなかったので、ただの棒）':''});startSlash();}

// ===== 入力 =====
cv.addEventListener('pointerdown',e=>{ac();if(state==='draw'){drawing=true;raw=[{x:e.clientX,y:e.clientY}];cv.setPointerCapture(e.pointerId);}
  else if(state==='slash'&&S&&S.ph==='ready'){swipe={x:e.clientX,y:e.clientY,t:performance.now()};S.trail=[{x:e.clientX,y:e.clientY,t:nowS()}];cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{if(state==='draw'&&drawing){const l=raw[raw.length-1];if(Math.hypot(e.clientX-l.x,e.clientY-l.y)>3)raw.push({x:e.clientX,y:e.clientY});}
  else if(swipe&&S){S.trail.push({x:e.clientX,y:e.clientY,t:nowS()});}});
cv.addEventListener('pointerup',e=>{drawing=false;if(swipe&&S){const sw=swipe;swipe=null;doSwipe(sw.x,sw.y,e.clientX,e.clientY,performance.now()-sw.t);}});
cv.addEventListener('pointercancel',()=>{drawing=false;swipe=null;});
addEventListener('keydown',e=>{if(state==='draw'&&e.key==='Enter')finishDraw();
  if(state==='slash'&&S&&S.ph==='ready'){const M=geo().M;if(e.key==='ArrowRight')doSwipe(M.x-M.r*1.5,M.y,M.x+M.r*1.5,M.y,200);if(e.key==='ArrowLeft')doSwipe(M.x-M.r*1.5,M.y,M.x+M.r*1.5,M.y,1200);if(e.key==='ArrowUp')doSwipe(M.x-M.r*1.5,M.y,M.x+M.r*1.5,M.y,40);}});

// ===== 描画 =====
let demo=null;
function heart(N=72){const p=[];for(let i=0;i<N;i++){const t=i/(N-1)*Math.PI*2;p.push({x:16*Math.sin(t)**3/34,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/34});}return p;}
function renderTitle(t){drawSpace(t);if(Math.random()<.5)addSpark(rand(0,W),H+5,rand(-20,20),rand(-90,-170),Math.random()<.7?'255,180,90':'190,220,255',rand(2.5,4.5));
  const R=Math.min(W*.4,H*.21),M={x:W/2,y:H*.45,r:R};auraFlames(M.x,M.y+R*.9,R*.9,.35,t);moonHalo(M.x,M.y,R);
  const cyc=t%4.5;const hp=heart().map(p=>({x:M.x+p.x*R*1.5,y:M.y+p.y*R*1.5}));if(!demo||demo.R!==R)demo={pts:hp,closed:true,Q:M,R};const c=demo;
  if(cyc<2.2)moonImg(M.x,M.y,R);else drawMoonCut(M,c,cyc-2.2);
  if(cyc>1.6&&cyc<2.2){const k=(cyc-1.6)/.6,n=Math.floor(k*hp.length);ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(255,240,200,.95)';ctx.lineWidth=4;ctx.beginPath();hp.slice(0,n).forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();ctx.restore();}}
function renderDraw(t){drawSpace(t,.6);const G=geo();ctx.globalAlpha=.3;moonImg(G.M.x,G.M.y,G.M.r);ctx.globalAlpha=1;drawGuide(odai.k,G.M,t,.7);
  if(raw.length>1){drawSword(raw,0,0,1,.6,7);}
  else{ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='700 15px "Zen Kaku Gothic New",sans-serif';ctx.textAlign='center';ctx.fillText('ここに指で描く',W/2,H*.62);}}
function renderScene(t){const G=geo(),M=G.M;drawSpace(t);if(!S)return;
  ctx.save();ctx.translate(G.Su.x,G.Su.y);sunImg(G.Su.r);ctx.restore();ctx.save();ctx.translate(G.Sa.x,G.Sa.y);saturnImg(G.Sa.r);ctx.restore();
  const ER=Math.max(W,H)*1.6,ey=H*.95+ER;ctx.fillStyle='rgba(120,190,255,.25)';ctx.beginPath();ctx.arc(W/2,ey,ER+10,0,7);ctx.fill();ctx.fillStyle='#1f5a96';ctx.beginPath();ctx.arc(W/2,ey,ER,0,7);ctx.fill();ctx.fillStyle='rgba(60,140,80,.6)';ctx.beginPath();ctx.ellipse(W*.22,H*.975,W*.16,H*.015,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(W*.82,H*.985,W*.14,H*.02,0,0,7);ctx.fill();drawSamurai(W/2,H*.955-((S.cutT!==undefined&&S.ph==='after')?Math.abs(Math.sin(t*7))*H*.012:0));
  if(S.cutT!==undefined){drawMoonCut(M,S.cut,gt-S.cutT,S.pace==='fast'?2.2:1);}
  else{moonHalo(M.x,M.y,M.r);let wob=0;if(S.stuck){wob=Math.sin(t*30)*Math.max(0,1-S.t)*.06;}ctx.save();ctx.translate(M.x,M.y);ctx.rotate(wob);ctx.translate(-M.x,-M.y);moonImg(M.x,M.y,M.r);if(S.stuck)cutGlow(S.cut,M,.5);ctx.restore();}
  try{renderRabbit(t,M.r);}catch(err){noteErr(err);for(let i=0;i<10;i++)ctx.restore();}
  if(S.ph==='grow'){const k=easeOut(Math.min(1,S.t/1.2)),ip=idlePts(t);const pts=S.from.map((p,i)=>({x:p.x+(ip[i].x-p.x)*k,y:p.y+(ip[i].y-p.y)*k}));speedLines(hands().x,hands().y,1-k*.6,t,'200,225,255');auraFlames(W/2,H*.92,H*.06,S.aura,t);drawSword(pts,0,0,1,S.aura,6+6*k);}
  else if(S.ph==='ready'){const ip=idlePts(t);auraFlames(W/2,H*.92,H*.06,S.aura,t);drawSword(ip,0,0,1,S.aura,11);drawGuide(odai.k,M,t,.45);
    if(S.trail.length>1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.strokeStyle='rgba(255,240,200,.9)';ctx.lineWidth=5;ctx.beginPath();S.trail.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();ctx.restore();}}
  else if(S.cut){const c=S.cut,D=c.R*2.3;let pts,ox=0,oy=0,al=1;
    if(S.ph==='align'){const k=easeInOut(Math.min(1,S.t/.5));pts=S.start.map((p,i)=>({x:p.x+(c.pts[i].x-c.n.x*D-p.x)*k,y:p.y+(c.pts[i].y-c.n.y*D-p.y)*k}));speedLines(M.x,M.y,1,t,'255,235,190');}
    else{pts=c.pts;const off=S.ph==='chop'?S.off:(S.stuck?0:D+S.t*D*2);ox=c.n.x*off;oy=c.n.y*off;if(S.ph==='after'&&!S.stuck){al=Math.max(0,1-S.t*2);if(S.t>.5){const k=easeOut(Math.min(1,(S.t-.5)/.5));const ip=idlePts(t);auraFlames(W/2,H*.92,H*.05,.5,t);drawSword(ip,0,(1-k)*-H*.15,k,.6,11);}}
      if(S.ph==='chop'&&!S.stuck){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=1;i<=5;i++){const o2=off-i*D*.12;ctx.globalAlpha=.12*(6-i)/5;drawSword(pts,c.n.x*o2,c.n.y*o2,1,0,c.R*.09);}ctx.restore();}}
    drawSword(pts,ox,oy,al,S.aura,clamp(c.R*.09,6,18));}}

// ===== ループ =====
let last=performance.now();
let lastErr='';function noteErr(err){lastErr=String(err&&err.message||err).slice(0,80);console.error(err);}
function frame(ms){requestAnimationFrame(frame);try{step(ms);}catch(err){noteErr(err);for(let i=0;i<40;i++)ctx.restore();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  if(lastErr){ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.font='12px monospace';ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,H*.12,W,20);ctx.fillStyle='#ff8a8a';ctx.textAlign='left';ctx.fillText('err: '+lastErr,6,H*.12+14);ctx.restore();}}
let moonRot=0;function step(ms){const dt=Math.min(.05,(ms-last)/1000);last=ms;const t=ms/1000;
  if(!(S&&(S.cutT!==undefined||S.stuck))){moonRot+=dt*.22;updateSphere(moonRot);}
  if(state==='draw'){const left=T_DRAW-(t-stT),sec=Math.ceil(Math.max(0,left));if(sec!==lastSec){lastSec=sec;const tm=document.getElementById('tm');if(tm){tm.textContent=sec;tm.classList.toggle('hot',sec<=3);}if(sec<=3&&sec>0)SFX.tick();}if(left<=0&&!drawing)finishDraw();}
  let gdt=dt;if(hitStop>0){hitStop-=dt;gdt=0;}else if(slow>0){slow-=dt;gdt=dt*.3;}gt+=gdt;
  let tv=0,tl=0;if(state==='slash'&&S){tv=S.ph==='align'?1:S.ph==='ready'?.35:.5;tl=S.ph==='ready'||S.ph==='grow'?0:1;}vign+=(tv-vign)*Math.min(1,dt*5);lb+=(tl-lb)*Math.min(1,dt*7);
  if((state==='slash'||state==='result')&&S)updSlash(gdt);if(state!=='slash'&&state!=='result')lastErr='';
  updParts(gdt);updFx(gdt);shake*=Math.pow(.02,dt);if(hitStop<=0)flash=Math.max(0,flash-dt*1.6);
  ctx.save();if(shake>.3)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  if(state==='title')renderTitle(t);else if(state==='draw')renderDraw(t);else renderScene(t);
  drawParts();drawFx();ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(${flashCol},${Math.min(1,flash)*.85})`;ctx.fillRect(0,0,W,H);}
  drawCinema();drawStamps();if(screenCut&&S&&S.cut)applyScreenCut();}
resize();initSphere();go('title');requestAnimationFrame(frame);
}
</script>
