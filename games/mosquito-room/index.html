<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>蚊を倒したかっただけなのに</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#1a1410;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#3b2a1a}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#e6d6b4;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.outline{color:#ffd23f;-webkit-text-stroke:6px #2b1d12;paint-order:stroke fill;text-shadow:0 4px 0 #2b1d12;font-weight:900}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:58px;display:flex;gap:6px;pointer-events:none;z-index:3}
.box{flex:1;background:rgba(255,250,240,.92);border:3px solid #2b1d12;border-radius:14px;padding:3px 6px;text-align:center}
.box small{display:block;font-size:11px;font-weight:800;color:#7a5a3a;line-height:1.2}
.box b{display:block;font-size:20px;font-weight:900;line-height:1.15;white-space:nowrap}
#hDmg{color:#d23b2f}
#hDmg.bump,#hKill.bump{animation:bump .2s ease-out}
@keyframes bump{0%{transform:scale(1.3)}100%{transform:scale(1)}}
#mute{position:absolute;top:calc(12px + env(safe-area-inset-top));right:10px;width:42px;height:42px;border-radius:50%;border:3px solid #2b1d12;background:#fffaf0;font-size:18px;cursor:pointer;z-index:5}
#hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 0 #2b1d12,0 0 6px #2b1d12;pointer-events:none;z-index:3;transition:opacity .5s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;padding:20px}
.hide{display:none!important}
#title{justify-content:space-between;padding:calc(56px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(rgba(20,14,10,.15),rgba(20,14,10,0) 40%,rgba(20,14,10,.45))}
#title h1{text-align:center;line-height:1.2}
#title h1 .s{display:block;font-size:32px}
#title h1 .l{display:block;font-size:22px;margin-top:8px;color:#fff}
.card{width:100%;max-width:400px;background:#fffaf0;border:4px solid #2b1d12;border-radius:24px;box-shadow:0 8px 0 #2b1d12;padding:18px 20px;text-align:center}
.rules{list-style:none;text-align:left;font-size:15px;font-weight:700;line-height:1.75;margin-bottom:14px}
.rules li::before{content:"✏️ "}
.rules b{color:#d23b2f}
button{font-family:inherit;cursor:pointer}
.big{width:100%;height:62px;border:4px solid #2b1d12;border-radius:34px;background:#e8453c;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 0 #2b1d12}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #2b1d12}
.sub{display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%;height:50px;margin-top:12px;border:3px solid #2b1d12;border-radius:26px;background:#111;color:#fff;font-size:18px;font-weight:900}
#result{background:rgba(20,14,10,.55)}
#result .card{animation:cardIn .35s ease-out;max-height:100%;overflow:auto}
@keyframes cardIn{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#rHead{font-size:15px;font-weight:900;color:#7a5a3a}
#rStats{display:flex;gap:8px;margin-top:8px}
#rStats div{flex:1;border:3px solid #2b1d12;border-radius:14px;padding:4px}
#rStats small{display:block;font-size:12px;font-weight:800;color:#7a5a3a}
#rStats b{font-size:26px;font-weight:900}
#rDmg{margin-top:10px;font-size:14px;font-weight:900;color:#7a5a3a}
#rDmgNum{font-size:44px;line-height:1.1;color:#ffd23f}
#rRank{font-size:20px;font-weight:900;margin-top:2px;color:#d23b2f}
#rList{list-style:none;margin:10px 0 0;font-size:14px;font-weight:700;text-align:left;border-top:2px dashed #c9b28d;padding-top:8px}
#rList li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
#rList li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
#rNote{margin-top:10px;font-size:15px;font-weight:900;line-height:1.5}
#rBtns{margin-top:12px}
/* portal: keep result buttons reachable; phone landscape layouts */
#result .card #rBtns{position:sticky;bottom:-18px;z-index:2;background:#fffaf0;padding:8px 0 12px;margin-bottom:-18px}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none}
  #title{flex-direction:row;justify-content:space-around;align-items:center;gap:18px;padding:10px 18px}
  #title h1{flex:1;min-width:0}#title h1 .s{font-size:26px}#title h1 .l{font-size:16px;margin-top:4px}
  #title .card{flex:1;max-width:none;padding:10px 14px}.rules{font-size:12.5px;line-height:1.5;margin-bottom:8px}.big{height:46px;font-size:20px}
  #result .card{width:min(680px,94%);max-width:none;max-height:96%;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;column-gap:16px;align-content:start}
  #result .card>*{grid-column:1}#rStats{margin-top:4px}#rStats b{font-size:20px}#rDmgNum{font-size:34px!important}#rRank{font-size:15px!important}#rNote{font-size:12px!important}
  #rList{grid-column:2!important;grid-row:1/6;margin:0;padding-top:0;border-top:0;font-size:12px;max-height:118px;overflow:auto}
  #result .card .big{height:42px;font-size:19px}
  #result .card #rBtns{grid-column:2!important;grid-row:6/9;position:static;margin:6px 0 0;padding:0}.sub{height:40px;margin-top:6px;font-size:15px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" class="hide">
    <div class="box"><small>残り</small><b id="hTime">30</b></div>
    <div class="box"><small>退治</small><b id="hKill">0匹</b></div>
    <div class="box" style="flex:1.5"><small>被害額</small><b id="hDmg">¥0</b></div>
  </div>
  <button id="mute" aria-label="音のオンオフ">🔊</button>
  <div id="hint" class="hide">蚊をねらってタップ！ 止まった瞬間がチャンス</div>

  <div id="title" class="overlay">
    <h1 class="outline"><span class="s">蚊を倒したかった<br>だけなのに</span><span class="l">部屋がボロボロになるゲーム</span></h1>
    <div class="card">
      <ul class="rules">
        <li>タップした場所に<b>鉛筆</b>が飛ぶ</li>
        <li>30秒で蚊を何匹倒せる？</li>
        <li>外した鉛筆は<b>部屋に刺さる</b></li>
        <li>壁、ふすま、テレビ…被害額に注意</li>
        <li>蚊が<b>止まった瞬間</b>がチャンス</li>
      </ul>
      <button id="startBtn" class="big">はじめる</button>
    </div>
  </div>

  <div id="result" class="overlay hide">
    <div class="card">
      <div id="rHead">今夜の戦果</div>
      <div id="rStats">
        <div><small>退治</small><b id="rKill">0</b>匹</div>
        <div><small>投げた鉛筆</small><b id="rPen">0</b>本</div>
        <div><small>刺された</small><b id="rBite">0</b>か所</div>
      </div>
      <div id="rDmg">部屋の被害額</div>
      <div id="rDmgNum" class="outline">¥0</div>
      <div id="rRank"></div>
      <ul id="rList"></ul>
      <div id="rNote"></div>
      <div id="rBtns">
        <button id="againBtn" class="big">もう一晩</button>
        <a id="shareBtn" class="sub" href="#" target="_blank" rel="noopener">𝕏 で共有</a>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app = $('app'), cv = $('cv'), ctx = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const GAME_TIME = 30;

/* ---------- layout ---------- */
let W, H, dpr, u, floorY, L, dots = [];
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = app.clientWidth; H = app.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  u = Math.min(W / 400, H / 700);
  floorY = H * 0.8;
  L = {
    light: { cx: W * 0.5, y: H * 0.15, w: W * 0.3, h: H * 0.055 },
    fus: [{ x: W * 0.04, y: H * 0.37, w: W * 0.22, h: floorY - H * 0.37 }, { x: W * 0.26, y: H * 0.37, w: W * 0.22, h: floorY - H * 0.37 }],
    shoji: { x: W * 0.58, y: H * 0.19, w: W * 0.36, h: H * 0.25 },
    clock: { cx: W * 0.17, cy: H * 0.24, r: Math.min(W * 0.075, H * 0.05) },
    frame: { x: W * 0.3, y: H * 0.2, w: W * 0.19, h: H * 0.1 },
    cal: { x: W * 0.58, y: H * 0.49, w: W * 0.1, h: H * 0.09 },
    tv: { x: W * 0.56, y: H * 0.6, w: W * 0.38, h: H * 0.135 },
    stand: { x: W * 0.53, y: H * 0.735, w: W * 0.44, h: floorY - H * 0.735 },
    vase: { x: W * 0.84, y: H * 0.535, w: W * 0.065, h: H * 0.065 }
  };
  dots = [];
  for (let i = 0; i < 260; i++) dots.push([Math.random() * W, Math.random() * floorY, rnd(0.5, 1.6)]);
}
window.addEventListener('resize', resize);
resize();

/* ---------- audio ---------- */
let ac = null, master = null, noiseBuf = null, muted = false, buzz = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
    master.connect(comp); comp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 蚊の羽音
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 560;
    const lfo = ac.createOscillator(); lfo.frequency.value = 7;
    const lg = ac.createGain(); lg.gain.value = 30; lfo.connect(lg).connect(o.frequency);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.2;
    const g = ac.createGain(); g.gain.value = 0;
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    o.connect(bp).connect(g);
    if (pan) { g.connect(pan).connect(master); } else g.connect(master);
    o.start(); lfo.start();
    buzz = { o, g, pan };
  } catch (e) { ac = null; }
}
function env(g, t, peak, a, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function noise(t, dur, type, freq, q, peak, a = 0.003) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); env(g, t, peak, a, dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05); return f;
}
function tone(t, type, f0, f1, dur, peak, a = 0.004) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = ac.createGain(); env(g, t, peak, a, dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  whoosh() { if (!ac) return; noise(ac.currentTime, 0.1, 'highpass', 2500, 0.7, 0.15, 0.02); },
  thunk() { if (!ac) return; const t = ac.currentTime; tone(t, 'sine', 200, 90, 0.09, 0.4); noise(t, 0.03, 'bandpass', 1500, 1.5, 0.3); },
  paper() { if (!ac) return; const t = ac.currentTime; const f = noise(t, 0.2, 'bandpass', 1200, 0.8, 0.45, 0.01); f.frequency.exponentialRampToValueAtTime(4000, t + 0.2); tone(t, 'sine', 160, 90, 0.07, 0.25); },
  glass() { if (!ac) return; const t = ac.currentTime; for (let i = 0; i < 6; i++) { noise(t + i * rnd(0.02, 0.06), 0.09, 'highpass', 3500 + i * 300, 0.8, 0.4); tone(t + i * 0.04, 'triangle', rnd(2200, 4200), rnd(1800, 3800), 0.12, 0.08); } tone(t, 'sine', 150, 60, 0.15, 0.4); },
  crash() { if (!ac) return; const t = ac.currentTime; noise(t, 0.4, 'lowpass', 900, 0.6, 0.7); tone(t, 'sine', 120, 45, 0.3, 0.6); },
  tatami() { if (!ac) return; const t = ac.currentTime; noise(t, 0.08, 'lowpass', 500, 0.7, 0.5); },
  kill() { if (!ac) return; const t = ac.currentTime; noise(t, 0.025, 'bandpass', 3000, 2, 0.4); tone(t + 0.05, 'sine', 1047, 1047, 0.12, 0.25); tone(t + 0.14, 'sine', 1568, 1568, 0.25, 0.25); },
  bite() { if (!ac) return; const t = ac.currentTime; tone(t, 'sine', 2600, 2200, 0.06, 0.2); },
  spark() { if (!ac) return; noise(ac.currentTime, 0.05, 'highpass', 5000, 1, 0.12); },
  end() { if (!ac) return; const t = ac.currentTime; tone(t, 'sine', 523, 523, 0.5, 0.25); tone(t + 0.15, 'sine', 392, 392, 0.7, 0.25); }
};
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

/* ---------- state ---------- */
let S;
function freshState(phase) {
  return {
    phase, time: GAME_TIME, kills: 0, pencils: 0, bites: 0, damage: 0, items: {},
    obj: { light: 0, clock: 0, frame: 0, tv: 0, vase: 0, cal: 11, fus: [[], []], shoji: {}, swing: 0 },
    fall: {}, flying: [], stuck: [], dead: [], parts: [], pops: [], m: null, respawn: 0.6, level: 0,
    lastThrow: 0, biteFlash: 0, sparkT: 1, shake: 0
  };
}
S = freshState('title');

function newMosquito() {
  const side = Math.random() < 0.5 ? -1 : 1;
  S.m = {
    x: side < 0 ? -10 : W + 10, y: rnd(H * 0.2, H * 0.65), vx: -side * 120 * u, vy: 0,
    state: 'fly', tx: W / 2, ty: H * 0.4, wT: 0, flyT: rnd(2, 4), landing: false, restT: 0,
    spd: (110 + S.level * 20) * u, biteT: 0, flap: 0
  };
}

/* ---------- damage ---------- */
function addCost(name, amount, x, y) {
  S.damage += amount;
  const it = S.items[name] || (S.items[name] = { n: 0, total: 0 });
  it.n++; it.total += amount;
  pop(x, y, amount > 0 ? name + ' -' + yen(amount) : name + ' ¥0', amount > 20000 ? '#ff4136' : '#fff');
  const d = $('hDmg'); d.textContent = yen(S.damage); d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump');
}
function pop(x, y, text, color, big) { S.pops.push({ x, y, text, color, t: 0, big: !!big }); }
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function shards(x, y, n, colors, floor) {
  for (let i = 0; i < n; i++) S.parts.push({ type: 'shard', x, y, vx: rnd(-180, 180) * u, vy: rnd(-260, -40) * u, rot: rnd(0, 6), vr: rnd(-10, 10), s: rnd(2, 5) * u, c: colors[i % colors.length], floor: (floor || floorY) + rnd(4, 40) * u });
}
function removeStuckIn(test) { S.stuck = S.stuck.filter(p => !test(p.x, p.y)); }

function impact(x, y) {
  const o = S.obj;
  // vase
  if (!o.vase && inRect(x, y, L.vase)) {
    o.vase = 1; sfx.glass(); vib(30);
    shards(L.vase.x + L.vase.w / 2, L.vase.y + L.vase.h / 2, 18, ['#eef3fb', '#3a6fc4', '#e8453c', '#59b84a'], floorY);
    removeStuckIn((px, py) => inRect(px, py, L.vase));
    addCost('花瓶', 25000, x, y); return 'drop';
  }
  if (inRect(x, y, L.tv)) {
    if (o.tv < 2) { o.tv++; o.tvHit = o.tvHit || { x, y }; sfx.glass(); vib(40); S.shake = 0.5; addCost('テレビ', o.tv === 1 ? 40000 : 85000, x, y); shards(x, y, 10, ['#cfd8e6', '#556']); }
    else { sfx.thunk(); pop(x, y, 'もう映らない', '#fff'); }
    return 'stick';
  }
  if (inRect(x, y, L.stand)) { sfx.thunk(); addCost('テレビ台', 6000, x, y); return 'stick'; }
  if (inRect(x, y, L.cal)) {
    o.cal = o.cal % 12 + 1; sfx.paper();
    S.parts.push({ type: 'page', x: L.cal.x + L.cal.w / 2, y: L.cal.y + L.cal.h * 0.55, vx: rnd(-40, 40) * u, vy: -30 * u, rot: 0, vr: rnd(-3, 3), floor: floorY + rnd(10, 60) * u, s: L.cal.w * 0.9, ph: rnd(0, 6) });
    addCost('カレンダー', 0, x, y); return 'stick';
  }
  const c = L.clock;
  if (o.clock < 2 && Math.hypot(x - c.cx, y - c.cy) < c.r) {
    o.clock++; vib(30);
    if (o.clock === 1) { sfx.glass(); addCost('掛け時計', 8000, x, y); }
    else { sfx.crash(); S.fall.clock = 0; removeStuckIn((px, py) => Math.hypot(px - c.cx, py - c.cy) < c.r * 1.1); addCost('掛け時計', 12000, x, y); return 'drop'; }
    return 'stick';
  }
  if (o.frame < 2 && inRect(x, y, L.frame)) {
    o.frame++; vib(30);
    if (o.frame === 1) { sfx.thunk(); addCost('額縁の絵', 15000, x, y); }
    else { sfx.crash(); S.fall.frame = 0; removeStuckIn((px, py) => inRect(px, py, L.frame)); addCost('額縁の絵', 30000, x, y); return 'drop'; }
    return 'stick';
  }
  const lr = { x: L.light.cx - L.light.w / 2, y: L.light.y - L.light.h * 0.2, w: L.light.w, h: L.light.h * 1.3 };
  if (o.light < 2 && inRect(x, y, lr)) {
    o.light++; o.swing = 1; vib(40);
    if (o.light === 1) { sfx.glass(); addCost('照明', 5000, x, y); }
    else { sfx.glass(); S.shake = 0.6; shards(x, y, 16, ['#fffbe8', '#ddd']); addCost('照明', 18000, x, y); pop(W / 2, H * 0.3, '真っ暗！', '#ffd23f', true); }
    return 'drop';
  }
  const sh = L.shoji;
  if (inRect(x, y, sh)) {
    const ci = Math.floor((x - sh.x) / (sh.w / 4)), ri = Math.floor((y - sh.y) / (sh.h / 3));
    const key = ci + ',' + ri; sfx.paper();
    if (!o.shoji[key]) { o.shoji[key] = 1; addCost('障子', 1500, x, y); } else pop(x, y, '穴が広がった', '#fff');
    return 'through';
  }
  for (let i = 0; i < 2; i++) {
    if (inRect(x, y, L.fus[i])) {
      const pts = []; const k = 9; const r = rnd(9, 14) * u;
      for (let j = 0; j < k; j++) pts.push(r * rnd(0.6, 1.25));
      o.fus[i].push({ x, y, pts }); sfx.paper(); addCost('ふすま', 6000, x, y); return 'stick';
    }
  }
  if (y > floorY) { sfx.tatami(); addCost('畳', 3000, x, y); return 'stick'; }
  sfx.thunk(); addCost('壁', 800, x, y); return 'stick';
}

/* ---------- throw ---------- */
function throwAt(x, y) {
  if (S.phase !== 'play') return;
  const now = performance.now(); if (now - S.lastThrow < 110) return; S.lastThrow = now;
  initAudio();
  S.pencils++;
  const sx = W / 2 + rnd(-40, 40) * u, sy = H + 30 * u;
  S.flying.push({ sx, sy, tx: x, ty: y, t: 0, dur: 0.17 });
  sfx.whoosh();
  $('hint').style.opacity = '0';
  const m = S.m;
  if (m) {
    const d = Math.hypot(m.x - x, m.y - y);
    if (m.state === 'fly' && d < 90 * u && Math.random() < 0.5) {
      const a = Math.atan2(m.y - y, m.x - x); m.vx += Math.cos(a) * 380 * u; m.vy += Math.sin(a) * 380 * u;
    } else if (m.state === 'rest' && d < 50 * u && Math.random() < 0.18 + S.level * 0.03) {
      takeoff(m);
    }
  }
}

/* ---------- update ---------- */
function update(dt) {
  if (S.phase === 'play') {
    S.time -= dt;
    $('hTime').textContent = Math.max(0, Math.ceil(S.time));
    if (S.time <= 0) { S.time = 0; endGame(); }
    if (!S.m) { S.respawn -= dt; if (S.respawn <= 0) newMosquito(); }
  }
  const m = S.m;
  if (m && (S.phase === 'play' || S.phase === 'title')) {
    m.flap += dt * 60;
    if (m.state === 'fly') {
      m.wT -= dt;
      if (!m.landing && m.wT <= 0) { m.wT = rnd(0.25, 0.7); m.tx = rnd(20 * u, W - 20 * u); m.ty = rnd(H * 0.13, floorY - 20 * u); }
      m.flyT -= dt;
      if (!m.landing && m.flyT <= 0) { m.landing = true; m.tx = rnd(25 * u, W - 25 * u); m.ty = rnd(H * 0.16, floorY - 30 * u); }
      const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy) || 1;
      const sp = m.landing ? Math.min(m.spd, d * 3) : m.spd;
      m.vx += (dx / d * sp - m.vx) * dt * 2.6 + rnd(-1, 1) * 700 * u * dt;
      m.vy += (dy / d * sp - m.vy) * dt * 2.6 + rnd(-1, 1) * 700 * u * dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.x = clamp(m.x, -20, W + 20); m.y = clamp(m.y, H * 0.1, floorY - 8 * u);
      if (m.landing && d < 7 * u) { m.state = 'rest'; m.vx = m.vy = 0; m.restT = rnd(1.0, 2.2) / (1 + S.level * 0.15); }
    } else {
      m.restT -= dt; if (m.restT <= 0) takeoff(m);
    }
    if (S.phase === 'play') {
      m.biteT += dt;
      if (m.biteT > 7) { m.biteT = 0; S.bites++; S.biteFlash = 1; sfx.bite(); vib(60); pop(W / 2, H * 0.86, 'チクッ…かゆい', '#ffb3b3'); }
    }
    if (buzz && ac) {
      const on = m.state === 'fly' && S.phase === 'play' ? 0.05 : 0;
      buzz.g.gain.setTargetAtTime(on, ac.currentTime, 0.04);
      buzz.o.frequency.setTargetAtTime(520 + Math.hypot(m.vx, m.vy) / u * 0.4, ac.currentTime, 0.05);
      if (buzz.pan) buzz.pan.pan.setTargetAtTime(clamp(m.x / W * 2 - 1, -1, 1), ac.currentTime, 0.05);
    }
  } else if (buzz && ac) buzz.g.gain.setTargetAtTime(0, ac.currentTime, 0.04);

  for (let i = S.flying.length - 1; i >= 0; i--) {
    const p = S.flying[i]; p.t += dt / p.dur;
    if (p.t >= 1) { S.flying.splice(i, 1); land(p); }
  }
  for (const p of S.parts) {
    if (p.rest) continue;
    if (p.type === 'page') { p.vy = Math.min(p.vy + 160 * u * dt, 60 * u); p.x += (p.vx + Math.sin(p.ph += dt * 4) * 50 * u) * dt; }
    else { p.vy += 1300 * u * dt; p.x += p.vx * dt; }
    p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > p.floor) { p.y = p.floor; if (p.type !== 'page' && p.vy > 150 * u) { p.vy *= -0.3; p.vx *= 0.5; } else { p.rest = true; } }
  }
  for (const k of ['clock', 'frame']) if (S.fall[k] !== undefined && S.fall[k] < 1) S.fall[k] = Math.min(1, S.fall[k] + dt * 2.6);
  for (const p of S.pops) p.t += dt;
  S.pops = S.pops.filter(p => p.t < 1.2);
  S.obj.swing *= Math.pow(0.4, dt);
  S.biteFlash = Math.max(0, S.biteFlash - dt * 2);
  S.shake = Math.max(0, S.shake - dt * 2);
  if (S.obj.tv === 2) { S.sparkT -= dt; if (S.sparkT <= 0) { S.sparkT = rnd(0.6, 2); const h = S.obj.tvHit; for (let i = 0; i < 6; i++) S.parts.push({ type: 'spark', x: h.x, y: h.y, vx: rnd(-120, 120) * u, vy: rnd(-180, -20) * u, rot: 0, vr: 0, s: 2 * u, floor: floorY + 10 * u, life: 0.5 }); if (S.phase === 'play') sfx.spark(); } }
  for (const p of S.parts) if (p.type === 'spark') p.life -= dt;
  S.parts = S.parts.filter(p => p.type !== 'spark' || p.life > 0);
}

    ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.arc(v.x + v.w * 0.75, v.y - v.h * 0.28, 4 * u, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#eef3fb'; ctx.beginPath();
    ctx.moveTo(v.x + v.w * 0.35, v.y + v.h * 0.15); ctx.quadraticCurveTo(v.x - v.w * 0.1, v.y + v.h * 0.6, v.x + v.w * 0.25, v.y + v.h);
    ctx.lineTo(v.x + v.w * 0.75, v.y + v.h); ctx.quadraticCurveTo(v.x + v.w * 1.1, v.y + v.h * 0.6, v.x + v.w * 0.65, v.y + v.h * 0.15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a6fc4'; ctx.lineWidth = 2 * u; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(v.x + v.w * 0.15, v.y + v.h * 0.6); ctx.lineTo(v.x + v.w * 0.85, v.y + v.h * 0.6); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(120,170,220,.35)'; ctx.beginPath(); ctx.ellipse(v.x + v.w * 0.4, floorY + 22 * u, 34 * u, 7 * u, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#e8453c'; ctx.beginPath(); ctx.arc(v.x, floorY + 24 * u, 4 * u, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.arc(v.x + v.w, floorY + 18 * u, 4 * u, 0, 6.28); ctx.fill();
  }
}

function drawLight(now) {
  const o = S.obj, lg = L.light;
  const ang = Math.sin(now / 160) * 0.35 * o.swing + (o.light === 2 ? 0.45 : 0);
  ctx.save(); ctx.translate(lg.cx, 0); ctx.rotate(ang);
  ctx.strokeStyle = '#2b1d12'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, lg.y); ctx.stroke();
  ctx.fillStyle = o.light === 2 ? '#bdb7a6' : '#fffaf0';
  ctx.beginPath(); ctx.moveTo(-lg.w * 0.18, lg.y); ctx.lineTo(lg.w * 0.18, lg.y); ctx.lineTo(lg.w / 2, lg.y + lg.h); ctx.lineTo(-lg.w / 2, lg.y + lg.h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a6a50'; ctx.lineWidth = 1.5; ctx.stroke();
  if (o.light === 2) { ctx.fillStyle = '#2b1d12'; ctx.beginPath(); ctx.moveTo(-lg.w * 0.1, lg.y + lg.h); ctx.lineTo(0, lg.y + lg.h * 0.4); ctx.lineTo(lg.w * 0.15, lg.y + lg.h); ctx.fill(); }
  else if (o.light === 1) { ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-lg.w * 0.2, lg.y + lg.h * 0.2); ctx.lineTo(lg.w * 0.05, lg.y + lg.h * 0.8); ctx.stroke(); }
  ctx.restore();
}

function lightAlpha(now) {
  const o = S.obj;
  if (o.light === 2) return 0.62;
  if (o.light === 1) return Math.random() < 0.06 ? 0.45 : 0.06;
  return 0;
}

function drawMosquito(m, now) {
  const s = u * 1.1;
  ctx.save(); ctx.translate(m.x, m.y);
  const dir = m.vx < 0 ? -1 : 1; ctx.scale(dir, 1);
  ctx.strokeStyle = '#1f1a17'; ctx.lineWidth = 0.9;
  for (let i = 0; i < 3; i++) {
    const lx = (-2 + i * 2) * s;
    ctx.beginPath(); ctx.moveTo(lx, 1 * s); ctx.lineTo(lx - 3 * s, 6 * s); ctx.lineTo(lx - 4 * s, 11 * s); ctx.stroke();
  }
  ctx.fillStyle = '#2b2522'; ctx.beginPath(); ctx.ellipse(-4 * s, 0, 6 * s, 2 * s, -0.25, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#e8e2d8'; for (let i = 0; i < 3; i++) ctx.fillRect((-8 + i * 3) * s, -1 * s + i * 0.6 * s, 1 * s, 2.2 * s);
  ctx.fillStyle = '#2b2522'; ctx.beginPath(); ctx.arc(3 * s, -1 * s, 2.4 * s, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(6 * s, -1.5 * s, 1.6 * s, 0, 6.28); ctx.fill();
  ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(7 * s, -1 * s); ctx.lineTo(12 * s, 1.5 * s); ctx.stroke();
  if (m.state === 'fly') {
    const f = Math.sin(m.flap) > 0;
    ctx.fillStyle = 'rgba(200,215,230,.55)';
    ctx.beginPath(); ctx.ellipse(1 * s, f ? -6 * s : -3 * s, 6 * s, 2.2 * s, f ? -0.6 : -0.1, 0, 6.28); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(200,215,230,.6)';
    ctx.beginPath(); ctx.ellipse(-5 * s, -2.5 * s, 7 * s, 1.6 * s, 0.08, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake * 14, (Math.random() - 0.5) * S.shake * 14);
  drawRoom(now);
  // light glow
  if (S.obj.light < 2) {
    const g = ctx.createRadialGradient(L.light.cx, L.light.y + L.light.h, 0, L.light.cx, L.light.y + L.light.h, H * 0.75);
    g.addColorStop(0, 'rgba(255,248,215,.35)'); g.addColorStop(1, 'rgba(255,248,215,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // dead mosquitoes
  for (const d of S.dead) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.fillStyle = 'rgba(190,30,30,.75)'; ctx.beginPath(); ctx.arc(2 * u, 2 * u, 3.5 * u, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#1f1a17'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-7 * u, 0); ctx.lineTo(7 * u, 1 * u); ctx.moveTo(-4 * u, -4 * u); ctx.lineTo(2 * u, 5 * u); ctx.moveTo(4 * u, -5 * u); ctx.lineTo(-2 * u, 4 * u); ctx.stroke();
    ctx.restore();
  }
  // stuck pencils
  for (const p of S.stuck) {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(40,25,10,.25)'; ctx.beginPath(); ctx.ellipse(Math.cos(p.a) * 12 * u + 4 * u, Math.sin(p.a) * 6 * u + 6 * u, 10 * u, 2.5 * u, p.a, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#1a120c'; ctx.beginPath(); ctx.arc(0, 0, 2.2 * u, 0, 6.28); ctx.fill();
    ctx.rotate(p.a); ctx.scale(1, 0.85); ctx.translate(-4 * u, 0);
    drawPencil(40 * u, 6 * u);
    ctx.restore();
  }
  // particles
  for (const p of S.parts) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.type === 'shard') { ctx.fillStyle = p.c; ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s, p.s); ctx.lineTo(-p.s, p.s * 0.6); ctx.fill(); }
    else if (p.type === 'page') { ctx.scale(1, Math.abs(Math.cos(p.rot * 2)) * 0.7 + 0.3); ctx.fillStyle = '#fff'; ctx.fillRect(-p.s / 2, -p.s * 0.4, p.s, p.s * 0.8); ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.strokeRect(-p.s / 2, -p.s * 0.4, p.s, p.s * 0.8); }
    else if (p.type === 'pencil') { drawPencil(34 * u, 5 * u); }
    else if (p.type === 'spark') { ctx.fillStyle = 'rgba(255,220,90,' + clamp(p.life * 2, 0, 1) + ')'; ctx.fillRect(-p.s, -p.s, p.s * 2, p.s * 2); }
    ctx.restore();
  }
  // mosquito (under darkness)
  if (S.m && S.phase !== 'result') drawMosquito(S.m, now);
  // darkness
  const da = lightAlpha(now);
  if (da > 0) { ctx.fillStyle = 'rgba(8,10,28,' + da + ')'; ctx.fillRect(0, 0, W, H); }
  drawLight(now);
  // flying pencils
  for (const p of S.flying) {
    const t = p.t, x = p.sx + (p.tx - p.sx) * t, y = p.sy + (p.ty - p.sy) * t - Math.sin(Math.PI * t) * 30 * u;
    const sc = 2.6 - 1.6 * t, a = Math.atan2(p.ty - p.sy, p.tx - p.sx);
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI); ctx.scale(sc, sc); drawPencil(34 * u, 5 * u); ctx.restore();
  }
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of S.pops) {
    const a = p.t < 0.9 ? 1 : 1 - (p.t - 0.9) / 0.3;
    const size = (p.big ? 30 : 15) * u * (p.t < 0.12 ? 0.6 + p.t * 3.3 : 1);
    const y = p.y - p.t * 30 * u;
    const x = clamp(p.x, 80 * u, W - 80 * u);
    ctx.globalAlpha = a; ctx.font = '900 ' + Math.round(size) + 'px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
    ctx.lineWidth = (p.big ? 7 : 5) * u; ctx.strokeStyle = '#2b1d12'; ctx.lineJoin = 'round'; ctx.strokeText(p.text, x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, x, y);
  }
  ctx.globalAlpha = 1;
  if (S.biteFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,40,40,' + 0.5 * S.biteFlash + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

// title screen: a demo mosquito flies around
newMosquito();

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
