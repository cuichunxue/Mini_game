<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SLAP KING USA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one full-screen arena canvas; title and result cards float over it. Deliberately single dark "arena at night" look. */
:root{
  --ink:#0d0a18; --panel:#171329; --line:#2e2850; --text:#f4efe6; --muted:#a9a1c6;
  --red:#ff3d47; --blue:#3d6cff; --gold:#ffc83a;
  --f-display:"Bungee","Dela Gothic One",Impact,sans-serif;
  --f-jp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px;
  background:radial-gradient(120% 80% at 50% 30%,rgba(13,10,24,.55),rgba(13,10,24,.92));backdrop-filter:blur(2px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.stars{color:var(--gold);letter-spacing:.5em;font-size:13px;padding-left:.5em}
h1{margin:0;font-family:var(--f-display);font-weight:400;line-height:.88;text-wrap:balance}
.logo h1{display:flex;flex-direction:column;font-size:clamp(56px,17vw,96px);color:var(--gold);
  text-shadow:4px 4px 0 var(--red),8px 8px 0 rgba(0,0,0,.5)}
.logo h1 .l2{color:var(--text)}
.usa{display:flex;align-items:center;gap:8px;margin-top:10px}
.usa span{font-family:var(--f-display);font-size:22px;background:var(--blue);color:#fff;padding:4px 14px 2px;letter-spacing:.12em;transform:skewX(-10deg)}
.usa small{font-family:var(--f-display);color:var(--muted);font-size:12px;letter-spacing:.1em}
.tag{margin:8px 0 0;font-family:var(--f-jp);font-size:15px;color:var(--text)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:s}
.how li{counter-increment:s;background:var(--panel);border:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.how li b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--gold);letter-spacing:.04em}
.how li b::before{content:counter(s) " ";color:var(--muted);font-size:11px}
.how li span{font-size:12px;line-height:1.55;color:var(--muted)}
.def{margin:0;font-size:13px;line-height:1.6;color:var(--muted);border-left:3px solid var(--blue);padding:2px 0 2px 10px}
.def b{font-family:var(--f-display);font-weight:400;color:var(--text);margin-right:6px;letter-spacing:.05em}
.sec{margin:6px 0 -6px;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.ladder{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--panel);border:2px solid var(--line);color:var(--text);padding:8px 12px 8px 8px;cursor:pointer;font:inherit}
.card canvas{width:72px;height:72px;background:#221c3c;display:block}
.card .nm{font-family:var(--f-display);font-size:17px;letter-spacing:.03em}
.card .meta{font-size:12px;color:var(--muted);margin-top:2px}
.card .st{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.card .st i{font-style:normal;color:var(--text)}
.card[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.card:disabled{opacity:.42;cursor:not-allowed}
.card .lock{font-size:11px;color:var(--gold);margin-top:4px}
.card:focus-visible,.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;background:var(--red);color:#fff;border:0;padding:14px 18px 10px;cursor:pointer;
  box-shadow:0 5px 0 #a3141d;transform:translateY(0);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a3141d}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 #1d3bad}
.mini{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 12px;font:inherit;font-size:13px;cursor:pointer}
.res{text-align:center;padding-top:6vh}
.eyebrow{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.18em;color:var(--muted)}
.res h1{font-size:clamp(52px,16vw,88px);color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.res h1.lose{color:var(--muted);text-shadow:4px 4px 0 #000}
#rsSub{margin:0;font-family:var(--f-jp);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--f-display);font-size:12px;padding:6px 10px 4px;border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{background:var(--panel);border:1px solid var(--line);padding:10px 6px;min-width:0}
.stats dt{font-size:11px;color:var(--muted)}
.stats dd{margin:4px 0 0;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.msg{margin:0;font-family:var(--f-jp);font-size:17px;line-height:1.6;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
@media (max-width:380px){.how{grid-template-columns:1fr}.stats dd{font-size:18px}}

/* keep FIGHT! reachable without scrolling to the bottom of the challenger list */
#go{position:sticky;bottom:10px;z-index:3}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="SLAP KING USA ゲーム画面"></canvas>

  <section id="title" class="ov">
    <div class="wrap">
      <header class="logo">
        <div class="stars">★★★★★</div>
        <h1><span class="l1">SLAP</span><span class="l2">KING</span></h1>
        <div class="usa"><span>USA</span><small>v3.1</small></div>
        <p class="tag">自分の一撃で、会場全体を爆発させろ。</p>
      </header>
      <ol class="how">
        <li><b>CHARGE</b><span>画面を長押しで力をためる。金色ゾーンで指を離す</span></li>
        <li><b>AIM</b><span>静寂の中、動く針が中央に来る瞬間を待つ</span></li>
        <li><b>SLAP!</b><span>指を横に一気にスワイプ。PCはマウスでドラッグ</span></li>
      </ol>
      <p class="def"><b>DEFENSE</b>反撃でふらついたら、傾きと反対側をタッチしてマーカーを中央に戻す。倒れかけたら一度だけ LAST STAND。</p>
      <h2 class="sec">CHALLENGER LADDER</h2>
      <div id="ladder" class="ladder"></div>
      <button id="go" class="btn" type="button">FIGHT!</button>
      <button id="mute" class="mini" type="button">サウンド：ON</button>
    </div>
  </section>

  <section id="result" class="ov" hidden>
    <div class="wrap res">
      <p class="eyebrow" id="rsEy"></p>
      <h1 id="rsH"></h1>
      <p id="rsSub"></p>
      <div id="rsChips" class="chips"></div>
      <dl id="rsStats" class="stats"></dl>
      <p id="rsMsg" class="msg"></p>
      <div class="row">
        <button id="again" class="btn" type="button">もう一回</button>
        <button id="next" class="btn alt" type="button">次の強敵へ</button>
      </div>
      <div class="row">
        <button id="replay" class="mini" type="button">ベストショットをリプレイ</button>
        <button id="home" class="mini" type="button">タイトルへ</button>
      </div>
    </div>
  </section>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>1-Math.pow(1-clamp(t),3), DEG=180/Math.PI;
const tri=ph=>{const p=((ph%1)+1)%1;return p<.5?p*2:2-p*2};
const FD='"Bungee","Dela Gothic One",Impact,sans-serif', FJ='"Dela Gothic One","Zen Kaku Gothic New",sans-serif', FB='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
const COL={red:'#ff3d47',blue:'#3d6cff',gold:'#ffc83a',text:'#f4efe6',muted:'#a9a1c6'};
const TIER={
  MISS:{col:'#8f88ad',label:'MISS',dmg:0},
  GOOD:{col:'#d4dcff',label:'GOOD',dmg:12,shake:7,slow:0,ss:1,rings:1,zoom:1.04,cheer:.35,imp:.45,stop:.03,flash:0},
  GREAT:{col:'#5fe0ff',label:'GREAT!',dmg:20,shake:13,slow:.4,ss:.33,rings:1,zoom:1.1,cheer:.6,imp:.7,stop:.06,flash:.15},
  PERFECT:{col:COL.gold,label:'PERFECT!!',dmg:30,shake:22,slow:.9,ss:.22,rings:2,zoom:1.22,cheer:.9,imp:.95,stop:.09,flash:.45},
  SUPER:{col:'#ff4d6d',label:'SUPER PERFECT',dmg:44,shake:34,slow:1.4,ss:.16,rings:4,zoom:1.38,cheer:1.3,imp:1.3,stop:0,flash:1}
};
/* how the rival's head and body react, per judgment */
const REACT={
  GOOD:{yaw:.38,roll:.12,sq:.5,knock:30,dizzy:0,spit:3,arm:.3},
  GREAT:{yaw:.62,roll:.22,sq:.8,knock:60,dizzy:.5,spit:8,arm:.6},
  PERFECT:{yaw:.92,roll:.34,sq:1,knock:100,dizzy:1.2,spit:14,arm:1,hat:true},
  SUPER:{yaw:1.18,roll:.5,sq:1.35,knock:160,dizzy:1.8,spit:24,arm:1.4,hat:true}
};
const RANK={MISS:0,GOOD:1,GREAT:2,PERFECT:3,SUPER:4};
const RIVALS=[
 {id:'tank',name:'TANK TUCKER',from:'テキサス州ヒューストン',title:'牧場育ちの重戦車',hp:100,atk:21,aim:.85,bodyW:1.3,height:1,jaw:1.05,
  skin:'#e0a57e',shirt:'#c22f2b',hair:'hat',hairC:'#6b4424',hatC:'#8a5a2c',browC:'#5a3a1e',brow:.1,eye:'#5b7a3a',stache:true,beard:false,emblem:'star',chant:'TANK!',
  taunts:['俺のアゴは雄牛より硬いぜ','震えてるのか、ルーキー？','一発で黙らせてやる'],miss:'そよ風かと思ったぜ',hurt:'ぐっ…やるじゃねえか'},
 {id:'flash',name:'MIAMI FLASH',from:'フロリダ州マイアミ',title:'電光石火のスピードスター',hp:100,atk:24,aim:1.3,bodyW:.88,height:1.08,jaw:.85,
  skin:'#9a6343',shirt:'#12b3a2',hair:'mohawk',hairC:'#ff4fa3',browC:'#24140e',brow:.08,eye:'#3a2414',stache:false,beard:false,emblem:'bolt',chain:true,chant:'FLASH!',
  taunts:['遅い遅い、止まって見えるぜ','この針に追いつけるか？','ビーチで昼寝してる方がマシだな'],miss:'ほらな、止まって見える',hurt:'今のは…見えなかった'},
 {id:'mtn',name:'THE MOUNTAIN',from:'モンタナ州ビュート',title:'身長210cmの巨人王者',hp:130,atk:29,aim:1.12,bodyW:1.5,height:1.2,jaw:1.2,
  skin:'#efc49c',shirt:'#2c4fd6',hair:'bald',hairC:'#7d5230',browC:'#6b4528',brow:.14,eye:'#3f6a8a',stache:false,beard:true,emblem:'peak',scar:true,chant:'MOUN-TAIN!',
  taunts:['ここが頂上だ。登ってこい','王座は渡さん','蚊に刺されたほどでもない'],miss:'山は動かん',hurt:'…山が、揺れた？'}
];

/* ---------- save ---------- */
let SAVE={unlocked:0,wins:0,supers:0};
try{const s=JSON.parse(localStorage.getItem('slapking-v3'));if(s)SAVE=Object.assign(SAVE,s)}catch(e){}
const save=()=>{try{localStorage.setItem('slapking-v3',JSON.stringify(SAVE))}catch(e){}};

/* ---------- audio ---------- */
const A={on:false,muted:false,cheer:0,lvl:-1,vol:.9};
function initAudio(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();A.ctx=C;
    A.master=C.createGain();A.master.gain.value=A.muted?0:A.vol;A.master.connect(C.destination);
    const len=C.sampleRate*2,nb=C.createBuffer(1,len,C.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=nb;
    const src=C.createBufferSource();src.buffer=nb;src.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=850;bp.Q.value=.45;
    const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    const am=C.createGain();am.gain.value=.75;
    const lfo=C.createOscillator();lfo.frequency.value=2.7;const lg=C.createGain();lg.gain.value=.25;lfo.connect(lg);lg.connect(am.gain);
    A.crowd=C.createGain();A.crowd.gain.value=0;
    src.connect(bp);bp.connect(lp);lp.connect(am);am.connect(A.crowd);A.crowd.connect(A.master);
    src.start();lfo.start();A.on=true;
  }catch(e){A.on=false}
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!A.on)return;const C=A.ctx,t=C.currentTime+delay,o=C.createOscillator(),g=C.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,ft,f0,f1,delay=0,q=1){
  if(!A.on)return;const C=A.ctx,t=C.currentTime+delay,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();
  s.buffer=A.noise;f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(A.master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
const SFX={
  heart(){tone('sine',68,40,.2,.95);tone('sine',62,38,.17,.6,.19)},
  whoosh(){noise(.2,.4,'bandpass',500,3800,0,1.2)},
  impact(s){noise(.04,.9*Math.min(1,s+.2),'highpass',2600,2200);noise(.14+.2*s,.45+.45*s,'lowpass',5000,260,.005);tone('sine',150,32,.3+.35*s,.55+.4*s)},
  boom(){this.impact(1.5);tone('sawtooth',70,24,1.4,.35);noise(1.6,.5,'lowpass',900,60,.05);tone('sine',45,25,1.6,.7,.04)},
  bell(){tone('triangle',1320,1310,1.1,.28);tone('sine',880,876,1.5,.22);tone('sine',2640,2630,.6,.08)},
  clap(d=0){for(let i=0;i<7;i++)noise(.05,.28,'bandpass',rand(1200,2200),1100,d+rand(0,.06),1.4)},
  miss(){tone('triangle',420,180,.55,.16,.15)},
  hit(){this.impact(1.1);noise(.3,.5,'lowpass',1200,200)},
  thud(){tone('sine',90,40,.25,.5);noise(.12,.3,'lowpass',600,100)},
  stand(){tone('sawtooth',110,55,1.1,.25);tone('square',220,110,.9,.08,.1)},
  win(){[523,659,784,1046].forEach((f,i)=>tone('triangle',f,f,.5,.22,i*.12))},
  lose(){[392,330,262].forEach((f,i)=>tone('triangle',f,f*.97,.6,.18,i*.22))}
};
function humStart(){if(!A.on)return;const C=A.ctx;const o=C.createOscillator(),g=C.createGain();o.type='sawtooth';o.frequency.value=70;g.gain.value=0;g.gain.setTargetAtTime(.07,C.currentTime,.1);
  const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=500;o.connect(f);f.connect(g);g.connect(A.master);o.start();A.hum={o,g,f}}
function humSet(k){if(A.hum){A.hum.o.frequency.setTargetAtTime(70+k*170,A.ctx.currentTime,.05);A.hum.f.frequency.setTargetAtTime(500+k*1600,A.ctx.currentTime,.05)}}
function humStop(){if(A.hum){const h=A.hum,t=A.ctx.currentTime;h.g.gain.setTargetAtTime(0,t,.03);h.o.stop(t+.2);A.hum=null}}
function silence(on){if(!A.on)return;A.master.gain.setTargetAtTime(on||A.muted?0:A.vol,A.ctx.currentTime,on?.015:.01)}

/* ---------- canvas & state ---------- */
let W=400,H=700,DPR=1,crowd=[];
const sc=()=>Math.min(W/420,H/780);
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);genCrowd();
}
function genCrowd(){
  crowd=[];const S=sc();
  for(let k=0;k<6;k++){const y=H*(.27+k*.048),r=(8+k*1.9)*S,gap=r*2.3;
    for(let x=-gap;x<W+gap;x+=gap*rand(.85,1.1))crowd.push({x:x+rand(-4,4),y,r,ph:rand(0,6.3),k,arm:Math.random()<.3,
      c:`hsl(${rand(235,285)|0} ${rand(14,32)|0}% ${(9+k*3+rand(0,5))|0}%)`,flash:0});}
}
const newRx=()=>({Y:0,Yv:0,hr:0,hrv:0,hx:0,hxv:0,bx:0,bxv:0,bs:0,bsv:0,sq:0,sqv:0,jg:0,jgv:0,al:0,alv:0,ar:0,arv:0,dizzy:0});
const G={phase:'title',pt:0,rt:0,time:0,sel:Math.min(SAVE.unlocked,2),r:RIVALS[0],php:100,phpShow:100,rhp:100,rhpShow:100,rmax:100,
  rx:newRx(),face:'smirk',faceT:0,cheek:0,fall:0,rise:0,windup:0,lean:0,tilt:0,dutch:0,zoom:1,zoomT:1,camF:{x:200,y:300},
  shake:0,flash:0,flashC:'#fff',lb:0,lbT:0,dim:0,dimT:0,dark:0,spot:0,excite:.3,freeze:0,slowT:0,slowS:1,onUnfreeze:null,
  charge:0,charging:false,lockedCharge:0,needlePh:0,sw:null,press:null,keyDir:0,bal:null,hbT:0,hbPulse:0,bubble:null,fb:null,
  hat:{on:true},spark:null,focus:0,print:0,trail:[],sched:[],tongue:false};
G.r=RIVALS[G.sel];
const parts=[],rings=[],pops=[];
function setPhase(p){G.phase=p;G.pt=0;G.rt=0}
function later(t,fn){G.sched.push({t,fn})}
function pop(s,x,y,size,col,o={}){pops.push(Object.assign({s,x,y,size,col,t:0,life:1.3,font:FD,rise:30},o))}
function say(text,life=2.2){G.bubble={text,t:0,life}}
function feedback(head,body,col){G.fb={head,body,col,t:0,life:3.2}}

/* rival skeleton: body matrix, then neck → head matrix. Used for drawing AND for finding the cheek the hand must land on */
function rivalMats(r,x,baseY,S,st){
  const th=210*S*r.height,R=46*S*(.92+.08*r.height),br=Math.sin((st.t||0)*2.2)*2*S,f=st.fall||0;
  const body=new DOMMatrix().translate(x+(st.bx||0),baseY).rotate(f*.85*DEG).translate(0,f*60*S).rotate(((st.bs||0)+(st.lean||0))*DEG);
  const head=body.translate(st.hx||0,-th-6*S+br).rotate((st.hr||0)*DEG).translate(0,-R*.95);
  return {body,head,th,R,br,tw:150*S*r.bodyW};
}
function stNow(){const x=G.rx;return{Y:x.Y,hr:x.hr,hx:x.hx,bx:x.bx,bs:x.bs,lean:G.lean,sq:x.sq,jg:x.jg,al:x.al,ar:x.ar,face:G.face,cheek:G.cheek,
  windup:G.windup,fall:G.fall,t:G.time,dizzy:x.dizzy,hat:G.hat.on,tongue:G.tongue}}
function layout(S){

function chargeScore(v){return v<80?clamp((v-25)/55):v<=95?1:clamp(1-(v-95)/20*.6)}
function reasonOf(r){
  const L=[];

  if(r.t<.97)L.push([r.t,r.early?'タイミングが早い。針が中央に来るまで待つ':'タイミングが遅い。針が中央を通り過ぎた']);
  if(r.s<.9)L.push([r.s,r.straight<.85?'スワイプが斜め。真横に振り抜く':'スワイプが遅い。一気に振り抜く']);

}
function resolveAttack(sw){

  if(sw){const n=tri(G.needlePh),d=Math.abs(n-.5)*2;t=d<=.05?1:clamp(1-(d-.05)/.55);
    const dir=(((G.needlePh%1)+1)%1)<.5?1:-1;early=(n<.5&&dir>0)||(n>.5&&dir<0);

  const mult=(G.final?1.4:1)*(G.allIn?1.3:1);

/* ---------- input ---------- */
function ptr(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
function chargeStart(){if(G.phase==='charge'&&!G.charging){G.charging=true;G.charge=0;humStart()}}
function chargeEnd(){
  if(G.phase!=='charge'||!G.charging)return;G.charging=false;humStop();
  if(G.charge<10){G.charge=0;feedback('もっと長く','画面を押し続けてゲージをためる',COL.muted);return}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const p=ptr(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  switch(G.phase){
    case 'intro':if(G.rt>1.2)G.rt=Math.max(G.rt,6.99);break;
    case 'charge':chargeStart();break;
    case 'aim':G.sw={x:p.x,y:p.y,pts:[{x:p.x,y:p.y,t:performance.now()}],done:false};break;
    case 'balance':case 'laststand':G.press=p.x;break;
  }
});
cv.addEventListener('pointermove',e=>{
  const p=ptr(e);

    const now=performance.now(),s=G.sw;s.pts.push({x:p.x,y:p.y,t:now});while(s.pts.length>2&&now-s.pts[0].t>90)s.pts.shift();
    if(Math.hypot(p.x-s.x,p.y-s.y)>=70*Math.max(.8,sc()))doSwipe(p,now);
  }
  if((G.phase==='balance'||G.phase==='laststand')&&G.press!==null)G.press=p.x;
});
function doSwipe(p,now){
  const s=G.sw;s.done=true;const o=s.pts[0],dtm=Math.max(8,now-o.t);
  const speed=Math.hypot(p.x-o.x,p.y-o.y)/dtm;const dx=p.x-s.x,dy=p.y-s.y,dist=Math.hypot(dx,dy)||1;

}
function up(e){

addEventListener('keydown',e=>{

/* ---------- update ---------- */
function spr(o,k,K,C,h){o[k+'v']+=(-K*o[k]-C*o[k+'v'])*h;o[k]+=o[k+'v']*h}
let last=performance.now();
function frame(now){const dtr=Math.min(.05,(now-last)/1000);last=now;update(dtr);render();requestAnimationFrame(frame)}
function update(dtr){
  let ts=1;
  if(G.freeze>0){G.freeze-=dtr;ts=0;if(G.freeze<=0&&G.onUnfreeze){const f=G.onUnfreeze;G.onUnfreeze=null;f()}}
  else if(G.slowT>0){G.slowT-=dtr;ts=G.slowS}
  const dt=dtr*ts;G.pt+=dt;G.rt+=dtr;G.time+=dt;
  for(let i=G.sched.length-1;i>=0;i--){const s=G.sched[i];s.t-=dt;if(s.t<=0){G.sched.splice(i,1);s.fn()}}
  // rival physics (sub-stepped springs)
  const rx=G.rx;let rem=dt;
  while(rem>1e-6){const h=Math.min(rem,1/240);rem-=h;
    spr(rx,'Y',45,5.5,h);spr(rx,'hr',60,6.5,h);spr(rx,'hx',80,9,h);spr(rx,'bx',18,4.2,h);spr(rx,'bs',30,4,h);
    spr(rx,'sq',520,20,h);spr(rx,'jg',900,11,h);spr(rx,'al',40,5,h);spr(rx,'ar',40,5,h);}
  if(rx.dizzy>0){rx.dizzy-=dt;rx.hrv+=Math.sin(G.time*5)*dt*2.4;rx.Yv+=Math.cos(G.time*3.7)*dt*2.2;rx.bsv+=Math.sin(G.time*2.6)*dt*.6;
    if(rx.dizzy<=0&&G.phase!=='koWin')shakeOff()}
  if(G.faceT>0){G.faceT-=dt;if(G.faceT<=0){
    if(G.face==='hit'){if(rx.dizzy>0){G.face='dizzy';G.faceT=rx.dizzy+.2}else{G.face='worried';G.faceT=.8}}
    else if(G.face!=='ko')G.face=G.rhp<G.rmax*.3?'worried':'smirk'}}
  // flying hat
  const ht=G.hat;if(ht.fly){ht.vy+=1100*sc()*dt;ht.x+=ht.vx*dt;ht.y+=ht.vy*dt;ht.rot+=ht.vr*dt;
    const floor=H*.8-ht.R*.25;if(ht.y>=floor){ht.y=floor;ht.vy*=-.25;ht.vx*=.6;ht.vr*=.4;if(Math.abs(ht.vy)<40){ht.vy=0;ht.fly=false;ht.landed=true;ht.rot=0;SFX.thud()}}}
  // camera & fx

function bez(a,b,c2,p){return(1-p)*(1-p)*a+2*(1-p)*p*b+p*p*c2}
/* where the player's hand is: wind-up → arc → palm pressed on the cheek → retract */
function playerHandPose(S,L){
  const rest={x:Math.max(62*S,W/2-150*S),y:H*.9},restA=.5,restS=1.45*S;
  const ph=G.phase,kc=(ph==='charge'?G.charge:G.lockedCharge)/118;
  const back={x:rest.x-kc*46*S,y:rest.y+kc*20*S,a:restA-kc*.45,s:(1.45+kc*.15)*S};
  if(ph==='charge'||ph==='aim'){const j=(ph==='aim'?1.1:G.charge>95?2.6:0)*S;return{x:back.x+rand(-j,j),y:back.y+rand(-j,j),a:back.a,s:back.s,sq:0}}
  if((ph==='impact'||ph==='replay')&&G.imp){
    const im=G.imp,miss=im.res.tier==='MISS',cS=.74*S,cA=-.06;
    if(!im.contact){const t=clamp(G.rt/.13),p=t*t,tg=miss?im.missT:{x:L.cx,y:L.cy},cp={x:tg.x-L.R*2.6,y:tg.y+L.R*.9};
      return{x:bez(back.x,cp.x,tg.x,p),y:bez(back.y,cp.y,tg.y,p),a:lerp(back.a,cA,p),s:lerp(back.s,cS,p),sq:0,swing:true}}
    const f=G.pt-im.ct;
    if(miss){if(f<.2){const k=f/.2;return{x:im.missT.x+k*L.R*3.2,y:im.missT.y-k*L.R*.8,a:cA+k*.4,s:cS,sq:0,swing:true}}
      if(!im.leave)im.leave={x:im.missT.x+L.R*3.2,y:im.missT.y-L.R*.8};}
    else if(f<.09){const k=f/.09;return{x:L.cx+k*7*S,y:L.cy+k*2*S,a:cA+k*.05,s:cS,sq:1-k*.6}}
    if(!im.leave)im.leave={x:L.cx+7*S,y:L.cy+2*S};
    const k=ease((f-(miss?.2:.09))/.55);
    return{x:lerp(im.leave.x,rest.x,k),y:lerp(im.leave.y,rest.y,k)+Math.sin(k*Math.PI)*24*S,a:lerp(cA,restA,k),s:lerp(cS,restS,k),sq:0};
  }
  return{x:rest.x,y:rest.y,a:restA,s:restS,sq:0};
}

  drawSpark(c);
  if(G.phase==='rivalTurn'&&G.rt>.55){const k=ease((G.rt-.55)/.6);
    drawPalm(c,lerp(L.x+L.tw*.7,W/2+30*S,k),lerp(L.fy-L.R*.6,H*.55,k),lerp(-.3,-1.35,k),lerp(.9,4.2,k)*S,G.r.skin,true)}
  c.restore();

  if(G.dim>.01){const g=c.createRadialGradient(W/2,L.fy+L.R,L.R*1.6,W/2,L.fy+L.R,Math.max(W,H)*.8);g.addColorStop(0,'rgba(5,3,10,0)');g.addColorStop(1,`rgba(5,3,10,${G.dim})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
  if(G.dark>.01){c.fillStyle=`rgba(4,2,10,${.65*G.dark})`;c.fillRect(0,0,W,H)}
  drawFocus(c,L);drawPrint(c,S);
  const inMatch=!['title','result'].includes(G.phase);
  if(inMatch&&G.php<=60){const crit=G.php<=30,a=(crit?.45:.2)+G.hbPulse*(crit?.25:.1);
    const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(255,0,30,0)');g.addColorStop(1,`rgba(190,0,25,${a})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
  else if(inMatch&&G.hbPulse>.05&&G.phase==='aim'){c.fillStyle=`rgba(0,0,0,${G.hbPulse*.12})`;c.fillRect(0,0,W,H)}
  if(G.lb>.01){const h=H*.11*G.lb;c.fillStyle='#000';c.fillRect(0,0,W,h);c.fillRect(0,H-h,W,h);
    if(G.phase==='replay'&&G.lb>.5)text(c,'● REPLAY',18,h/2,14*S+4,'#ff4d6d',{align:'left'});}
  if(G.flash>.01){c.fillStyle=G.flashC;c.globalAlpha=clamp(G.flash);c.fillRect(0,0,W,H);c.globalAlpha=1}

  if(inMatch&&G.phase!=='replay')drawHUD(c,S,L);
  drawPhaseUI(c,S,L);
  for(const p of pops){const k=p.t/p.life,sc2=p.t<.12?lerp(1.9,1,p.t/.12):1,al=k>.75?(1-k)/.25:1;
    c.save();c.translate(p.x,p.y-ease(k)*p.rise);c.scale(sc2,sc2);text(c,p.s,0,0,p.size,p.col,{font:p.font,stroke:true,alpha:al});c.restore()}
  if(G.bubble&&inMatch)drawBubble(c,S,L);
}
function drawBubble(c,S,L){
  const b=G.bubble,al=clamp(Math.min(b.t/.15,(b.life-b.t)/.2));c.save();c.globalAlpha=al;
  c.font=`700 ${Math.round(14*S+3)}px ${FB}`;const tw=c.measureText(b.text).width,pw=tw+28,ph=36*S+8;
  let x=clamp(L.fx+L.R*.6,pw/2+10,W-pw/2-10),y=Math.max(ph/2+80,L.fy-L.R*2.1);
  c.fillStyle='#fff';rr(c,x-pw/2,y-ph/2,pw,ph,ph/2);c.fill();c.beginPath();c.moveTo(x-10,y+ph/2-2);c.lineTo(x-2,y+ph/2+12);c.lineTo(x+8,y+ph/2-2);c.fill();
  c.fillStyle='#160d22';c.textAlign='center';c.textBaseline='middle';c.fillText(b.text,x,y+1);c.restore();
}
function hpBar(c,x,y,w,h,v,show,max,col,right){
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle='#2a2340';c.fillRect(x,y,w,h);
  const f=clamp(v/max),fs=clamp(show/max);
  c.fillStyle='#fff';right?c.fillRect(x+w-w*fs,y,w*fs,h):c.fillRect(x,y,w*fs,h);
  c.fillStyle=col;right?c.fillRect(x+w-w*f,y,w*f,h):c.fillRect(x,y,w*f,h);
  c.fillStyle='rgba(255,255,255,.25)';right?c.fillRect(x+w-w*f,y,w*f,h*.35):c.fillRect(x,y,w*f,h*.35);
}
function drawHUD(c,S,L){
  const pad=14,cw=48,w=(W-pad*2-cw)/2,y=pad+18,h=14;
  const crit=G.php<=30,pinch=G.php<=60;
  const pc=crit?(Math.sin(G.time*10)>0?COL.red:'#ff8a8f'):pinch?'#ffa53d':COL.blue;
  text(c,'YOU',pad,pad+6,13,'#fff',{align:'left'});text(c,Math.ceil(G.php)+'/100',pad+w,pad+6,12,'#fff',{align:'right',font:FD});
  hpBar(c,pad,y,w,h,G.php,G.phpShow,100,pc,false);
  text(c,G.r.name,W-pad,pad+6,13,'#fff',{align:'right'});
  hpBar(c,W-pad-w,y,w,h,G.rhp,G.rhpShow,G.rmax,COL.red,true);
  text(c,G.final?'FINAL':'R'+Math.min(G.round,G.maxRound),W/2,y+h/2,G.final?11:16,G.final?COL.gold:'#fff');
  if(crit)text(c,'CRITICAL!',pad,y+h+14,12,COL.red,{align:'left',alpha:.6+.4*Math.sin(G.time*8)});
  else if(pinch)text(c,'PINCH',pad,y+h+14,12,'#ffa53d',{align:'left'});
  if(G.allIn)text(c,'ALL-IN ×1.3',W/2,y+h+14,11,COL.gold);
  if(G.fb){const f=G.fb,al=clamp(Math.min(f.t/.2,(f.life-f.t)/.4)),fy=y+h+40;
    c.save();c.globalAlpha=al;const bw=Math.min(W-28,460);c.fillStyle='rgba(10,7,20,.78)';rr(c,W/2-bw/2,fy-14,bw,f.body?54:30,6);c.fill();
    c.fillStyle=f.col;c.fillRect(W/2-bw/2,fy-14,4,f.body?54:30);c.restore();
    text(c,f.head,W/2-bw/2+14,fy+1,15,f.col,{align:'left',font:FJ,alpha:al});
    if(f.body)text(c,f.body,W/2-bw/2+14,fy+24,Math.min(13,(bw-28)/Math.max(12,f.body.length)*1.9),'#e9e3f5',{align:'left',font:FB,weight:700,alpha:al});}
}
function instr(c,S,s,y){if(s)text(c,s,W/2,y,Math.round(15*S+4),'#fff',{font:FJ,stroke:true,sw:5})}
function drawPhaseUI(c,S,L){
  const ph=G.phase;
  if(ph==='intro'){
    const rt=G.rt,r=G.r;
    if(rt>2.2){const k=ease((rt-2.2)/.5),x=lerp(W+200,W/2,k);
      text(c,r.name,x,H*.21,Math.min(48*S,W/(r.name.length*.72)),COL.gold,{stroke:true,shadow:COL.red});
      text(c,r.from+' ／ '+r.title,x,H*.21+36*S,Math.round(13*S+3),'#fff',{font:FB,weight:700,stroke:true,sw:4})}
    if(rt>3&&rt<5.2){const beat=((rt-3)%.5)/.5;text(c,r.chant+' '+r.chant,W/2,H*.12,Math.round(26*S)*(1+(1-beat)*.15),'#fff',{alpha:.85,stroke:true})}
    if(rt>1.2)text(c,'タップでスキップ',W/2,H-24,12,COL.muted,{font:FB,weight:700});
  }
  if(ph==='banner'){const k=ease(G.rt/.35),out=clamp((G.rt-1.05)/.3),bh=86*S;
    c.save();c.globalAlpha=1-out;c.fillStyle=G.final?'rgba(200,24,40,.85)':'rgba(20,30,90,.85)';c.fillRect(lerp(-W,0,k),H*.42-bh/2,W,bh);
    text(c,G.final?'FINAL ROUND':'ROUND '+G.round,lerp(W*1.5,W/2,k),H*.42-(G.final?10*S:0),Math.min(46*S,W/8),G.final?COL.gold:'#fff',{stroke:true});
    if(G.final)text(c,'与ダメージ ×1.4',W/2,H*.42+24*S,Math.round(14*S+2),'#fff',{font:FJ});c.restore()}
  if(ph==='charge'||ph==='aim')drawChargeMeter(c,S);
  if(ph==='charge'){instr(c,S,G.charging?(G.charge>95?'今だ！指を離せ！':'ためろ…金色ゾーンで離す'):'画面を長押しでチャージ',H*.93);
    if(G.charging&&G.charge>95)text(c,'OVER',W-34*S-10,H*.38,14,COL.red)}
  if(ph==='aim'){drawAim(c,S);instr(c,S,'針が中央に来たら横にスワイプ！',H*.93);
    const left=Math.max(0,4.5-G.rt);if(left<2)text(c,left.toFixed(1),W/2,Math.max(H*.2,120)+44*S,18,COL.red)}
  if(ph==='rivalTurn')instr(c,S,G.rt<1.15?'反撃が来る！ 耐えろ！':'',H*.93);
  if(ph==='balance'||ph==='laststand')drawBalance(c,S);
  if(ph==='lsBanner'){const k=ease(G.rt/.3);c.fillStyle=`rgba(0,0,0,${.5*k})`;c.fillRect(0,0,W,H);
    text(c,'LAST STAND',W/2,H*.4,Math.min(52*S,W/7)*(1.4-.4*k),COL.gold,{stroke:true,shadow:COL.red});
    text(c,'倒れるな！ 耐えろ！',W/2,H*.4+46*S,Math.round(20*S+2),'#fff',{font:FJ,stroke:true,alpha:k});
    text(c,'40%以上中央に保てば踏みとどまる',W/2,H*.4+80*S,Math.round(12*S+3),'#e9e3f5',{font:FB,weight:700,stroke:true,sw:4,alpha:k})}
  if(ph==='koWin'){const k=ease(G.rt/.35);text(c,'K.O.!',W/2,H*.36,Math.min(96*S,W/3.6)*(1.6-.6*k),COL.gold,{stroke:true,shadow:COL.red});
    if(G.rt>1.4){const k2=ease((G.rt-1.4)/.4);text(c,G.sel===2?'NEW SLAP KING':(G.lsWon?'大逆転！':'WINNER'),W/2,H*.36+70*S,Math.round(30*S)*(1.4-.4*k2),'#fff',{stroke:true,font:G.sel===2?FD:FJ,alpha:k2})}}
  if(ph==='koLose'){c.fillStyle=`rgba(0,0,0,${clamp(G.rt/1.5)*.6})`;c.fillRect(0,0,W,H);text(c,'DOWN…',W/2,H*.42,Math.min(70*S,W/5),'#cfc8e6',{stroke:true,alpha:clamp(G.rt/.6)})}
  if(ph==='decision'){text(c,'判定',W/2,H*.34,Math.round(26*S+4),'#fff',{font:FJ,stroke:true});
    if(G.rt>1)text(c,G.win?'WIN':'LOSE',W/2,H*.34+60*S,Math.min(80*S,W/4.5),G.win?COL.gold:COL.muted,{stroke:true,shadow:G.win?COL.red:'#000'})}
}
function drawChargeMeter(c,S){
  const x=W-34*S-10,h=Math.min(280*S,H*.4),top=H*.42,w=22*S,v=G.phase==='charge'?G.charge:G.lockedCharge,M=118;
  const yOf=p=>top+h-(p/M)*h;
  c.fillStyle='rgba(0,0,0,.6)';rr(c,x-w/2-4,top-4,w+8,h+8,6);c.fill();
  c.fillStyle='#2a2340';c.fillRect(x-w/2,top,w,h);
  c.fillStyle='rgba(255,200,58,.25)';c.fillRect(x-w/2,yOf(95),w,yOf(80)-yOf(95));
  c.fillStyle='rgba(255,61,71,.25)';c.fillRect(x-w/2,top,w,yOf(95)-top);
  const col=v>95?COL.red:v>=80?COL.gold:COL.blue;c.fillStyle=col;c.fillRect(x-w/2,yOf(v),w,top+h-yOf(v));
  c.strokeStyle=COL.gold;c.lineWidth=2;c.strokeRect(x-w/2,yOf(95),w,yOf(80)-yOf(95));
  text(c,'POWER',x,top+h+16,11,'#fff');text(c,Math.round(v/M*100)+'%',x,top-14,12,col);
}
function drawAim(c,S){
  const w=Math.min(W-48,480),x=W/2-w/2,y=Math.max(H*.2,120),h=26*S+4;
  c.fillStyle='rgba(0,0,0,.65)';rr(c,x-6,y-6,w+12,h+12,8);c.fill();
  const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#3a1830');g.addColorStop(.35,'#3d6cff');g.addColorStop(.5,'#9fe3ff');g.addColorStop(.65,'#3d6cff');g.addColorStop(1,'#3a1830');
  c.fillStyle=g;c.fillRect(x,y,w,h);
  c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x+w*(.5-.15),y,w*.3,h);
  c.fillStyle=COL.gold;c.fillRect(x+w*.475,y-3,w*.05,h+6);
  const n=tri(G.needlePh),nx=x+w*n;c.fillStyle='#fff';c.beginPath();c.moveTo(nx,y+h+2);c.lineTo(nx-9,y+h+14);c.lineTo(nx+9,y+h+14);c.fill();
  c.fillRect(nx-2,y-6,4,h+8);
  text(c,'AIM',x,y-16,12,COL.gold,{align:'left'});text(c,'PERFECT',W/2,y-16,10,COL.gold);
}
function drawBalance(c,S){
  const b=G.bal,w=Math.min(W-48,460),x=W/2-w/2,y=H*.88,h=22*S+4;
  c.fillStyle='rgba(0,0,0,.7)';rr(c,x-6,y-6,w+12,h+12,8);c.fill();
  c.fillStyle='#5a1a22';c.fillRect(x,y,w,h);c.fillStyle='#2a2340';c.fillRect(x+w*.08,y,w*.84,h);
  c.fillStyle='rgba(80,220,140,.55)';c.fillRect(x+w*(.5-.15),y,w*.3,h);
  const mx=x+w*(.5+b.x*.5),inZ=Math.abs(b.x)<.3;c.fillStyle=inZ?'#7dffb0':Math.abs(b.x)>.75?COL.red:'#fff';
  c.beginPath();c.arc(mx,y+h/2,h*.62,0,6.3);c.fill();c.strokeStyle='#140c22';c.lineWidth=3;c.stroke();
  c.fillStyle='rgba(255,255,255,.75)';c.fillRect(x,y+h+6,w*(1-b.t/b.dur),3);
  const q=clamp(b.zone/Math.max(.01,b.t));
  text(c,(b.ls?'LAST STAND ':'BALANCE ')+'安定 '+Math.round(q*100)+'%',x,y-16,12,b.ls?COL.gold:'#fff',{align:'left',font:FJ});
  instr(c,S,Math.abs(b.x)<.15?'中央をキープ！':b.x>0?'← 左を押せ':'右を押せ →',y-50*S);
  if(G.press!==null){c.fillStyle='rgba(255,255,255,.08)';c.fillRect(G.press<W/2?0:W/2,0,W/2,H)}
}

/* ---------- title / UI ---------- */
function thumb(cvs,r){
  const d=Math.min(2,devicePixelRatio||1),s=72;cvs.width=s*d;cvs.height=s*d;const c=cvs.getContext('2d');c.setTransform(d,0,0,d,0,0);
  const S=.5,R=46*S*(.92+.08*r.height),th=210*S*r.height;drawRival(c,r,s/2,38+th+6*S+R*.95,S,{face:'smirk',t:0,hat:true});
}
function buildLadder(){
  const box=$('ladder');box.innerHTML='';
  RIVALS.forEach((r,i)=>{
    const locked=i>SAVE.unlocked,b=document.createElement('button');b.className='card';b.type='button';b.disabled=locked;b.setAttribute('aria-pressed',String(i===G.sel));
    b.innerHTML=`<canvas></canvas><div><div class="nm">${r.name}</div><div class="meta">${r.from} ・ ${r.title}</div>
      <div class="st"><span>HP <i>${r.hp}</i></span><span>攻撃 <i>${'■'.repeat(Math.round(r.atk/10))}</i></span><span>針の速さ <i>×${r.aim.toFixed(2)}</i></span></div>
      ${locked?'<div class="lock">前の相手に勝つと解放</div>':''}</div>`;
    thumb(b.querySelector('canvas'),r);
    b.addEventListener('click',()=>{G.sel=i;G.r=r;G.face='smirk';G.cheek=0;G.hat={on:true};buildLadder()});box.appendChild(b);
  });
}
function toTitle(){setPhase('title');G.r=RIVALS[G.sel];G.fall=0;G.face='smirk';G.cheek=0;G.tilt=0;G.rise=0;G.windup=0;G.rx=newRx();G.hat={on:true};$('result').hidden=true;$('title').hidden=false;buildLadder()}
$('go').addEventListener('click',()=>startMatch(G.sel));
$('again').addEventListener('click',()=>startMatch(G.sel));
$('next').addEventListener('click',()=>{G.sel=Math.min(2,G.sel+1);startMatch(G.sel)});
$('home').addEventListener('click',toTitle);
$('replay').addEventListener('click',()=>{if(!G.best)return;$('result').hidden=true;G.fall=0;G.face='smirk';G.faceT=0;G.tilt=0;G.rx=newRx();G.hat={on:true};G.sched=[];
  G.cheek=Math.max(0,G.cheek-.4);G.lockedCharge=G.best.cv;startImpact(G.best,true)});
$('mute').addEventListener('click',()=>{A.muted=!A.muted;$('mute').textContent='サウンド：'+(A.muted?'OFF':'ON');if(A.on)A.master.gain.setTargetAtTime(A.muted?0:A.vol,A.ctx.currentTime,.02)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.charging){G.charging=false;humStop()}});

addEventListener('resize',resize);resize();G.camF={x:W/2,y:H/2};buildLadder();
requestAnimationFrame(frame);
})();
</script>
