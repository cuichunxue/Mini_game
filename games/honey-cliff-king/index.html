<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Honey Cliff King</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed canvas game, DOM HUD on top edge, touch pads on bottom corners, modal cards for menus */
:root{
  --night:#1d1530;
  --panel:rgba(32,20,44,.88);
  --panel-line:rgba(255,206,110,.28);
  --honey:#ffb320;
  --honey-deep:#d9740b;
  --comb:#ffe08a;
  --leaf:#57c27f;
  --danger:#ff4d5e;
  --warn:#ff9a3d;
  --paper:#fff3da;
  --muted:#c9b6d6;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--comb);outline-offset:2px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;line-height:1.25;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
#hudL{justify-self:start;display:flex;flex-direction:column;gap:2px}
#hudL .stg{font-size:11px;color:var(--muted);letter-spacing:.04em}
#hudL .time{font-family:var(--display);font-size:20px;letter-spacing:.02em}
#hudL .time.low{color:var(--danger)}
#hudC{justify-self:center;min-width:180px;display:flex;flex-direction:column;gap:4px}
.alertRow{display:flex;align-items:center;gap:6px}
.alertRow svg{flex:none}
.bar{position:relative;flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--leaf)}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.45)}
#alertTxt{min-width:68px;text-align:right;font-size:12px}
#windTxt{font-size:11px;color:var(--muted);text-align:center}
#windTxt.on{color:var(--warn)}
#hudR{justify-self:end;display:flex;flex-direction:column;gap:2px;text-align:right}
#hudR .kg{font-family:var(--display);font-size:18px;color:var(--honey)}
#hudR .kg small{font-family:var(--body);font-size:11px;color:var(--muted)}
#hudR .lives{color:var(--danger);letter-spacing:2px;font-size:15px}
#hudR .sub{font-size:11px;color:var(--muted)}
#pauseBtn{position:fixed;top:calc(112px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:34px;height:34px;border-radius:10px;border:1px solid var(--panel-line);background:var(--panel);color:var(--paper);font-size:14px;pointer-events:auto}

/* touch controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
body.touch #ctrl{display:flex}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;pointer-events:auto}
.tb{border:2px solid rgba(255,230,170,.35);background:rgba(30,18,40,.55);color:var(--paper);border-radius:16px;font-size:20px;font-weight:800;
  display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.on{background:rgba(255,179,32,.55);border-color:var(--comb)}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
#joyZone{position:fixed;left:0;bottom:0;width:55vw;height:min(62vh,340px);pointer-events:auto;touch-action:none}
#joyBase{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;
  background:radial-gradient(circle,rgba(30,18,40,.35) 0 45%,rgba(30,18,40,.6) 70%);border:2px solid rgba(255,230,170,.35);transition:opacity .2s}
#joyBase.on{border-color:var(--comb)}
#joyBase .ja{position:absolute;font-size:12px;color:rgba(255,243,218,.55);line-height:1}
#joyBase .u{top:8px;left:50%;transform:translateX(-50%)} #joyBase .d{bottom:8px;left:50%;transform:translateX(-50%)}
#joyBase .l{left:9px;top:50%;transform:translateY(-50%)} #joyBase .r{right:9px;top:50%;transform:translateY(-50%)}
#joyKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1b8 0,#ffc23d 32%,#e0860d 75%,#9c5207 100%);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 -4px 6px rgba(120,60,0,.4)}
.acts{margin-left:auto;display:grid;grid-template-columns:62px 96px;grid-template-rows:56px 56px 56px;gap:6px;pointer-events:auto;align-items:center;justify-items:center}
.acts .cut{grid-area:2/2/4/3;width:96px;height:96px;border-radius:50%;font-family:var(--display);font-size:22px;background:rgba(217,116,11,.7);border-color:var(--comb)}
.acts .cut.on{background:var(--honey)}
.acts .ret{grid-area:1/2;width:96px;height:46px;font-size:14px}
.acts .ret.active{background:rgba(87,194,127,.6);border-color:#bff5cf}
.acts .smk{grid-area:2/1;width:58px;height:52px;font-size:13px}
.acts .bag{grid-area:3/1;width:58px;height:52px;font-size:13px}
.tb small{font-size:10px;display:block;opacity:.8}

#keys{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;color:var(--muted);
  background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:5px 12px;pointer-events:none;white-space:nowrap}
body.touch #keys{display:none}
#keys kbd{font-family:var(--body);font-weight:800;color:var(--comb)}

#toast{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--panel-line);
  border-radius:12px;padding:6px 14px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

/* menus */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(20,12,30,.35);overflow:auto}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:20px 22px;width:min(460px,100%);max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{font-family:var(--display);font-size:clamp(34px,8vw,54px);line-height:.95;color:var(--honey);text-shadow:0 4px 0 var(--honey-deep),0 8px 18px rgba(0,0,0,.5);text-wrap:balance;margin:0}
.logo span{display:block;font-size:.62em;color:var(--paper);text-shadow:0 3px 0 #6b3d14}
.tag{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.btn{border:none;border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;background:rgba(255,255,255,.1);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.primary{background:var(--honey);color:#3a1c00;font-family:var(--display);font-size:22px;padding:14px;box-shadow:0 4px 0 var(--honey-deep)}
.btn.primary:hover{background:#ffc447}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.set input[type=range]{flex:1;accent-color:var(--honey)}
.set label{display:flex;align-items:center;gap:6px;cursor:pointer}
.set input[type=checkbox]{accent-color:var(--honey);width:18px;height:18px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--honey)}
.stlist{display:flex;flex-direction:column;gap:8px}
.st{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--panel-line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.05);color:var(--paper)}
.st:disabled{opacity:.4;cursor:not-allowed}
.st .n{font-family:var(--display);font-size:22px;color:var(--honey)}
.st .t{font-weight:800}
.st .s{font-size:11px;color:var(--muted)}
.st .b{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.stars{color:var(--honey);letter-spacing:1px}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--panel-line);border-radius:14px;padding:10px 12px}
.up .t{font-weight:800}
.up .s{font-size:11px;color:var(--muted);grid-column:1}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.pips i.on{background:var(--honey)}
.up .btn{grid-row:1/3;grid-column:2;padding:8px 12px;font-size:13px}
.coins{font-weight:800;color:var(--comb);font-variant-numeric:tabular-nums}
.res-title{font-family:var(--display);font-size:40px;margin:0;line-height:1}
.res-title.ok{color:var(--honey)} .res-title.ng{color:var(--danger)}
.score{font-family:var(--display);font-size:38px;font-variant-numeric:tabular-nums}
.lines{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.lines div:nth-child(even){text-align:right;font-weight:800}
.hint{background:rgba(255,179,32,.12);border:1px solid rgba(255,179,32,.35);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.5}
.hint b{color:var(--honey)}
.events{font-size:12px;color:var(--muted);line-height:1.6}
.new{display:inline-block;background:var(--danger);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.ach{display:flex;flex-wrap:wrap;gap:6px}
.ach span{font-size:11px;border:1px solid var(--panel-line);border-radius:8px;padding:2px 8px;color:var(--muted)}
.ach span.on{color:#3a1c00;background:var(--comb);border-color:var(--comb)}
@media (max-height:520px){.card{padding:14px 18px;gap:8px}.logo{font-size:34px}.btn.primary{font-size:18px;padding:10px}}
@media (max-width:520px){#hud{grid-template-columns:1fr 1fr;}
  #hudC{grid-column:1/3;grid-row:2;min-width:0;width:100%}
  #pauseBtn{right:auto;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px))}
  .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="hudL" class="chip"><span class="stg" id="hStage">ST1 はじめての崖</span><span class="time" id="hTime">3:00</span><span class="stg" id="hDepth">深さ 22m</span></div>
  <div id="hudC" class="chip">
    <div class="alertRow">
      <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><ellipse cx="9" cy="9" rx="6" ry="5" fill="#ffb320"/><rect x="7" y="4" width="2" height="10" fill="#2a1630"/><rect x="11" y="4.5" width="1.6" height="9" fill="#2a1630"/><ellipse cx="6" cy="3.5" rx="3.5" ry="2.2" fill="#e8f4ff" opacity=".85"/><ellipse cx="11.5" cy="3" rx="3.5" ry="2.2" fill="#e8f4ff" opacity=".85"/></svg>
      <div class="bar"><i id="alertBar"></i><b style="left:30%"></b><b style="left:60%"></b><b style="left:85%"></b></div>
      <span id="alertTxt">平穏 0</span>
    </div>
    <div id="windTxt">風 おだやか</div>
  </div>
  <div id="hudR" class="chip"><span class="kg" id="hKg">0.0<small> / 15kg 軽量</small></span><span class="sub" id="hScore">見込み 0</span><span class="lives" id="hLives">♥♥♥</span><span class="sub" id="hSmoke">煙 ×2</span></div>
</div>
<button id="pauseBtn" hidden aria-label="一時停止">❚❚</button>

<div id="ctrl" hidden>
  <div id="joyZone" aria-label="移動スティック：左右で揺らす、上下で登り降り">
    <div id="joyBase"><span class="ja u">▲</span><span class="ja d">▼</span><span class="ja l">◀</span><span class="ja r">▶</span><div id="joyKnob"></div></div>
  </div>
  <div class="acts">
    <button class="tb ret" data-press="ret" id="retBtn">帰還</button>
    <button class="tb smk" data-press="smoke">煙<small id="smkN">×2</small></button>
    <button class="tb bag" data-hold="bag">袋<small>長押し</small></button>
    <button class="tb cut" data-hold="cut">CUT</button>
  </div>
</div>
<div id="keys" hidden><kbd>A/D</kbd> 揺らす　<kbd>W/S</kbd> 登降　<kbd>Space</kbd> 長押しCUT　<kbd>E</kbd> 煙　<kbd>Q</kbd> 捨てる　<kbd>R</kbd> 帰還　<kbd>Esc</kbd> 停止</div>
<div id="toast"></div>

<section class="screen" id="scrTitle" hidden>
  <div class="card">
    <h1 class="logo">HONEY CLIFF<span>KING</span></h1>
    <p class="tag">命がけで蜂蜜を採れ。欲張るほど、帰れなくなる。<br>採った蜂蜜は、崖の上まで持ち帰って初めて得点になる。</p>
    <button class="btn primary" id="bPlay">▶ はじめる</button>
    <div class="row"><button class="btn" id="bStages">ステージ</button><button class="btn" id="bShop">強化 <span class="coins" id="tCoins">0</span></button></div>
    <div class="set"><span>音量</span><input type="range" id="vol" min="0" max="1" step="0.05" aria-label="音量"><label><input type="checkbox" id="mute"> ミュート</label></div>
    <div class="set"><label><input type="checkbox" id="easy"> 初級モード</label><span>予兆が長く風が弱い・失敗でも練習コイン</span></div>
    <div class="ach" id="achList"></div>
  </div>
</section>

<section class="screen" id="scrStages" hidden>
  <div class="card">
    <h2>ステージ</h2>
    <div class="stlist" id="stList"></div>
    <button class="btn" data-back>もどる</button>
  </div>
</section>

<section class="screen" id="scrShop" hidden>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center"><h2>強化</h2><span class="coins">所持 <span id="sCoins">0</span> コイン</span></div>
    <div class="stlist" id="upList"></div>
    <p class="tag">強化は各3段階まで。危険を完全に消すことはできない。</p>
    <button class="btn" data-back>もどる</button>
  </div>
</section>

<section class="screen" id="scrPause" hidden>
  <div class="card">
    <h2>一時停止</h2>
    <button class="btn primary" id="pResume">再開</button>
    <div class="row"><button class="btn" id="pRetry">リトライ</button><button class="btn" id="pQuit">タイトルへ</button></div>
    <div class="set"><span>音量</span><input type="range" id="vol2" min="0" max="1" step="0.05" aria-label="音量"></div>
  </div>
</section>

<section class="screen" id="scrResult" hidden>
  <div class="card" id="resCard"></div>
</section>

<script>
'use strict';
/* =========================================================
   HONEY CLIFF KING v4.1 — single-file build
   Modules (same responsibilities as the spec's js/ files):
   CONFIG/STAGES · Storage · Audio · Input · Physics/Rope · Player
   Honey(cut) · Bees · Chaos · Game · Render · UI
   ========================================================= */
const CONFIG = {
  targetFPS: 60, step: 1/60,
  gameDuration: 180, maxHoneyKg: 15, maxHealth: 3,
  chaosProbability: 0.35, chaosMaxEvents: 2, chaosWarningSeconds: 1.6,
  chaosFirstAllowed: 15, chaosMinGap: 20,
  beeAttackWarningSeconds: 0.8, startingSmoke: 2,
  returnTimeTarget: [15, 35],
  perfectWindow: 0.04, goodWindow: 0.17, apexBonusWindow: 0.02,
  stageCount: 5,
  g: 980, swingForce: 360, windForce: 300, damping: 0.42, maxAngle: 1.0, maxOmega: 3.2,
  playerR: 16, safeR: 28, gatherMinR: 44,
  climbUp: 70, climbDown: 115, returnDrift: 22, returnClimbMul: 1.5,
  cutTime: 1.25, smokeDrop: 25, smokeTime: 3,
  hiveReachPad: 26,
};
const HIVE = {
  S:{r:20, slices:2, kg:1.0, alert:10, label:'小'},
  M:{r:28, slices:3, kg:1.5, alert:13, label:'中'},
  L:{r:38, slices:4, kg:2.5, alert:17, label:'大'},
};
const STAGES = [
  {name:'はじめての崖', stars:1, L:520, wallX:118, aggr:0.55, wind:0.25, chaos:false, time:180, swarm:5, startR:228, startTh:0.2,
   hives:[{d:240,s:'S'},{d:335,s:'M'},{d:445,s:'L'}], desc:'短いロープ、穏やかな蜂'},
  {name:'風の谷', stars:2, L:620, wallX:128, aggr:0.8, wind:1.0, chaos:true, time:180, swarm:6, startR:238, startTh:0.15,
   hives:[{d:250,s:'M'},{d:390,s:'M'},{d:525,s:'L'}], desc:'強風、揺れの制御'},
  {name:'蜂の王国', stars:3, L:700, wallX:132, aggr:1.15, wind:0.5, chaos:true, time:180, swarm:9, startR:228, startTh:0.15,
   hives:[{d:240,s:'M'},{d:360,s:'L'},{d:485,s:'L'},{d:610,s:'M'}], desc:'大きな巣、蜂の群れ'},
  {name:'猿の断崖', stars:4, L:760, wallX:140, aggr:1.0, wind:0.7, chaos:true, time:180, swarm:7, startR:222, startTh:0.15, bias:'monkey',
   hives:[{d:230,s:'S'},{d:330,s:'M'},{d:435,s:'M'},{d:545,s:'L'},{d:660,s:'L'}], desc:'カオス（猿）と複数の巣'},
  {name:'天空の蜂蜜', stars:5, L:900, wallX:150, aggr:1.3, wind:1.2, chaos:true, time:180, swarm:9, startR:248, startTh:0.1,
   hives:[{d:260,s:'M'},{d:430,s:'L'},{d:610,s:'L'},{d:790,s:'L'}], desc:'長いロープ、複合リスク'},
];
const UPGRADES = [
  {k:'rope', name:'ロープ強化', desc:'最大揺れの許容範囲 +10%'},
  {k:'bag', name:'軽量バッグ', desc:'重量ペナルティ −10%'},
  {k:'knife', name:'ナイフ強化', desc:'採集時間 −10%'},
  {k:'smoke', name:'煙強化', desc:'警戒度低下 +5'},
  {k:'watch', name:'蜂観察', desc:'攻撃予兆 +0.3秒'},
];
const UPG_COST = [80, 160, 280];
const ACH = [
  {k:'first', name:'初採集'}, {k:'perfect', name:'初PERFECT'}, {k:'home', name:'初生還'},
  {k:'heavy', name:'10kg生還'}, {k:'chaos', name:'カオス撃退'}, {k:'king', name:'天空制覇'},
];
const CHAOS_NAME = {monkey:'猿の蜂蜜泥棒', queen:'巨大女王蜂', bear:'空飛ぶ熊', bubble:'蜂蜜バブル', beeball:'蜂だるま'};
const CHAOS_BANNER = {monkey:'猿が蜂蜜を狙っている！',queen:'巨大女王蜂が来る！',bear:'空飛ぶ熊が横切る！ 赤いレーンから離れろ',bubble:'下から蜂蜜バブル！ 触れると浮く',beeball:'蜂の大群が包囲してくる！ 大揺れか煙で振り払え'};
const MOGO = ['もごもご','ブブブブ','たすけて〜','前が見えない','かゆい！','ンーッ！'];

/* ---------------- audio ---------------- */
const AU = {
  ctx:null, master:null, noise:null, buzzG:null, buzzO:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=this.ctx=new C(); this.master=ctx.createGain(); this.master.connect(ctx.destination); this.applyVol();
    const len=ctx.sampleRate*1, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=b;
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=210;
    const lfo=ctx.createOscillator(); lfo.frequency.value=31; const lg=ctx.createGain(); lg.gain.value=14; lfo.connect(lg); lg.connect(o.frequency);
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=1.2;
    const g=ctx.createGain(); g.gain.value=0; o.connect(f); f.connect(g); g.connect(this.master); o.start(); lfo.start();
    this.buzzG=g; this.buzzO=o;
  },
  applyVol(){ if(this.master){const s=Store.data.set; this.master.gain.value=s.mute?0:s.vol*0.8;} },
  tone(f,dur,type='sine',vol=0.3,to=null,delay=0){
    const c=this.ctx; if(!c) return; const t=c.currentTime+delay;
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  hiss(dur,freq,q=1,vol=0.3,type='bandpass',delay=0){
    const c=this.ctx; if(!c) return; const t=c.currentTime+delay;
    const s=c.createBufferSource(); s.buffer=this.noise; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
  },
  sfx(n){
    if(!this.ctx) return;
    switch(n){
      case 'creak': this.tone(95,0.22,'sawtooth',0.07,70); this.hiss(0.18,420,6,0.08); break;
      case 'thud': this.tone(120,0.18,'triangle',0.3,55); this.hiss(0.1,300,1,0.15); break;
      case 'cutStart': this.hiss(0.12,2400,2,0.12); break;
      case 'cut': this.hiss(0.16,3200,3,0.25); this.tone(900,0.08,'square',0.05,500); break;
      case 'drip': this.tone(880,0.14,'sine',0.25,330); this.tone(660,0.12,'sine',0.18,260,0.1); break;
      case 'perfect': [784,988,1175,1568].forEach((f,i)=>this.tone(f,0.16,'triangle',0.18,null,i*0.06)); break;
      case 'good': this.tone(660,0.12,'triangle',0.16); this.tone(880,0.14,'triangle',0.14,null,0.07); break;
      case 'miss': this.tone(300,0.22,'square',0.08,180); break;
      case 'warn': this.tone(1046,0.09,'square',0.09); this.tone(1046,0.09,'square',0.09,null,0.14); break;
      case 'alarm': this.tone(520,0.18,'sawtooth',0.1,780); this.tone(520,0.18,'sawtooth',0.1,780,0.22); break;
      case 'hit': this.tone(240,0.25,'sawtooth',0.2,90); this.hiss(0.2,1200,1,0.2); break;
      case 'smoke': this.hiss(0.7,600,0.6,0.25,'lowpass'); break;
      case 'drop': this.tone(500,0.2,'sine',0.18,200); break;
      case 'win': [523,659,784,1046,784,1046,1318].forEach((f,i)=>this.tone(f,0.22,'triangle',0.2,null,i*0.1)); break;
      case 'fail': this.tone(440,0.35,'square',0.12,110); this.tone(330,0.5,'triangle',0.15,82,0.3); this.tone(1200,0.12,'sine',0.08,2000,0.8); break;
      case 'boing': this.tone(200,0.3,'sine',0.25,620); break;
      case 'pop': this.tone(1400,0.08,'sine',0.2,300); break;
      case 'chaos': this.tone(330,0.12,'square',0.1,660); this.tone(440,0.12,'square',0.1,880,0.13); this.tone(554,0.18,'square',0.1,1100,0.26); break;
      case 'click': this.tone(700,0.05,'triangle',0.1); break;
    }
  },
  buzz(level){ if(!this.buzzG) return; const t=this.ctx.currentTime;
    this.buzzG.gain.setTargetAtTime(level*0.09,t,0.15); this.buzzO.frequency.setTargetAtTime(190+level*120,t,0.2); }
};

const Input = {
  kb:{}, tp:{}, queue:[], held:{up:false,down:false,left:false,right:false,cut:false,bag:false}, bagKbd:false, cutCancel:false,
  ax:0, kbSwing:false,
  sync(){
    for(const k in this.held) this.held[k]=!!(this.kb[k]||this.tp[k]);
    // joystick ball: analog swing on x, climb on y (only when the stick points mostly up/down)
    const jx=Joy.x, jy=Joy.y, dz=0.15;
    this.ax = Math.abs(jx)>dz ? Math.sign(jx)*Math.min(1,(Math.abs(jx)-dz)/0.7) : 0;
    const vert = Math.abs(jy)>0.55 && Math.abs(jy)>Math.abs(jx)*0.8;
    if(this.ax<0) this.held.left=true; if(this.ax>0) this.held.right=true;
    if(vert && jy<0) this.held.up=true; if(vert && jy>0) this.held.down=true;
    this.kbSwing=!!(this.kb.left||this.kb.right);
  }
};
const Joy={id:null,x:0,y:0,R:54};
(function setupJoy(){
  const zone=document.getElementById('joyZone'), base=document.getElementById('joyBase'), knob=document.getElementById('joyKnob');
  let cx=0, cy=0;
  const setKnob=(dx,dy)=>{ knob.style.transform=`translate(${dx}px,${dy}px)`; };
  const reset=()=>{ Joy.id=null; Joy.x=0; Joy.y=0; setKnob(0,0); base.classList.remove('on'); base.style.left=''; base.style.top=''; base.style.bottom=''; };
  zone.addEventListener('pointerdown',e=>{
    if(Joy.id!==null) return; e.preventDefault(); Joy.id=e.pointerId; try{zone.setPointerCapture(e.pointerId)}catch(_){}
    const zr=zone.getBoundingClientRect(), half=68;
    const lx=clamp(e.clientX-zr.left,half,zr.width-half+40), ly=clamp(e.clientY-zr.top,half,zr.height-half);
    base.style.left=(lx-half)+'px'; base.style.top=(ly-half)+'px'; base.style.bottom='auto'; base.classList.add('on');
    cx=zr.left+lx; cy=zr.top+ly; setKnob(0,0);
  });
  zone.addEventListener('pointermove',e=>{
    if(e.pointerId!==Joy.id) return; e.preventDefault();
    let dx=e.clientX-cx, dy=e.clientY-cy; const d=Math.hypot(dx,dy), R=Joy.R;
    if(d>R){ dx*=R/d; dy*=R/d; }
    Joy.x=dx/R; Joy.y=dy/R; setKnob(dx,dy);
  });
  const end=e=>{ if(e.pointerId===Joy.id) reset(); };
  zone.addEventListener('pointerup',end); zone.addEventListener('pointercancel',end); zone.addEventListener('lostpointercapture',end);
  window.resetJoy=reset;
})();

let screen='title', G=null, demo=null, rng=Math.random;

function planChaos(st, r){
  const enabled = st.chaos && r() < CONFIG.chaosProbability;
  if(!enabled) return {enabled:false,queue:[],next:Infinity,active:null};
  const n = r()<0.5?1:CONFIG.chaosMaxEvents, types=['monkey','queen','bear','bubble','beeball'], q=[];
  for(let i=0;i<n;i++){ let t = st.bias && r()<0.6 ? st.bias : types[Math.floor(r()*types.length)]; if(q.includes(t)) t=types[(types.indexOf(t)+1)%types.length]; q.push(t); }
  return {enabled:true,queue:q,next:CONFIG.chaosFirstAllowed+1+r()*14,active:null};
}
// acceptance test: 10,000 seeded draws must land in 33–37%
function chaosRateTest(n=10000){ let c=0; for(let s=1;s<=n;s++){ const r=mulberry32(s); if(planChaos(STAGES[1],r).enabled) c++; } return c/n; }
window.HCK={chaosRateTest};

function newRun(idx, isDemo){
  const st=STAGES[idx], seed=(Date.now() ^ Math.floor(Math.random()*1e9))>>>0;
  rng = mulberry32(seed);
  const hives = st.hives.map(h=>{ const D=HIVE[h.s]; return {d:h.d,s:h.s,r:D.r,slices:D.slices,left:D.slices,kg:D.kg,alert:D.alert,
    x:st.wallX-D.r*0.55, y:h.d, shake:0}; });
  const easy = Store.data.set.easy;
  const g = {
    idx, st, seed, demo:!!isDemo, t:0, timeLeft:st.time, easy,
    p:{r:st.startR, th:st.startTh, om:0, kg:0, lives:CONFIG.maxHealth, smoke:CONFIG.startingSmoke, mode:'gather', inv:0, slip:0, lift:0, face:1},
    hives, alert:0, lastCutT:-99, smokeT:0, attacks:[], attackAcc:0,
    swarms: hives.map((h,i)=>({h, x:h.x-30, y:h.y, bees:Array.from({length:st.swarm},(_,k)=>({a:rng()*6.28, rad:14+rng()*18, sp:2+rng()*3, ph:rng()*6}))})),
    wind:{cur:0, phase:'idle', t:3+rng()*4, dir:1, str:0},
    cut:null, armed:false, prevCut:false, prevUp:false, prevDown:false, bagT:0, extraF:0,
    perfects:0, goods:0, misses:0, cuts:0, hitsTaken:0, chaosAvoided:0, chaosLog:[], dropped:0,
    chaos: isDemo ? {enabled:false,queue:[],next:Infinity,active:null} : planChaos(st, rng),
    parts:[], pops:[], hintsShown:{}, hint:null, hintT:0, banner:null,
    shake:0, end:null, maxDepth:0, creakT:0, rhythmT:0, firstHoneyT:null, retHintT:0,
    feat:makeScenery(idx),
  };
  return g;
}

function makeScenery(idx){
  const r=mulberry32(1000+idx*77), st=STAGES[idx];
  const strata=[], cracks=[], plants=[], jag=[];
  for(let y=-10;y<st.L+900;y+=34) jag.push(r()*7);
  for(let y=40;y<st.L+900;y+=48+r()*40) strata.push({y, s:(r()-0.5)*0.12, w:1+r()*2});
  for(let i=0;i<14;i++) cracks.push({x:st.wallX+20+r()*260, y:r()*(st.L+300), l:20+r()*50, a:1.2+r()*0.7});
  for(let i=0;i<10;i++) plants.push({y:30+r()*(st.L+200), s:6+r()*8});
  const far=[], mid=[];
  for(let i=0;i<=40;i++) far.push(0.35+0.25*Math.sin(i*0.7+idx)+r()*0.2);
  for(let i=0;i<=30;i++) mid.push(0.4+r()*0.5);
  return {strata,cracks,plants,jag,far,mid};
}

/* ---------------- helpers ---------------- */
const P = g=>({x:g.p.r*Math.sin(g.p.th), y:g.p.r*Math.cos(g.p.th)});
function mass(g){ return 1 + g.p.kg*0.075*(1-0.1*U('bag')); }
function weightState(kg){ return kg>=15?'上限':kg>=10?'危険':kg>=6?'重量級':kg>=3?'普通':'軽量'; }
function climbFactor(g){ const kg=g.p.kg; const wf = kg>=10?0.58:kg>=6?0.76:kg>=3?0.9:1; return 1-(1-wf)*(1-0.1*U('bag')); }
function alertState(a){ return a>=85?'大暴走':a>=60?'攻撃':a>=30?'警戒':'平穏'; }
function maxAngle(){ return CONFIG.maxAngle*(1+0.1*U('rope')); }
function cutTime(){ return CONFIG.cutTime*(1-0.1*U('knife')); }
function warnTime(g){ return CONFIG.beeAttackWarningSeconds + 0.3*U('watch') + (g.easy?0.35:0); }
function reachable(g){
  const pp=P(g); let best=null, bd=1e9;
  for(const h of g.hives){ if(h.left<=0) continue; const d=Math.hypot(pp.x-h.x, pp.y-h.y); if(d<h.r+CONFIG.hiveReachPad && d<bd){bd=d;best=h;} }
  return best;
}
function nearestHiveDist(g){ const pp=P(g); let bd=1e9; for(const h of g.hives){ bd=Math.min(bd,Math.hypot(pp.x-h.x,pp.y-h.y)); } return bd; }
function previewScore(g){ const H=Math.round(g.p.kg*10)/10; return Math.round(100*H + (H>0?500+2*Math.floor(g.timeLeft):0) + 50*g.perfects + 100*g.chaosAvoided); }
function pop(g,x,y,text,color='#fff3da',size=18,life=1.1){ g.pops.push({x,y,text,color,size,life,max:life}); }
function part(g,o){ g.parts.push(Object.assign({vx:0,vy:0,life:1,max:1,size:3,color:'#ffb320',kind:'dot',gr:0},o)); if(g.parts.length>400) g.parts.shift(); }
let toastT=null;
function toast(msg,ms=1500){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }
function setHint(g,key,text,dur=4){ if(g.hintsShown[key]) return; g.hintsShown[key]=1; g.hint=text; g.hintT=dur; }
const isTouch=()=>document.body.classList.contains('touch');
const K = (kb,tp)=>isTouch()?tp:kb;

/* ---------------- update ---------------- */
function update(g,dt){
  const p=g.p, st=g.st;
  Input.sync(); const held=Input.held;
  updateParts(g,dt);
  if(g.end){ g.end.t-=dt;
    if(g.end.kind==='fail' && g.end.fall){ p.r+=g.end.v*dt; g.end.v+=900*dt; }
    if(g.end.kind==='win'){ p.r=Math.max(0,p.r-60*dt); }
    if(g.end.t<=0 && !g.end.shown){ g.end.shown=true; showResult(); }
    return; }
  g.t+=dt; g.timeLeft-=dt;
  if(g.hintT>0) g.hintT-=dt;
  if(g.timeLeft<=0){ g.timeLeft=0; return fail(g,'time'); }
  if(g.timeLeft<40 && p.mode==='gather') setHint(g,'late','残り40秒！ '+K('Rキー','帰還ボタン')+'で帰り始めよう',4);

  // discrete presses
  while(Input.queue.length){ const a=Input.queue.shift();
    if(a==='pause'){ pause(); return; }
    if(a==='smoke') useSmoke(g);
    if(a==='ret') toggleReturn(g);
    if(a==='cancel' && g.cut) cancelCut(g,'キャンセル');
  }
  if(Input.cutCancel){ Input.cutCancel=false; if(g.cut) cancelCut(g,'キャンセル'); g.armed=false; }

  p.inv=Math.max(0,p.inv-dt); g.smokeT=Math.max(0,g.smokeT-dt); g.shake=Math.max(0,g.shake-dt*2.5);
  updateWind(g,dt);
  updateCut(g,dt,held);
  updatePhysics(g,dt,held);
  if(g.end) return;
  updateBees(g,dt);
  updateChaos(g,dt,held);
  updateAlert(g,dt);
  updateBag(g,dt,held);
  updateTutorial(g);
  for(const h of g.hives) h.shake=Math.max(0,h.shake-dt*3);
  AU.buzz(clamp(g.alert/100 + (g.cut?0.15:0),0,1));
}

function updateWind(g,dt){
  const w=g.wind, st=g.st, base=st.wind*(g.easy?0.6:1);
  w.t-=dt;
  if(w.phase==='idle' && w.t<=0 && base>0.05){ w.phase='warn'; w.t=1.5; w.dir=rng()<0.5?-1:1; w.str=base*(0.6+rng()*0.5); AU.sfx('warn'); }
  else if(w.phase==='warn' && w.t<=0){ w.phase='gust'; w.t=2+rng()*1.6; }
  else if(w.phase==='gust' && w.t<=0){ w.phase='idle'; w.t=(5+rng()*6)/Math.max(0.5,st.wind); }
  const target = (w.phase==='gust'? w.dir*w.str : 0) + Math.sin(g.t*0.7)*base*0.12;
  w.cur = lerp(w.cur,target,Math.min(1,dt*2.5));
  if(w.phase==='gust' && rng()<dt*25){ const pp=P(g); part(g,{x:pp.x-w.dir*220+(rng()-0.5)*80,y:pp.y+(rng()-0.5)*200,vx:w.dir*420,vy:0,life:0.6,max:0.6,kind:'streak',color:'rgba(255,255,255,.5)'}); }
}

function cursorPos(g){
  const c=g.cut, x=c.t/cutTime(), tri = (x%2)<1 ? (x%1) : 1-(x%1);
  const jit = c.jit*0.07*Math.sin(c.t*23)*Math.exp(-c.t*1.4) + g.wind.cur*0.03*Math.sin(c.t*9.3);
  return clamp(tri+jit,0,1);
}
function updateCut(g,dt,held){
  const p=g.p;
  const cutHeld=held.cut;
  if(cutHeld && !g.prevCut){
    if(p.mode==='return'){ p.mode='gather'; toast('採集モードに戻った'); }
    if(p.kg>=CONFIG.maxHoneyKg-0.05) toast('袋がいっぱい（15kg）。帰還しよう');
    else g.armed=true;
  }
  if(!cutHeld && g.prevCut){ if(g.cut) resolveCut(g,false); g.armed=false; }
  g.prevCut=cutHeld;
  // up/down presses cancel an active cut
  const upE=held.up&&!g.prevUp, dnE=held.down&&!g.prevDown; g.prevUp=held.up; g.prevDown=held.down;
  if(g.cut && (upE||dnE)){ cancelCut(g,'キャンセル'); g.armed=false; return; }
  if(g.cut){ g.cut.t+=dt; if(g.cut.t>cutTime()*3.2) resolveCut(g,true); }
  else if(g.armed && p.slip<=0){ const h=reachable(g); if(h) startCut(g,h); }
}
function startCut(g,h){
  const p=g.p;
  g.cut={h,t:0,apex:Math.abs(p.om)<0.55,jit:Math.min(1,Math.abs(p.om)/2.2)};
  p.om=0; h.shake=0.4; AU.sfx('cutStart');
  if(g.cut.apex) pop(g,P(g).x,P(g).y-36,'APEX','#bff5cf',14,0.8);
}
function cancelCut(g,msg){ g.cut=null; pop(g,P(g).x,P(g).y-30,msg,'#c9b6d6',13,0.8); }
function resolveCut(g,timeout){
  const c=g.cut, h=c.h, p=g.p; g.cut=null;
  const d=Math.abs(cursorPos({cut:c,wind:g.wind})-0.5);
  const pw=CONFIG.perfectWindow+(c.apex?CONFIG.apexBonusWindow:0);
  let res = timeout?'MISS': d<=pw?'PERFECT': d<=CONFIG.goodWindow?'GOOD':'MISS';
  const pct = res==='PERFECT'?1:res==='GOOD'?0.85:0.4;
  const am = res==='PERFECT'?0.7:res==='GOOD'?1:1.3;
  let gain = Math.round(h.kg*pct*10)/10; gain=Math.min(gain, CONFIG.maxHoneyKg-p.kg); gain=Math.max(0,Math.round(gain*10)/10);
  p.kg=Math.round((p.kg+gain)*10)/10; h.left--; h.shake=0.6;
  g.alert=clamp(g.alert + h.alert*g.st.aggr*am,0,100); g.lastCutT=g.t; g.cuts++;
  if(res==='PERFECT'){ g.perfects++; AU.sfx('perfect'); unlock('perfect'); }
  else if(res==='GOOD'){ g.goods++; AU.sfx('good'); } else { g.misses++; AU.sfx('miss'); }
  AU.sfx('cut'); setTimeout(()=>AU.sfx('drip'),180);
  const pp=P(g), col=res==='PERFECT'?'#ffe08a':res==='GOOD'?'#fff3da':'#ff9aa5';
  pop(g,pp.x,pp.y-42,res+(res==='PERFECT'?'!':''),col,res==='PERFECT'?26:20,1.1);
  pop(g,pp.x,pp.y-18,'+'+gain.toFixed(1)+'kg','#ffb320',15,1.1);
  for(let i=0;i<16;i++) part(g,{x:h.x,y:h.y+h.r*0.3,vx:(pp.x-h.x)*(0.8+rng()*0.6)+(rng()-0.5)*40,vy:-60-rng()*80,gr:500,life:0.7,max:0.7,size:3+rng()*3,color:'#ffb320',kind:'honey'});
  if(res==='PERFECT') for(let i=0;i<14;i++){ const a=rng()*6.28; part(g,{x:pp.x,y:pp.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:0.5,max:0.5,size:2,color:'#fff6c0'}); }
  if(g.firstHoneyT==null){ g.firstHoneyT=g.t; unlock('first'); }
  p.om=-0.5; // push off the wall
  if(p.kg>=CONFIG.maxHoneyKg) toast('袋がいっぱい！ 帰還しよう');
}

function updatePhysics(g,dt,held){
  const p=g.p, st=g.st;
  const pp0=P(g); g.maxDepth=Math.max(g.maxDepth,p.r);
  if(g.cut) return;
  const m=mass(g);
  let dir=(held.right?1:0)-(held.left?1:0);
  if(!Input.kbSwing && !Input.tp.left && !Input.tp.right && Input.ax) dir=Input.ax;   // analog from the ball stick
  if(dir) p.face=Math.sign(dir);
  const ek=engulfK(g);
  let F = dir*CONFIG.swingForce/m*(1+ek*0.25);
  F += g.wind.cur*CONFIG.windForce*Math.cos(p.th)/Math.sqrt(m);
  F += g.extraF*Math.cos(p.th); g.extraF=0;
  const c = CONFIG.damping*(p.kg>=6?0.55:1);
  const alpha = (-CONFIG.g*Math.sin(p.th) + F)/p.r - c*p.om;
  p.om = clamp(p.om + alpha*dt, -CONFIG.maxOmega, CONFIG.maxOmega);   // semi-implicit Euler: v first
  p.th += p.om*dt;                                                     // then position with new v
  const mA=maxAngle();
  if(Math.abs(p.th)>mA){ p.th=Math.sign(p.th)*mA; p.om=0; creak(g); }
  const lim=st.wallX-CONFIG.playerR, x=p.r*Math.sin(p.th);
  if(x>lim){ p.th=Math.asin(clamp(lim/p.r,-1,1)); if(p.om>0){ if(p.om>1.7){ g.shake=Math.max(g.shake,0.25); AU.sfx('thud'); } p.om*=-0.3; } }
  if(Math.abs(p.om)>1.6 && Math.abs(p.th)>0.5) creak(g);
  // climbing
  const rOld=p.r; let vr=0;
  if(p.slip>0){ const s=Math.min(p.slip,340*dt); p.slip-=s; vr=s/dt; }
  else if(p.lift>0){ p.lift-=dt; vr=-160; }
  else{
    const cf=climbFactor(g);
    let up=CONFIG.climbUp*cf*(p.mode==='return'?CONFIG.returnClimbMul:1);
    const rhythm = Math.abs(p.om)<0.4 && Math.abs(p.th)>0.18;
    if(held.up && rhythm){ up*=1.4; g.rhythmT+=dt; if(g.rhythmT>0.6){ g.rhythmT=0; pop(g,pp0.x+24,pp0.y-10,'RHYTHM','#bff5cf',12,0.7);} }
    if(held.up) vr-=up*(1-ek*0.5);
    if(held.down) vr+=CONFIG.climbDown;
    if(p.mode==='return' && !held.down) vr-=CONFIG.returnDrift*cf;
  }
  p.r += vr*dt;
  const minR = p.mode==='return'?0:CONFIG.gatherMinR;
  if(p.slip<=0){
    if(p.r>st.L-6) p.r=st.L-6;
    if(p.r<minR){ p.r=minR; if(p.mode==='gather' && held.up){ g.retHintT+=dt; if(g.retHintT>0.4){ g.retHintT=-3; toast(K('Rキー','帰還ボタン')+'で帰還モードにすると崖の上へ戻れる'); } } }
  }
  if(p.r>st.L+4){ return fail(g,'valley'); }
  p.r=Math.max(p.r,4);
  if(Math.abs(p.r-rOld)>0.01) p.om=clamp(p.om*(rOld/p.r)*(rOld/p.r),-CONFIG.maxOmega,CONFIG.maxOmega);
  if(p.mode==='return' && p.r<=CONFIG.safeR) win(g);
}
function creak(g){ if(g.t-g.creakT>0.7){ g.creakT=g.t; AU.sfx('creak'); } }

function toggleReturn(g){
  const p=g.p;
  if(p.mode==='gather'){ p.mode='return'; g.armed=false; if(g.cut) cancelCut(g,'帰還開始'); toast('帰還モード：↑で登って崖の上へ'); AU.sfx('click'); }
  else { p.mode='gather'; toast('採集モードに戻った'); AU.sfx('click'); }
}
function useSmoke(g){

  p.smoke--; g.alert=Math.max(0,g.alert-(CONFIG.smokeDrop+5*U('smoke'))); g.smokeT=CONFIG.smokeTime;
  let canceled=0; g.attacks=g.attacks.filter(a=>{ if(a.phase==='warn'){canceled++;return false;} return true; });
  AU.sfx('smoke');
  const pp=P(g);
  for(let i=0;i<34;i++){ const a=rng()*6.28, s=30+rng()*90; part(g,{x:pp.x,y:pp.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:1.6,max:1.6,size:10+rng()*14,color:'rgba(230,228,235,.5)',kind:'smoke'}); }
  pop(g,pp.x,pp.y-40,'煙！ 警戒 −'+(CONFIG.smokeDrop+5*U('smoke')),'#e6e4eb',16,1);
  const C=g.chaos.active; if(C && C.type==='queen' && C.phase==='act'){ C.smoked=true; C.t=0; }
  if(C && (C.type==='monkey'||C.type==='beeball') && C.phase==='act'){ C.shake=99; }
}
function updateBag(g,dt,held){

function dropHoney(g){
  const p=g.p; if(p.kg<=0.05){ toast('袋は空っぽ'); return; }
  const d=Math.min(1,p.kg); p.kg=Math.round((p.kg-d)*10)/10; g.dropped+=d; AU.sfx('drop');

function hurt(g,src,opt={}){
  const p=g.p; if(p.inv>0 || g.end) return;
  const chaosSrc=src==='chaos';
  if(chaosSrc && p.lives<=1){ p.inv=1.0; p.om+= (opt.dir||1)*0.8; AU.sfx('thud'); pop(g,P(g).x,P(g).y-30,'セーフ…！','#ffe08a',14,0.9); return; }
  p.lives--; g.hitsTaken++; p.inv=1.4; g.shake=0.5; AU.sfx('hit');
  if(g.cut) cancelCut(g,'中断'); g.armed=false;
  p.om=clamp(p.om+(opt.dir||(rng()<0.5?-1:1))*1.1,-CONFIG.maxOmega,CONFIG.maxOmega);
  const slip = 20 + Math.max(0,p.kg-6)*8;
  p.slip += slip;
  const pp=P(g); pop(g,pp.x,pp.y-30,'痛っ！','#ff4d5e',20,1);
  if(slip>=80 && p.lives>0){ p.lives--; pop(g,pp.x,pp.y,'滑落ダメージ','#ff4d5e',14,1.1); }
  else if(slip>40) pop(g,pp.x,pp.y,'重くて滑る！','#ff9a3d',14,1);
  if(p.lives<=0) return fail(g,src==='chaos'?'chaos':'bees');
  if(p.kg>=6) setHint(g,'slipHint','重いほど刺された時に滑り落ちる。'+K('Q','袋ボタン長押し')+'で捨てて軽くできる',5);
}

/* ---------------- bees ---------------- */
function updateBees(g,dt){
  const pp=P(g), st=g.st, a=g.alert;
  for(const s of g.swarms){
    const hx=s.h.x-26, hy=s.h.y;
    let tx=hx, ty=hy;
    const dist=Math.hypot(pp.x-hx,pp.y-hy);
    if(a>=30 && dist<420){ const k=clamp((a-30)/70,0,1)*0.5; tx=lerp(hx,pp.x,k); ty=lerp(hy,pp.y,k); }
    if(g.smokeT>0){ tx=hx+10; ty=hy; }
    s.x=lerp(s.x,tx,Math.min(1,dt*1.6)); s.y=lerp(s.y,ty,Math.min(1,dt*1.6));
    const agit = a>=85?2.2:a>=60?1.6:a>=30?1.2:1;
    for(const b of s.bees){ b.a+=b.sp*agit*dt; }
  }
  // attack scheduler (state machine: 平穏→警戒→攻撃→大暴走)
  if(a>=60){
    const rate=(a>=85?1/1.35:1/3.2)*st.aggr*(g.smokeT>0?0.25:1)*(g.easy?0.8:1);
    g.attackAcc+=dt*rate;
    if(g.attackAcc>=1){ g.attackAcc-=1; spawnAttack(g,0); if(a>=85) spawnAttack(g,0.45); }
  } else g.attackAcc=Math.max(0,g.attackAcc-dt*0.2);
  for(const at of g.attacks){
    if(at.delay>0){ at.delay-=dt; if(at.delay<=0) aimAttack(g,at); continue; }
    if(at.phase==='warn'){ at.t-=dt; at.sx=at.s.x; at.sy=at.s.y;
      if(at.t<=0){ at.phase='dash'; const dx=at.tx-at.sx, dy=at.ty-at.sy, l=Math.hypot(dx,dy)||1; at.vx=dx/l*560; at.vy=dy/l*560; at.x=at.sx; at.y=at.sy; at.rem=l+160; } }
    else if(at.phase==='dash'){ const s=560*dt; at.x+=at.vx*dt; at.y+=at.vy*dt; at.rem-=s;
      if(Math.hypot(at.x-pp.x,at.y-pp.y)<CONFIG.playerR+7){ hurt(g,'bees',{dir:Math.sign(at.vx)||1}); at.rem=0; }
      if(at.rem<=0) at.phase='done'; }
  }
  g.attacks=g.attacks.filter(x=>x.phase!=='done');
  if(g.end) return;
}
function spawnAttack(g,delay){
  const pp=P(g); let best=g.swarms[0], bd=1e9;
  for(const s of g.swarms){ const d=Math.hypot(s.x-pp.x,s.y-pp.y); if(d<bd){bd=d;best=s;} }
  const at={s:best,phase:'warn',delay,t:0,sx:best.x,sy:best.y,tx:0,ty:0};
  if(!delay) aimAttack(g,at);
  g.attacks.push(at);
}
function aimAttack(g,at){
  const p=g.p, pp=P(g), wt=warnTime(g);
  const vx=p.r*Math.cos(p.th)*p.om, vy=-p.r*Math.sin(p.th)*p.om;
  at.tx=pp.x+vx*wt*0.45; at.ty=pp.y+vy*wt*0.45; at.t=wt; at.tot=wt; at.phase='warn';
  AU.sfx('warn');
  setHint(g,'beeHint','赤い線は蜂の突進予告。'+K('W/S','ボールの上下')+'や揺れで軌道から外れるか、'+K('E','煙')+'で鎮めよう',5);
}

/* ---------------- alert ---------------- */
function updateAlert(g,dt){
  if(g.cut) g.alert+=2.5*g.st.aggr*dt;
  else if(g.t-g.lastCutT>3){ const d=nearestHiveDist(g); g.alert-=(d>170?3.5:1.2)*dt*(g.p.mode==='return'?1.3:1); }
  g.alert=clamp(g.alert,0,100);
  const s=alertState(g.alert);
  if(s==='大暴走' && !g.frenzyBall && !g.chaos.active && !g.cut && !g.demo && g.t>=CONFIG.chaosFirstAllowed){ g.frenzyBall=true; startChaos(g,'beeball',true); }
  if(s!==g.lastAlertState){ if((s==='攻撃'||s==='大暴走') && g.lastAlertState && g.lastAlertState!=='大暴走'){ AU.sfx('alarm'); toast(s==='攻撃'?'蜂が攻撃態勢！':'蜂が大暴走！ 帰還を考えよう'); } g.lastAlertState=s; }
}

/* ---------------- chaos ---------------- */
function updateChaos(g,dt,held){
  const C=g.chaos; if(!C.enabled && !C.active) return;
  if(!C.active){
    if(C.queue.length && g.t>=C.next && !g.cut && g.t>=CONFIG.chaosFirstAllowed) startChaos(g,C.queue.shift());
    return;
  }
  const a=C.active, p=g.p, pp=P(g); a.t-=dt;
  if(a.phase==='warn'){
    if(a.type==='bubble'){ a.by-=40*dt; }
    if(a.t<=0){ a.phase='act';
      if(a.type==='monkey'){ a.t=2.0; a.shake=0; g.banner={text:(isTouch()?'ボールを左右に大きく振って振り落とせ！':'←→で大きく揺らして振り落とせ！'),t:2}; }
      if(a.type==='queen'){ a.t=4.5; a.beat=0.5; a.dir=1; }
      if(a.type==='bear'){ a.t=1.7; a.bx=-520; }
      if(a.type==='bubble'){ a.t=8; }
      if(a.type==='beeball'){ a.t=4.2; a.shake=0; a.cover=0; a.mogo=0.6; g.banner={text:(isTouch()?'真っ黒！ ボールを左右に振って暴れろ！':'真っ黒！ ←→で暴れて振り払え！'),t:2.4}; AU.sfx('alarm'); }
    }
    return;
  }
  if(a.phase==='act'){
    if(a.type==='monkey'){
      a.shake+=Math.abs(p.om)*dt;
      if(a.shake>=1.35){ endChaos(g,true,'振り払った'); pop(g,pp.x,pp.y-40,'猿を撃退！ +100','#bff5cf',18,1.2); AU.sfx('boing'); return; }
      if(a.t<=0){ const s=Math.min(1,p.kg); p.kg=Math.round((p.kg-s)*10)/10; endChaos(g,false,s>0?'1kg盗まれた':'空の袋に猿ががっかり'); pop(g,pp.x,pp.y-40,s>0?'蜂蜜を盗まれた！':'猿、がっかり','#ff9a3d',16,1.2); a.stole=s; }
    }
    if(a.type==='queen'){
      a.beat-=dt;
      if(a.beat<=0 && a.t>0.3){ a.beat=0.9; a.dir*=-1; p.om=clamp(p.om+a.dir*0.85/Math.sqrt(mass(g)),-CONFIG.maxOmega,CONFIG.maxOmega); g.alert=clamp(g.alert+3,0,100); AU.sfx('thud'); g.shake=Math.max(g.shake,0.15);
        for(let i=0;i<8;i++) part(g,{x:pp.x-60,y:pp.y-40,vx:a.dir*(120+rng()*120),vy:(rng()-0.5)*80,life:0.5,max:0.5,kind:'streak',color:'rgba(255,255,255,.6)'}); }
      if(a.t<=0){ const ok=a.smoked || g.hitsTaken===a.hits0; endChaos(g,ok,a.smoked?'煙で追い払った':ok?'揺れに耐えた':'振り回された'); if(ok) pop(g,pp.x,pp.y-40,'女王蜂をかわした！ +100','#bff5cf',16,1.2); }
    }
    if(a.type==='bear'){
      const sp=(g.st.wallX+700)/1.7; a.bx+=sp*dt;
      const dx=Math.abs(a.bx-pp.x);
      if(dx<220) g.extraF+=520*(1-dx/220);
      if(!a.touched && dx<42 && Math.abs(a.laneY-pp.y)<40){ a.touched=true; hurt(g,'chaos',{dir:1}); }
      if(a.t<=0){ endChaos(g,!a.touched,a.touched?'熊に轢かれた':'熊をかわした'); if(!a.touched) pop(g,pp.x,pp.y-40,'熊をかわした！ +100','#bff5cf',16,1.2); }
    }
    if(a.type==='beeball'){
      a.cover=Math.min(1,a.cover+dt*1.6);
      a.shake+=Math.abs(p.om)*dt*(a.cover>0.5?1:0.5);
      g.alert=clamp(g.alert+2*dt,0,100);
      a.mogo-=dt; if(a.mogo<=0){ a.mogo=0.7+rng()*0.4; pop(g,pp.x+(rng()-0.5)*40,pp.y-34,MOGO[Math.floor(rng()*MOGO.length)],'#fff3da',13,0.8); AU.tone&&AU.tone(140+rng()*60,0.25,'sawtooth',0.06,90); }
      if(a.shake>=1.6){ burstBees(g,pp,true); endChaos(g,true,'振り払った'); pop(g,pp.x,pp.y-44,'ブワッ！ 脱出 +100','#bff5cf',20,1.3); AU.sfx('boing'); return; }
      if(a.t<=0){ hurt(g,'chaos',{dir:rng()<0.5?-1:1}); burstBees(g,pp,false); endChaos(g,false,'全身刺された'); pop(g,pp.x,pp.y-44,'ボコボコ…','#ff9a3d',18,1.2); }
    }
    if(a.type==='bubble'){
      a.by-=75*dt; a.bx+=Math.sin(g.t*2)*20*dt;
      if(Math.hypot(a.bx-pp.x,a.by-pp.y)<34+CONFIG.playerR){ p.lift=1.7; p.slip=0; AU.sfx('pop'); endChaos(g,true,'バブルで浮上');
        pop(g,pp.x,pp.y-40,'ふわっ！ 浮上 +100','#ffe08a',18,1.2); for(let i=0;i<18;i++){const t=rng()*6.28; part(g,{x:a.bx,y:a.by,vx:Math.cos(t)*120,vy:Math.sin(t)*120,life:0.6,max:0.6,size:3,color:'#ffe08a'});} return; }
      if(a.t<=0 || a.by<pp.y-340){ endChaos(g,null,'見送った'); }
    }
  }
  if(a.phase==='leave'){ if(a.t<=0) C.active=null; }
}
function startChaos(g,type,frenzy){
  const C=g.chaos;
  C.active={type,phase:'warn',t:CONFIG.chaosWarningSeconds,tot:CONFIG.chaosWarningSeconds,hits0:g.hitsTaken,frenzy:!!frenzy};
  const a=C.active, pp=P(g);
  if(type==='bear'){ a.laneY=pp.y; a.t=a.tot=1.9; }
  if(type==='bubble'){ a.bx=clamp(pp.x+(rng()-0.5)*50,-140,g.st.wallX-60); a.by=pp.y+300; }
  g.banner={text:frenzy?'大暴走！ 蜂の大群が包囲してくる！':CHAOS_BANNER[type],t:CONFIG.chaosWarningSeconds+0.6};
  AU.sfx('chaos');
}
function burstBees(g,pp,big){
  for(let i=0;i<(big?70:35);i++){ const t=rng()*6.28, s=(big?160:70)+rng()*(big?260:80);
    part(g,{x:pp.x+Math.cos(t)*14,y:pp.y+Math.sin(t)*14,vx:Math.cos(t)*s,vy:Math.sin(t)*s-30,life:0.9+rng()*0.5,max:1.4,size:2.4,color:i%5?'#1a1018':'#ffc21a',kind:'bee'}); }
}
function engulfK(g){ const a=g.chaos.active; return a && a.type==='beeball' && a.phase==='act' ? a.cover : 0; }
function endChaos(g,ok,note){
  const C=g.chaos, a=C.active;
  g.chaosLog.push({type:a.type,ok,note});
  if(ok){ g.chaosAvoided++; unlock('chaos'); }
  a.phase='leave'; a.t=1.0; a.result=ok;
  C.next=g.t+CONFIG.chaosMinGap+rng()*8;
}

/* ---------------- tutorial ---------------- */
function updateTutorial(g){
  if(g.idx!==0 || Store.data.tutorialDone) return;
  const p=g.p;
  if(g.t<0.1) setHint(g,'t1',K('D / →','ボールを右へ倒し')+'で崖側へ揺らして、蜂の巣に近づこう',6);

/* ---------------- end of run ---------------- */
function fail(g,reason){
  if(g.end) return;
  g.cut=null; g.end={kind:'fail',reason,t:reason==='valley'?1.1:0.9,v:120,fall:reason==='valley'||reason==='bees'||reason==='chaos'};
  AU.sfx('fail'); AU.buzz(0); g.shake=0.6;
  finalize(g,false);
}
function win(g){
  if(g.end) return;
  g.end={kind:'win',t:0.8}; AU.sfx('win'); AU.buzz(0);
  const pp=P(g); for(let i=0;i<40;i++){const a=rng()*6.28,s=80+rng()*200; part(g,{x:pp.x,y:pp.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,gr:300,life:1.2,max:1.2,size:3+rng()*3,color:['#ffb320','#ffe08a','#57c27f','#fff3da'][i%4]});}
  finalize(g,true);
}
function finalize(g,ok){
  const S=Store.data, p=g.p, H=Math.round(p.kg*10)/10;
  const timeB=2*Math.floor(g.timeLeft);
  const parts = ok ? {honey:Math.round(100*H), ret:H>0?500:0, perfect:50*g.perfects, chaos:100*g.chaosAvoided, time:H>0?timeB:0} : null;
  const score = ok ? Object.values(parts).reduce((a,b)=>a+b,0) : 0;
  let coins = ok ? Math.floor(score/40) : (g.easy ? 5+Math.floor((g.cuts*1.5+H)*2) : 0);
  const prevBest=S.best[g.idx]||0, isBest=ok && score>prevBest;
  if(isBest) S.best[g.idx]=score;
  S.coins+=coins; S.plays++; S.lastStage=g.idx;
  if(ok){ unlock('home'); if(H>=10) unlock('heavy'); if(g.idx===4) unlock('king');
    if(g.idx+1>=S.unlocked && g.idx+1<STAGES.length) S.unlocked=g.idx+2; if(g.idx===0) S.tutorialDone=true; }
  const hint=makeHint(g,ok);
  S.lastHint=hint;

  S.log=S.log.slice(0,30);
  Store.save();

}
function makeHint(g,ok){
  const r=g.end.reason;

    if(r==='valley') return '重いほど刺された時に大きく滑る。危険域（10kg〜）では袋を長押しして1kg捨てよう。';
    if(r==='time') return '残り40秒を切ったら帰還を始めよう。帰還モードは自動で少しずつ登る。';
    if(g.p.smoke>0) return '煙が'+g.p.smoke+'回残っていた。警戒度60を超えたら早めに使おう。';
    return '赤い予告線が出たら、上下移動で軌道から外れよう。PERFECTなら警戒度が上がりにくい。';
  }
  if(g.p.kg<0.05) return '蜂蜜を持ち帰らないと帰還ボーナスは付かない。まず1切れ採ろう。';
  if(g.perfects===0) return 'ゲージ中央で離すとPERFECT。蜂蜜100%で警戒度の上昇も小さい。';
  if(g.p.kg<6) return '袋にはまだ余裕があった。もう1つ深い巣を狙ってみよう。';

function mix(a,b,t){

const colCache={};
function parseCol(c){ if(colCache[c]) return colCache[c]; let r;

}

      <div>時間ボーナス（残り${Math.floor(g.timeLeft)}秒）</div><div>${fmt(r.parts.time)}</div></div>`
    : `<div class="lines"><div>採集記録</div><div>${r.H.toFixed(1)}kg / ${g.cuts}回</div><div>PERFECT</div><div>${g.perfects}回</div><div>確定スコア</div><div>0</div></div>`;
  const next = r.ok && g.idx+1<STAGES.length && g.idx+1<S.unlocked ? `<button class="btn" id="rNext">次へ：${STAGES[g.idx+1].name}</button>` : '';
  $('#resCard').innerHTML = `
    <p class="res-title ${r.ok?'ok':'ng'}">${r.ok?'生還！':'失敗…'}</p>
    ${r.ok?`<div class="score">${fmt(r.score)}${r.isBest?'<span class="new">ベスト更新</span>':''}</div>`:`<div class="tag" style="font-size:15px;color:#fff3da">${reasonTxt}</div>`}
    ${lines}
    ${ev?`<div class="events"><b style="color:#ffe08a">珍事件</b><br>${ev}</div>`:''}
    <div class="hint"><b>次のコツ</b>　${r.hint}</div>
    <div class="tag">${r.coins>0?'+'+r.coins+' コイン'+(r.ok?'':'（練習コイン）')+'　':''}所持 ${fmt(S.coins)}</div>
    <button class="btn primary" id="rRetry">もう一回 <span style="font-family:var(--body);font-size:12px;opacity:.7">${isTouch()?'':'Space'}</span></button>
    <div class="row">${next}<button class="btn" id="rStages">ステージ</button><button class="btn" id="rShop">強化</button></div>`;
  show('result');
  $('#rRetry').onclick=()=>startRun(g.idx); $('#rRetry').focus();
  $('#rStages').onclick=()=>{ renderStages(); show('stages'); };
  $('#rShop').onclick=()=>{ renderShop(); show('shop'); };
  if(next) $('#rNext').onclick=()=>startRun(g.idx+1);
}

$('#bPlay').onclick=()=>{ AU.init(); playDefault(); };
$('#bStages').onclick=()=>{ AU.init(); renderStages(); show('stages'); };
$('#bShop').onclick=()=>{ AU.init(); renderShop(); show('shop'); };
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=goTitle);
$('#pauseBtn').onclick=()=>pause();
$('#pResume').onclick=resume; $('#pRetry').onclick=()=>startRun(G.idx); $('#pQuit').onclick=goTitle;
function setVol(v){ Store.data.set.vol=+v; Store.save(); AU.applyVol(); }
$('#vol').oninput=e=>setVol(e.target.value); $('#vol2').oninput=e=>setVol(e.target.value);
$('#mute').onchange=e=>{ Store.data.set.mute=e.target.checked; Store.save(); AU.applyVol(); };
$('#easy').onchange=e=>{ Store.data.set.easy=e.target.checked; Store.save(); };

/* ---------------- loop ---------------- */
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(screen==='play' && G){
    acc+=dt; let n=0;
    while(acc>=CONFIG.step && n<6){ update(G,CONFIG.step); acc-=CONFIG.step; n++; }
    if(n>=6) acc=0;
    updateCamera(G,dt); render(G,now); if(screen==='play') updateHud(G);
  } else if((screen==='pause'||screen==='result') && G){
    if(screen==='result') updateParts(G,dt);
    render(G,now);
  } else if(demo){
    demo.t+=dt; demo.p.th=0.42*Math.sin(now/850); demo.p.r=200+30*Math.sin(now/2300);
    demo.alert=20+15*Math.sin(now/3000); updateBees(demo,dt);
    updateCamera(demo,dt); render(demo,now);
  }
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
</script>
