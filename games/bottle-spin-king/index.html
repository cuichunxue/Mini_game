<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bottle Spin King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one full-bleed 3D table (night bar counter), HUD floats on the edges, sheets slide over the table. */
:root{
  --ink:#17131f;      /* night bar */
  --ink-2:#241d31;    /* raised panels */
  --cream:#f6ecd9;    /* text */
  --muted:#a99fbb;    /* secondary text */
  --brass:#e9ae3f;    /* the King's metal, accent */
  --rose:#ef5371;     /* hit / danger */
  --mint:#62d6a8;     /* positive */
  --line:rgba(246,236,217,.14);
  --font-d:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-b:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--cream);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--font-b);font-weight:700;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
.hud-top{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;gap:8px}
.pill{background:rgba(23,19,31,.72);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:baseline;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill small{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.pill b{font-family:var(--font-d);font-weight:400;font-size:20px;letter-spacing:.02em}
.pill.warn b{color:var(--rose)}
.chip{font-size:15px;padding:6px 14px;border-radius:999px;background:var(--brass);color:#2a1b05;font-weight:900;box-shadow:0 4px 0 #9b6b14;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.party{background:var(--cream);box-shadow:0 4px 0 #b7a98f}
.combo{font-family:var(--font-d);color:var(--brass);font-size:14px;min-height:18px;letter-spacing:.06em}
#status{position:fixed;left:0;right:0;top:24%;text-align:center;font-family:var(--font-d);font-size:clamp(26px,8vw,44px);color:var(--cream);text-shadow:0 3px 0 var(--ink),0 0 24px rgba(233,174,63,.35);pointer-events:none;transition:transform .15s}
#status.shake{animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
#toast{position:fixed;left:50%;top:33%;transform:translate(-50%,0) scale(.6);opacity:0;text-align:center;pointer-events:none;transition:transform .22s cubic-bezier(.2,1.6,.4,1),opacity .15s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .big{font-family:var(--font-d);font-size:clamp(30px,10vw,56px);line-height:1.05;white-space:nowrap}
#toast .sub{font-size:16px;color:var(--muted);margin-top:4px}
#toast.hit .big{color:var(--brass)} #toast.near .big{color:var(--mint)} #toast.miss .big{color:var(--cream)}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.icon-btn{pointer-events:auto;width:48px;height:48px;border-radius:14px;background:rgba(36,29,49,.85);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.icon-btn:active{transform:translateY(2px)}
#hint{flex:1;text-align:center;font-size:16px;color:var(--cream);opacity:.92;padding-bottom:12px}
#hint .hand{display:inline-block;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%{transform:translateX(-18px) rotate(-10deg);opacity:.2}40%{opacity:1}70%{transform:translateX(18px) rotate(12deg);opacity:1}100%{transform:translateX(18px);opacity:0}}
#hint small{display:block;font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(15,12,21,.55);z-index:20;overflow-y:auto}
.card{width:100%;max-width:420px;background:var(--ink-2);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
.logo{font-family:var(--font-d);line-height:.92;text-align:center;letter-spacing:.01em}
.logo .l1{display:block;font-size:clamp(40px,13vw,62px);color:var(--brass);text-shadow:0 5px 0 #8a5a0e}
.logo .l2{display:block;font-size:clamp(26px,8.5vw,40px);color:var(--cream);margin-top:6px}
.logo .ver{font-family:var(--font-b);font-size:12px;color:var(--muted);letter-spacing:.2em;display:block;margin-top:8px}
.tag{text-align:center;font-size:17px;color:var(--cream);text-wrap:balance}
.mode{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 14px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--ink);border:2px solid var(--line);transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--brass)}
.mode:active{transform:scale(.98)}
.mode .ic{grid-row:span 2;font-size:34px}
.mode .nm{font-family:var(--font-d);font-size:22px;letter-spacing:.04em}
.mode .ds{font-size:13px;color:var(--muted);font-weight:500}
.mode.solo .nm{color:var(--brass)} .mode.party .nm{color:var(--rose)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--ink);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.btn{font-family:var(--font-d);font-size:20px;padding:14px 18px;border-radius:14px;background:var(--brass);color:#2a1b05;box-shadow:0 5px 0 #9b6b14;letter-spacing:.04em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9b6b14}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--font-b);font-size:16px}
.btn.rose{background:var(--rose);color:#fff;box-shadow:0 5px 0 #a3283f}
.btns{display:flex;gap:10px}.btns>*{flex:1}
h2{font-family:var(--font-d);font-weight:400;font-size:26px;text-align:center;margin:0;color:var(--brass)}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .face{width:46px;height:46px;border-radius:12px;background:var(--ink);border:1px solid var(--line);font-size:24px;flex:none}
.prow input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--cream);font:inherit;font-size:16px;padding:0 12px}
.prow .rm{width:36px;height:46px;color:var(--muted);font-size:18px;flex:none}
.score-big{font-family:var(--font-d);font-size:56px;text-align:center;color:var(--cream);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--ink);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-family:var(--font-d);font-weight:400;font-size:22px}
.stats small{font-size:11px;color:var(--muted);letter-spacing:.08em}
.newbest{text-align:center;color:var(--brass);font-family:var(--font-d);letter-spacing:.1em}

/* command card */
.cmd-who{text-align:center;font-size:44px;line-height:1}
.cmd-name{text-align:center;font-family:var(--font-d);font-size:24px}
.cmd-text{text-align:center;font-size:20px;line-height:1.5;background:var(--ink);border-radius:14px;padding:16px;text-wrap:balance}
.cmd-flag{text-align:center;color:var(--rose);font-family:var(--font-d);font-size:16px;letter-spacing:.06em}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;background:var(--ink);border-radius:10px;padding:8px 12px}

/* ---------- Chaos ---------- */
#chaos{position:fixed;inset:0;pointer-events:none;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#chaos .ce{font-size:min(30vw,150px);line-height:1;animation:cpop 1.7s ease-out forwards}
#chaos .ct{font-family:var(--font-d);font-size:clamp(20px,6vw,30px);background:var(--ink);border:2px solid var(--brass);padding:6px 16px;border-radius:12px;animation:cfade 1.7s ease-out forwards;text-align:center;max-width:90vw}
#chaos .tier{font-size:11px;letter-spacing:.3em;color:var(--brass);animation:cfade 1.7s ease-out forwards}
#chaos.hand .ce{animation:chand 1.8s cubic-bezier(.2,.9,.3,1) forwards}
#chaos.frog .ce{animation:cfrog 1.8s ease-out forwards}
#chaos.small{justify-content:flex-end;padding-bottom:22vh}
#chaos.small .ce{font-size:min(18vw,80px)}
@keyframes cpop{0%{transform:scale(0) rotate(-20deg)}18%{transform:scale(1.2) rotate(6deg)}30%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes cfade{0%,10%{opacity:0;transform:translateY(10px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes chand{0%{transform:translateY(80vh) rotate(-30deg)}30%{transform:translateY(0) rotate(8deg)}40%,85%{transform:rotate(0)}100%{transform:translateY(-80vh);opacity:0}}
@keyframes cfrog{0%{transform:scale(0)}15%{transform:scale(1.15)}25%,45%{transform:scale(1)}50%{transform:scale(1.1) rotate(-8deg)}55%,85%{transform:scale(1)}100%{opacity:0}}
.rain{position:fixed;top:-10vh;font-size:28px;animation:rain 1.8s linear forwards;pointer-events:none;z-index:14}
@keyframes rain{to{transform:translateY(120vh) rotate(360deg)}}
#flash{position:fixed;inset:0;background:var(--cream);opacity:0;pointer-events:none;z-index:13;transition:opacity .35s}
#flash.on{opacity:.35;transition:none}
#bubble{position:fixed;z-index:16;background:var(--cream);color:var(--ink);font-family:var(--font-d);font-size:22px;padding:8px 14px;border-radius:16px;transform:translate(-50%,-120%);pointer-events:none;animation:cpop 1.6s ease-out forwards;white-space:nowrap}
#bubble::after{content:"";position:absolute;left:50%;bottom:-10px;border:10px solid transparent;border-top-color:var(--cream);border-bottom:0;margin-left:-10px}
#status.pow{animation:pow .55s cubic-bezier(.2,1.7,.4,1)}
#status.max{color:var(--brass);text-shadow:0 4px 0 #8a3a14,0 0 30px rgba(239,83,113,.8),0 0 60px rgba(233,174,63,.6)}
@keyframes pow{0%{transform:scale(2.6) rotate(-6deg);opacity:0}60%{transform:scale(.92) rotate(1deg);opacity:1}100%{transform:scale(1)}}
#rpm{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#rpm small{font-size:11px;letter-spacing:.3em;color:var(--muted)}
#rpm b{font-family:var(--font-d);font-weight:400;font-size:clamp(36px,11vw,56px);line-height:1;color:var(--cream);text-shadow:0 0 18px rgba(98,214,168,.6)}
#rpm.hot b{color:var(--brass);text-shadow:0 0 22px rgba(239,83,113,.85)}
#rpm .bar{width:min(220px,48vw);height:8px;border-radius:4px;background:rgba(246,236,217,.12);overflow:hidden}
#rpm .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--brass),var(--rose))}
.ono{position:fixed;z-index:12;pointer-events:none;font-family:var(--font-d);line-height:1;white-space:nowrap;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:ono .95s cubic-bezier(.2,1.6,.4,1) forwards}
.ono.boom{font-size:clamp(56px,19vw,120px)!important;color:var(--rose)!important;animation:boom 1.2s cubic-bezier(.2,1.8,.3,1) forwards;text-shadow:0 0 40px rgba(233,174,63,.9)}
@keyframes ono{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r));opacity:0}18%{transform:translate(-50%,-50%) scale(1.25) rotate(var(--r));opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(var(--r))}75%{opacity:1}100%{transform:translate(-50%,-80%) scale(1.05) rotate(var(--r));opacity:0}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(3) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(.9) rotate(4deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#status.pow{animation:none}#status.shake,#hint .hand{animation:none}}
</style>

<div id="stage" aria-label="game table"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<header class="hud-top" id="hudTop" hidden>
  <div class="row">
    <div class="pill"><small data-i="score">SCORE</small><b class="num" id="score">0</b></div>
    <div class="pill" id="timePill"><small data-i="time">TIME</small><b class="num" id="time">01:00</b></div>
  </div>
  <div class="chip" id="target">🎯</div>
  <div class="combo" id="combo"></div>
</header>
<div id="status"></div>
<div id="toast"><div class="big" id="toastBig"></div><div class="sub" id="toastSub"></div></div>

<footer class="hud-bottom" id="hudBottom" hidden>
  <button class="icon-btn" id="muteBtn" aria-label="sound">🔊</button>
  <div id="hint"><span class="hand">👆</span> <span data-i="hint">スワイプして瓶を回せ！</span><small data-i="keys">PC：ドラッグ ／ ←→で狙い・Spaceで溜めて回す</small></div>
  <button class="icon-btn" id="pauseBtn" aria-label="pause">⏸</button>
</footer>

<div id="rpm" hidden><small>RPM</small><b class="num" id="rpmNum">0</b><div class="bar"><i id="rpmBar"></i></div></div>
<div id="chaos"></div>

<!-- Title -->
<section class="sheet" id="titleSheet">
  <div class="card">
    <div class="logo"><span class="l1">BOTTLE</span><span class="l2">SPIN KING</span><span class="ver">v4.0</span></div>
    <p class="tag" data-i="tagline">回せ！グラグラ！そっちに倒れるの!? 😂</p>
    <button class="mode solo" id="goSolo"><span class="ic">🎯</span><span class="nm">SOLO SCORE</span><span class="ds" data-i="soloDesc">60秒でハイスコア。狙ったマスに倒せ</span></button>
    <button class="mode party" id="goParty"><span class="ic">🎉</span><span class="nm">PARTY CHAOS</span><span class="ds" data-i="partyDesc">2〜6人で1台。指された人に謎の指令</span></button>
    <div class="meta"><span><span data-i="best">ベスト</span> <b class="num" id="bestTitle">0</b></span>
      <span class="seg" role="group" aria-label="language"><button id="langJa" aria-pressed="true">日本語</button><button id="langEn" aria-pressed="false">EN</button></span></div>
  </div>
</section>

<!-- Party setup -->
<section class="sheet" id="setupSheet" hidden>
  <div class="card">
    <h2>PARTY CHAOS</h2>
    <div class="label" data-i="players">プレイヤー（アイコンをタップで変更）</div>
    <div class="players" id="plist"></div>
    <button class="btn ghost" id="addP" data-i="add">＋ プレイヤーを追加</button>
    <div class="meta"><span class="label" data-i="rounds">周回数</span>
      <span class="seg" role="group" aria-label="rounds"><button data-r="3" aria-pressed="true">3</button><button data-r="5" aria-pressed="false">5</button><button data-r="0" aria-pressed="false">∞</button></span></div>
    <div class="btns"><button class="btn ghost" id="setupBack" data-i="back">戻る</button><button class="btn rose" id="partyStart" data-i="start">はじめる</button></div>
  </div>
</section>

<!-- Command -->
<section class="sheet" id="cmdSheet" hidden>
  <div class="card">
    <div class="cmd-flag" id="cmdFlag" hidden></div>
    <div class="cmd-who" id="cmdWho">🦊</div>
    <div class="cmd-name" id="cmdName">—</div>
    <div class="label" style="text-align:center" data-i="order">指令</div>
    <div class="cmd-text" id="cmdText"></div>
    <div class="btns"><button class="btn ghost" id="cmdSkip" data-i="skip">スキップ</button><button class="btn rose" id="cmdOk" data-i="done">やった！次へ</button></div>
  </div>
</section>

<!-- Pause -->
<section class="sheet" id="pauseSheet" hidden>
  <div class="card">
    <h2 data-i="paused">一時停止</h2>
    <button class="btn" id="resumeBtn" data-i="resume">つづける</button>
    <button class="btn ghost" id="pauseMenu" data-i="menu">メニューへ</button>
  </div>
</section>

<!-- Solo over -->
<section class="sheet" id="overSheet" hidden>
  <div class="card">
    <h2 data-i="timeup">TIME UP!</h2>
    <div class="score-big num" id="overScore">0</div>
    <div class="newbest" id="newBest" hidden>NEW BEST!</div>
    <div class="stats">
      <div><b class="num" id="stHit">0</b><small data-i="hits">的中</small></div>
      <div><b class="num" id="stSpin">0</b><small data-i="spins">スピン</small></div>
      <div><b class="num" id="stBest">0</b><small data-i="best">ベスト</small></div>
    </div>
    <div class="btns"><button class="btn ghost" id="overMenu" data-i="menu">メニューへ</button><button class="btn" id="overAgain" data-i="again">もう一回</button></div>
  </div>
</section>

<!-- Party end -->
<section class="sheet" id="partyEnd" hidden>
  <div class="card">
    <h2 data-i="finale">今夜の主役は…</h2>
    <div class="cmd-who" id="peWho">👑</div>
    <div class="cmd-name" id="peName"></div>
    <div class="rank" id="peRank"></div>
    <div class="btns"><button class="btn ghost" id="peMenu" data-i="menu">メニューへ</button><button class="btn rose" id="peAgain" data-i="again">もう一回</button></div>
  </div>
</section>

<script src="../shared/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>

// SIM-START
const STEP=1/120, WC=14, G=9, MAXT=12;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSim(inp,seed){
  return {w:inp.w0,th:inp.th0,thd:0,ph:inp.ph0,phd:0,dir:inp.dir,spin:0,t:0,phase:"spin",rng:mulberry32(seed),caught:false,bounced:false,events:[],seed};
}
function stepSim(s,dt){
  s.t+=dt;
  if(s.phase==="spin"){
    const stab=Math.min(3,(s.w/WC)*(s.w/WC));
    let acc=G*Math.sin(s.th)*(1-stab)-1.4*s.thd+(s.rng()-.5)*1.8;
    if(s.t>MAXT) acc+=6; // safety: never stand forever
    s.thd+=acc*dt; s.th+=s.thd*dt;
    if(s.th<0){s.th=-s.th;s.thd=-s.thd;s.ph+=Math.PI;}
    s.phd=s.dir*Math.min(7,30/Math.max(s.w,1))*(.7+1.5*s.th);
    s.ph+=s.phd*dt;
    s.w=Math.max(0,s.w-(2.2+.12*s.w+4*s.th)*dt);
    s.spin+=s.dir*s.w*dt;
    if(!s.caught&&s.th>.42&&s.thd>0){s.caught=true;if(s.rng()<.5&&s.w>2){s.thd=-s.thd*.55;s.events.push("catch");}}
    if(s.th>.78){s.phase="fall";s.events.push("fall");}
  }else if(s.phase==="fall"){
    s.thd+=16*Math.sin(s.th)*dt; s.th+=s.thd*dt;
    s.phd*=Math.exp(-7*dt); s.ph+=s.phd*dt;
    s.w*=Math.exp(-5*dt); s.spin+=s.dir*s.w*dt;
    if(s.th>=Math.PI/2){
      s.th=Math.PI/2;
      if(!s.bounced&&s.thd>1.5){s.bounced=true;s.events.push("land");s.thd=-s.thd*.2;}
      else{s.thd=0;s.phase="done";s.events.push("rest");}
    }
  }
}
function runToEnd(inp,seed){const s=makeSim(inp,seed);let n=0;while(s.phase!=="done"&&n<120*20){stepSim(s,STEP);n++;}return s;}
// SIM-END

$("muteBtn").textContent=SFX.muted?"🔇":"🔊";
$("muteBtn").onclick=toggleMute;$("pauseBtn").onclick=()=>setPaused(true);$("resumeBtn").onclick=()=>setPaused(false);$("pauseMenu").onclick=toTitle;
$("goSolo").onclick=startSolo;$("goParty").onclick=openSetup;$("langJa").onclick=()=>setLang("ja");$("langEn").onclick=()=>setLang("en");
$("addP").onclick=()=>{if(setupPlayers.length<6){const i=setupPlayers.length;setupPlayers.push({face:FACES[(i*3)%FACES.length],name:`${t("player")}${i+1}`});renderPlist();}};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{G_.rounds=+b.dataset.r;document.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
$("setupBack").onclick=()=>{show("setupSheet",false);show("titleSheet");};$("partyStart").onclick=startParty;
$("cmdOk").onclick=closeCommand;$("cmdSkip").onclick=closeCommand;
$("overAgain").onclick=startSolo;$("overMenu").onclick=toTitle;$("peAgain").onclick=startParty;$("peMenu").onclick=toTitle;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G_.mode&&!G_.paused&&G_.state!=="over")setPaused(true);});

/* ================= Main loop ================= */
const bp=new THREE.Vector3(),bq=new THREE.Quaternion();let last=performance.now();
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;
  if(!G_.paused){
    if(G_.mode==="solo"&&G_.state!=="over"&&G_.timeLeft>0&&!anySheet()){G_.timeLeft-=dt;if(G_.timeLeft<=0){G_.timeLeft=0;if(G_.state!=="spinning"&&!G_.overPending){G_.overPending=true;setTimeout(endSolo,300);}}
      $("time").textContent=fmtTime(G_.timeLeft);$("timePill").classList.toggle("warn",G_.timeLeft<=10);}
    if(kb.charging){kb.charge=(Math.sin((now-kb.t0)/320-Math.PI/2)+1)/2;}
    const s=G_.sim;
    if(s&&G_.state==="spinning"){
      if(G_.hitstop>0){G_.hitstop-=dt;if(G_.hitstop<=0&&G_.pendingImpact){G_.pendingImpact=false;impact(s);}}
      else{G_.acc+=dt;while(G_.acc>=STEP&&s.phase!=="done"){stepSim(s,STEP);G_.acc-=STEP;if(s.events.indexOf("land")>=0){G_.acc=0;break;}}}
      while(s.events.length){const ev=s.events.shift();
        if(ev==="catch"){SFX.clink(.2);buzz(30);setStatus(t("catch"),true);}
        if(ev==="fall"){setStatus(t("fall"),true);}
        if(ev==="land"){SFX.thud();G_.hitstop=REDUCED?.01:.16;G_.pendingImpact=true;spinFx.kick=1.7;buzz(40);setStatus("");}
        if(ev==="rest"){SFX.clink(.08);}}
      SFX.updLoop(s.w,s.th);
      if(s.phase==="spin"){const stab=(s.w/WC)**2;if(stab<1.05){drawLabel("wobble");if(G_.lastStatus!==t("catch")||s.th<.3)setStatus(t("wobble"),true);}
        if(s.th>.25&&Math.random()<s.th*.08)SFX.clink(.05+s.th*.08);}
      if(s.phase==="done"&&!(G_.hitstop>0))onLanded();
    }
  }
  // bottle pose
  const s=G_.sim;
  if(s&&G_.state==="spinning"&&!G_.paused&&!(G_.hitstop>0))spinFx.vis+=s.dir*Math.min(s.w*VIS,58)*dt;
  if(s&&(G_.state==="spinning"||G_.state==="landed"||G_.state==="over")){pose(s.th,s.ph,spinFx.vis,bp,bq);}
  else{G_.idleSpin+=dt*(G_.mode?0:.6);const wob=Math.sin(now/600)*.015;pose(Math.abs(wob),now/900,G_.idleSpin,bp,bq);}
  if(G_.reset>0){G_.reset=Math.max(0,G_.reset-dt);const k=G_.reset/.25;bottlePivot.scale.setScalar(1+Math.sin(k*Math.PI)*.12);}else bottlePivot.scale.setScalar(1);
  bottlePivot.position.copy(bp);bottlePivot.quaternion.copy(bq);
  if(G_.state==="spinning"&&!G_.paused&&s&&s.phase==="spin"&&!REDUCED){const vb=spinFx.level*.07+((s.w/WC)**2<1?s.th*.12:0);bottlePivot.position.x+=(Math.random()-.5)*vb;bottlePivot.position.z+=(Math.random()-.5)*vb;bottlePivot.position.y+=Math.random()*vb*.5;}
  if(!G_.paused){updateDebris(dt);updateJunk(dt,s,G_.state==="spinning");updateOno(dt,s,G_.state==="spinning");
    sectors.forEach(sc=>{if(!(sc.knock>0))return;sc.knock=Math.max(0,sc.knock-dt*1.1);sc.sprite.position.y=.75+Math.abs(Math.sin((1-sc.knock)*Math.PI*2.5))*sc.knock*2.4;sc.sprite.material.rotation=Math.sin(now/45)*sc.knock*.7;});}
  // shadow under center of mass
  _v.set(0,1.0*BS,0).applyQuaternion(bq).add(bp);shadow.position.x=_v.x;shadow.position.z=_v.z;const tilt=s?s.th:0;shadow.scale.set((1.4+tilt*1.6)*BS,(1.4+tilt*1.6)*BS,1);
  updateSpinFx(G_.paused?0:dt,s,G_.state==="spinning");updRpm(s);
  // keyboard aim
  aim.visible=kb.used&&(G_.state==="ready"||G_.state==="landed")&&!G_.paused&&!anySheet();
  if(aim.visible){aim.position.set(Math.cos(kb.aim)*1.4,.15,Math.sin(kb.aim)*1.4);aim.rotation.set(-Math.PI/2,0,0);aim.rotation.z=-kb.aim-Math.PI/2;aim.rotation.order="XYZ";const sc=1+kb.charge*.8;aim.scale.set(sc,sc,sc);}
  // sectors pulse
  sectors.forEach((sc,i)=>{const isT=G_.mode==="solo"&&i===G_.target&&G_.state!=="landed";
    if(sc.pulse>0){const k=.6+.4*Math.sin(now/90);sc.mesh.material.emissiveIntensity=.55*k;const z=1.35+.35*k;sc.sprite.scale.set(z,z,1);}
    else{const n=sectors.length;let d=Math.abs(((spinFx.chase%n)+n)%n-i);d=Math.min(d,n-d);const ch=spinFx.level*Math.max(0,1-d/1.3)*.9;sc.mesh.material.emissiveIntensity=Math.max(isT?.25+.15*Math.sin(now/220):0,ch);}});
  if(targetMark.visible){targetMark.position.y=1.75+Math.sin(now/260)*.12;targetMark.visible=G_.mode==="solo"&&G_.state!=="landed";}
  else if(G_.mode==="solo"&&G_.state!=="landed"&&sectors[G_.target])targetMark.visible=true;
  // dust
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.userData.life-=dt;d.position.x+=d.userData.vx*dt;d.position.z+=d.userData.vz*dt;d.position.y+=dt*.6;d.scale.setScalar(.3+(.6-d.userData.life)*1.2);d.material.opacity=Math.max(0,d.userData.life/.6);if(d.userData.life<=0){scene.remove(d);d.material.dispose();dust.splice(i,1);}}
  // camera shake
  shakeT=Math.max(0,shakeT-dt);{const a=REDUCED?0:shakeT*.5+spinFx.level*.045;camera.position.copy(camera.userData.base);if(a>0)camera.position.add(new THREE.Vector3((Math.random()-.5)*a,(Math.random()-.5)*a,0));camera.lookAt(0,.4,.25);if(!REDUCED)camera.rotateZ((Math.random()-.5)*(shakeT*.09+spinFx.level*.012)+Math.sin(now/110)*spinFx.level*.025);}
  renderer.render(scene,camera);
  drawFx(now);
  requestAnimationFrame(frame);
}
function drawFx(now){fx.setTransform(dpr,0,0,dpr,0,0);fx.clearRect(0,0,innerWidth,innerHeight);
  const zb=Math.max(spinFx.level,spinFx.boom);
  if(zb>.2&&!REDUCED){const src=renderer.domElement,cx=spinFx.screen.x,cy=spinFx.screen.y;fx.globalAlpha=.16*zb;for(let i=1;i<=4;i++){const k=1+i*.045*zb;fx.drawImage(src,cx-cx*k,cy-cy*k,innerWidth*k,innerHeight*k);}fx.globalAlpha=1;}
  if(scrCrack){scrCrack.t+=1/60;const a=Math.max(0,1-scrCrack.t/1.6);if(a<=0)scrCrack=null;else{fx.lineJoin="miter";
    scrCrack.lines.forEach(pts=>{fx.beginPath();pts.forEach((p,i)=>i?fx.lineTo(p[0],p[1]):fx.moveTo(p[0],p[1]));fx.strokeStyle=`rgba(10,8,14,${.55*a})`;fx.lineWidth=5;fx.stroke();fx.strokeStyle=`rgba(255,255,255,${.9*a})`;fx.lineWidth=1.6;fx.stroke();});
    const g=fx.createRadialGradient(scrCrack.x,scrCrack.y,0,scrCrack.x,scrCrack.y,60);g.addColorStop(0,`rgba(255,255,255,${.5*a})`);g.addColorStop(1,"rgba(255,255,255,0)");fx.fillStyle=g;fx.fillRect(scrCrack.x-60,scrCrack.y-60,120,120);}}
  while(trail.length&&now-trail[0].t>220)trail.shift();
  if(trail.length>1){fx.lineCap="round";fx.lineJoin="round";for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];const k=1-(now-b.t)/220;fx.strokeStyle=`rgba(233,174,63,${k*.9})`;fx.lineWidth=4+k*12;fx.beginPath();fx.moveTo(a.x,a.y);fx.lineTo(b.x,b.y);fx.stroke();}}
  // anime speed lines while the bottle rips
  if(!REDUCED&&spinFx.level>.45){const a=(spinFx.level-.45)/.55,{x:cx,y:cy}=spinFx.screen,R=Math.hypot(innerWidth,innerHeight)*.7;
    const vg=fx.createRadialGradient(cx,cy,Math.min(innerWidth,innerHeight)*.3,cx,cy,R*1.1);vg.addColorStop(0,"rgba(239,83,113,0)");vg.addColorStop(1,`rgba(${spinFx.max?"239,83,113":"233,174,63"},${.22*a*(.75+.25*Math.sin(now/45))})`);fx.fillStyle=vg;fx.fillRect(0,0,innerWidth,innerHeight);
    fx.lineCap="round";for(let i=0;i<(spinFx.max?56:40);i++){const ang=Math.random()*6.2832,r0=R*(.5+Math.random()*.25);fx.strokeStyle=i%5?`rgba(246,236,217,${.16*a})`:`rgba(233,174,63,${.3*a})`;fx.lineWidth=1+Math.random()*(spinFx.max?5:3.5);
      fx.beginPath();fx.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0);fx.lineTo(cx+Math.cos(ang)*R*1.2,cy+Math.sin(ang)*R*1.2);fx.stroke();}}
  if(kb.charging){const w=Math.min(260,innerWidth-64),x=(innerWidth-w)/2,y=innerHeight*.7;fx.fillStyle="rgba(23,19,31,.8)";fx.fillRect(x-4,y-4,w+8,22);fx.fillStyle=kb.charge>.8?"#ef5371":"#e9ae3f";fx.fillRect(x,y,w*kb.charge,14);}
}
fitCamera();applyI18n();toTitle();requestAnimationFrame(frame);
})();
</script>
