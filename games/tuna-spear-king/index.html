<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tuna Spear King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: full-bleed canvas sea with a moving camera; HUD floats on top; screens are bottom-anchored panels over the live sea */
:root{
  --ink:#0b1b2e;          /* deep navy outlines */
  --foam:#f4fbff;         /* foam white */
  --sea:#0e5f8f;          /* panel sea blue */
  --buoy:#ff5a2c;         /* buoy orange accent */
  --kelp:#3fd18b;         /* safe green */
  --sun:#ffd23f;          /* gold / power */
  --danger:#ff3348;       /* red tension */
  --panel:rgba(6,28,48,.86);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#04213a;color:var(--foam)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:#04213a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* ---------- HUD ---------- */
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{background:rgba(4,22,40,.62);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-weight:900;font-size:13px;letter-spacing:.04em;white-space:nowrap;backdrop-filter:blur(4px)}
.chip small{font-weight:700;opacity:.7;margin-left:4px;font-size:11px}
.hud-top .grow{flex:1}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(4,22,40,.62);color:var(--foam);font-size:16px;font-weight:900;display:grid;place-items:center}
#spearsChip{display:flex;gap:3px;align-items:center}
.spear-pip{width:5px;height:18px;border-radius:2px;background:var(--sun);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.spear-pip.used{background:rgba(255,255,255,.18)}
#timerChip{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:400;font-size:15px}
#timerChip.low{color:var(--danger);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}

/* fish finder (aim phase) */
.sonar{position:absolute;top:56px;left:max(12px,env(safe-area-inset-left,0px));width:150px;background:rgba(2,16,30,.78);border:1px solid rgba(120,255,200,.35);border-radius:12px;padding:7px 9px 8px;pointer-events:none;box-shadow:inset 0 0 18px rgba(60,255,170,.08)}
.sonar .h{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.12em;color:#8fffc9}
.sonar .h em{font-style:normal;font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.02em}
.sonar .h em.go{color:var(--sun);animation:blink .35s steps(2) infinite}
.sonar .h em.deep{color:#6f8fa3}
.sonar .scope{position:relative;height:38px;margin-top:5px;border-radius:6px;overflow:hidden;background:linear-gradient(#0d4a5e,#06202f 70%,#2a1a10);}
.sonar .scope .rng{position:absolute;left:0;right:0;top:0;height:0;background:rgba(255,210,63,.13);border-bottom:1px dashed rgba(255,210,63,.55)}
.sonar .scope .blip{position:absolute;left:50%;top:0;width:26px;height:10px;margin:-5px 0 0 -13px;background:#ff5a8a;border-radius:50%;box-shadow:0 0 10px #ff5a8a,0 0 2px #fff}
.sonar .scope .sweep{position:absolute;top:0;bottom:0;width:2px;background:rgba(140,255,200,.55);box-shadow:0 0 8px rgba(140,255,200,.8);animation:sweep 1.6s linear infinite}
@keyframes sweep{from{left:-2%}to{left:102%}}

/* fight hud */
#fightHud{position:absolute;inset:0;pointer-events:none}
.distbox{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(78vw,420px);text-align:center}
.dist-num{font-family:var(--display);font-size:clamp(28px,8vw,44px);line-height:1;text-shadow:0 3px 0 var(--ink),0 0 14px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.dist-num small{font-size:.45em;margin-left:2px}
.track{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px 6px 0}
.track .esc{position:absolute;right:0;top:-4px;bottom:-4px;width:3px;background:var(--danger);border-radius:2px}
.track .fishmark{position:absolute;top:50%;width:20px;height:11px;margin:-5.5px 0 0 -10px;background:var(--foam);clip-path:polygon(0 50%,25% 0,80% 15%,100% 0,90% 50%,100% 100%,80% 85%,25% 100%)}
.track .boatmark{position:absolute;left:-6px;top:-5px;width:12px;height:18px;background:var(--buoy);clip-path:polygon(50% 0,100% 40%,85% 100%,15% 100%,0 40%)}
.stam{display:flex;align-items:center;gap:8px;margin:10px 6px 0;font-size:11px;font-weight:900;letter-spacing:.06em;text-shadow:0 1px 2px #000}
.stam .bar{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.stam .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a2c,#ffd23f);transform-origin:left}

.gauge{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:30%;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:48px;display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge .lbl{font-size:11px;font-weight:900;letter-spacing:.1em;text-shadow:0 1px 2px #000}
.gauge .tube{position:relative;flex:1;width:24px;border-radius:12px;background:rgba(4,22,40,.75);border:2px solid rgba(255,255,255,.6);overflow:hidden}
.gauge .zone{position:absolute;left:0;right:0}
.gauge .z-slack{bottom:0;height:7.7%;background:repeating-linear-gradient(-45deg,rgba(90,209,255,.45) 0 4px,rgba(90,209,255,.18) 4px 8px)}
.gauge .z-safe{bottom:7.7%;height:46.1%;background:rgba(63,209,139,.18)}
.gauge .z-pow{bottom:53.8%;height:20.8%;background:repeating-linear-gradient(-45deg,rgba(255,210,63,.32) 0 5px,rgba(255,210,63,.14) 5px 10px)}
.gauge .z-warn{bottom:74.6%;height:2.3%;background:rgba(255,140,60,.45)}
.gauge .z-red{bottom:76.9%;top:0;background:rgba(255,51,72,.35)}
.gauge .fill{position:absolute;left:3px;right:3px;bottom:3px;border-radius:8px;background:var(--kelp);height:0;box-shadow:0 0 10px currentColor}
.gauge .limit{position:absolute;left:-2px;right:-2px;bottom:76.9%;height:2px;background:#fff}
.gauge .pwlbl{position:absolute;left:30px;top:calc(19px + (100% - 64px) * .36);font-family:var(--display);font-size:9px;color:var(--sun);letter-spacing:.04em;text-shadow:0 1px 2px #000}
.gauge.pow .tube{border-color:var(--sun);box-shadow:0 0 14px rgba(255,210,63,.7)}
.gauge.hot .tube{border-color:var(--danger);box-shadow:0 0 16px rgba(255,51,72,.8);animation:shake .1s infinite}
.gauge .rope{width:48px;text-align:center;font-size:10px;font-weight:900;line-height:1.2;text-shadow:0 1px 2px #000}
.gauge .rope b{display:block;font-family:var(--display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.gauge .rope.low b{color:var(--danger);animation:blink .4s steps(2) infinite}
.gauge .hook b{color:#9fe6ff}
.gauge .hook.low b{color:#5ad1ff;animation:blink .3s steps(2) infinite}
#scoreChip{font-family:var(--display);font-weight:400;font-size:14px;font-variant-numeric:tabular-nums}
#scoreChip small{font-family:var(--body);font-weight:900}
#scoreChip.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.18);color:var(--sun)}}
@keyframes shake{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}

#pullBtn{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:122px;height:122px;border-radius:50%;border:4px solid var(--foam);background:radial-gradient(circle at 35% 30%,#ff8a5c,var(--buoy) 55%,#c2361a);color:#fff;font-family:var(--display);font-size:25px;letter-spacing:.04em;box-shadow:0 7px 0 #7b1f0d,0 12px 26px rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .05s}
#pullBtn small{font-family:var(--body);font-size:10px;font-weight:900;opacity:.85;letter-spacing:.08em}
#pullBtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent;pointer-events:none}
#pullBtn.on{transform:translateY(6px) scale(.97);box-shadow:0 1px 0 #7b1f0d,0 4px 12px rgba(0,0,0,.45);background:radial-gradient(circle at 35% 30%,#ffb08f,#ff6a3c 55%,#d4401f)}
#pullBtn.pow::after{border-color:var(--sun);box-shadow:0 0 18px var(--sun);animation:ring .5s ease-out infinite}
#pullBtn.danger{animation:pulse .25s infinite alternate}
#pullBtn.qte{background:radial-gradient(circle at 35% 30%,#bff0ff,#38b8ff 55%,#0b6fb8);box-shadow:0 7px 0 #064a7a,0 0 0 8px rgba(90,209,255,.45);animation:none}
#pullBtn.final{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffd23f 55%,#d69a00);color:var(--ink);text-shadow:none;animation:pulseG .35s infinite alternate}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.12);opacity:0}}
@keyframes pulse{to{border-color:var(--danger);box-shadow:0 7px 0 #7b1f0d,0 0 0 10px rgba(255,51,72,.5)}}
@keyframes pulseG{to{box-shadow:0 7px 0 #8a6200,0 0 0 10px rgba(255,210,63,.55)}}

#msg{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(32px,10vw,60px);line-height:1.1;padding:0 16px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);opacity:0;transform:scale(.6)}
#msg.show{opacity:1;transform:scale(1);transition:opacity .08s,transform .22s cubic-bezier(.2,1.8,.4,1)}
#msg.top{top:11%}
#msg .sub{display:block;font-family:var(--body);font-weight:900;font-size:clamp(13px,3.7vw,18px);-webkit-text-stroke:0;text-shadow:0 1px 3px #000,0 0 8px #000;margin-top:8px}
#hint{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(4,22,40,.72);border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap;pointer-events:none}
#hint.fight{left:auto;right:156px;transform:none;bottom:calc(64px + env(safe-area-inset-bottom,0px));white-space:normal;max-width:calc(100vw - 236px);border-radius:14px;font-size:12px}
#keyhint{position:absolute;right:16px;bottom:154px;font-size:11px;font-weight:900;opacity:.75;pointer-events:none}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;touch-action:pan-y;gap:12px}
.logo{margin:auto 0 0;text-align:center;pointer-events:none;padding-top:16px}
.logo .en{font-family:var(--display);font-size:clamp(40px,12vw,78px);line-height:.92;letter-spacing:.01em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 12px 28px rgba(0,0,0,.45);animation:slam .7s cubic-bezier(.2,1.7,.4,1) both}
.logo .en span{color:var(--sun)}
.logo .jp{display:inline-block;margin-top:12px;font-weight:900;font-size:clamp(15px,4.4vw,20px);background:var(--buoy);color:#fff;padding:4px 14px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 3px 0 var(--ink);animation:wob 2.4s ease-in-out infinite}
.logo .copy{margin-top:10px;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000;opacity:.95}
@keyframes slam{from{transform:scale(1.5) rotate(-4deg)}to{transform:none}}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1.5deg) scale(1.04)}}
.panel{width:min(100%,520px);background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:900;letter-spacing:.14em;opacity:.75;text-transform:uppercase}
.stages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;touch-action:pan-x}
.stage{flex:0 0 132px;scroll-snap-align:start;text-align:left;border:2px solid transparent;border-radius:12px;padding:9px 10px;color:#fff;display:flex;flex-direction:column;gap:3px;min-height:104px;position:relative;overflow:hidden}
.stage .n{font-size:10px;font-weight:900;letter-spacing:.12em;opacity:.85}
.stage .t{font-family:var(--display);font-size:15px;line-height:1.05}
.stage .r{margin-top:auto;font-size:10.5px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums;opacity:.95}
.stage.sel{border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,210,63,.3)}
.stage:disabled{cursor:not-allowed;filter:grayscale(.85) brightness(.55)}
.stage .lock{position:absolute;right:8px;top:8px;font-size:10px;font-weight:900;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px}
.stage .star{color:var(--sun)}
.stage-desc{font-size:12.5px;font-weight:700;line-height:1.5;min-height:2.9em;opacity:.92}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.3);padding:4px;border-radius:12px}
.seg button{border:0;border-radius:9px;padding:9px 4px;background:transparent;color:#fff;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-size:9.5px;opacity:.7;font-weight:700}
.seg button.sel{background:var(--foam);color:var(--ink)}
.row{display:flex;gap:8px;align-items:stretch}
.big{flex:1;border:0;border-radius:14px;padding:14px;font-family:var(--display);font-size:22px;letter-spacing:.04em;color:#fff;background:var(--buoy);box-shadow:0 5px 0 #8a2610;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #8a2610}
#startBtn{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 5px 0 #8a2610,0 0 0 6px rgba(255,90,44,.3)}}
.ghost{border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 14px;background:transparent;color:#fff;font-weight:900;font-size:14px}
.ctl{font-size:11px;font-weight:700;opacity:.7;text-align:center;line-height:1.6}
.ctl b{display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px;margin:0 2px;font-size:10px}

/* result */
.res-head{text-align:center}
.res-head .k{font-family:var(--display);font-size:clamp(34px,10vw,52px);line-height:1;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.res-head .k.win{color:var(--sun)}
.res-head .k.lose{color:#ff8a95}
.res-head .s{margin-top:8px;font-weight:900;font-size:14px}
.res-score{text-align:center;font-family:var(--display);font-size:clamp(28px,8vw,40px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.res-score small{display:block;font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.14em;opacity:.7;margin-bottom:4px}
.res-score em{font-style:normal;font-size:12px;color:var(--sun);margin-left:6px;vertical-align:middle}
.breakdown{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;font-weight:700;opacity:.8;font-variant-numeric:tabular-nums}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:6px;border-radius:8px;background:var(--sun);color:var(--ink);font-family:var(--display);font-size:18px;vertical-align:middle;transform:rotate(-6deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 10px;min-width:0}
.stat .l{font-size:10px;font-weight:900;letter-spacing:.08em;opacity:.7;white-space:nowrap}
.stat .v{font-family:var(--display);font-size:clamp(17px,5vw,22px);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:11px;margin-left:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.badge{font-family:var(--display);font-size:13px;padding:5px 10px;border-radius:8px;background:var(--sun);color:var(--ink);transform:rotate(-2deg)}
.badge.alt{background:var(--kelp)}
.badge.red{background:var(--buoy);color:#fff}
.cause{background:rgba(255,51,72,.14);border:1px solid rgba(255,51,72,.45);border-radius:12px;padding:12px;font-size:13px;font-weight:700;line-height:1.6}
.cause b{display:block;font-size:15px;font-weight:900;margin-bottom:2px}
.photo-wrap{width:min(100%,420px);display:flex;flex-direction:column;gap:10px;align-items:center;margin:auto 0}
.photo-wrap img{width:100%;border-radius:14px;border:3px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
.photo-wrap p{font-size:12.5px;font-weight:700;text-align:center;opacity:.9;margin:0}
.dim{background:rgba(2,12,22,.55)}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){#msg.show{transition:none}.gauge.hot .tube,#pullBtn.danger,#pullBtn.final,#pullBtn.pow::after,.logo .en,.logo .jp,#startBtn{animation:none}}
@media (min-width:900px){.screen{justify-content:center}.logo{margin:0}}

/* narrow phones (iPhone SE etc.): keep the whole top bar on screen */
@media (max-width:360px){
  .hud-top{gap:4px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .hud-top .chip{padding:4px 7px;font-size:11px;letter-spacing:0}
  .hud-top .chip small{font-size:9px}
  .hud-top .iconbtn{width:32px;height:32px;font-size:13px;flex:none}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="海とマグロのゲーム画面"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="chip" id="scoreChip"><small>SCORE</small> 0</div>
      <div class="grow"></div>
      <div class="chip" id="spearsChip" aria-label="残りの槍"></div>
      <div class="chip" id="timerChip" hidden>0:00</div>
      <button class="iconbtn" id="soundBtn" aria-label="サウンド切替">♪</button>
      <button class="iconbtn" id="pauseBtn" aria-label="一時停止">II</button>
    </div>
    <div class="sonar" id="sonar">
      <div class="h"><span>魚探 SONAR</span><em id="sonarTxt">深い</em></div>
      <div class="scope"><div class="rng" id="sonarRng"></div><div class="sweep"></div><div class="blip" id="sonarBlip"></div></div>
    </div>
  </div>

  <div id="fightHud" hidden>
    <div class="distbox">
      <div class="dist-num" id="distNum">40.0<small>m</small></div>
      <div class="track"><div class="boatmark"></div><div class="fishmark" id="fishMark"></div><div class="esc"></div></div>
      <div class="stam"><span>マグロ体力</span><div class="bar"><i id="stamBar"></i></div></div>
    </div>
    <div class="gauge" id="gauge">
      <div class="lbl">張力</div>
      <div class="tube"><div class="zone z-slack"></div><div class="zone z-safe"></div><div class="zone z-pow"></div><div class="zone z-warn"></div><div class="zone z-red"></div><div class="fill" id="tFill"></div><div class="limit"></div></div>
      <div class="pwlbl">POWER</div>
      <div class="rope" id="ropeBox">ロープ<b id="ropeNum">100</b></div>
      <div class="rope hook" id="hookBox">フック<b id="hookNum">100</b></div>
    </div>
  </div>

  <button id="pullBtn" hidden aria-label="ロープを引く（長押し）">PULL<small>長押し</small></button>
  <div id="keyhint" hidden>Space長押しで巻く</div>
  <div id="msg"></div>

<script>
(()=>{

/* ================= DATA ================= */
const STAGES=[
 {id:'sunny',charge:.15,name:'SUNNY BAY',jp:'サニーベイ',desc:'穏やかな入り江。小型マグロで「狙う・引く・緩める」を覚えよう。',kg:[60,110],speed:.85,wave:.35,burst:.92,tell:1.25,stam:.9,erratic:0,jump:.3,
  sky:['#2f9be8','#8fd2fa','#e6f7ff'],sea:['#6fd0e6','#1d86b5','#06406a'],hi:'#e9fbff',sun:{x:.78,y:.5,r:26,c:'#fff6c8',glow:'rgba(255,246,200,.6)'},island:'#3f8f8a',cloud:'rgba(255,255,255,.92)',fish:'n'},
 {id:'blue',charge:.3,name:'BLUE OCEAN',jp:'ブルーオーシャン',desc:'外洋。マグロの泳ぎが速い。進行方向の少し先を狙え。',kg:[120,190],speed:1.3,wave:.5,burst:1.0,tell:1.0,stam:1.0,erratic:0,jump:.35,
  sky:['#0b62c4','#5fb0ef','#cfeeff'],sea:['#2f98d2','#0d5e9a','#022850'],hi:'#d6f1ff',sun:{x:.2,y:.35,r:24,c:'#ffffff',glow:'rgba(255,255,255,.55)'},island:null,cloud:'rgba(255,255,255,.88)',fish:'n'},
 {id:'storm',charge:.3,name:'STORM SEA',jp:'ストームシー',desc:'嵐の海。船が大きく揺れ、張力が跳ね上がる。揺れが止まる瞬間を待て。',kg:[170,250],speed:1.15,wave:1.0,burst:1.05,tell:.95,stam:1.1,erratic:.3,jump:.4,storm:1,
  sky:['#18222d','#46586a','#7d8c98'],sea:['#587683','#24414f','#0a1820'],hi:'#c4d6de',sun:null,island:'#26343c',cloud:'rgba(66,80,92,.96)',fish:'n'},
 {id:'sunset',charge:.32,name:'SUNSET GIANT',jp:'サンセットジャイアント',desc:'夕焼けの海に巨大マグロ。体力が多く長期戦。焦らず張力を管理しろ。',kg:[280,380],speed:1.1,wave:.6,burst:1.1,tell:.95,stam:1.3,erratic:.2,jump:.45,
  sky:['#2a1d5c','#b4507a','#ffae5e'],sea:['#ee9663','#7b3b62','#1c1235'],hi:'#ffd7a8',sun:{x:.5,y:.82,r:46,c:'#ffd26b',glow:'rgba(255,170,80,.65)'},island:'#3a1f3f',cloud:'rgba(255,170,150,.72)',fish:'n'},
 {id:'legend',charge:.4,name:'LEGEND TUNA',jp:'伝説の黄金マグロ',desc:'月夜に現れる伝説級の黄金マグロ。急加速と方向転換が激しい最終決戦。',kg:[430,560],speed:1.5,wave:.75,burst:1.18,tell:.8,stam:1.4,erratic:1,jump:.6,
  sky:['#030720','#141a4d','#3a3f84'],sea:['#34479a','#121b4a','#020414'],hi:'#c9d4ff',sun:{x:.72,y:.3,r:22,c:'#f4f1ff',glow:'rgba(200,210,255,.5)',moon:1},island:'#0c1030',cloud:'rgba(60,70,130,.55)',fish:'g',stars:1},
];
const DIFFS={
 easy:{label:'初心者',sub:'予測ガイドあり',speed:.75,roll:.45,guide:2,rope:1.6,tell:1.55,time:110,aim:42,hook:.55,spears:8,tol:.36,maxDive:.62},
 normal:{label:'中級者',sub:'弱い補助',speed:1,roll:1,guide:1,rope:1,tell:1,time:90,aim:32,hook:1,spears:6,tol:.22,maxDive:.95},
 hard:{label:'上級者',sub:'補助なし',speed:1.2,roll:1.45,guide:0,rope:.7,tell:.6,time:72,aim:24,hook:1.3,spears:4,tol:.14,maxDive:.98},
};
const POW_LO=.7, POW_HI=.97;

/* ================= SAVE ================= */
const SAVE_KEY='tunaSpearKing.v1';
let save={unlocked:1,diff:'normal',stage:0,muted:false,rec:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')save=Object.assign(save,s);}catch(e){}
if(!save.rec||typeof save.rec!=='object')save.rec={};
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ================= AUDIO ================= */
const AU={ctx:null,master:null,mus:null,noise:null,creak:null,creakG:null};
/* iOS: a silent looping <audio> moves the page to the "playback" session so Web Audio is heard even with the ringer switch off */
let silentEl=null;
function silentWav(){const n=800,b=new Uint8Array(44+n);const v=new DataView(b.buffer);const w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  let s='';for(const x of b)s+=String.fromCharCode(x);return'data:audio/wav;base64,'+btoa(s)}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!silentEl){silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=.01}
    const p=silentEl.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  if(AU.ctx){if(AU.ctx.state!=='running'){const r=AU.ctx.resume();if(r&&r.catch)r.catch(()=>{})}
    try{const b=AU.ctx.createBuffer(1,1,22050),s=AU.ctx.createBufferSource();s.buffer=b;s.connect(AU.ctx.destination);s.start(0)}catch(e){}}
}
['pointerdown','pointerup','touchend','click','keydown'].forEach(t=>document.addEventListener(t,()=>{initAudio();unlockAudio()},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU.ctx&&AU.ctx.state!=='running'){const r=AU.ctx.resume();if(r&&r.catch)r.catch(()=>{})}});
function initAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended'||AU.ctx.state==='interrupted'){const r=AU.ctx.resume();if(r&&r.catch)r.catch(()=>{})}return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const a=new C();AU.ctx=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(a.destination);
    AU.master=a.createGain();AU.master.gain.value=save.muted?0:.9;AU.master.connect(comp);
    AU.mus=a.createGain();AU.mus.gain.value=.55;AU.mus.connect(AU.master);
    const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
    const n=a.createBufferSource();n.buffer=b;n.loop=true;
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
    const g=a.createGain();g.gain.value=.05;
    const lfo=a.createOscillator();lfo.frequency.value=.13;const lg=a.createGain();lg.gain.value=.035;lfo.connect(lg);lg.connect(g.gain);
    n.connect(lp);lp.connect(g);g.connect(AU.master);n.start();lfo.start();
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=80;
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=6;
    const cg=a.createGain();cg.gain.value=0;o.connect(bp);bp.connect(cg);cg.connect(AU.master);o.start();
    AU.creak=o;AU.creakBP=bp;AU.creakG=cg;
  }catch(e){AU.ctx=null}
}
function setMuted(m){save.muted=m;persist();if(AU.master)AU.master.gain.value=m?0:.9;updSoundBtns()}
function noiseHit({t=0,at=null,dur=.3,type='lowpass',f=1000,f2=null,q=1,vol=.4,attack=.005,out=null}){
  const a=AU.ctx;if(!a)return;const now=at!=null?at:a.currentTime+t;
  const s=a.createBufferSource();s.buffer=AU.noise;
  const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,now);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,now+dur);fl.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+attack);g.gain.exponentialRampToValueAtTime(.001,now+dur);
  s.connect(fl);fl.connect(g);g.connect(out||AU.master);s.start(now,Math.random());s.stop(now+dur+.05);
}
function tone({t=0,at=null,f=440,f2=null,dur=.2,type='sine',vol=.2,attack=.005,out=null,lp=null}){
  const a=AU.ctx;if(!a)return;const now=at!=null?at:a.currentTime+t;
  const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,now);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+dur);
  const g=a.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+attack);g.gain.exponentialRampToValueAtTime(.001,now+dur);
  if(lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g)}else o.connect(g);
  g.connect(out||AU.master);o.start(now);o.stop(now+dur+.05);
}
const SFX={
  whoosh(){noiseHit({dur:.4,type:'bandpass',f:500,f2:3600,q:1.5,vol:.45,attack:.06});tone({f:300,f2:900,dur:.25,type:'triangle',vol:.06})},
  splash(s=1){noiseHit({dur:.45+.35*s,type:'lowpass',f:2600,f2:250,vol:.25+.22*s});noiseHit({t:.03,dur:.3,type:'highpass',f:3000,vol:.13*s})},
  hit(){tone({f:110,f2:32,dur:.7,type:'sine',vol:.9});tone({f:2400,f2:1800,dur:.18,type:'triangle',vol:.12});noiseHit({dur:.8,type:'lowpass',f:3200,f2:200,vol:.55});noiseHit({t:.05,dur:.25,type:'bandpass',f:900,q:2,vol:.3})},
  critical(){[1318,1760,2637].forEach((f,i)=>tone({t:.12+i*.06,f,dur:.25,type:'square',vol:.07}))},
  warn(){tone({f:880,dur:.09,type:'square',vol:.1});tone({t:.12,f:880,dur:.09,type:'square',vol:.1});tone({t:.24,f:1175,dur:.12,type:'square',vol:.1})},
  alarm(){tone({f:1240,dur:.07,type:'square',vol:.07})},
  chance(){tone({f:660,dur:.08,type:'triangle',vol:.16});tone({t:.08,f:990,dur:.16,type:'triangle',vol:.16})},
  power(){tone({f:440,f2:1320,dur:.25,type:'sawtooth',vol:.08,lp:3000});tone({t:.05,f:880,f2:1760,dur:.2,type:'square',vol:.05})},
  snap(){noiseHit({dur:.14,type:'highpass',f:2500,vol:.7,attack:.001});tone({f:2200,f2:120,dur:.45,type:'sawtooth',vol:.18});tone({f:70,f2:30,dur:.5,vol:.6})},
  reel(){noiseHit({dur:.03,type:'highpass',f:4200,vol:.06,attack:.001})},
  thunder(){noiseHit({dur:2.4,type:'lowpass',f:320,f2:50,vol:.6,attack:.06})},
  click(){tone({f:520,dur:.05,type:'triangle',vol:.08})},
  ping(){tone({f:1480,dur:.6,type:'sine',vol:.12});tone({t:.35,f:1480,dur:.4,type:'sine',vol:.05})},
  cheer(){noiseHit({dur:1.8,type:'bandpass',f:1400,q:.7,vol:.2,attack:.2});[523,659,784,1047].forEach((f,i)=>tone({t:.1+i*.11,f,dur:.35,type:'triangle',vol:.16}))},
  fanfare(){[784,988,1175,1568].forEach((f,i)=>tone({t:.9+i*.09,f,dur:.45,type:'square',vol:.06,lp:4000}))},
  fail(){[392,330,262].forEach((f,i)=>tone({t:i*.16,f,dur:.32,type:'triangle',vol:.16}))},
  breach(){noiseHit({dur:1.2,type:'lowpass',f:3000,f2:300,vol:.6,attack:.02});tone({f:90,f2:40,dur:.8,vol:.6})},
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ----- procedural taiko music ----- */
const MUS={mode:'none',next:0,step:0};
const BASS=[55,55,65.4,55,73.4,65.4,82.4,73.4];
function taiko(at,vol,pitch=1){tone({at,f:130*pitch,f2:46*pitch,dur:.32,vol,out:AU.mus});noiseHit({at,dur:.08,type:'lowpass',f:900,vol:vol*.35,out:AU.mus})}
function musicTick(){
  const a=AU.ctx;if(!a||save.muted)return;
  const mode=G.state==='fight'?'fight':G.state==='aim'?'aim':'none';
  if(mode!==MUS.mode){MUS.mode=mode;MUS.next=a.currentTime+.05;MUS.step=0}
  if(mode==='none')return;
  if(MUS.next<a.currentTime-.1)MUS.next=a.currentTime+.03;
  const fi=G.fight;
  let bpm;
  if(mode==='fight')bpm=128+(fi&&fi.phase==='burst'?14:0)+(fi&&fi.exhausted?20:0)+(fi&&fi.last?8:0);
  else bpm=76+(G.fish?(1-G.fish.dive)*36:0);
  const spb=60/bpm/2;
  while(MUS.next<a.currentTime+.14){playStep(mode,MUS.step,MUS.next);MUS.next+=spb;MUS.step++}
}
function playStep(mode,s,at){
  const fi=G.fight;
  if(mode==='aim'){
    const k=s%8;
    if(k===0)taiko(at,.5,.8);if(k===2)taiko(at,.3,.8);
    if(G.fish&&G.fish.dive<.4&&k%2===1)noiseHit({at,dur:.04,type:'highpass',f:6000,vol:.05,out:AU.mus});
    return;
  }
  const k=s%16,I=fi?clamp(fi.T,0,1.3):.5;
  if([0,3,6,8,11,14].includes(k))taiko(at,k===0||k===8?.7:.45);
  if(k===4||k===12)noiseHit({at,dur:.12,type:'bandpass',f:1800,q:.8,vol:.12+.12*I,out:AU.mus});
  noiseHit({at,dur:.03,type:'highpass',f:7000,vol:(k%2?.03:.05)*(.6+I),out:AU.mus});
  if(k%2===0){const n=BASS[(k/2)|0]*(fi&&fi.exhausted?1.5:1);tone({at,f:n,dur:.2,type:'sawtooth',vol:.12+.08*I,out:AU.mus,lp:300+700*I})}
  if(fi&&fi.phase==='burst'&&k%2===1)noiseHit({at,dur:.06,type:'bandpass',f:2400,q:1,vol:.1,out:AU.mus});
  if(fi&&fi.exhausted){const ar=[440,523,659,784,880,1047,880,659];tone({at,f:ar[k%8],dur:.12,type:'square',vol:.04,out:AU.mus,lp:3500})}
  if(fi&&fi.rope<35&&(k===0||k===2))tone({at,f:60,f2:40,dur:.18,vol:.5,out:AU.mus});
}

/* ================= VIEW / PROJECTION ================= */
let W=0,H=0,DPR=1,CX=0,HZ=0,F=1,CAMH=1,BW=0,BH=0,BPX=0,BPY=0;
const bgC=document.createElement('canvas'),vigC=document.createElement('canvas');
function resize(){
  const r=cv.parentElement.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  CX=W/2;HZ=H*(W<H?.3:.32);F=Math.min(W*1.15,H*.9);CAMH=(H*.8-HZ)*2/F;
  BW=Math.min(W*.62,360);BH=Math.min(H*.25,BW*.78);BPX=CX;BPY=H+12;
  initDeco();buildBg();buildVig();
}
const P=(x,d,h=0)=>{const s=F/d;return{x:CX+x*s,y:HZ+(CAMH-h)*s,s}};
const unP=(sx,sy)=>{const d=CAMH*F/Math.max(1,sy-HZ);return{x:(sx-CX)*d/F,d}};
const halfW=d=>(W/2)*d/F;
let boatBob=0;
function boatPt(lx,ly){const c=Math.cos(G.roll),s=Math.sin(G.roll);return{x:BPX+lx*c-ly*s,y:BPY+boatBob+lx*s+ly*c}}

/* camera */
const CAM={z:1,x:0,y:0,trauma:0,rt:0};
const PIVY=()=>H*.55;
function addTrauma(v){if(!reduceMotion)CAM.trauma=Math.min(1,CAM.trauma+v)}
function screenToWorld(sx,sy){return{x:(sx-CX-CAM.x)/CAM.z+CX,y:(sy-PIVY()-CAM.y)/CAM.z+PIVY()}}

/* ================= STATE ================= */
const G={state:'title',stage:save.stage|0,diff:save.diff,t:0,roll:0,fish:null,spear:null,spears:0,cool:0,aim:null,aiming:false,
  fight:null,parts:[],ripples:[],confetti:[],pops:[],rings:[],slow:0,timeScale:1,flash:0,flashCol:'230,240,255',roundT:0,endT:0,result:null,
  btnPull:false,keyPull:false,canvasPull:false,lightning:rnd(5,10),throwAnim:0,catchT:0,snap:null,missCount:0,firstFight:true,
  seaScroll:0,score:0,aimT:0,kill:null,leap:null,leapT:2,crit:false,speedFx:0,edge:null};
if(G.stage>=save.unlocked)G.stage=0;
if(!DIFFS[G.diff])G.diff='normal';
const ST=()=>STAGES[G.stage], DF=()=>DIFFS[G.diff];

function fishLenCm(kg){return Math.round(Math.cbrt(kg/1.96e-5))}
function newFish(){
  const st=ST(),df=DF();const kg=Math.round(rnd(st.kg[0],st.kg[1]));const rel=(kg-st.kg[0])/(st.kg[1]-st.kg[0]);
  return{kg,rel,cm:fishLenCm(kg),len:(1.45+kg/250)*1.3,x:rnd(-1,1),d:13,h:-Math.PI/2+rnd(-.6,.6),v:0,
    spd:.95*st.speed*df.speed,tx:0,td:8,retarget:0,dive:.9,divePh:rnd(-1,.5),dart:0,flap:0,pw:st.burst*(.88+.3*rel),rising:false,prevDive:1}
}

/* ================= DECOR / CACHES ================= */
let clouds=[],sparkles=[],rain=[],stars=[];
function initDeco(){

  if(G.state==='aim'&&G.fish){
    const f=G.fish;ui.sonarBlip.style.top=(8+f.dive*24).toFixed(1)+'px';
    ui.sonarBlip.style.left=(50+clamp(f.x/halfW(f.d),-1,1)*38).toFixed(1)+'%';
    ui.sonarRng.style.height=(8+.78*24).toFixed(1)+'px';
    const t=ui.sonarTxt;
    if(f.dive>=.78){t.textContent='深すぎ';t.className='deep'}else if(f.dive<.4){t.textContent='チャンス！';t.className='go'}else{t.textContent='射程内';t.className=''}
  }
  if(G.state==='fight'&&fi){
    ui.dist.innerHTML=`${fi.D.toFixed(1)}<small>m</small>`;
    ui.fishMark.style.left=(clamp(fi.D/fi.Dmax,0,1)*100)+'%';
    ui.stam.style.transform=`scaleX(${fi.S.toFixed(3)})`;
    const tp=clamp(fi.T/1.3,0,1);ui.tFill.style.height=`calc(${(tp*100).toFixed(1)}% - 6px)`;
    const pulling=isPulling();const power=pulling&&fi.T>=POW_LO&&fi.T<POW_HI;
    const c=fi.T>1?'#ff3348':fi.T>=POW_HI?'#ff9a3c':fi.T>=POW_LO?'#ffd23f':fi.T<.1?'#5ad1ff':'#3fd18b';ui.tFill.style.background=c;ui.tFill.style.color=c;
    ui.gauge.classList.toggle('hot',fi.T>.97);ui.gauge.classList.toggle('pow',power);
    ui.rope.textContent=Math.ceil(fi.rope);ui.ropeBox.classList.toggle('low',fi.rope<35);ui.hook.textContent=Math.ceil(fi.hook);ui.hookBox.classList.toggle('low',fi.hook<40);
    ui.pull.classList.toggle('on',pulling);ui.pull.classList.toggle('danger',fi.T>.97&&pulling);ui.pull.classList.toggle('pow',power);ui.pull.classList.toggle('final',fi.exhausted);
    const left=Math.max(0,DF().time-fi.time);ui.timer.textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`;ui.timer.classList.toggle('low',left<10);
  }
}

/* ================= PHOTO ================= */
let snapCanvas=null;
function capturePhoto(){try{snapCanvas=document.createElement('canvas');snapCanvas.width=cv.width;snapCanvas.height=cv.height;snapCanvas.getContext('2d').drawImage(cv,0,0)}catch(e){snapCanvas=null}}
function makePhoto(){
  if(!snapCanvas)return null;
  try{
    const o=document.createElement('canvas');o.width=1080;o.height=1350;const c=o.getContext('2d');
    const sc=Math.max(1080/snapCanvas.width,1350/snapCanvas.height);const dw=snapCanvas.width*sc,dh=snapCanvas.height*sc;
    c.fillStyle='#04213a';c.fillRect(0,0,1080,1350);c.drawImage(snapCanvas,(1080-dw)/2,(1350-dh)/2-60,dw,dh);
    const g=c.createLinearGradient(0,980,0,1350);g.addColorStop(0,'rgba(4,22,40,0)');g.addColorStop(.35,'rgba(4,22,40,.85)');g.addColorStop(1,'rgba(4,22,40,.97)');c.fillStyle=g;c.fillRect(0,980,1080,370);
    const f=G.fish,st=ST();c.textAlign='left';
    c.fillStyle='#ffd23f';c.font='34px "Dela Gothic One",sans-serif';c.fillText('TUNA SPEAR KING',60,1150);
    c.fillStyle='#fff';c.font='96px "Dela Gothic One",sans-serif';c.fillText(`${f.kg}kg`,56,1255);
    c.font='900 34px "Zen Maru Gothic",sans-serif';c.fillText(`${f.cm}cm ／ ${G.roundT.toFixed(1)}秒`,60,1310);
    c.textAlign='right';c.font='900 30px "Zen Maru Gothic",sans-serif';c.fillStyle='rgba(255,255,255,.85)';c.fillText(`${st.name}・${DF().label}`,1020,1255);
    const d=new Date();c.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`,1020,1310);
    if(G.fight&&G.fight.rope>=70){c.save();c.translate(870,1150);c.rotate(-.06);c.fillStyle='#3fd18b';c.fillRect(-170,-44,340,62);c.fillStyle='#0b1b2e';c.textAlign='center';c.font='34px "Dela Gothic One",sans-serif';c.fillText('PERFECT CATCH',0,0);c.restore()}
    c.strokeStyle='#fff';c.lineWidth=14;c.strokeRect(7,7,1066,1336);
    return o.toDataURL('image/jpeg',.9);
  }catch(e){return null}
}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function frame(now){
  const realDt=Math.min(.05,(now-last)/1000);last=now;
  if(G.slow>0){G.slow-=realDt;if(G.slow<=0)G.timeScale=1}else G.timeScale=1;
  if(msgTimer>0){msgTimer-=realDt;if(msgTimer<=0)hideMsg()}
  if(G.state!=='pause'){
    acc+=realDt*G.timeScale;let n=0;
    while(acc>=STEP&&n<20){update(STEP);acc-=STEP;n++}
    updateCamera(realDt);
    musicTick();
  }
  render(G.state==='pause'?0:realDt);updateHud();
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
resize();goTitle();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Dela Gothic One"').catch(()=>{})}
})();
</script>
