<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WIG PANIC KING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#15122b;overscroll-behavior:none;touch-action:none;
 font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
#stage{position:absolute;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:calc(var(--u)*9);background:rgba(14,10,36,.82);text-align:center;padding:calc(var(--u)*14)}
.ov.hide{display:none}
.logo{font-size:calc(var(--u)*40);font-weight:900;line-height:1.02;letter-spacing:1px;color:#ffd84a;
 text-shadow:0 calc(var(--u)*3) 0 #b0412a,0 calc(var(--u)*6) calc(var(--u)*14) rgba(0,0,0,.5)}
.logo small{display:block;font-size:calc(var(--u)*22);color:#fff;text-shadow:0 calc(var(--u)*2) 0 #5b3a1e}
.tag{font-size:calc(var(--u)*15);font-weight:800;color:#ffe9b8;line-height:1.35}
.how{font-size:calc(var(--u)*12.5);line-height:1.55;color:#d9d4ff;background:rgba(255,255,255,.08);
 border-radius:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*14)}
.best{font-size:calc(var(--u)*14);color:#ffd84a;font-weight:800}
.btn{font:inherit;font-weight:900;font-size:calc(var(--u)*22);color:#3b1d06;background:linear-gradient(#ffe36a,#ffb21f);
 border:0;border-radius:calc(var(--u)*30);padding:calc(var(--u)*11) calc(var(--u)*38);
 box-shadow:0 calc(var(--u)*5) 0 #b06a0a,0 calc(var(--u)*10) calc(var(--u)*16) rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*2) 0 #b06a0a}
.btn.sub{font-size:calc(var(--u)*14);background:linear-gradient(#d8d4f5,#9d98d6);box-shadow:0 calc(var(--u)*3) 0 #5d5898;padding:calc(var(--u)*7) calc(var(--u)*22)}
.row{display:flex;gap:calc(var(--u)*10);align-items:center;justify-content:center}
.rbig{font-size:calc(var(--u)*25);font-weight:900;line-height:1.2;color:#fff;text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.45)}
.rsub{font-size:calc(var(--u)*14);color:#ffd2d2;font-weight:800}
.stats{font-size:calc(var(--u)*14);line-height:1.6;background:rgba(255,255,255,.1);border-radius:calc(var(--u)*14);
 padding:calc(var(--u)*8) calc(var(--u)*22);font-weight:700}
.score{font-size:calc(var(--u)*34);font-weight:900;color:#ffd84a;text-shadow:0 calc(var(--u)*3) 0 #7a4b00}
.newb{color:#7dffb2;font-size:calc(var(--u)*15);font-weight:900;min-height:calc(var(--u)*18)}
.pt{font-size:calc(var(--u)*28);font-weight:900;color:#ffd84a}
</style>
</head>
<body>
<div id="stage" style="--u:1px">
  <canvas id="cv"></canvas>

  <div class="ov" id="title">
    <div class="logo">WIG PANIC<small>KING</small></div>
    <div class="tag">カツラを守れ！<br>でも、守っていることを絶対にバレるな！</div>
    <div class="how">👆 長押しでカツラを押さえる<br>（押さえすぎるとバレる）<br><span style="opacity:.7">ほかの操作はゲーム中に教えます</span></div>
    <div class="best" id="bestT">BEST 0</div>
    <button class="btn" id="startBtn">QUICK 30秒<small style="display:block;font-size:.55em;opacity:.8">はじめての人はこちら</small></button>
    <button class="btn sub" id="survBtn">SURVIVAL 150秒（全5ステージ）</button>
  </div>

  <div class="ov hide" id="pause">
    <div class="pt">PAUSE</div>
    <button class="btn" id="resumeBtn">再開</button>
    <button class="btn sub" id="quitBtn">タイトルへ</button>
  </div>

  <div class="ov hide" id="result">
    <div class="rbig" id="rTitle"></div>
    <div class="rbig" id="rMsg" style="font-size:calc(var(--u)*19)"></div>
    <div class="rsub" id="rSub"></div>
    <div class="stats" id="rStats"></div>
    <div class="score" id="rScore"></div>
    <div class="newb" id="rNew"></div>
    <button class="btn" id="retryBtn">もう一度！</button>
    <button class="btn sub" id="toTitleBtn">タイトルへ</button>
  </div>
</div>

<script>
(function(){
'use strict';
const W=360,H=640,GOAL=150;
const $=id=>document.getElementById(id);
const stageEl=$('stage'),cv=$('cv'),cx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,u)=>a+(b-a)*u, rnd=(a,b)=>a+Math.random()*(b-a);
const STAGES=[
 {n:'STAGE 1',t:'街中の突風'},{n:'STAGE 2',t:'鳥の襲撃'},{n:'STAGE 3',t:'ジェットコースター'},
 {n:'STAGE 4',t:'ダンスパーティー'},{n:'FINAL',t:'巨大扇風機'}];

/* ---------- 画面サイズ ---------- */
let SC=1,DPR=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  SC=Math.min(vw/W,vh/H);
  const w=Math.floor(W*SC),h=Math.floor(H*SC);
  stageEl.style.width=w+'px';stageEl.style.height=h+'px';
  stageEl.style.left=Math.floor((vw-w)/2)+'px';stageEl.style.top=Math.floor((vh-h)/2)+'px';
  stageEl.style.setProperty('--u',SC+'px');
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

/* ---------- 保存 ---------- */
let best=0,bestQ=0,muted=false,plays=0,longest=0,mode='quick';
try{best=+localStorage.getItem('wigPanicKingBest')||0;bestQ=+localStorage.getItem('wigPanicKingBestQ')||0;muted=localStorage.getItem('wigPanicKingMute')==='1';plays=+localStorage.getItem('wigPanicKingPlays')||0;longest=+localStorage.getItem('wigPanicKingLong')||0;}catch(e){}
function saveMeta(){try{localStorage.setItem('wigPanicKingPlays',plays);localStorage.setItem('wigPanicKingLong',longest)}catch(e){}}
function saveBest(){try{localStorage.setItem('wigPanicKingBest',best);localStorage.setItem('wigPanicKingBestQ',bestQ)}catch(e){}}
function saveMute(){try{localStorage.setItem('wigPanicKingMute',muted?'1':'0')}catch(e){}}

/* ---------- 音 ---------- */
let AC=null,master=null,windG=null,windF=null;
function ac(){
  if(!AC){
    try{
      AC=new(window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
      const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
      let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.04*w)/1.04;d[i]=last*8;}
      const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
      windF=AC.createBiquadFilter();windF.type='bandpass';windF.frequency.value=500;windF.Q.value=.7;
      windG=AC.createGain();windG.gain.value=0;
      src.connect(windF);windF.connect(windG);windG.connect(master);src.start();
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,v,slide,delay){
  if(muted||!ac())return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,f,q,delay,swell){
  if(muted||!ac())return;
  const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),dd=buf.getChannelData(0);
  for(let i=0;i<n;i++)dd[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;
  const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f||1500;fl.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+(swell?d*.45:.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);
}
const SFX={
  tap(){tone(660,.08,'square',.1,200)},
  fix(){tone(520,.09,'triangle',.22,300);tone(780,.12,'triangle',.2,300,.07)},
  miss(){tone(200,.16,'sawtooth',.14,-80)},
  hold(){tone(300,.07,'sine',.14,80)},
  squeak(){tone(900,.06,'square',.06,300)},
  flutter(){noise(.12,.12,2200,3)},
  bird(){tone(1500,.07,'sine',.14,500);tone(1900,.08,'sine',.13,-300,.09);tone(1700,.06,'sine',.12,300,.19)},
  shoo(){tone(900,.15,'triangle',.2,-500);noise(.18,.14,2500,2)},
  peck(){tone(240,.1,'square',.25,-120);noise(.14,.2,500,1)},
  cheer(){noise(.9,.22,1300,.8,0,true);[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.16,0,i*.09))},
  clear(){[523,659,784].forEach((f,i)=>tone(f,.16,'square',.12,0,i*.08))},
  warn(){tone(880,.12,'square',.09);tone(880,.12,'square',.09,0,.16)},
  fail(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.2,-30,i*.2))},
  gasp(){noise(.5,.25,900,1.2,0,true);tone(300,.5,'sine',.15,500)},
  boing(){tone(300,.3,'sine',.25,500)},
  beat(){tone(70,.12,'sine',.35,-20);tone(62,.12,'sine',.3,-20,.16)},
  safe(){[660,880,1320].forEach((f,i)=>tone(f,.12,'triangle',.18,0,i*.06))},
  count(){tone(1000,.09,'square',.12)},
  murmur(){noise(.5,.08,700,4,0,true);noise(.4,.06,1100,5,.15,true)},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.18,0,i*.1));SFX.cheer()}
};
function setWindSound(mag,on){
  if(!AC||!windG)return;
  const v=(muted||!on)?0:Math.min(.24,mag*.15);
  windG.gain.setTargetAtTime(v,AC.currentTime,.1);
  windF.frequency.setTargetAtTime(380+mag*520,AC.currentTime,.1);
}

/* ---------- 状態 ---------- */
let state='title';            // title / play / pause / win / lose
let S=null;
const holdIds=new Map();      // pointerId -> {x0,btn}
let keyHold=false;
const isHold=()=>{if(keyHold)return true;for(const h of holdIds.values())if(h.mode==='hold')return true;return false};

function newGame(){
  S={t:0,stab:85,sus:0,wx:0,wv:0,lift:0,holdAmt:0,holdTime:0,fixCd:0,
     gusts:[],gT:3.6,warn:null,wind:0,windMag:0,fanDir:-1,fanT:6,fanX:300,
     birds:[],bT:3.5,birdsOff:0,score:0,cleared:0,susSum:0,maxSus:0,
     pops:[],parts:[],streaks:[],banner:null,stageIdx:0,shake:0,flash:0,
     goal:mode==='quick'?30:150,stLen:mode==='quick'?6:30,rescueUsed:false,wigFlip:false,
     lose:null,winT:0,slow:1,ph:0,scroll:0,fixes:0,hurt:0,look:0,bonus:0,saves:0,lowStab:false,highSus:false,beatT:0,murT:0,cdLast:0,hint:null,seen:{},tut:plays<2,everHeld:false};
  for(let i=0;i<26;i++)S.streaks.push({x:Math.random()*W,y:rnd(110,520),l:rnd(18,50),v:rnd(.6,1.4)});
}
function show(id,on){$(id).classList.toggle('hide',!on)}
function toTitle(){
  state='title';holdIds.clear();keyHold=false;
  show('title',true);show('pause',false);show('result',false);
  $('bestT').textContent='BEST  QUICK '+bestQ.toLocaleString()+' ／ SURVIVAL '+best.toLocaleString();
  newGame();setWindSound(0,false);
}
function startGame(m){
  if(m==='quick'||m==='survival')mode=m;
  ac();newGame();state='play';holdIds.clear();keyHold=false;
  show('title',false);show('pause',false);show('result',false);
  plays++;saveMeta();
  banner(STAGES[0].n,STAGES[0].t);SFX.tap();
  if(S.tut)hint('hold','長押しでカツラを押さえる！','H');
}
function pauseGame(){
  if(state!=='play')return;
  state='pause';holdIds.clear();keyHold=false;show('pause',true);setWindSound(0,false);
}
function resumeGame(){
  if(state!=='pause')return;
  state='play';holdIds.clear();keyHold=false;show('pause',false);last=performance.now();
}
function banner(a,b){S.banner={a,b,t:0}}
function hint(key,txt,target,force){if(!force&&(!S.tut||S.seen[key]))return;S.seen[key]=1;S.hint={txt,target,t:0,key}}
function pop(x,y,txt,col){S.pops.push({x,y,txt,col:col||'#fff',t:0})}

/* ---------- 風 ---------- */
/* difficulty knobs (tuned with bot playtests: casual / normal / good players) */
const DIF={fixGain:7,fixSus:5,fixCd:.5,fixMin:.4,holdGain:6,holdLeak:5,holdLeakFrom:.6,susHold:11,susDecay:4,windBase:1,windK:9,calm:.5,stageGift:3,tiltDrain:3,
  gustIv:.75,quickIv:.6,birdSp:135,birdSpFinal:165,birdHit:25,birdSus:8,birdIv:[3.0,4.4],birdIvFinal:[2.2,3.2],
  q:{windK:10,susHold:12},           // QUICK 30s: short, so every second is sharper
  s:{windK:6,holdGain:7,holdLeak:3,stageGift:8}};  // SURVIVAL 150s: long, so per-second wear is gentler
const K=n=>{const o=mode==='quick'?DIF.q:DIF.s;return o[n]!=null?o[n]:DIF[n]};
function spawnGust(){
  const st=S.stageIdx;let dir=Math.random()<.5?-1:1,mag,dur,iv;
  if(st===0){mag=rnd(.5,.9);dur=rnd(1.6,2.4);iv=rnd(2.8,4.2)}
  else if(st===1){mag=rnd(.6,1);dur=rnd(1.5,2.2);iv=rnd(2.6,3.8)}
  else if(st===2){mag=rnd(.8,1.3);dur=rnd(1.1,1.7);iv=rnd(1.4,2.4);dir=S.lastDir?-S.lastDir:dir}
  else if(st===3){mag=rnd(.6,1.1);dur=rnd(1.5,2.2);iv=rnd(2.2,3.2)}
  else{mag=rnd(1,1.5);dur=rnd(1.8,2.8);iv=rnd(1.6,2.6)}
  if(S.t<Math.min(S.stLen*.4,6))mag=Math.min(mag,.6);
  iv*=K('gustIv')*(mode==='quick'?K('quickIv'):1);
  S.lastDir=dir;
  S.gusts.push({dir,mag,dur,age:-.75});
  S.gT=iv+.75;
}
function updateWind(sd){
  S.gT-=sd;if(S.gT<=0)spawnGust();
  let w=Math.sin(S.t*.9)*.12,warn=null;
  const st=S.stageIdx;
  if(st===3)w+=Math.sin(S.t*4.2)*.5;           // 踊り
  if(st===4){                                   // 巨大扇風機
    S.fanT-=sd;if(S.fanT<=0){S.fanDir*=-1;S.fanT=rnd(5,8)}
    w+=S.fanDir*(.55+.35*Math.sin(S.t*1.7));
  }
  for(let i=S.gusts.length-1;i>=0;i--){
    const g=S.gusts[i];g.age+=sd;
    if(g.age<0){if(!warn||g.age>warn.age)warn=g;continue}
    if(g.age>g.dur){S.gusts.splice(i,1);continue}
    w+=g.dir*g.mag*Math.sin(Math.PI*g.age/g.dur);
  }
  if(warn&&(!S.warn||S.warn!==warn))SFX.warn();
  S.warn=warn;
  S.wind=w;S.windMag=Math.abs(w);
}

/* ---------- 鳥 ---------- */
function spawnBird(){
  const side=Math.random()<.5?-1:1;
  S.birds.push({x:side<0?-30:W+30,y:rnd(120,230),side,state:'in',t:0,ph:Math.random()*6,fx:0,fy:0});
  SFX.bird();
}
function scareBird(b){
  if(b.state!=='in')return;
  b.state='out';b.t=0;S.birdsOff++;S.score+=0;
  pop(b.x,b.y-10,'シッ！+200','#ffe36a');SFX.shoo();
  for(let i=0;i<8;i++)S.parts.push({x:b.x,y:b.y,vx:rnd(-90,90),vy:rnd(-90,30),t:0,l:.8,c:'#dfe9f2',r:3,g:160});
}

/* ---------- 補正 ---------- */
function fix(dir){
  if(state!=='play'||S.fixCd>0)return;
  S.fixCd=K('fixCd');
  const need=-Math.sign(S.wx);
  if(Math.abs(S.wx)>K('fixMin')&&dir===need){
    S.stab=clamp(S.stab+K('fixGain')*Math.min(1,Math.abs(S.wx)),0,100);S.sus=clamp(S.sus+K('fixSus'),0,100);
    S.wx*=.12;S.wv=dir*1.2;S.fixes++;
    S.bonus+=50;pop(180+dir*50,270,'ナイス直し！+50','#8dffb5');SFX.fix();
  }else{
    S.stab=clamp(S.stab-3,0,100);S.sus=clamp(S.sus+3,0,100);
    S.wv+=dir*2.2;
    pop(180,270,'あやしい動き…','#ff9a9a');SFX.miss();
  }
}

/* ---------- 更新 ---------- */
function update(dt){
  S.ph+=dt;
  if(state==='play')updatePlay(dt);
  else if(state==='lose')updateLose(dt);
  else if(state==='win')updateWin(dt);
  for(let i=S.pops.length-1;i>=0;i--){const p=S.pops[i];p.t+=dt;if(p.t>1.1)S.pops.splice(i,1)}
  for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.t+=dt;p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.l)S.parts.splice(i,1)}
  if(S.banner){S.banner.t+=dt;if(S.banner.t>2.2)S.banner=null}
  S.shake*=Math.pow(.02,dt);S.flash=Math.max(0,S.flash-dt*2.5);
}
function updatePlay(dt){
  // ファイナルの危機はスローモーション
  const target=(S.stageIdx===4&&S.stab<26)?.55:1;
  S.slow+=(target-S.slow)*Math.min(1,dt*6);
  const sd=dt*S.slow;
  S.t+=dt;S.fixCd=Math.max(0,S.fixCd-dt);
  const idx=Math.min(4,Math.floor(S.t/S.stLen));
  if(idx!==S.stageIdx){
    S.stageIdx=idx;S.cleared++;S.stab=Math.min(100,S.stab+K('stageGift'));
    banner(STAGES[idx].n,STAGES[idx].t);SFX.clear();S.gusts.length=0;S.gT=2.2;pop(180,150,'STAGE CLEAR +500','#ffd84a');
    if(idx>=1)S.bT=Math.min(S.bT,2.5);
  }
  updateWind(sd);
  {const now=performance.now();for(const h of holdIds.values())if(h.mode==='pending'&&now-h.t0>120){h.mode='hold';SFX.hold()}}
  const hold=isHold();
  S.holdAmt+=((hold?1:0)-S.holdAmt)*Math.min(1,dt*14);
  S.look+=(((S.warn?S.warn.dir:Math.sign(S.wind))||0)-S.look)*Math.min(1,dt*5);
  // カツラ物理
  const k=hold?42:6,c=hold?11:1.5;
  S.wv+=((hold?.14:1)*S.wind*5-S.wx*k-S.wv*c)*sd;
  S.wx=clamp(S.wx+S.wv*sd,-1.6,1.6);
  S.lift=clamp(S.windMag*9*(hold?.15:1)+Math.abs(S.wv)*3,0,24);
  // 安定度
  if(hold){S.stab+=K('holdGain')*sd-Math.max(0,S.windMag-K('holdLeakFrom'))*K('holdLeak')*sd;S.holdTime+=dt;if(Math.random()<dt*7)SFX.squeak()}
  else{
    S.holdTime=0;
    if(S.windMag<.2)S.stab+=K('calm')*sd;
    else S.stab-=(K('windBase')+S.windMag*K('windK'))*sd;
    if(Math.abs(S.wx)>1)S.stab-=K('tiltDrain')*sd;
    if(S.windMag>.5&&Math.random()<dt*5)SFX.flutter();
  }
  S.stab=clamp(S.stab,0,100);
  // バレそう度
  if(hold){
    let r=K('susHold');if(S.stageIdx===3)r*=1.4;if(S.holdTime>3)r*=1.4;
    S.sus+=r*sd;
  }else S.sus-=K('susDecay')*sd;
  S.sus=clamp(S.sus,0,100);S.maxSus=Math.max(S.maxSus,S.sus);S.susSum+=S.sus*dt;
  // 鳥
  if(S.stageIdx>=1){
    S.bT-=sd;
    if(S.bT<=0){spawnBird();const bi=S.stageIdx===4?K('birdIvFinal'):K('birdIv');S.bT=rnd(bi[0],bi[1])*(mode==='quick'?.7:1)}
  }
  for(let i=S.birds.length-1;i>=0;i--){
    const b=S.birds[i];b.t+=sd;
    if(b.state==='in'){
      const tx=180+Math.sin(b.ph+b.t*5)*14,ty=262,dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;
      const sp=(S.stageIdx===4?K('birdSpFinal'):K('birdSp'));
      b.x+=dx/d*sp*sd;b.y+=dy/d*sp*sd+Math.sin(b.t*9+b.ph)*40*sd;
      if(d<34){
        S.stab=clamp(S.stab-K('birdHit'),0,100);S.sus=clamp(S.sus+K('birdSus'),0,100);S.wv+=b.side*3;S.shake=8;S.hurt=.4;
        pop(180,230,'つつかれた！-'+K('birdHit'),'#ff7a7a');SFX.peck();
        b.state='out';b.t=0;
      }
    }else{
      b.x+=b.side*(b.side<0?-1:1)*0; // placeholder (direction below)
      b.x+=(b.x<180?-1:1)*180*sd;b.y-=70*sd;
      if(b.x<-60||b.x>W+60||b.y<-40)S.birds.splice(i,1);
    }
  }
  S.hurt=Math.max(0,S.hurt-dt);
  // ヒント（初回プレイのみ）
  if(hold&&!S.everHeld){S.everHeld=true;if(S.hint&&S.hint.key==='hold')S.hint=null}
  if(Math.abs(S.wx)>.45&&!hold)hint('fix',S.wx>0?'ずれた！ ← 逆方向にスワイプ':'ずれた！ 逆方向にスワイプ →',S.wx>0?'L':'R');
  if(S.birds.some(b=>b.state==='in'))hint('bird','鳥をタップで追い払え！','bird');
  if(S.sus>55&&hold)hint('sus','押さえすぎ！怪しまれてる…離して！','sus');
  if(S.hint){S.hint.t+=dt;if(S.hint.t>(S.hint.key==='hold'&&!S.everHeld?6:3))S.hint=null}
  // ギリギリセーフ（最優先方針：ギリギリの瞬間を面白く）
  if(S.stab<15)S.lowStab=true;
  if(S.lowStab&&S.stab>45){S.lowStab=false;S.bonus+=300;S.saves++;pop(180,240,'ギリギリセーフ！+300','#7dffb2');SFX.safe();S.flash=.25}
  if(S.sus>88)S.highSus=true;
  if(S.highSus&&S.sus<55){S.highSus=false;S.bonus+=300;S.saves++;pop(180,240,'ごまかし成功！+300','#7dffb2');SFX.safe()}
  // 心音・ひそひそ
  S.beatT-=dt;if((S.stab<25||S.sus>80)&&S.beatT<=0){SFX.beat();S.beatT=S.stab<12||S.sus>90?.45:.7}
  S.murT-=dt;if(S.sus>60&&S.murT<=0){SFX.murmur();S.murT=1.6}
  // ラスト10秒カウント
  const left=Math.ceil(S.goal-S.t);if(left<=(mode==='quick'?5:10)&&left>=1&&left!==S.cdLast){S.cdLast=left;SFX.count()}
  S.score=Math.floor(S.t*100)+S.birdsOff*200+S.cleared*500+S.bonus;
  // 風のスジ
  for(const s of S.streaks){
    s.x+=Math.sign(S.wind||1)*S.windMag*320*s.v*sd+(S.stageIdx===2?-120*sd:0);
    if(s.x<-60)s.x=W+40;if(s.x>W+60)s.x=-40;
  }
  S.scroll+=(S.stageIdx===2?140:S.stageIdx===1?14:22)*sd;
  setWindSound(S.windMag+(S.stageIdx===4?.3:0),true);
  // 判定
  if(S.sus>=100)endLose('sus');
  else if(S.stab<=0)endLose('wind');
  else if(S.t>=S.goal)endWin();
}

function headPos(){return{x:180+S.wx*26,y:292-S.lift}}
function endLose(reason){
  state='lose';holdIds.clear();keyHold=false;
  const hp=headPos();
  const type=reason==='sus'?-1:Math.floor(Math.random()*4);
  const dir=Math.sign(S.wx||S.wind||1);
  const L={reason,type,t:0,sx:hp.x,sy:hp.y,rot0:S.wx*.5,vx:0,vy:0,gy:470,bounced:0,done:false,sfx:false};
  S.lose=L;S.banner=null;S.shake=14;S.flash=.8;
  if(type===-1){L.vx=dir*30;L.vy=-60}
  if(reason==='wind'&&!S.rescueUsed&&type!==1)L.rescue={need:10,taps:0,start:1.3,dur:3,state:'wait'};
  setWindSound(0,false);
  if(type===-1)SFX.gasp();else SFX.fail();
}
function updateLose(dt){
  const L=S.lose;L.t+=dt;
  const ease=L.t<.5?.4:1;const d=dt*ease;
  S.wx*=.9;S.look+=(0-S.look)*dt*3;
  for(const s of S.streaks)s.x+=3;
  if(L.type===-1){
    L.vy+=900*d;L.sx+=L.vx*d;L.sy+=L.vy*d;
    if(L.sy>L.gy){L.sy=L.gy;L.vy*=-.35;L.vx*=.6;L.bounced++;if(L.bounced<4)SFX.boing()}
  }
  const RC=L.rescue;
  if(RC){
    if(RC.state==='wait'&&L.t>=RC.start){RC.state='on';SFX.warn()}
    if(RC.state==='on'){if(RC.taps>=RC.need){rescueOK();return}if(L.t>RC.start+RC.dur){RC.state='fail';SFX.fail();pop(180,250,'取り返せなかった…','#ff9a9a')}}
  }
  const endAt=RC?RC.start+RC.dur+.8:2.1;
  if(L.t>endAt&&!L.done){L.done=true;showResult(false)}
}

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function showResult(won){
  const G_=S.goal,t=Math.min(S.t,G_),pct=Math.floor(t/G_*100);
  const avg=S.t>0?S.susSum/S.t:0;
  let total=Math.floor(t*100)+S.birdsOff*200+S.cleared*500+S.bonus;
  let bonus=0;
  if(won){total+=mode==='quick'?1000:3000;bonus=Math.round((100-avg)*(mode==='quick'?10:30));total+=bonus}
  S.finalScore=total;
  let title,msg,sub;
  if(won){
    title=S.wigFlip?'🙃 裏返しのまま完走！':'🎉 完走！ ヅラ防衛成功！';
    msg=S.wigFlip?'…誰も、何も言わなかった。':avg<25?'周囲は誰も気づいていない…完璧！':'カツラ防衛率100％！';
    if(mode==='quick')msg+='　次は SURVIVAL 150秒へ！';
    sub='ボーナス：バレなさ +'+bonus.toLocaleString();
  }else{
    const left=G_-t;
    title=S.lose.reason==='sus'?'😱 正体がバレた！':S.lose.rescue&&S.lose.rescue.state==='fail'?'💨 取り返せなかった…':'💨 カツラが飛んだ！';
    if(left<=6)msg='あと'+Math.max(1,Math.ceil(left))+'秒だったのに！';
    else msg='カツラ防衛率'+pct+'％';
    sub=S.lose.reason==='sus'?'💡 コツ：風が弱い時は手を離してごまかそう':
      (S.fixes<2?'💡 コツ：ずれたら光るボタン（逆方向）で直そう':'💡 コツ：⚠が出たら先に押さえて備えよう');
  }
  $('rTitle').textContent=title;$('rMsg').textContent=msg;$('rSub').textContent=sub;
  $('rStats').innerHTML='生存 '+fmt(t)+'（'+STAGES[Math.min(4,Math.floor(t/S.stLen))].n+'・'+(mode==='quick'?'QUICK':'SURVIVAL')+'）<br>鳥の撃退 '+S.birdsOff+'羽 ／ ギリギリセーフ '+S.saves+'回<br>最大バレそう度 '+Math.round(S.maxSus)+'%';
  $('rScore').textContent=total.toLocaleString();
  const prevLong=longest;if(t>longest){longest=t;saveMeta()}
  if(!won&&t>prevLong&&prevLong>0)$('rSub').textContent='📈 最長記録更新！ '+fmt(prevLong)+' → '+fmt(t)+'　'+$('rSub').textContent;
  const cur=mode==='quick'?bestQ:best,nb=total>cur;
  if(nb){if(mode==='quick')bestQ=total;else best=total;saveBest()}
  $('rNew').textContent=nb?'🏆 NEW BEST！':'BEST '+(mode==='quick'?bestQ:best).toLocaleString();
  show('result',true);
}

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const inR=(p,r)=>p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3];
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();
  if(state==='lose'&&S.lose&&S.lose.rescue&&S.lose.rescue.state==='on'){S.lose.rescue.taps++;SFX.tap();S.shake=Math.max(S.shake,3);return}
  if(state==='lose'&&S.lose&&S.lose.t>1&&!S.lose.done&&!(S.lose.rescue&&S.lose.rescue.state==='wait')){S.lose.done=true;showResult(false);return}
  if(state!=='play')return;
  const p=toLogical(e);
  if(p.y<46&&p.x>312){pauseGame();return}
  if(p.y<46&&p.x>270){muted=!muted;saveMute();if(!muted)SFX.tap();return}
  // 鳥優先
  for(const b of S.birds){if(b.state==='in'&&Math.hypot(b.x-p.x,b.y-p.y)<44){scareBird(b);return}}
  if(inR(p,BTN.L)){fix(-1);return}
  if(inR(p,BTN.R)){fix(1);return}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const onBtn=inR(p,BTN.H);
  holdIds.set(e.pointerId,{x0:p.x,t0:performance.now(),mode:onBtn?'hold':'pending',btn:onBtn});
  if(onBtn)SFX.hold();
});
cv.addEventListener('pointermove',e=>{
  const h=holdIds.get(e.pointerId);if(!h||state!=='play')return;
  e.preventDefault();
  const p=toLogical(e),dx=p.x-h.x0;
  if(!h.btn&&h.mode!=='swipe'&&Math.abs(dx)>14)h.mode='swipe';   // a sideways move is a fix, never a hold
  if(h.mode==='swipe'&&Math.abs(dx)>34){fix(dx>0?1:-1);h.x0=p.x}
});
function up(e){holdIds.delete(e.pointerId)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
['touchmove','touchstart'].forEach(n=>document.addEventListener(n,e=>{if(e.target===cv||state==='play')e.preventDefault()},{passive:false}));
document.addEventListener('gesturestart',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='Spacebar'){e.preventDefault();if(state==='play'&&!keyHold){keyHold=true;SFX.hold()}else if(state==='title'&&!e.repeat)startGame('quick');}
  else if(k==='ArrowLeft'){e.preventDefault();fix(-1)}
  else if(k==='ArrowRight'){e.preventDefault();fix(1)}
  else if(k==='Escape'){if(state==='play')pauseGame();else if(state==='pause')resumeGame()}
  else if(k==='m'||k==='M'){muted=!muted;saveMute()}
  else if(k==='Enter'&&(state==='title'))startGame();
  else if(k==='Enter'&&!$('result').classList.contains('hide'))startGame();
});
window.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Spacebar')keyHold=false});
window.addEventListener('blur',()=>{holdIds.clear();keyHold=false;if(state==='play')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

$('startBtn').addEventListener('click',()=>startGame('quick'));
$('survBtn').addEventListener('click',()=>startGame('survival'));
$('retryBtn').addEventListener('click',()=>startGame());
$('resumeBtn').addEventListener('click',resumeGame);
$('quitBtn').addEventListener('click',toTitle);
$('toTitleBtn').addEventListener('click',toTitle);

/* ---------- ループ ---------- */
let last=performance.now(),slowFrames=0,lowFps=false,skip=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>.1)dt=.1;if(dt<=0)return;
  if(state!=='pause')update(dt);
  if(dt>.028){if(++slowFrames>90)lowFps=true}else if(slowFrames>0)slowFrames--;
  if(lowFps){skip=!skip;if(skip)return}
  render();
}
toTitle();
requestAnimationFrame(frame);
window.__WPK={DIF,get S(){return S},get state(){return state},start:startGame,fix,
  jump(t){if(S)S.t=t},setStab(v){S.stab=v},setSus(v){S.sus=v},endWin,endLose,pause:pauseGame,resume:resumeGame,
  scare(){for(const b of S.birds)scareBird(b)}};
})();
</script>
