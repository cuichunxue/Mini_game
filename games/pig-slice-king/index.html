<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PIG SLICE KING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: TV-show slapstick, loud but tidy — a game cabinet on a phone.
   IDEA: a Japanese variety-show stage: blueprint paper → smithy → crimson studio.
   PICTURE: the full-height canvas IS the game; panel below holds controls.
   COLOUR and TYPE: crimson stage, cream panel, ink black, hot yellow accent; Dela Gothic One + M PLUS 1p.
   LAYOUT: header / stage canvas (flex) / bottom control sheet; result card overlays. */
:root{color-scheme:light dark;--red:#a3122a;--deep:#4a0512;--cream:#fff4e6;--ink:#1b0a0e;--yel:#ffd60a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--ink);font:16px/1.5 "M PLUS 1p",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top);max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(14px,env(safe-area-inset-left));background:var(--deep)}
header b{font:20px/1 "Dela Gothic One",sans-serif;color:var(--yel);letter-spacing:.01em;white-space:nowrap}
.steps{display:flex;gap:4px}
.steps i{font-style:normal;font-size:13px;font-weight:800;padding:5px 9px;border-radius:99px;color:#f6c9d0;background:rgba(255,255,255,.08)}
.steps i.on{background:var(--yel);color:var(--ink)}
#stageWrap{position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#banner{position:absolute;left:0;right:0;top:12%;text-align:center;font:clamp(26px,8vw,40px)/1.1 "Dela Gothic One",sans-serif;color:var(--yel);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.6);padding:0 12px;text-wrap:balance}
#banner.on{opacity:1;transform:scale(1);transition:transform .25s cubic-bezier(.3,1.8,.5,1),opacity .1s}
#panel{background:var(--cream);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
.hint{margin:0;font-weight:700;font-size:15px;min-height:1.5em}
.warn{color:var(--red)}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{font:800 16px/1.1 "M PLUS 1p",sans-serif;min-height:50px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer}
button small{display:block;font-weight:700;font-size:12px;opacity:.7;margin-top:2px}
button.pri{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--ink)}
button.big{min-height:64px;font-size:19px;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.35}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meters div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 8px}
.meters span{display:block;font-size:13px;font-weight:700}
.meters b{font:22px/1.1 "Dela Gothic One",sans-serif;white-space:nowrap}
#result{position:fixed;inset:0;background:rgba(20,0,6,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#result[hidden]{display:none}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;width:min(420px,100%);padding:20px;box-shadow:0 8px 0 var(--ink);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{font:28px/1.1 "Dela Gothic One",sans-serif;margin:0 0 12px;text-wrap:balance}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scores div{border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff}
.scores span{font-size:13px;font-weight:800}
.scores b{display:block;font:clamp(30px,10vw,42px)/1.05 "Dela Gothic One",sans-serif;color:var(--red);white-space:nowrap}
.scores .ch{background:var(--yel)}
.scores .ch b{color:var(--ink)}
.scores em{font-style:normal;font-size:12px;font-weight:700}
blockquote{margin:14px 0 6px;font-weight:800;font-size:17px}
#rChain{margin:0 0 6px;padding-left:1.1em;font-size:14px;font-weight:700;color:var(--red)}
.zk{border-top:2px dashed rgba(27,10,14,.3);margin-top:10px;padding-top:10px}
.zk p{margin:0 0 6px;font-size:13px;font-weight:800}
#zkList{display:flex;gap:6px;flex-wrap:wrap}
#zkList span{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;border:2px dashed rgba(27,10,14,.4);color:rgba(27,10,14,.5)}
#zkList span.got{border:2px solid var(--ink);background:var(--yel);color:var(--ink)}
.zk .hint2{font-weight:700;color:var(--red);margin-top:6px}
.card .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.card .btns .pri{grid-column:1/-1}
#title{position:fixed;inset:0;z-index:6;background:radial-gradient(circle at 50% 38%,#a3122a,#4a0512 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff}
#title[hidden]{display:none}
#title svg{width:min(240px,58vw);height:auto}
#title h1{font:clamp(44px,14vw,68px)/.95 "Dela Gothic One",sans-serif;color:var(--yel);margin:0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#title p{margin:0;font-weight:800;font-size:17px;max-width:22em;text-wrap:balance}
.tbtns{display:grid;gap:10px;width:min(320px,100%);margin-top:6px}
.best{margin:8px 0 0;font-size:13px;font-weight:800}
#title .best{color:#f6c9d0}
.card .btns .wide{grid-column:1/-1}
/* portal: keep the result buttons reachable on short screens (phone portrait/landscape) */
.card .btns{position:sticky;bottom:-20px;background:var(--cream);padding:10px 0 8px;margin-bottom:-20px;z-index:2;box-shadow:0 -8px 10px var(--cream)}
@media (max-height:680px){#result{padding:8px}.card{padding:12px 14px;border-radius:16px;max-height:calc(100dvh - 16px)}.card h2{font-size:22px;margin-bottom:6px}
 .scores{gap:6px}.scores div{padding:5px 8px}.scores b{font-size:30px}blockquote{margin:8px 0 4px;font-size:15px}#rChain{font-size:13px}.zk{margin-top:6px;padding-top:6px}
 .card .btns{bottom:-12px;margin-bottom:-12px;padding:8px 0 6px}.card .btns button{padding:9px 6px}}
@media (max-height:420px){.card{width:min(680px,100%);display:grid;grid-template-columns:1fr 180px;column-gap:14px;align-content:start;overflow-y:auto}
 .card>*{grid-column:1}.card .btns{grid-column:2;grid-row:1/8;position:static;grid-template-columns:1fr;align-self:center;margin:0;padding:0;box-shadow:none;gap:6px}
 .card .btns button{padding:8px 4px;font-size:14px}.card h2{font-size:19px;margin-bottom:4px}.scores b{font-size:24px}.scores span,.scores em{font-size:11px}
 blockquote{font-size:13px;margin:5px 0 2px}#rChain{font-size:12px;margin:0}.card .best{margin:4px 0 0;font-size:11px}.zk{margin-top:4px;padding-top:4px}.zk p{font-size:11px;margin:0 0 3px}
 #zkList span{padding:1px 7px;font-size:11px}.zk .hint2{display:none}}
@media (prefers-reduced-motion:reduce){#banner.on{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header><b>PIG SLICE KING</b><nav class="steps"><i data-p="draw">描く</i><i data-p="forge">鍛える</i><i data-p="test">斬る</i></nav></header>
  <div id="stageWrap"><canvas id="cv"></canvas><div id="banner"></div></div>
  <div id="panel"></div>
</div>
<div id="result" hidden><div class="card">
  <h2 id="rTitle"></h2>
  <div class="scores"><div><span>CUT</span><b id="rCut"></b><em id="rCutNote"></em></div><div class="ch"><span>CHAOS</span><b id="rChaos"></b><em id="rChaosNote"></em></div></div>
  <p class="best" id="rBest"></p>
  <blockquote id="rQuote"></blockquote>
  <ul id="rChain"></ul>
  <div class="zk"><p>カオス図鑑 <span id="zkN"></span></p><div id="zkList"></div><p class="hint2" id="zkHint"></p></div>
  <div class="btns"><button class="pri big" data-act="again">もう一度斬る</button><button data-act="replay">スロー再生</button><button data-act="toForge">鍛え直す</button><button class="wide" data-act="new">新しい刀を描く</button></div>
</div></div>
<div id="title">
  <svg viewBox="0 0 260 150" aria-hidden="true"><rect x="40" y="58" width="180" height="80" rx="28" fill="#f39aac" stroke="#1b0a0e" stroke-width="5"/><rect x="46" y="64" width="168" height="20" rx="10" fill="#fff3f0"/><rect x="46" y="112" width="168" height="18" rx="9" fill="#d96a82"/><path d="M16 14 L244 140" stroke="#1b0a0e" stroke-width="12" stroke-linecap="round"/><path d="M16 14 L244 140" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
  <h1>PIG<br>SLICE<br>KING</h1>
  <p>どんな刀でも描け。自分で振れ。常識を斬れ。</p>
  <div class="tbtns"><button class="pri big" data-act="quick">すぐ斬る<small>見本の刀で試し斬り</small></button><button class="big" data-act="start">自分の刀を描く</button></div>
  <p class="best" id="tBest"></p>
</div>
<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('stageWrap'),panel=$('panel'),bannerEl=$('banner'),resEl=$('result');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=300,H=300,DPR=1,drawing=false,parts=[];
const S={phase:'draw',raw:[],shape:null,len:1,sharp:3,bend:0,trail:[],anim:null,shake:0,res:null,lastPts:[],flash:0,swung:false,jt0:0,jdone:0};
const EV={
  banana:{name:'バナナ刀',title:'豚肉、宇宙へ',cut:0,chaos:400,quote:'滑りの美しさは満点だ。斬れてはいない。',chain:'刀の皮で審査員が滑った',bonus:250,hint:'ヒント：刀を思いきり曲げて描くと…'},
  giant:{name:'巨大包丁',title:'ステージごと真っ二つ',cut:100,chaos:999,quote:'刀よりカツラの飛距離が優秀だ！',chain:'余波でスタジオの照明が全部落ちた',bonus:300,hint:'ヒント：叩いて叩いて叩きまくると…'},
  thin:{name:'極細刀',title:'誰も気づかなかった',cut:100,chaos:300,quote:'……今、斬ったのか？ 私の目が悪いのか？',chain:'審査員のネクタイも3秒後に落ちた',bonus:200,hint:'ヒント：研いで研いで研ぎまくると…'},
  wig:{name:'カツラ事件',hint:'ヒント：100点の一刀を狙え（運も少し必要）'}
};
let found={};try{found=JSON.parse(localStorage.getItem('psk_found')||'{}')||{}}catch(e){}
let best={cut:0,chaos:0};try{best=JSON.parse(localStorage.getItem('psk_best'))||best}catch(e){}
/* sound: tiny synth, starts on first touch */
let AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type,v,f2){const a=AC,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,hp){const a=AC,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start()}
const SFX={hammer:()=>{tone(190,.16,'square',.16,90);noise(.08,.25,2500)},sharpen:()=>noise(.28,.14,4500),swoosh:()=>noise(.2,.22,1400),
  slice:()=>{noise(.12,.35,3000);tone(1000,.14,'triangle',.12,280)},thud:()=>tone(130,.3,'sine',.35,45),boing:()=>tone(200,.6,'triangle',.22,1300),
  boom:()=>{noise(1,.55,50);tone(70,1,'sine',.45,24)},tick:()=>tone(1250,.06,'square',.08),count:()=>tone(1600,.03,'square',.04),hm:()=>tone(150,.45,'sawtooth',.05,130),
  tada:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.13),i*90)),sad:()=>{tone(392,.3,'triangle',.12,370);setTimeout(()=>tone(311,.55,'triangle',.12,280),300)}};
const sfx=k=>{if(AC)try{SFX[k]()}catch(e){}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
document.addEventListener('pointerdown',au,true);
const saveFound=()=>{try{localStorage.setItem('psk_found',JSON.stringify(found))}catch(e){}};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=u=>1-Math.pow(1-u,3);

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
const ro=new ResizeObserver(resize);ro.observe(wrap);resize();

/* ---------- helpers ---------- */
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function path(P){ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y)}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function pathLen(a){let s=0;for(let i=1;i<a.length;i++)s+=Math.hypot(a[i].x-a[i-1].x,a[i].y-a[i-1].y);return s}
function bbox(P){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of P){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}return{cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0}}
let bT;function say(t,ms=1600){bannerEl.textContent=t;bannerEl.classList.remove('on');void bannerEl.offsetWidth;bannerEl.classList.add('on');clearTimeout(bT);bT=setTimeout(()=>bannerEl.classList.remove('on'),ms)}
function sparks(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,c})}}
const bladeW=()=>Math.max(1.2,15-S.sharp*1.4)*Math.min(2.2,Math.sqrt(S.len));

/* ---------- sword ---------- */
function makeShape(pts){
  const g=pts[0],sh=pts.map(p=>({x:p.x-g.x,y:p.y-g.y})),L=sh[sh.length-1],c=Math.hypot(L.x,L.y);
  let md=0;for(const p of sh){const d=c>1e-6?Math.abs(p.x*L.y-p.y*L.x)/c:Math.hypot(p.x,p.y);md=Math.max(md,d)}
  S.shape={pts:sh,chord:c,ang:Math.atan2(L.y,L.x)};S.bend=md/Math.max(c,.08);S.len=1;S.sharp=3;setPanel();
}
function drawSword(gx,gy,sc,rot){
  const sh=S.shape;if(!sh)return;const cs=Math.cos(rot),sn=Math.sin(rot);
  const P=sh.pts.map(p=>({x:gx+(p.x*cs-p.y*sn)*sc,y:gy+(p.x*sn+p.y*cs)*sc}));S.lastPts=P;
  const k=Math.min(P.length-1,3);let dx=P[k].x-P[0].x,dy=P[k].y-P[0].y;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
  const hl=Math.min(90,30+sc*.05);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#241016';ctx.lineWidth=12;line(gx,gy,gx-dx*hl,gy-dy*hl);
  ctx.strokeStyle='#f3e6c8';ctx.lineWidth=2;ctx.setLineDash([4,5]);line(gx,gy,gx-dx*hl,gy-dy*hl);ctx.setLineDash([]);
  const w=bladeW(),ban=S.bend>=.22,ghost=S.sharp>=9;
  ctx.globalAlpha=ghost?.45:1;
  path(P);ctx.strokeStyle='#1b0a0e';ctx.lineWidth=w+(ghost?1:4);ctx.stroke();
  path(P);ctx.strokeStyle=ban?'#ffe14d':'#dfe6ee';ctx.lineWidth=w;ctx.stroke();
  if(w>3){path(P);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(1,w*.28);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(gx,gy);ctx.rotate(Math.atan2(dy,dx));ctx.fillStyle='#ffd60a';ctx.strokeStyle='#1b0a0e';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,4,12,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
}

/* ---------- stage ---------- */
const pigG=()=>{const w=Math.min(W*.42,210);return{x:W*.63,y:H*.58,w,h:w*.5}};
function bgStage(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5c0716');g.addColorStop(.72,'#a3122a');g.addColorStop(.72,'#3a0410');g.addColorStop(1,'#1e0208');
  ctx.fillStyle=g;ctx.fillRect(-60,-60,W+120,H+120);
  const r=ctx.createRadialGradient(W*.6,H*.55,10,W*.6,H*.55,Math.max(W,H)*.6);r.addColorStop(0,'rgba(255,236,190,.38)');r.addColorStop(1,'rgba(255,236,190,0)');
  ctx.fillStyle=r;ctx.fillRect(-60,-60,W+120,H+120);
  ctx.fillStyle='rgba(255,214,10,.9)';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(W*(i+.5)/9,H*.06,3,0,7);ctx.fill()}
}
function drawTable(pg){const top=pg.y+pg.h/2;ctx.fillStyle='#6a3a1c';ctx.fillRect(pg.x-pg.w*.5,top,14,H*.22);ctx.fillRect(pg.x+pg.w*.5-14,top,14,H*.22);
  rr(pg.x-pg.w*.65,top,pg.w*1.3,16,4);ctx.fillStyle='#d99a5c';ctx.fill();ctx.strokeStyle='#1b0a0e';ctx.lineWidth=2.5;ctx.stroke()}
function drawPig(x,y,w,h){ctx.save();ctx.translate(x,y);
  rr(-w/2,-h/2,w,h,h*.35);ctx.fillStyle='#f39aac';ctx.fill();
  ctx.save();rr(-w/2,-h/2,w,h,h*.35);ctx.clip();
  ctx.fillStyle='#fff3f0';ctx.fillRect(-w/2,-h/2,w,h*.28);ctx.fillStyle='#d96a82';ctx.fillRect(-w/2,h*.22,w,h*.3);
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-w*.3,0);ctx.quadraticCurveTo(-w*.1,-h*.12,w*.05,h*.05);ctx.moveTo(w*.12,-h*.02);ctx.quadraticCurveTo(w*.25,h*.1,w*.36,-h*.05);ctx.stroke();
  ctx.restore();rr(-w/2,-h/2,w,h,h*.35);ctx.lineWidth=3;ctx.strokeStyle='#1b0a0e';ctx.stroke();ctx.restore()}
function drawJudge(wig){const k=clamp(W/380,.75,1.2);ctx.save();ctx.translate(W*.2,H*.3);ctx.scale(k,k);
  ctx.fillStyle='#14080b';ctx.beginPath();ctx.moveTo(-30,52);ctx.lineTo(-22,14);ctx.lineTo(22,14);ctx.lineTo(30,52);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-7,14);ctx.lineTo(7,14);ctx.lineTo(0,30);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.strokeStyle='#1b0a0e';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-6,20,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1b0a0e';ctx.fillRect(-9,-9,4,4);ctx.fillRect(5,-9,4,4);line(-6,4,6,4);
  ctx.save();ctx.translate(wig.dx,wig.dy);ctx.rotate(wig.r);ctx.fillStyle='#6b3f1f';ctx.beginPath();ctx.ellipse(0,-20,24,13,0,Math.PI,0);ctx.quadraticCurveTo(0,-26,-24,-20);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle='#3b1a0f';ctx.fillRect(-58,44,116,42);ctx.fillStyle='#ffd60a';ctx.fillRect(-28,54,56,20);
  ctx.fillStyle='#1b0a0e';ctx.font='800 13px "M PLUS 1p",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('審査員',0,64);ctx.restore()}
function halfClip(cx,cy,a,s){const dx=Math.cos(a)*3000,dy=Math.sin(a)*3000,nx=-Math.sin(a)*3000*s,ny=Math.cos(a)*3000*s;
  ctx.beginPath();ctx.moveTo(cx-dx,cy-dy);ctx.lineTo(cx+dx,cy+dy);ctx.lineTo(cx+dx+nx,cy+dy+ny);ctx.lineTo(cx-dx+nx,cy-dy+ny);ctx.closePath();ctx.clip()}
const W0={dx:0,dy:0,r:0};

  else if(a==='start'){$('title').hidden=true}
  else if(a==='replay'&&S.anim){resEl.hidden=true;const A=S.anim;for(const k in A)if(k==='s'||k==='w'||k==='q'||k[0]==='k'&&k!=='type')delete A[k];A.t0=performance.now();A.speed=.4;A.done=0;S.phase='anim';if(A.type==='cut'||A.type==='banana')S.flash=.6;setPanel()}
  else if(a==='hammer'){S.len=+(S.len+.35).toFixed(2);sfx('hammer');buzz(15);const p=S.lastPts[Math.floor(Math.random()*S.lastPts.length)]||{x:W/2,y:H/2};sparks(p.x,p.y,18,'#ffb02e');S.shake=S.len>=3.2?14:6;if(S.len>=3.2&&S.len<3.55)say('重い…！',900);setPanel()}
  else if(a==='sharpen'){S.sharp=Math.min(10,S.sharp+1);sfx('sharpen');const p=S.lastPts[Math.floor(Math.random()*S.lastPts.length)]||{x:W/2,y:H/2};sparks(p.x,p.y,12,'#e8f4ff');setPanel()}
  else if(a==='reset'){S.len=1;S.sharp=3;setPanel()}
  else if(a==='toTest'||a==='again'){resEl.hidden=true;if(S.anim)delete S.anim.speed;S.phase='test';S.trail=[];setPanel()}
  else if(a==='new'){resEl.hidden=true;S.phase='draw';S.raw=[];S.shape=null;setPanel()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act)});
{const n=Object.keys(EV).filter(k=>found[k]).length;$('tBest').textContent=best.cut||n?`自己ベスト CUT ${best.cut}% ・ カオス図鑑 ${n}/${Object.keys(EV).length}`:'ヒント：変な刀ほど、変なことが起きる'}
setPanel();requestAnimationFrame(frame);
}
</script>
