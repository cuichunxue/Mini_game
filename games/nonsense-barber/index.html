<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ナンセンス理髪店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: barber-pole stripe on top, then one phone-width column laid out like a shop counter: customer, mirror, tools, till. */
:root{
  --bg:#EDF3F8; --surface:#FFFFFF; --fg:#13243B; --muted:#55677D; --line:#C9D5E1;
  --red:#DE3340; --red-d:#A8212C; --on-red:#FFFFFF;
  --blue:#1F5AA6; --on-blue:#FFFFFF;
  --gold:#F2B705; --frame:#B98B2E;
  --ok:#12805A; --ok-bg:#DAF3E8; --bad:#C62B40; --bad-bg:#FBDDE1;
  --warn-bg:#FFF0BE; --warn-fg:#5B4300;
  --mirror-a:#D5E7F5; --mirror-b:#F3F9FE; --glint:rgba(255,255,255,.55);
  --skin:#F7CBA7; --skin-d:#D9A57D; --ink:#2B2B2B; --cape:#1F5AA6;
  --paper:#FFFBEA; --paper-ink:#2B2B2B; --paper-line:#BDB7A0;
  --font-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"DotGothic16","Osaka-Mono","Noto Sans JP",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1524; --surface:#13233A; --fg:#EAF1F8; --muted:#9DB0C6; --line:#2B405E;
    --red:#FF5A66; --red-d:#B3303A; --on-red:#2A070B;
    --blue:#5FA2F0; --on-blue:#07182C;
    --gold:#FFC93C; --frame:#D9A93C;
    --ok:#46D39A; --ok-bg:#103A2B; --bad:#FF7285; --bad-bg:#47202A;
    --warn-bg:#47380C; --warn-fg:#FFE08A;
    --mirror-a:#1B3350; --mirror-b:#0F2038; --glint:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#13233A; --fg:#EAF1F8; --muted:#9DB0C6; --line:#2B405E;
  --red:#FF5A66; --red-d:#B3303A; --on-red:#2A070B;
  --blue:#5FA2F0; --on-blue:#07182C;
  --gold:#FFC93C; --frame:#D9A93C;
  --ok:#46D39A; --ok-bg:#103A2B; --bad:#FF7285; --bad-bg:#47202A;
  --warn-bg:#47380C; --warn-fg:#FFE08A;
  --mirror-a:#1B3350; --mirror-b:#0F2038; --glint:rgba(255,255,255,.07);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.pole{height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--surface) 12px 24px,var(--blue) 24px 36px,var(--surface) 36px 48px);background-size:68px 68px;animation:pole 1.4s linear infinite}
@keyframes pole{to{background-position:68px 0}}

.wrap{max-width:520px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.open{font-family:var(--font-display);font-size:13px;letter-spacing:.12em;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:1px 8px}
.snd{border:2px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:34px;cursor:pointer;font-size:16px}
.snd[aria-pressed="false"]{opacity:.45}

.hud{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.stat small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--font-mono);font-size:19px;font-weight:400;font-variant-numeric:tabular-nums}

h1,h2,.disp{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
.screen{display:flex;flex-direction:column;gap:12px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
p{margin:0}

/* title */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.sign{align-self:flex-start;font-family:var(--font-display);background:var(--red);color:var(--on-red);padding:2px 12px;border-radius:6px;transform:rotate(-4deg);font-size:15px;letter-spacing:.15em}
.hero h1{font-size:clamp(32px,10vw,46px)}
.lead{color:var(--muted);font-size:16px}
.steps{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;min-width:0}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue);color:var(--on-blue);font-family:var(--font-mono);display:grid;place-items:center;font-size:15px}
.menu{font-family:var(--font-mono);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.best{color:var(--muted);font-size:13px}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;background:var(--red);color:var(--on-red);cursor:pointer;box-shadow:0 4px 0 var(--red-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* day intro / panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv span:first-child{color:var(--muted);font-size:13px}
.kv b{font-family:var(--font-mono);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.fc{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.vipnote{font-size:13px;color:var(--muted)}

/* cut */
.who small{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.who h2{font-size:20px}
.vip{display:inline-block;background:var(--gold);color:#3a2a00;font-family:var(--font-display);font-size:13px;padding:0 8px;border-radius:6px;vertical-align:middle;margin-right:6px}
.quote{font-size:16px;font-weight:700;margin-top:4px}
.ticket{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--paper);color:var(--paper-ink);border:1px dashed var(--paper-line);border-radius:8px;padding:6px 10px;font-size:14px}
.ticket .tk-h{font-family:var(--font-mono);letter-spacing:.1em;font-size:13px}
.timer{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px}
.bar.low i{background:var(--red)}
.timer b{font-family:var(--font-mono);font-weight:400;font-size:20px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.event{min-height:2.7em;display:flex;align-items:center;font-size:13px;color:var(--muted);padding:2px 2px}
.event.hit{background:var(--warn-bg);color:var(--warn-fg);font-weight:800;border-radius:10px;padding:6px 10px;animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.mirror{position:relative;width:min(100%,300px);aspect-ratio:300/324;margin-inline:auto;border:6px solid var(--frame);border-radius:24px;background:linear-gradient(135deg,var(--mirror-a),var(--mirror-b));overflow:hidden}
.mirror.sm{width:min(70%,220px)}
.mirror svg{position:absolute;inset:0;width:100%;height:100%}
.mirror::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,var(--glint) 36%,transparent 42%,transparent 50%,var(--glint) 53%,transparent 58%)}
.hr{fill:var(--hair);stroke:var(--hair-d);stroke-width:2.5}
.skin{fill:var(--skin);stroke:var(--skin-d);stroke-width:2}
.scis{font-size:30px;text-anchor:middle;animation:snap .6s ease-out forwards}
@keyframes snap{0%{transform:scale(.5) rotate(-30deg);opacity:1}60%{transform:scale(1.2) rotate(15deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
.bit{fill:var(--hair);stroke:var(--hair-d);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:fall .8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),80px) rotate(220deg);opacity:0}}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{flex:1 1 28%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;font-weight:800;cursor:pointer;font-size:14px}
.seg[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px 7px;cursor:pointer;min-width:0;min-height:92px}
.chip:active{transform:scale(.95)}
.chips[data-tool="tonic"] .chip{border-style:dashed}
.chips[data-tool="clip"] .chip{border-color:var(--blue)}
.cl{font-size:12px;font-weight:800}
.cn{font-family:var(--font-display);font-size:28px;line-height:1.1}
.ct{font-size:11px;color:var(--muted)}
.cs{font-size:10.5px;font-weight:800;margin-top:2px;text-align:center;line-height:1.25}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}
.chip.ok .cs{color:var(--ok)}
.chip.under{background:var(--bad-bg);border-color:var(--bad)}
.chip.under .cs{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
.accs{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
.pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.lab{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}

/* result */
.center{align-items:center;text-align:center}
.stars{display:flex;gap:4px;justify-content:center}
.st{font-size:38px;line-height:1;color:var(--line)}
.st.on{color:var(--gold);animation:pop .45s calc(var(--i)*.16s) both}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.3)}100%{transform:none;opacity:1}}
.score{font-family:var(--font-mono);font-size:18px}
.review{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.review .by{font-size:12px;color:var(--muted);margin-top:6px}
.detail{font-size:13px;color:var(--muted)}
.combo{font-family:var(--font-display);color:var(--red);font-size:20px}

/* receipt */
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;font-family:var(--font-mono);font-size:16px;box-shadow:0 2px 0 var(--paper-line);display:flex;flex-direction:column;gap:4px}
.r-h{font-size:22px;text-align:center;letter-spacing:.3em}
.r-s{text-align:center;font-size:12px;color:#6b6650}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:4px 0;width:100%}
.tot{font-size:20px}
.r-pay{font-size:14px}
.r-pay b{font-weight:400;display:block;font-size:17px;margin-top:2px}
.got{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.got .amt{font-family:var(--font-display);font-size:34px}
.got .flav{font-size:14px;color:var(--muted)}
.got .pts{font-family:var(--font-mono);color:var(--blue)}
.lvup{color:var(--red);font-weight:800;font-size:15px}
.pay-btns{display:flex;flex-direction:column;gap:10px}

/* shop */
.shop{display:flex;flex-direction:column;gap:10px}
.up{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.up .info{min-width:0;flex:1}
.up .nm{font-weight:800}
.up .ds{font-size:12px;color:var(--muted)}
.pips{letter-spacing:.2em;color:var(--blue);font-size:13px}
.buy{flex:0 0 auto;border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:var(--blue);color:var(--on-blue);cursor:pointer;font-family:var(--font-mono);font-size:15px;white-space:nowrap}
.buy[disabled]{background:var(--line);color:var(--muted);cursor:default}

/* end */
.rank{font-size:24px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.sum small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.sum b{font-family:var(--font-mono);font-weight:400;font-size:18px}
.log{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.log li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;min-width:0}
.log li span:first-child{min-width:0;overflow-wrap:anywhere;flex:1}
.log .gs{color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.log .gm{font-family:var(--font-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok);font-weight:800}
.ng-t{color:var(--bad);font-weight:800}

@media (prefers-reduced-motion: reduce){
  .pole,.screen,.st.on,.scis,.bit,.event.hit{animation:none}
  .st.on{opacity:1}
}
</style>
</head>
<body>


<div class="pole"></div>
<div class="wrap">
  <div class="top">
    <span class="open">営業中</span>
    <button class="snd" id="snd" aria-pressed="true" aria-label="効果音">♪</button>
  </div>
  <div class="hud" id="hud" hidden>
    <div class="stat"><small id="h-l1">DAY 1</small><b id="h-n">1/5</b></div>
    <div class="stat"><small>財布</small><b id="h-money">¥0</b></div>
    <div class="stat"><small id="h-l3">ポイント Lv1</small><b id="h-pts">0pt</b></div>
  </div>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var yen=function(n){return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('ja-JP')};
var r10=function(x){return Math.round(x/10)*10};

var DAYS=5, PER_DAY=5;
var GOALS=[5500,6500,8500,9500,11000];
var DAY_TITLES=['開店初日','ざわつく二日目','VIPが来る三日目','ハプニング全開の四日目','最終日・伝説の一日'];
var LVT=[0,100,260,460,720,1050,1450];
var LVN=['見習い','町の床屋','人気店','行列店','カリスマ店','伝説の店','ナンセンス殿堂'];
function lvOf(p){var l=1;for(var i=0;i<LVT.length;i++){if(p>=LVT[i])l=i+1}return l}

var ZONES=[
  {id:'top',label:'てっぺん',ax:150,ay:50},
  {id:'bangs',label:'前髪',ax:150,ay:105},
  {id:'left',label:'左',ax:58,ay:140},
  {id:'right',label:'右',ax:242,ay:140},
  {id:'back',label:'後ろ',ax:150,ay:225}
];
var ZKEYS=['top','bangs','left','right','back'];
var ACCS=[
  {id:'none',label:'なし',verb:'なにもつけない'},
  {id:'negi',label:'ネギ',verb:'ネギを刺す'},
  {id:'ribbon',label:'リボン',verb:'リボンを結ぶ'},
  {id:'antenna',label:'アンテナ',verb:'アンテナを立てる'},
  {id:'mage',label:'ちょんまげ',verb:'ちょんまげにする'},
  {id:'sunflower',label:'ひまわり',verb:'ひまわりを挿す'},
  {id:'crown',label:'王冠',verb:'王冠をのせる'},
  {id:'ears',label:'猫耳',verb:'猫耳をつける'},
  {id:'nest',label:'鳥の巣',verb:'鳥の巣をのせる'}
];
function accOf(id){return ACCS.filter(function(a){return a.id===id})[0]}

// t = [てっぺん, 前髪, 左, 右, 後ろ]
var CUST=[
  {name:'ネギ蔵さん',hair:'#4a3b32',hairD:'#2e231d',deco:'mustache',quote:'朝イチのネギ市場みたいにしてくれ。てっぺんだけ元気にな。',t:[4,1,1,1,2],acc:'negi'},
  {name:'ゲンさん（宇宙人）',hair:'#7bd389',hairD:'#3f9a52',deco:'glasses',quote:'Wi-Fiが入る髪型で頼む。前髪は電波の邪魔だ。',t:[3,0,2,2,3],acc:'antenna'},
  {name:'佐藤課長',hair:'#555b66',hairD:'#2f333b',deco:'glasses',quote:'会議で笑われない程度に。でも5％は笑われたい。',t:[2,2,2,2,2],acc:'none'},
  {name:'源三郎（前世は武士）',hair:'#26262b',hairD:'#0f0f12',deco:'none',quote:'前世の自分に戻してくれ。頭の上に一本、頼む。',t:[2,0,0,0,2],acc:'mage'},
  {name:'みけさん',hair:'#f1a7c6',hairD:'#c9709a',deco:'none',quote:'猫耳が生えそうなくらい、サイドをふわっと。',t:[2,2,4,4,1],acc:'ribbon'},
  {name:'校長先生',hair:'#9aa0a8',hairD:'#6b7078',deco:'mustache',quote:'教育的指導の長さで。前は短く、後ろは長く。',t:[1,1,1,1,4],acc:'none'},
  {name:'ひまわり農家のトメさん',hair:'#d4a24a',hairD:'#a37722',deco:'none',quote:'ひまわりに負けん頭にしてくれ！',t:[4,3,3,3,2],acc:'sunflower'},
  {name:'謎の配達員',hair:'#2f6fb3',hairD:'#1b4575',deco:'none',quote:'届け物がある。髪は適当でいい。ただし右だけ長く。',t:[2,1,1,4,2],acc:'ribbon'},
  {name:'生後5分の赤ちゃん（自称）',hair:'#f4d9a6',hairD:'#c9a766',deco:'none',quote:'生後5分の風格で。ほぼ無でお願いします。',t:[1,0,0,0,0],acc:'ribbon'},
  {name:'ハニワ太郎',hair:'#e0562f',hairD:'#a63413',deco:'glasses',quote:'ロックに頼む。てっぺんは天を突け。花も挿せ。',t:[4,0,1,1,3],acc:'sunflower'},
  {name:'王様（自称）',hair:'#c9c9d4',hairD:'#8e8ea0',deco:'mustache',quote:'王の威厳が欲しい。てっぺんは高く、横は刈れ。',t:[4,1,0,0,2],acc:'crown'},
  {name:'ミケ丸',hair:'#f0a050',hairD:'#b36c1e',deco:'none',quote:'猫になりたい。耳をつけて、横はふんわりな。',t:[2,2,4,4,1],acc:'ears'},
  {name:'スズメ博士',hair:'#7a6a58',hairD:'#4e4234',deco:'glasses',quote:'小鳥が住める頭にしてくれ。巣は上だ。',t:[4,2,2,2,2],acc:'nest'},

var soundOn=true, ac=null;
function tone(f,d,type,v,delay){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=='running'&&ac.resume)ac.resume();
    var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v||0.04,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
var sfx={
  snip:function(){tone(1500,.04,'square',.03);tone(1100,.05,'square',.03,.06)},
  tonic:function(){tone(600,.12,'sine',.05);tone(900,.12,'sine',.05,.1)},
  bad:function(){tone(200,.25,'sawtooth',.04)},
  star:function(i){tone(500+i*110,.15,'triangle',.06)},
  coin:function(){tone(988,.08,'triangle',.06);tone(1319,.2,'triangle',.06,.08)},
  levelup:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.25,'triangle',.07,i*.12)})},
  ding:function(){tone(880,.3,'sine',.06)}
};

function paintMeta(){
  var m=$('#meta');if(!m)return;
  m.textContent='お客さん '+(S.idx+1)+'/'+PER_DAY+
    (S.combo>=2?'　コンボ×'+S.combo:'')+
    '　今日 '+yen(S.dayMoney)+' / 目標 '+yen(GOALS[S.day-1]);
}
function setTool(t){
  S.tool=t;
  ['cut','clip','tonic'].forEach(function(k){
    var b=$('#t-'+k);if(b)b.setAttribute('aria-pressed',String(k===t));
  });
  $('#chips').setAttribute('data-tool',t);
}
function paintHead(mood){
  var el=$('#head');if(!el)return;
  el.innerHTML=headSVG(S.cust,S.lv,S.acc,mood);
}
function paintChips(){
  ZONES.forEach(function(z){
    var b=$('.chip[data-z="'+z.id+'"]');if(!b)return;
    var cur=S.lv[z.id],tg=S.tgt[z.id],cls,txt;
    if(cur===tg){cls='ok';txt='ぴったり'}
    else if(cur>tg){cls='over';txt='あと'+(cur-tg)+'切る'}
    else{cls='under';txt=(tg-cur)+'足りない'}
    b.className='chip '+cls;
    $('.cn',b).textContent=cur;
    $('.ct',b).textContent='目標 '+tg;
    $('.cs',b).textContent=txt;
    b.setAttribute('aria-label',z.label+' 現在'+cur+' 目標'+tg+' '+txt);
  });
}
function burst(zid,kind){
  var fx=$('#fx');if(!fx)return;
  var z=ZONES.filter(function(q){return q.id===zid})[0];
  var g=document.createElementNS('http://www.w3.org/2000/svg','g');
  var h='<text class="scis" x="'+z.ax+'" y="'+z.ay+'">'+(kind==='tonic'?'✨':'✂️')+'</text>';
  if(kind!=='tonic'){
    for(var i=0;i<5;i++){h+='<rect class="bit" x="'+(z.ax+rnd(-22,22))+'" y="'+(z.ay+rnd(0,20))+'" width="7" height="12" rx="3" style="--dx:'+Math.round(rnd(-30,30))+'px"/>'}
  }
  g.innerHTML=h;fx.appendChild(g);
  setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g)},900);
}
function say(msg,hit){
  var e=$('#event');if(!e)return;
  e.textContent=msg;e.className=hit?'event hit':'event';
  var id=++S.sayId;
  setTimeout(function(){if(id===S.sayId)defaultHint()},hit?3200:1800);
}
function defaultHint(){
  var e=$('#event');if(!e)return;
  e.className='event';e.textContent='予報：'+S.forecast.n+'。切りすぎてもトニックで戻せる。';
}
function cutZone(z){
  if(S.done)return;
  var d,msg='',bad=false;
  if(S.tool==='cut'||S.tool==='clip'){
    if(S.lv[z]===0){say('もう切るところがない！',false);return}
    if(S.tool==='clip'){
      d=-2;
      if(Math.random()<0.1){d=-3;msg='バリカンが暴走！ 3段も持っていかれた';bad=true}
    }else{
      d=-1;
      if(S.lv[z]>=2&&Math.random()<sneezeP()){d=-2;msg='ハサミがくしゃみ！ 2段も切れた';bad=true}
    }
    S.lv[z]=Math.max(0,S.lv[z]+d);
    burst(z,'cut');
    bad?sfx.bad():sfx.snip();
  }else{
    var tc=tonicCost();
    S.money-=tc;S.dayMoney-=tc;
    if(Math.random()<0.15){
      var others=ZKEYS.filter(function(k){return k!==z});
      z=pick(others);msg='トニックが迷子になって '+ZONES.filter(function(q){return q.id===z})[0].label+' に届いた！';bad=true;
    }
    S.lv[z]=Math.min(4,S.lv[z]+1);
    burst(z,'tonic');sfx.tonic();
    paintHud();paintMeta();
  }
  paintChips();paintHead('neutral');
  if(msg)say(msg,bad);
}
function fireEvent(){
  var ev=Math.random()<0.6?EVENTS[S.forecast.e]:pick(EVENTS);
  S.lv[ev.z]=Math.max(0,Math.min(4,S.lv[ev.z]+ev.d));
  burst(ev.z,ev.d<0?'cut':'tonic');
  sfx.bad();
  paintChips();paintHead('neutral');
  say(ev.m,true);
}
function tick(){
  if(S.done)return;
  var el=(performance.now()-S.t0)/1000, left=Math.max(0,S.limit-el);
  var f=$('#fill');if(!f)return;
  f.style.width=(left/S.limit*100)+'%';
  $('#left').textContent=left.toFixed(1);
  $('#bar').className='bar'+(left<8?' low':'');
  S.events.forEach(function(ev){
    if(!ev.done&&el>=ev.at){ev.done=true;fireEvent()}
  });
  if(left<=0)finishCut(true);
}

function finishCut(timeUp){
  if(S.done)return;
  S.done=true;clearInterval(S.timer);
  var err=0;
  ZONES.forEach(function(z){err+=Math.abs(S.lv[z.id]-S.tgt[z.id])});
  var accOk=S.acc===S.cust.acc;
  var left=timeUp?0:Math.max(0,S.limit-(performance.now()-S.t0)/1000);
  var score=Math.max(0,100-err*14-(accOk?0:25));
  var stars=score>=92?5:score>=78?4:score>=58?3:score>=38?2:1;
  var speed=left>=S.limit/3&&stars>=3;
  S.combo=stars>=4?S.combo+1:0;
  if(S.combo>S.maxCombo)S.maxCombo=S.combo;
  S.allStars.push(stars);
  S.res={err:err,accOk:accOk,score:score,stars:stars,speed:speed,timeUp:timeUp};
  showRating();
}

function showRating(){
  var r=S.res,c=S.cust;
  var mood=r.stars>=4?'happy':r.stars===3?'neutral':'sad';
  setScreen(
    '<div class="center screen" style="animation:none;gap:12px">'+
    (r.timeUp?'<p class="detail">時間切れ！ ハサミは勝手に止まった。</p>':'')+
    '<div class="mirror sm"><svg id="head" viewBox="0 -24 300 324" style="'+hairStyle(c)+'" role="img" aria-label="仕上がり"></svg></div>'+
    '<div class="stars" aria-label="評価 '+r.stars+'">'+starsHTML(r.stars)+'</div>'+
    '<div class="score">仕上がり '+r.score+'点</div>'+
    (S.combo>=2?'<div class="combo">コンボ ×'+S.combo+'</div>':'')+
    '<div class="review"><p>「'+esc(pick(REV[r.stars]))+'」</p><p class="by">'+esc(c.name)+'の口コミ</p></div>'+
    '<p class="detail">髪のズレ合計 '+r.err+'段 ／ おまけ '+(r.accOk?'ぴったり':'ちがった')+(r.speed?' ／ スピード賞':'')+'</p>'+
    '<button class="btn" id="topay">お会計へ</button></div>'
  );
  $('#head').innerHTML=headSVG(c,S.lv,S.acc,mood);
  for(var i=1;i<=r.stars;i++){(function(k){setTimeout(function(){sfx.star(k)},k*160)})(i)}
  $('#topay').onclick=showPay;
}

function showPay(){
  var r=S.res,c=S.cust;
  var vm=c.vip?2:1;
  var price=menuPrice()*vm;
  var adj=0,adjLabel='';
  if(r.stars===1){adj=-Math.round(price*0.5);adjLabel='ご立腹割引（−50%）'}
  else if(r.stars===2){adj=-Math.round(price*0.2);adjLabel='不満割引（−20%）'}
  var m=1+0.25*S.ups.cat;
  var tip=r10([0,0,100,300,600][r.stars-1]*vm*m);
  var speed=r.speed?r10(150*m):0;
  var comboB=S.combo>=2?r10(Math.min(500,(S.combo-1)*100)*m):0;
  var base=price+adj;
  var total=base+tip+speed+comboB;
  var pay=pick(PAYS);
  var n=pay.unit?Math.max(1,Math.round(total/pay.unit)):0;
  var d=new Date();
  var date=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  var rows='<div class="row"><span>カット代'+(c.vip?'（VIP×2）':'')+'</span><span>'+yen(price)+'</span></div>';
  if(adj)rows+='<div class="row"><span>'+adjLabel+'</span><span>'+yen(adj)+'</span></div>';
  if(tip)rows+='<div class="row"><span>チップ（★'+r.stars+'）</span><span>'+yen(tip)+'</span></div>';
  if(speed)rows+='<div class="row"><span>スピード料金</span><span>'+yen(speed)+'</span></div>';
  if(comboB)rows+='<div class="row"><span>コンボ ×'+S.combo+'</span><span>'+yen(comboB)+'</span></div>';
  var btns=pay.id==='cash'
    ? '<button class="btn" id="accept">受け取る</button>'
    : '<button class="btn" id="accept">それで受け取る（時価・チップ込み）</button><button class="btn ghost" id="cashonly">現金にしてもらう（チップなし '+yen(base)+'）</button>';
  setScreen(
    '<h2>お会計</h2>'+
    '<div class="receipt"><div class="r-h">領収書</div><div class="r-s">ナンセンス理髪店　'+date+'</div><hr>'+
    rows+'<hr><div class="row tot"><span>合計</span><span>'+yen(total)+'</span></div><hr>'+
    '<div class="r-pay">'+esc(c.name)+'のお支払い<b>'+esc(pay.fmt(n))+'</b></div></div>'+
    '<div class="pay-btns" id="payui">'+btns+'</div>'
  );
  function settle(received,flav,gain){
    S.money+=received;S.dayMoney+=received;
    var up=addPts(gain);
    S.dayLog.push({name:c.name,stars:r.stars,got:received});
    paintHud();sfx.coin();
    if(up)setTimeout(sfx.levelup,350);
    var last=S.idx>=PER_DAY-1;
    $('#payui').innerHTML=
      '<div class="got"><div class="lab">受取額</div><div class="amt">'+yen(received)+'</div>'+
      '<p class="flav">'+esc(flav)+'</p><p class="pts">+'+gain+'pt</p>'+
      (up?'<p class="lvup">店ランクアップ！ Lv'+up.lv+'「'+up.name+'」 カット代が上がった</p>':'')+'</div>'+
      '<button class="btn" id="next">'+(last?'今日の結果を見る':'次のお客さん')+'</button>';
    $('#next').onclick=function(){S.idx++;if(S.idx>=PER_DAY)showDayEnd();else startCustomer()};
  }
  var gain=r.stars*10+(r.speed?5:0)+(S.combo>=2?5:0);
  $('#accept').onclick=function(){
    if(pay.id==='cash'){settle(total,pay.after,gain);return}
    var rate=rnd(pay.rate[0],pay.rate[1]);
    var got=Math.round(total*rate/10)*10;
    var ratio=got/total;
    var mm=ratio>=1.15?'相場が高騰していた！ ':ratio<=0.85?'相場が暴落していた…。 ':'ほぼ時価どおり。 ';
    settle(got,mm+pay.after,gain);
  };
  var co=$('#cashonly');
  if(co)co.onclick=function(){settle(base,'お客さんは少しふくれて、現金だけ置いていった。',gain)};
}

function showDayEnd(){
  clearInterval(S.timer);
  var goal=GOALS[S.day-1], hit=S.dayMoney>=goal, bonus=0, up=null;
  if(hit&&!S.bonusDone){
    bonus=1000+250*(S.day-1);S.money+=bonus;up=addPts(50);S.goalHits++;
  }
  S.bonusDone=true;
  var avg=avgOf(S.dayLog.map(function(l){return l.stars}));
  S.daySum.push({day:S.day,money:S.dayMoney,goal:goal,hit:hit,avg:avg});
  S.idx=PER_DAY-1;
  paintHud();
  var items=S.dayLog.map(function(l){
    return '<li><span>'+esc(l.name)+'</span><span class="gs">'+starsText(l.stars)+'</span><span class="gm">'+yen(l.got)+'</span></li>';
  }).join('');
  setScreen(
    '<div class="center screen" style="animation:none;gap:12px">'+
    '<p class="lab">DAY '+S.day+' 閉店</p>'+
    '<h2>'+(hit?'目標達成！':'目標に届かず…')+'</h2>'+
    '<div class="sum"><div><small>今日の売上</small><b>'+yen(S.dayMoney)+'</b></div><div><small>目標</small><b>'+yen(goal)+'</b></div><div><small>平均評価</small><b>'+avg.toFixed(1)+'</b></div></div>'+
    (hit?'<p class="ok-t">ボーナス '+yen(bonus)+' と +50pt をもらった</p>':'<p class="ng-t">店長がカラスに叱られている。明日がんばろう。</p>')+
    (up?'<p class="lvup">店ランクアップ！ Lv'+up.lv+'「'+up.name+'」</p>':'')+
    '<ul class="log">'+items+'</ul>'+
    '<button class="btn" id="go">'+(S.day<DAYS?'ショップへ':'最終結果へ')+'</button></div>'
  );
  if(up)setTimeout(sfx.levelup,200);else if(hit)sfx.coin();else sfx.bad();
  $('#go').onclick=function(){if(S.day<DAYS)showShop();else showFinale()};
}

function showShop(){
  setScreen(
    '<p class="lab">DAY '+S.day+' の夜</p><h2>ショップ</h2>'+
    '<p class="detail">財布 <b id="wallet"></b>。道具を強化して、明日に備えよう。</p>'+
    '<div class="shop" id="shoplist"></div>'+
    '<button class="btn" id="nextday">DAY '+(S.day+1)+' へ</button>'
  );
  renderShop();
  $('#nextday').onclick=function(){S.day++;showDayIntro()};
}
function renderShop(){
  $('#wallet').textContent=yen(S.money);
  var list=$('#shoplist');
  list.innerHTML=UPS.map(function(u){
    var lvl=S.ups[u.id], maxed=lvl>=u.max, cost=maxed?0:u.cost[lvl];
    var pips='';for(var i=0;i<u.max;i++){pips+=i<lvl?'●':'○'}
    var btn=maxed?'<button class="buy" disabled>最大</button>'
      :'<button class="buy" data-u="'+u.id+'"'+(S.money<cost?' disabled':'')+'>'+yen(cost)+'</button>';
    return '<div class="up"><div class="info"><div class="nm">'+u.name+'</div><div class="ds">'+u.desc+'</div><div class="pips">'+pips+'</div></div>'+btn+'</div>';
  }).join('');
  $$('.buy[data-u]',list).forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-u');
      var u=UPS.filter(function(x){return x.id===id})[0];
      var lvl=S.ups[id];if(lvl>=u.max)return;
      var cost=u.cost[lvl];
      if(S.money<cost){sfx.bad();return}
      S.money-=cost;S.ups[id]=lvl+1;
      sfx.coin();paintHud();renderShop();
    };
  });
}

function showFinale(){
  clearInterval(S.timer);
  var avg=avgOf(S.allStars);
  var lv=lvOf(S.pts);
  var score=S.pts+Math.floor(S.money/100);
  var prev=null,isBest=false;
  try{prev=JSON.parse(localStorage.getItem('nsb-best2')||'null')}catch(e){}
  if(!prev||score>prev.score){
    isBest=true;
    try{localStorage.setItem('nsb-best2',JSON.stringify({score:score,pts:S.pts,money:S.money,lv:lv}))}catch(e){}
  }
  var rank=avg>=4.5?'伝説のナンセンス理容師':avg>=3.5?'町の人気カリスマ':avg>=2.5?'ギリギリ営業中の人':'カラスの専属スタイリスト';
  var items=S.daySum.map(function(d){
    return '<li><span>DAY '+d.day+'　'+yen(d.money)+' / '+yen(d.goal)+'</span><span class="gs">★'+d.avg.toFixed(1)+'</span><span class="'+(d.hit?'ok-t':'ng-t')+'">'+(d.hit?'達成':'未達')+'</span></li>';
  }).join('');
  hudEl.hidden=true;
  setScreen(
    '<div class="center screen" style="animation:none;gap:12px">'+
    '<p class="lab">'+DAYS+'日間の営業が終わりました</p><h2 class="rank">'+rank+'</h2>'+
    '<div class="stars" aria-label="平均評価">'+starsHTML(Math.round(avg))+'</div>'+
    '<div class="sum"><div><small>ポイント</small><b>'+S.pts+'pt</b></div><div><small>財布</small><b>'+yen(S.money)+'</b></div><div><small>平均評価</small><b>'+avg.toFixed(1)+'</b></div></div>'+
    '<div class="panel" style="width:100%">'+
    '<div class="kv"><span>店ランク</span><b>Lv'+lv+' '+LVN[lv-1]+'</b></div>'+
    '<div class="kv"><span>目標達成</span><b>'+S.goalHits+' / '+DAYS+'日</b></div>'+
    '<div class="kv"><span>最大コンボ</span><b>×'+S.maxCombo+'</b></div>'+
    '<div class="kv"><span>スコア</span><b>'+score+'</b></div></div>'+
    (isBest?'<p class="lvup">自己ベスト更新！</p>':'')+
    '<ul class="log">'+items+'</ul>'+
    '<button class="btn" id="again">もう一回、開店する</button></div>'
  );
  sfx.levelup();
  $('#again').onclick=function(){sfx.snip();newGame()};
}

$('#snd').onclick=function(){
  soundOn=!soundOn;
  this.setAttribute('aria-pressed',String(soundOn));
  if(soundOn)sfx.snip();
};

showTitle();
})();
</script>

</body>
</html>
